<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конспекти · Фізична культура · 10 клас</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: класний «підручник» — бічний зміст розділів зліва, колонка читання ~68 знаків справа, тест вбудований наприкінці кожного уроку */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EAEEF4; --ink:#152030; --muted:#566275; --line:#D9DFE8;
  --accent:#1F4E79; --accent-soft:#E3ECF6; --copper:#B4521A; --copper-soft:#FBEDE3;
  --ok:#23703A; --ok-soft:#E3F2E7; --bad:#B42323; --bad-soft:#FBE6E6;
  --s-art:#8A3866; --s-zu:#56652A; --s-pe:#0F766E; --s-tech:#B4441C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto;flex-wrap:wrap}
.tab{text-decoration:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--subj);border-radius:6px;transition:width .3s}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:12px}
.theme{margin-bottom:14px}
.theme h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:700;line-height:1.35}
.les{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.35}
.les:hover{background:var(--sunk)}
.les[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.les .no{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.les .tt{flex:1;min-width:0}
.les .st{flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--copper-soft);color:var(--copper)}
.empty{color:var(--muted);font-size:13px;padding:8px}

main{min-width:0}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subj)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
a.chip{color:var(--accent);text-decoration:none}
a.chip:hover{text-decoration:underline}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-family:var(--f-body);font-size:16px;line-height:1.55;max-width:68ch}
.goal b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:30px 0 12px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-family:var(--f-body);font-size:16.5px;line-height:1.65;max-width:68ch}
.prose h4{font-family:var(--f-ui);font-size:15px;font-weight:700;margin:20px 0 6px}
.prose p{margin:0 0 10px;text-indent:1.4em}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em}
.prose li{margin-bottom:5px}
.terms{display:grid;grid-template-columns:minmax(120px,30%) 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:76ch}
.terms dt,.terms dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}
.terms dt{font-weight:700;background:var(--sunk);font-size:14px}
.terms dd{font-family:var(--f-body);font-size:15px}
.fact{margin-top:20px;background:var(--copper-soft);border-radius:var(--r);padding:14px 16px;max-width:68ch;font-family:var(--f-body);font-size:15.5px}
.fact b{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.prose .lead{text-indent:0;font-size:17.5px}
.prose h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:22px 0 8px}
.prose h2x{display:block}
.prose li b{font-family:var(--f-ui);font-size:.95em}
.call{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;max-width:68ch}
.fig{margin:14px 0 18px;max-width:68ch}
.fig img,.cardx img{display:block;width:100%;height:auto;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.cardsx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0 20px}
.cardx{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.cardx img{aspect-ratio:16/10;object-fit:cover;border-radius:0}
.cardx div{padding:10px 12px 12px;font-family:var(--f-body);font-size:14.5px}
.cardx h4{margin:0 0 4px;font-family:var(--f-ui);font-size:15px}
.cardx p{margin:0 0 6px;text-indent:0}
.cardx p b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subj)}
.prose .tgrid{padding-left:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px;padding:0;list-style:none}
.tgrid li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--surface);margin:0}
.tgrid li b{display:block;color:var(--subj);font-family:var(--f-ui)}
.steps{counter-reset:st;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.steps li::before{content:counter(st);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-ui);text-align:center}
.steps li b{display:block;font-family:var(--f-ui)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tasks li::marker{content:"✎  ";color:var(--copper)}

.quiz{margin-top:34px;border:1.5px solid var(--subj);border-radius:14px;padding:clamp(16px,3vw,26px);background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.qhead h2{margin:0;color:var(--ink)}
.qhead h2::after{display:none}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.q{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt span{color:var(--subj);font-variant-numeric:tabular-nums;flex:0 0 auto}
.q .qt div{min-width:0}
.q .qt em{font-family:var(--f-body);font-weight:400}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.opt span{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.checked .opt{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);font-family:var(--f-body)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)} .score.mid{color:var(--copper)} .score.low{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:14px}
.pager button:last-child{text-align:right;margin-left:auto}

@media (max-width:880px){
  .back{padding:6px 10px;font-size:13px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:inline-block}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px}
  .tab:last-child:nth-child(odd){grid-column:1/-1}
  .tab{flex:1 1 auto;justify-content:center;padding:7px 6px;font-size:12.5px;gap:5px;white-space:nowrap}
  .terms{grid-template-columns:1fr}
  .terms dt{border-top:1px solid var(--line)}
  .terms dd{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const DATA = [{"id": "pe", "name": "Фізична культура", "short": "Фізкультура", "themes": [{"name": "Розділ 1. Волейбол (уроки 1–26)", "lessons": [{"n": "1", "t": "Інструктаж з безпеки життєдіяльності на заняттях з волейболу. Спеціальні бігові та стрибкові вправи", "g": "Знати правила безпечної поведінки на заняттях волейболом і розуміти призначення спеціальних бігових і стрибкових вправ.", "k": "1 (первинний), 2–26 (повторення)", "terms": [["Інструктаж з БЖД", "ознайомлення з правилами безпеки перед заняттями; первинний — на початку розділу, повторний — перед кожним уроком."], ["Розминка", "комплекс вправ, що готує м’язи, суглоби, серце й дихання до навантаження."], ["Спеціальні бігові вправи", "вправи, що розвивають техніку бігу, швидкість і координацію."], ["Спеціальні стрибкові вправи", "вправи для розвитку вибухової сили ніг і стрибучості."]], "th": [{"h": "Правила безпеки на заняттях волейболом", "p": [], "ul": ["займатися лише у спортивній формі та взутті з неслизькою підошвою; зняти прикраси, годинник;", "розпочинати гру тільки після розминки та за сигналом учителя;", "не виконувати подачу, доки партнери не готові, і не подавати в бік людей;", "не висіти на сітці й не штовхати гравців біля неї;", "стежити за м’ячами, що відкотилися на майданчик, — на них можна травмувати гомілкостоп;", "під час блокування й нападу приземлятися на обидві ноги, на свою половину;", "при будь-якій травмі чи поганому самопочутті — негайно повідомити вчителя."]}, {"h": "Навіщо розминка", "p": ["Волейбол — гра з різкими стрибками, ривками й падіннями. Без розминки зростає ризик розтягнень і травм суглобів. Розминка підвищує температуру м’язів, еластичність зв’язок і частоту серцевих скорочень, налаштовує нервову систему на швидку реакцію."], "ul": []}, {"h": "Спеціальні бігові вправи", "p": [], "ul": ["біг з високим підніманням стегна — сила м’язів-згиначів стегна, частота кроків;", "біг із закиданням гомілки назад — розслаблення задньої поверхні стегна;", "семенячий біг — частота рухів і робота стопи;", "приставні кроки лівим і правим боком, біг спиною вперед — пересування волейболіста по майданчику;", "прискорення на 10–15 м зі зміною напрямку за сигналом — швидкість реакції."]}, {"h": "Спеціальні стрибкові вправи", "p": [], "ul": ["стрибки на двох ногах на місці та з просуванням;", "багатоскоки з ноги на ногу;", "стрибки вгору з імітацією нападаючого удару чи блоку;", "стрибки через скакалку — ритм і робота гомілкостопа.", "Стрибкові вправи виконують після бігової частини розминки, приземлюючись м’яко, на передню частину стопи з перекатом."]}], "f": "Волейболіст високого рівня за одну гру може виконати понад 100 стрибків.", "pr": ["Складіть пам’ятку «7 правил безпеки на уроці волейболу».", "Опишіть комплекс розминки волейболіста з 8 вправ: назва вправи, її мета, дозування (кількість повторів або час)."], "q": ["Для чого проводять первинний і повторний інструктаж з БЖД?", "Назвіть 5 правил безпеки на заняттях волейболом.", "Чому без розминки зростає ризик травм?", "Яку мету мають біг з високим підніманням стегна та приставні кроки?", "Як правильно приземлятися після стрибка?"]}, {"n": "2", "t": "Історія розвитку волейболу. Основні поняття та правила гри", "g": "Знати історію виникнення волейболу та основні правила гри.", "k": "1, 2, 8", "terms": [["Розіграш (раллі)", "період гри від подачі до моменту, коли м’яч поза грою; кожен розіграш приносить очко."], ["Перехід", "зміна позицій гравців за годинниковою стрілкою після отримання права подачі."], ["Ліберо", "гравець захисту в формі іншого кольору; не подає, не блокує, не атакує вище сітки."], ["Зони майданчика", "шість позицій гравців, пронумерованих від 1 до 6."]], "th": [{"h": "Історія", "p": [], "ul": ["1895 р. — Вільям Морган, викладач фізкультури з міста Голіок (США), придумав гру «мінтонет»; згодом її назвали волейболом (volley — удар з льоту, ball — м’яч);", "1947 р. — створено Міжнародну федерацію волейболу (FIVB);", "1964 р. — волейбол став олімпійським видом спорту (Токіо), з 1996 ьний норматив (довідково)", "p": ["6 передач на точність через сітку із зон 2, 3, 4 у визначену зону."], "ul": []}], "f": "", "pr": ["Намалюйте схему передач «через зону» і «в ближню зону» на майданчику.", "Опишіть типові помилки верхньої передачі та як їх виправити."], "q": ["Якими частинами пальців торкаються м’яча під час верхньої передачі?", "Що таке зависла передача?", "Навіщо зв’язковому передача за спину?", "Як потрібно вийти під м’яч перед передачею?"]}, {"n": "6", "t": "Нападаючий удар", "g": "Знати фази прямого нападаючого удару та різновиди нападу з різних передач.", "k": "6, 8, 24", "terms": [["Нападаючий удар", "удар однією рукою над сіткою з метою направити м’яч на бік суперника."], ["Прямий нападаючий удар", "удар за напрямком розбігу."], ["Коротка передача", "низька швидка передача для нападника біля зв’язкового."], ["Удар з першої передачі", "атака одразу після прийому, без другої передачі — несподіванка для суперника."]], "th": [{"h": "Фази прямого нападаючого удару", "p": [], "ul": ["розбіг — 2–3 кроки, останній крок широкий, з постановкою ніг для стрибка;", "стрибок — поштовх двома ногами, мах руками вгору;", "замах — ударна рука відводиться назад за голову, лікоть високо;", "удар — долонею по верхній частині м’яча у найвищій точці, кисть «накриває» м’яч;", "приземлення — на обидві ноги, м’яко, на свою половину, не торкаючись сітки."]}, {"h": "Удари з різних передач", "p": [], "ul": ["з високих і середніх передач із зон 2 і 4 — найпростіший варіант;", "з короткої передачі — швидка атака, що не дає блоку підготуватися;", "з першої передачі — несподіваний удар одразу після прийому."]}, {"h": "Правила", "p": ["Гравці задньої лінії можуть атакувати вище сітки лише з-за лінії атаки (3 м). Не можна торкатися сітки та перетинати центральну лінію."], "ul": []}], "f": "", "pr": ["Опишіть п’ять фаз нападаючого удару та помилки в кожній.", "Поясніть, чому удар з першої передачі ефективний проти блоку."], "q": ["З яких фаз складається нападаючий удар?", "Як правильно приземлятися після удару?", "Хто з гравців задньої лінії і звідки може атакувати?", "Чим корисна коротка передача для нападу?"]}, {"n": "7", "t": "Блокування. Індивідуальне, групове та зонне блокування. Самостраховка", "g": "Знати техніку та тактику блокування і правила безпечного приземлення.", "k": "9, 11, 19, 21, 23", "terms": [["Блок", "дія гравців передньої лінії біля сітки, що перекриває шлях м’яча після нападаючого удару."], ["Груповий блок", "блокування двома-трьома гравцями одночасно."], ["Зонне блокування", "блок, що закриває основний напрямок удару, а решту зон страхують гравці захисту."]], "th": [{"h": "Техніка блокування", "p": [], "ul": ["стійка біля сітки, руки на рівні плечей;", "пересування приставними кроками вздовж сітки;", "стрибок угору двома ногами трохи пізніше за нападника;", "руки випрямлені, пальці напружені й розведені, кисті трохи нахилені вперед над сіткою;", "приземлення на обидві ноги, не торкаючись сітки."]}, {"h": "Тактика блокування", "p": [], "ul": ["блокувати найсильнішого нападника суперника;", "своєчасно виходити в зону удару;", "при зонному блоці закривати основний напрямок удару, а гравці захисту страхують інші;", "після блоку — самостраховка: готовність до м’яча, що відскочив."]}, {"h": "Правила", "p": ["Блокувати можуть тільки гравці передньої лінії; торкання блоком не рахується до трьох торкань команди; руки можна переносити над сіткою, але не торкатися м’яча до атаки суперника."], "ul": []}], "f": "", "pr": ["Намалюйте схему групового блоку проти удару із зони 4.", "Опишіть, як діють гравці захисту при зонному блокуванні."], "q": ["Хто має право блокувати?", "Чи рахується торкання блоком як одне з трьох?", "Опишіть техніку стрибка на блок.", "Що таке зонне блокування?"]}, {"n": "8", "t": "Суддівство. Склад суддівської бригади. Жести та термінологія. Ведення протоколу гри", "g": "Знати склад суддівської бригади, основні жести суддів і правила ведення протоколу.", "k": "5, 6, 9, 10", "terms": [["Перший суддя", "головний суддя на вишці біля сітки, керує матчем."], ["Секретар", "суддя, що веде протокол гри."], ["Протокол", "офіційний документ матчу: склади команд, рахунок, заміни, перерви, санкції."]], "th": [{"h": "Склад суддівської бригади", "p": [], "ul": ["перший суддя — керує матчем, його рішення остаточні;", "другий суддя — стоїть біля стійки сітки з протилежного боку, контролює розстановку, заміни, перерви, торкання сітки;", "секретар (і помічник секретаря) — веде протокол;", "лінійні судді (2 або 4) — прапорцями показують, м’яч «в полі» чи «аут»."]}, {"h": "Основні жести", "p": [], "ul": ["дозвіл на подачу — рух рукою в бік подачі;", "команда, що подаватиме, — рука витягнута в її бік;", "м’яч у полі — рука вказує на підлогу майданчика;", "аут — обидві руки зігнуті, долоні до себе;", "чотири торкання — чотири пальці;", "подвійне торкання — два пальці;", "торкання сітки — долонею по сітці;", "перерва — руки буквою «Т»;", "заміна — оберти рук одна навколо іншої."]}, {"h": "Протокол гри", "p": ["У протокол вносять назви команд, номери гравців, розстановку на початку кожної партії, рахунок, заміни, перерви, попередження та покарання, результат і підписи. Правильне ведення протоколу — запорука чесності змагань."], "ul": []}], "f": "", "pr": ["Намалюйте або опишіть 8 жестів судді та їхнє значення.", "Перегляньте фрагмент волейбольного матчу й запишіть, які жести судді ви побачили."], "q": ["З кого складається суддівська бригада?", "Що контролює другий суддя?", "Покажіть (опишіть) жест «аут».", "Що записують у протокол гри?"]}, {"n": "9", "t": "Тактика гри. Взаємодія гравців. Страховка. Побудова «кутом вперед». Фактори ефективності змагальної діяльності", "g": "Знати основи командної тактики волейболу: взаємодію з зв’язковим, страховку, розстановки під час прийому та чинники успішної гри.", "k": "12, 14, 15, 16, 17, 18, 22", "terms": [["Тактика", "організація дій гравців і команди для досягнення перемоги."], ["Страховка", "позиція гравця, готового підхопити м’яч, якщо партнер не впорається."], ["«Кутом вперед»", "розстановка при прийомі, коли гравець зони 6 виходить уперед, утворюючи кут."]], "th": [{"h": "Схема «прийом — передача — атака»", "p": [], "ul": ["перше торкання — прийом, м’яч спрямовують зв’язковому (зона 3 або 2);", "друге торкання — передача зв’язкового нападникові;", "третє — нападаючий удар.", "Зв’язковий обирає партнера для атаки: того, хто в кращій позиції, або проти слабшого блоку суперника."]}, {"h": "Страховка", "p": ["Під час прийому та нападу гравці, які не виконують дію, займають місця страховки: ближче до партнера, щоб підхопити м’яч, що відскочив від рук чи блоку. При побудові «кутом вперед» гравець зони 6 виходить до лінії атаки й страхує нападників."], "ul": []}, {"h": "Фактори ефективності змагальної діяльності", "p": [], "ul": ["фізична підготовленість (швидкість, стрибучість, витривалість);", "технічна майстерність;", "тактична грамотність, взаєморозуміння;", "психологічна стійкість, уміння зосередитися;", "командний дух і комунікація на майданчику."]}], "f": "", "pr": ["Намалюйте схему розстановки «кутом вперед» під час прийому подачі.", "Назвіть 5 факторів, від яких залежить успіх команди, і поясніть, як їх розвивати."], "q": ["Опишіть схему «прийом — передача — атака».", "Що таке страховка?", "Як обирає зв’язковий партнера для атаки?", "Які фактори визначають ефективність гри?"]}, {"n": "10", "t": "Волейбол як засіб фізичного виховання. Досягнення українських волейболістів", "g": "Розуміти оздоровче й виховне значення волейболу та знати про розвиток волейболу в Україні.", "k": "8, 15", "terms": [["Фізичні якості", "сила, швидкість, витривалість, спритність, гнучкість."], ["Пляжний волейбол", "олімпійський вид: команди по 2 гравці на піску."]], "th": [{"h": "Оздоровче значення", "p": [], "ul": ["зміцнює серцево-судинну та дихальну системи;", "розвиває стрибучість, швидкість реакції, координацію;", "зміцнює м’язи ніг, рук, спини;", "покращує поставу й окомір;", "підходить для будь-якого віку, адже є безконтактним."]}, {"h": "Виховне значення", "p": ["Волейбол виховує відповідальність перед командою, уміння довіряти партнерам, дисципліну, наполегливість і вміння контролювати емоції — кожне очко команда здобуває разом."], "ul": []}, {"h": "Волейбол в Україні", "p": [], "ul": ["волейбол — один з найпопулярніших ігрових видів спорту в українських школах;", "чоловіча збірна України 2022 року дійшла до чвертьфіналу чемпіонату світу;", "Олег Плотницький — один з провідних нападників світу, багато років грає за італійську «Перуджу»;", "розвиваються пляжний волейбол та волейбол сидячи (паралімпійський вид), популярний серед ветеранів."]}], "f": "Волейбол сидячи — паралімпійський вид спорту, у якому сітка нижча (близько 1,15 м для чоловіків), а гравці мають постійно торкатися підлоги сідницями.", "pr": ["Підготуйте коротке повідомлення (8–10 речень) про українського волейболіста чи волейболістку.", "Складіть таблицю «Фізичні якості — які дії у волейболі їх розвивають»."], "q": ["Які фізичні якості розвиває волейбол?", "Які риси характеру виховує гра?", "Що таке волейбол сидячи?", "Назвіть досягнення українських волейболістів."]}, {"n": "11", "t": "Попередження спортивного травматизму", "g": "Знати причини спортивних травм і способи їх запобігання.", "k": "14", "terms": [["Спортивний травматизм", "пошкодження, отримані під час занять фізкультурою і спортом."], ["Перевтома", "стан, коли організм не встигає відновитися після навантажень."]], "th": [{"h": "Причини травм", "p": [], "ul": ["відсутність або погана розминка;", "неправильна техніка виконання вправ;", "невідповідний одяг і взуття, прикраси;", "порушення правил гри та дисципліни;", "надмірне навантаження, втома, недостатній сон;", "незадовільний стан спортивного майданчика чи інвентарю."]}, {"h": "Типові травми у волейболі", "p": [], "ul": ["розтягнення зв’язок гомілковостопного суглоба (приземлення на ногу іншого гравця);", "травми пальців (вивихи, забої) під час блоку й прийому;", "травми колін і плечового суглоба."]}, {"h": "Як запобігти", "p": [], "ul": ["завжди розминатися й завершувати заняття заминкою;", "опановувати правильну техніку, особливо приземлення та падіння;", "поступово збільшувати навантаження;", "користуватися якісним взуттям, за потреби — наколінниками;", "дотримуватися режиму сну й харчування, пити воду;", "не займатися при поганому самопочутті."]}], "f": "", "pr": ["Складіть пам’ятку «10 способів уникнути спортивної травми».", "Опишіть, як правильно приземлятися після стрибка, щоб не травмувати гомілковостоп."], "q": ["Назвіть основні причини спортивних травм.", "Які травми найчастіше трапляються у волейболі?", "Чому важлива заминка після заняття?", "Як режим дня впливає на ризик травм?"]}]}, {"name": "Розділ 2. Настільний теніс (уроки 27–52)", "lessons": [{"n": "12", "t": "Інструктаж з БЖД на заняттях настільним тенісом. Історія та правила гри. Стійка тенісиста", "g": "Знати правила безпеки, історію та основні правила настільного тенісу, способи тримання ракетки й стійку тенісиста.", "k": "27 (первинний), 28–52 (повторення)", "terms": [["Хватка", "спосіб тримання ракетки."], ["Європейська хватка («рукостискання»)", "ракетку тримають, ніби вітаються з нею за руку; найпоширеніша."], ["Азійська хватка («перо»)", "ракетку тримають як ручку для письма."], ["Партія (гейм)", "триває до 11 очок з перевагою у 2 очки."]], "th": [{"h": "Правила безпеки", "p": [], "ul": ["займатися у спортивному взутті, на сухій неслизькій підлозі;", "між столами має бути достатньо місця; не бігати між столами під час гри інших;", "не сідати й не спиратися на стіл, не пересувати його самостійно (складні столи можуть травмувати руки);", "не махати ракеткою поруч з іншими; не кидати ракетку;", "підбирати м’ячі, щоб не наступити на них."]}, {"h": "Історія", "p": [], "ul": ["гра виникла в Англії наприкінці ХІХ ст. як кімнатна розвага; звук удару дав назву «пінг-понг»;", "1926 р. — створено Міжнародну федерацію настільного тенісу (ITTF), проведено перший чемпіонат світу;", "1988 р. — настільний теніс став олімпійським видом спорту (Сеул);", "найсильніша школа сьогодні — китайська."]}, {"h": "Інвентар і правила", "p": [], "ul": ["стіл 274 × 152,5 см, висота 76 см; висота сітки 15,25 см;", "м’яч діаметром 40 мм, масою 2,7 г;", "партія — до 11 очок (при 10:10 — до переваги у 2 очки); матч — з 3, 5 або 7 партій;", "подачу змінюють кожні 2 очки (при 10:10 — кожне очко);", "м’яч має один раз відскочити на своєму боці при подачі та на боці суперника."]}, {"h": "Стійка тенісиста", "p": [], "ul": ["ноги на ширині плечей або трохи ширше, права (для правші) трохи позаду;", "коліна зігнуті, вага на передній частині стоп;", "корпус трохи нахилений уперед, ракетка перед собою на рівні столу;", "відстань до столу — близько витягнутої руки;", "з цієї стійки легко пересуватися приставними кроками вліво-вправо."]}], "f": "Під час гри в настільний теніс м’яч у професіоналів може летіти зі швидкістю понад 100 км/год і обертатися понад 100 обертів за секунду.", "pr": ["Намалюйте схему тенісного столу з розмірами.", "Порівняйте європейську та азійську хватки: переваги й недоліки."], "q": ["Коли настільний теніс став олімпійським видом?", "До скількох очок триває партія?", "Як часто змінюється подача?", "Опишіть стійку тенісиста.", "Назвіть 4 правила безпеки на заняттях."]}, {"n": "13", "t": "Методика проведення самостійних занять. Комплекс спеціальних вправ тенісиста. Техніко-тактична підготовка", "g": "Знати, як правильно організувати самостійні заняття, та призначення спеціальних вправ тенісиста.", "k": "27, 29, 33, 35", "terms": [["Самостійні заняття", "тренування, які людина організовує сама, поза уроком."], ["Самоконтроль", "спостереження за власним самопочуттям і показниками (пульс, сон, настрій)."], ["Техніко-тактична підготовка", "вдосконалення техніки ударів і вміння застосовувати їх у грі."]], "th": [{"h": "Принципи самостійних занять", "p": [], "ul": ["регулярність — 2–3 рази на тиждень;", "поступовість — навантаження збільшують повільно;", "структура заняття: розминка (10 хв) → основна частина → заминка (5–10 хв);", "самоконтроль: пульс до, під час і після заняття, самопочуття, сон;", "щоденник тренувань: що робив, скільки, як почувався."]}, {"h": "Спеціальні вправи тенісиста (що вони розвивають)", "p": [], "ul": ["приставні кроки вліво-вправо в стійці — швидкість пересування біля столу;", "імітація ударів без м’яча (перед дзеркалом) — техніка й автоматизм;", "набивання м’яча на ракетці різними сторонами — відчуття м’яча;", "вправи для кисті та передпліччя;", "вправи на реакцію (ловля м’ячика, що відскочив від стіни)."]}, {"h": "Техніко-тактична підготовка", "p": ["Техніка — це «як» виконати удар, тактика — «коли й навіщо». Тенісист поєднує подачі, накати й підрізки, змінює обертання, темп і напрямок, щоб змусити суперника помилитися. Тактичні принципи: грати в незручну для суперника сторону, змінювати довжину й обертання м’яча, атакувати слабкі передачі."], "ul": []}], "f": "", "pr": ["Складіть план самостійного заняття тривалістю 30 хвилин (розминка, основна частина, заминка).", "Створіть шаблон щоденника самоконтролю на тиждень."], "q": ["Які принципи самостійних занять ви знаєте?", "З яких частин складається заняття?", "Що таке самоконтроль і які показники варто відстежувати?", "Чим техніка відрізняється від тактики?"]}, {"n": "14", "t": "Подачі з нижнім, верхнім і боковим обертанням. Подача «маятник»", "g": "Знати правила подачі та різновиди подач з обертанням, зокрема подачу «маятник».", "k": "28, 29, 31, 33, 35, 38, 43, 46, 47, 48, 50, 52", "terms": [["Нижнє обертання (підрізка)", "м’яч обертається «назад», після відскоку гальмує і прагне піти вниз."], ["Верхнє обертання (топ)", "м’яч обертається «вперед», після відскоку прискорюється."], ["Бокове обертання", "м’яч обертається навколо вертикальної осі й відхиляється вбік."], ["Подача «маятник»", "подача, під час якої ракетка рухається, як маятник, створюючи бокове (і нижнє або верхнє) обертання."]], "th": [{"h": "Правила подачі", "p": [], "ul": ["м’яч лежить на відкритій долоні вільної руки, над рівнем столу й за задньою лінією;", "м’яч підкидають вертикально вгору щонайменше на 16 см;", "удар — коли м’яч опускається;", "м’яч має відскочити один раз на своєму боці, а потім — на боці суперника;", "у парній грі подача виконується по діагоналі (з правої половини в праву)."]}, {"h": "Подачі з обертанням", "p": [], "ul": ["з нижнім обертанням — ракетка «підрізає» м’яч знизу рухом уперед-униз;", "з верхнім обертанням — ракетка рухається знизу вгору-вперед, «накриваючи» м’яч;", "з боковим — рух ракетки вбік; часто поєднують з нижнім чи верхнім («нижньобокова»)."]}, {"h": "Подача «маятник»", "p": ["Виконується справа: ракетка рухається від себе до себе (як маятник), удар — по нижній чи бічній частині м’яча. Змінюючи точку удару, можна давати різне обертання однаковим рухом — це збиває суперника з пантелику."], "ul": []}, {"h": "Контрольний норматив (довідково)", "p": ["Виконання подачі з нижнім боковим обертанням у визначену зону."], "ul": []}], "f": "Сильне обертання м’яча пояснюється ефектом Магнуса: через різницю тиску з двох боків м’яч відхиляється від прямої траєкторії.", "pr": ["Намалюйте схеми нижнього, верхнього та бокового обертання м’яча (стрілками) і опишіть, як м’яч поводиться після відскоку.", "Запишіть правила подачі у вигляді пам’ятки."], "q": ["На яку висоту потрібно підкидати м’яч при подачі?", "Чим відрізняється нижнє обертання від верхнього?", "Як виконується подача «маятник»?", "Як виконується подача в парній грі?"]}, {"n": "15", "t": "Прийом подачі з нижнім обертанням м’яча", "g": "Знати, як розпізнати нижнє обертання та як правильно приймати таку подачу.", "k": "27, 29, 31, 36, 41", "terms": [["Підрізка (підрізання)", "удар, що надає м’ячу нижнього обертання."], ["Відкрита ракетка", "ракетка, нахилена ігровою поверхнею догори."]], "th": [{"h": "Як розпізнати нижнє обертання", "p": [], "ul": ["ракетка суперника рухалася зверху вниз і «підрізала» м’яч;", "м’яч летить повільніше, після відскоку ніби «гальмує»;", "якщо підставити ракетку прямо — м’яч піде в сітку."]}, {"h": "Способи прийому", "p": [], "ul": ["підрізкою — ракетка відкрита, рух уперед-униз під м’ячем; безпечний спосіб;", "накатом по нижньому обертанню — активний рух знизу вгору (для досвідчених);", "«скидка» (коротка відповідь) — м’яч ледь перелітає сітку, ускладнюючи атаку суперника."]}, {"h": "Поради", "p": ["Уважно стежте за ракеткою суперника в момент удару, займіть стійку ближче до столу, реагуйте ногами, а не лише рукою. Чим сильніше обертання — тим більше треба відкривати ракетку."], "ul": []}], "f": "", "pr": ["Опишіть три ознаки, за якими можна визначити нижнє обертання подачі.", "Поясніть, чому м’яч з нижнім обертанням іде в сітку, якщо підставити ракетку прямо."], "q": ["Як розпізнати подачу з нижнім обертанням?", "Як треба нахилити ракетку при прийомі підрізкою?", "Що таке «скидка»?", "Чому важливо стежити за ракеткою суперника?"]}, {"n": "16", "t": "Накат справа та зліва по діагоналі. Серійні удари", "g": "Знати техніку накату справа та зліва й розуміти, чому гру ведуть по діагоналі.", "k": "28, 30, 32, 34, 37, 40, 42, 45, 47, 49, 51", "terms": [["Накат", "атакувальний удар з верхнім обертанням, рух ракетки знизу вгору-вперед."], ["Справа / зліва", "удар з правого (форхенд) чи лівого (бекхенд) боку тіла."], ["Діагональ", "напрямок удару з кута в протилежний кут столу."]], "th": [{"h": "Накат справа (форхенд)", "p": [], "ul": ["стійка: ліва нога трохи попереду (у правші);", "замах — поворот тулуба праворуч, ракетка відводиться вниз-назад;", "удар — рух ракетки вгору-вперед з поворотом тулуба, ракетка трохи закрита;", "удар у верхній точці відскоку або на висхідній;", "після удару — повернення в стійку."]}, {"h": "Накат зліва (бекхенд)", "p": [], "ul": ["ракетка перед собою, лікоть трохи виведений уперед;", "рух від себе з розгинанням передпліччя і кисті;", "удар коротший і компактніший, ніж справа."]}, {"h": "Чому по діагоналі", "p": ["Діагональ — найдовший шлях через стіл (близько 3,2 м), тож м’яч має більше «запасу» для влучання, а сітка по краях нижча. Серійні удари по діагоналі з партнером — основна вправа для закріплення техніки."], "ul": []}, {"h": "Контрольний норматив (довідково)", "p": ["Серійні удари справа або зліва з партнером по діагоналі — оцінюють кількість ударів без помилки."], "ul": []}], "f": "", "pr": ["Опишіть по фазах накат справа і накат зліва, порівняйте їх.", "Поясніть, чому гравці-початківці тренують удари саме по діагоналі."], "q": ["Що таке накат?", "Чим накат справа відрізняється від накату зліва?", "У якій точці відскоку краще бити накатом?", "Чому діагональ вигідна для удару?"]}, {"n": "17", "t": "Контрудари", "g": "Знати, що таке контрудар і коли його застосовувати.", "k": "30, 34, 37, 42, 47, 51", "terms": [["Контрудар", "атакувальний удар у відповідь на атакувальний удар суперника."], ["Темп", "швидкість обміну ударами."]], "th": [{"h": "Суть контрудару", "p": ["Контрудар — це відповідь накатом на накат або топ-спін суперника. Гравець використовує швидкість м’яча суперника, додаючи власний рух. Контрудари вимагають швидкої реакції, стабільної стійки й короткого замаху."], "ul": []}, {"h": "Техніка", "p": [], "ul": ["стійка близько до столу або на середній відстані;", "короткий замах, удар на висхідній або у верхній точці;", "ракетка закрита (нахилена вперед), щоб контролювати верхнє обертання суперника;", "швидке повернення у вихідне положення."]}, {"h": "Тактичне значення", "p": ["Контрудари дозволяють перехопити ініціативу, підвищити темп і не дати суперникові спокійно атакувати."], "ul": []}], "f": "", "pr": ["Порівняйте накат і контрудар: схожість і відмінності.", "Перегляньте фрагмент професійного матчу та порахуйте, скільки контрударів виконали гравці в одному розіграші."], "q": ["Що таке контрудар?", "Чому для контрудару потрібен короткий замах?", "Як нахиляють ракетку при контрударі проти верхнього обертання?", "Яке тактичне значення контрударів?"]}, {"n": "18", "t": "Топ-спін. Підрізка справа", "g": "Знати різницю між топ-спіном і підрізкою та їхнє призначення у грі.", "k": "39, 44, 49", "terms": [["Топ-спін", "удар з дуже сильним верхнім обертанням: ракетка «зачісує» м’яч знизу вгору."], ["Підрізка", "захисний удар з нижнім обертанням."]], "th": [{"h": "Топ-спін", "p": [], "ul": ["головна атакувальна зброя сучасного тенісу;", "рух ракетки — знизу вгору-вперед, дотик до м’яча дотичний, «зачісувальний»;", "м’яч летить дугою, після відскоку різко прискорюється і «стрибає»;", "ефективний проти м’ячів з нижнім обертанням."]}, {"h": "Підрізка справа", "p": [], "ul": ["захисний удар; ракетка відкрита, рух зверху вниз-уперед під м’ячем;", "м’яч летить низько, з нижнім обертанням, його складно атакувати;", "застосовують проти коротких м’ячів і для прийому подачі з нижнім обертанням."]}, {"h": "Тактика", "p": ["Типова комбінація: подача з нижнім обертанням → суперник відповідає підрізкою → гравець атакує топ-спіном. Уміння поєднувати підрізку й топ-спін робить гру різноманітною."], "ul": []}], "f": "", "pr": ["Складіть таблицю «Топ-спін / підрізка»: обертання, рух ракетки, траєкторія, призначення.", "Опишіть тактичну комбінацію з подачі, підрізки та топ-спіну."], "q": ["Що таке топ-спін?", "Як рухається ракетка під час підрізки?", "Чому топ-спін ефективний проти нижнього обертання?", "Коли застосовують підрізку?"]}, {"n": "19", "t": "Настільний теніс в Україні та світі. Оздоровче значення", "g": "Знати досягнення українських тенісистів і користь настільного тенісу для здоров’я.", "k": "27–52 (узагальнення)", "terms": [["ITTF", "Міжнародна федерація настільного тенісу."], ["Паранастільний теніс", "настільний теніс для людей з інвалідністю — паралімпійський вид."]], "th": [{"h": "Користь для здоров’я", "p": [], "ul": ["розвиває швидкість реакції, координацію рухів «око — рука»;", "тренує увагу, зосередженість, тактичне мислення;", "помірне навантаження на серце й дихальну систему;", "доступний для будь-якого віку."]}, {"h": "Українці в настільному тенісі", "p": [], "ul": ["Коу Лей — багаторазовий чемпіон України, учасник кількох Олімпійських ігор;", "Маргарита Песоцька — учасниця Олімпійських ігор, одна з найсильніших тенісисток України;", "українські паратенісисти неодноразово здобували медалі Паралімпійських ігор."]}], "f": "", "pr": ["Підготуйте повідомлення про одного з українських тенісистів.", "Назвіть 5 якостей, які розвиває настільний теніс, і поясніть, як вони знадобляться в житті."], "q": ["Які якості розвиває настільний теніс?", "Назвіть українських тенісистів.", "Чому настільний теніс підходить людям різного віку?"]}]}, {"name": "Розділ 3. Футбол (уроки 53–78)", "lessons": [{"n": "20", "t": "Інструктаж з БЖД на заняттях футболом. Історія розвитку та основні правила гри", "g": "Знати правила безпеки, історію футболу та основні правила гри.", "k": "53 (первинний), 54–78 (повторення)", "terms": [["Офсайд (положення «поза грою»)", "гравець ближче до лінії воріт суперника, ніж м’яч і передостанній захисник, у момент передачі йому м’яча."], ["Стандартні положення", "кутовий, штрафний, пенальті, вкидання м’яча з-за бокової лінії."], ["VAR", "система відеоперегляду спірних моментів."]], "th": [{"h": "Правила безпеки", "p": [], "ul": ["форма, бутси чи кросівки відповідно до покриття, щитки на гомілки;", "зняти прикраси; ворота мають бути надійно закріплені — не висіти на поперечині;", "не виконувати підкати ззаду та удари ногою на рівні голови суперника;", "розминка обов’язкова; при травмі — негайно зупинитися й повідомити вчителя."]}, {"h": "Історія", "p": [], "ul": ["ігри з м’ячем ногами відомі в Китаї (цуцзю), Греції, Римі;", "1863 р. — в Англії створено Футбольну асоціацію та перші єдині правила — народження сучасного футболу;", "1904 р. — заснована FIFA; 1930 р. — перший чемпіонат світу (Уругвай);", "1954 р. — створено УЄФА; чемпіонат Європи — з 1960 р."]}, {"h": "Основні правила", "p": [], "ul": ["у команді на полі 11 гравців, серед них воротар;", "матч — два тайми по 45 хвилин з перервою 15 хвилин;", "розміри поля для міжнародних матчів — 100–110 × 64–75 м; ворота 7,32 × 2,44 м;", "руками грає лише воротар у своєму штрафному майданчику;", "порушення карають штрафним або пенальті, попередженням (жовта картка) чи вилученням (червона);", "гол зараховують, коли м’яч повністю перетнув лінію воріт."]}, {"h": "Футбол в Україні", "p": [], "ul": ["київське «Динамо» двічі вигравало Кубок володарів кубків (1975, 1986) і Суперкубок УЄФА (1975);", "донецький «Шахтар» виграв Кубок УЄФА у 2009 році;", "«Золотий м’яч» здобували Олег Блохін (1975), Ігор Бєланов (1986), Андрій Шевченко (2004);", "збірна України — чвертьфіналіст чемпіонату світу 2006 і Євро-2020; Україна разом з Польщею приймала Євро-2012."]}], "f": "Андрій Шевченко виграв Лігу чемпіонів з «Міланом» (2003) і став першим володарем «Золотого м’яча» в історії незалежної України (2004).", "pr": ["Намалюйте схему футбольного поля з розмітками (центральне коло, штрафний майданчик, точка пенальті, кутові сектори).", "Поясніть своїми словами правило офсайду з прикладом-схемою."], "q": ["Коли з’явилися перші єдині правила футболу?", "Скільки триває матч?", "Які розміри футбольних воріт?", "Що таке офсайд?", "Назвіть українських володарів «Золотого м’яча»."]}, {"n": "21", "t": "Удари по м’ячу ногою", "g": "Знати способи ударів по м’ячу ногою та їхнє призначення.", "k": "53, 57, 65, 70, 77", "terms": [["Удар внутрішньою стороною стопи", "найточніший удар, для передач на короткі й середні відстані."], ["Удар підйомом", "удар верхньою частиною стопи (шнурівкою); сильний, для ударів по воротах і далеких передач."], ["Опорна нога", "нога, що стоїть поруч із м’ячем під час удару."]], "th": [{"h": "Способи ударів", "p": [], "ul": ["внутрішньою стороною стопи — точні передачі;", "серединою підйому — сильні прямі удари;", "внутрішньою частиною підйому — навісні передачі, «закручені» удари;", "зовнішньою частиною підйому — удари з обертанням («шведкою»);", "носком — рідко, коли немає часу на замах."]}, {"h": "Фази удару", "p": [], "ul": ["розбіг — прямолінійний або під кутом;", "постановка опорної ноги збоку від м’яча (носок у напрямку удару);", "замах ударною ногою (згинання в коліні);", "удар — ступня напружена, зафіксована;", "супровід м’яча — нога продовжує рух у напрямку удару."]}, {"h": "Поради", "p": ["Дивіться на м’яч у момент удару, корпус над м’ячем для низького удару; відхилення корпусу назад робить удар «свічкою»."], "ul": []}], "f": "", "pr": ["Складіть таблицю «Спосіб удару — коли застосовують — точність / сила».", "Опишіть фази удару серединою підйому."], "q": ["Який удар найточніший і чому?", "Куди ставлять опорну ногу?", "Чому м’яч летить угору, якщо корпус відхилено назад?", "Для чого застосовують удар внутрішньою частиною підйому?"]}, {"n": "22", "t": "Зупинки та ведення м’яча різними способами", "g": "Знати способи зупинки й ведення м’яча і розуміти, коли їх застосовують.", "k": "53, 57, 61, 65, 70, 74, 77, 78", "terms": [["Зупинка (прийом) м’яча", "гасіння швидкості м’яча, щоб узяти його під контроль."], ["Ведення м’яча", "переміщення з м’ячем серією легких поштовхів."]], "th": [{"h": "Способи зупинки", "p": [], "ul": ["підошвою — для м’ячів, що котяться;", "внутрішньою стороною стопи — найпоширеніша;", "стегном — для м’ячів, що летять на рівні пояса;", "грудьми — для високих м’ячів;", "головою — рідко, у складних ситуаціях.", "Принцип: частина тіла «поступається» м’ячу, гасячи його швидкість (амортизація)."]}, {"h": "Способи ведення", "p": [], "ul": ["внутрішньою стороною стопи — зручно змінювати напрямок;", "зовнішньою частиною підйому — швидке ведення по прямій;", "серединою підйому — на великій швидкості;", "голова піднята, щоб бачити поле; м’яч близько до ноги, якщо поруч суперник."]}, {"h": "Контрольні нормативи (довідково)", "p": ["Зупинка м’яча різними способами та ведення м’яча зі зміною напрямку (між стійками) на час."], "ul": []}], "f": "", "pr": ["Опишіть, якою частиною тіла краще зупинити м’яч у 5 різних ситуаціях.", "Поясніть, чому під час ведення важливо тримати голову піднятою."], "q": ["Назвіть способи зупинки м’яча.", "Що означає «амортизувати» м’яч?", "Які способи ведення м’яча ви знаєте?", "Коли м’яч ведуть близько до ноги?"]}, {"n": "23", "t": "Фінти. Відбирання м’яча в підкаті", "g": "Знати, що таке фінти, їхні види, та правила безпечного відбору м’яча.", "k": "54, 59, 64, 69", "terms": [["Фінт", "обманний рух, що змушує суперника рушити в хибному напрямку."], ["Відбір", "дії, щоб заволодіти м’ячем суперника."], ["Підкат", "відбір м’яча в ковзанні по газону."]], "th": [{"h": "Види фінтів", "p": [], "ul": ["«відходом» — показати рух в один бік і піти в інший;", "«ударом» — імітувати удар чи передачу, а потім обійти суперника;", "«зупинкою» — різко зупинитися й змінити темп;", "переступи через м’яч."]}, {"h": "Відбір м’яча", "p": [], "ul": ["стоячи — випадом, виставленою ногою;", "плечем у плече (дозволений силовий прийом);", "у підкаті — ковзаючи по газону, вибити або забрати м’яч ногою."]}, {"h": "Безпека підкату", "p": ["Підкат виконують лише збоку або спереду, граючи в м’яч, а не в ногу суперника. Підкат ззаду, двома ногами чи з шипами вперед — грубе порушення, що карається червоною карткою й може спричинити важку травму. На шкільних уроках і на твердому покритті підкати не виконують."], "ul": []}], "f": "", "pr": ["Опишіть два фінти, які ви бачили у професійних футболістів.", "Складіть правила безпечного відбору м’яча."], "q": ["Що таке фінт?", "Назвіть види фінтів.", "Які способи відбору м’яча ви знаєте?", "Коли підкат вважається грубим порушенням?"]}, {"n": "24", "t": "Удари по м’ячу головою. Техніка удару лобом", "g": "Знати техніку удару лобом і правила безпечного виконання.", "k": "55, 60, 66, 71, 73, 76", "terms": [["Удар лобом", "удар серединою лоба — основний і найбезпечніший спосіб удару головою."]], "th": [{"h": "Техніка", "p": [], "ul": ["стежити за м’ячем до моменту удару, очі відкриті;", "шия напружена, підборіддя трохи притиснуте;", "удар серединою лоба (не маківкою чи скронею);", "рух іде від корпусу: прогин назад і різкий рух уперед;", "удари виконують з місця, у стрибку або в падінні."]}, {"h": "Безпека та здоров’я", "p": ["Часті удари головою можуть шкодити мозку, тому в багатьох країнах для дітей і підлітків кількість таких ударів на тренуваннях обмежують. На уроках використовують легкі м’ячі й невелику кількість повторів. При запамороченні, головному болю чи нудоті після удару — негайно припинити заняття."], "ul": []}], "f": "", "pr": ["Опишіть техніку удару лобом по етапах.", "Поясніть, чому для підлітків обмежують кількість ударів головою."], "q": ["Якою частиною голови б’ють по м’ячу?", "Чому шия має бути напруженою?", "Які симптоми після удару головою — привід припинити заняття?"]}, {"n": "25", "t": "Гра воротаря: кидки руками, вибивання м’яча ногами, гра на виходах", "g": "Знати основні технічні прийоми воротаря та правила, що стосуються його гри.", "k": "56, 62, 67, 75", "terms": [["Вихід воротаря", "рух воротаря з воріт, щоб перехопити м’яч до удару суперника."], ["Введення м’яча в гру", "кидок рукою або удар ногою воротаря після того, як він заволодів м’ячем."]], "th": [{"h": "Прийоми воротаря", "p": [], "ul": ["ловля м’яча — «чашечкою» з долонь, прижимання до грудей;", "відбивання кулаком — коли не впевнений, що спіймаєш;", "стрибок-кидок — для м’ячів у кут;", "вибір позиції — на бісектрисі кута між м’ячем і стійками воріт."]}, {"h": "Введення м’яча", "p": [], "ul": ["кидок знизу (котом) — на короткі відстані;", "кидок зверху (як гандбольний) — на середні відстані;", "вибивання з рук або з землі — на далекі відстані, для швидкої атаки."]}, {"h": "Гра на виходах", "p": ["Воротар виходить, щоб перехопити навісну передачу або скоротити кут перед ударом нападника. Потрібні рішучість, правильний вибір моменту і гучна команда захисникам («Моя!»)."], "ul": []}, {"h": "Правила для воротаря", "p": [], "ul": ["грати руками дозволено лише у своєму штрафному майданчику;", "тримати м’яч у руках — не довше 6 секунд;", "не можна брати в руки м’яч після навмисної передачі ногою від свого гравця."]}], "f": "Українець Олександр Шовковський провів понад 20 сезонів у воротах київського «Динамо» і відбив вирішальні пенальті в серії з Швейцарією на чемпіонаті світу 2006 року.", "pr": ["Намалюйте схему вибору позиції воротарем при ударі з флангу й по центру.", "Складіть таблицю «Спосіб введення м’яча — відстань — перевага»."], "q": ["Де воротар може грати руками?", "Скільки секунд воротар може тримати м’яч?", "Як обирає позицію воротар?", "Що таке гра на виходах?"]}, {"n": "26", "t": "Тактика футболу: швидкий і поступовий напад, організація оборони", "g": "Знати види нападу й оборони та принципи командної тактики у футболі.", "k": "58, 63, 68, 72", "terms": [["Швидкий напад (контратака)", "стрімка атака після відбору м’яча, поки суперник не організував оборону."], ["Поступовий (позиційний) напад", "атака з контролем м’яча, серіями передач, пошуком слабкого місця."], ["Персональна оборона", "кожен захисник опікає конкретного суперника."], ["Зонна оборона", "кожен захисник відповідає за свою зону поля."]], "th": [{"h": "Швидкий напад", "p": [], "ul": ["мінімум передач — довгі передачі вперед, ривки нападників;", "застосовують, коли суперник багатьма гравцями пішов в атаку;", "оборона проти нього — швидке повернення в оборону, страховка, перекриття зон і напрямків передач."]}, {"h": "Поступовий напад", "p": [], "ul": ["контроль м’яча, передачі в ширину й глибину;", "розтягування оборони суперника, пошук вільного простору;", "оборона проти нього — компактність, щільні лінії, пресинг."]}, {"h": "Схеми розстановки", "p": ["Розстановку позначають цифрами від захисту до атаки (без воротаря): 4-4-2, 4-3-3, 3-5-2. Вона визначає, скільки гравців у кожній лінії, але в грі гравці постійно взаємодіють і змінюють позиції."], "ul": []}, {"h": "Принципи командної гри", "p": [], "ul": ["кожен гравець атакує і обороняється;", "комунікація — голосові підказки партнерам;", "підтримка партнера з м’ячем, відкривання для передачі."]}], "f": "Тренер Валерій Лобановський одним з перших у світі застосував наукові методи (статистику, моделювання) у підготовці футбольної команди.", "pr": ["Намалюйте схему розстановки 4-4-2 або 4-3-3 і позначте зони відповідальності.", "Опишіть ситуацію, коли команді вигідно застосувати швидкий напад."], "q": ["Чим швидкий напад відрізняється від поступового?", "Що таке персональна та зонна оборона?", "Що означає розстановка 4-3-3?", "Які принципи командної гри ви знаєте?"]}]}, {"name": "Розділ 4. Легка атлетика (уроки 79–105)", "lessons": [{"n": "27", "t": "Інструктаж з БЖД на заняттях легкою атлетикою. Спеціальні бігові та стрибкові вправи. Історія легкої атлетики", "g": "Знати правила безпеки на заняттях легкою атлетикою, види легкої атлетики та призначення спеціальних вправ.", "k": "79 (первинний), 80–105 (повторення)", "terms": [["Легка атлетика", "«королева спорту»: біг, ходьба, стрибки, метання, багатоборства."], ["Бігова доріжка", "стадіонна доріжка довжиною 400 м (по першій доріжці)."], ["Сектор", "місце для стрибків чи метань."]], "th": [{"h": "Правила безпеки", "p": [], "ul": ["займатися в легкому одязі за погодою та в кросівках;", "бігти лише у своїй доріжці, не перетинати доріжку, де біжать інші;", "не стояти в секторі метання й не перебігати його; метати лише за командою вчителя, підбирати снаряди — теж за командою;", "перед стрибками перевірити, чи розпушено пісок у ямі, чи немає в ньому сторонніх предметів;", "після фінішу не зупинятися різко — поступово перейти на ходьбу;", "пити воду, у спеку — головний убір."]}, {"h": "Історія", "p": [], "ul": ["біг на один стадій (близько 192 м) — перша дисципліна античних Олімпійських ігор (776 р. до н. е.);", "легка атлетика — основа сучасних Олімпійських ігор з 1896 р.;", "World Athletics (колишня IAAF) заснована 1912 р."]}, {"h": "Видатні українські легкоатлети", "p": [], "ul": ["Валерій Борзов — олімпійський чемпіон 1972 р. у бігу на 100 і 200 м;", "Сергій Бубка — стрибки з жердиною, 35 світових рекордів, олімпійський чемпіон 1988 р.;", "Наталія Добринська — олімпійська чемпіонка 2008 р. в семиборстві;", "Ярослава Магучіх — олімпійська чемпіонка 2024 р. у стрибках у висоту, світова рекордсменка (2,10 м, 2024)."]}, {"h": "Спеціальні бігові та стрибкові вправи", "p": [], "ul": ["біг з високим підніманням стегна, із закиданням гомілки, семенячий біг — техніка й частота кроків;", "біг прямими ногами, стрибковий біг — сила поштовху;", "прискорення 20–30 м — швидкість;", "стрибки на одній і двох ногах, багатоскоки, стрибки через перешкоди — вибухова сила ніг."]}], "f": "Ярослава Магучіх встановила світовий рекорд 2,10 м у Парижі 7 липня 2024 року й за місяць виграла Олімпійські ігри в тому ж місті.", "pr": ["Складіть пам’ятку «Правила безпеки на заняттях легкою атлетикою».", "Підготуйте повідомлення про одного з українських легкоатлетів."], "q": ["Чому легку атлетику називають «королевою спорту»?", "Які правила безпеки діють у секторі метання?", "Назвіть видатних українських легкоатлетів.", "Для чого виконують біг з високим підніманням стегна?"]}, {"n": "28", "t": "Біг на короткі дистанції: 30 м, 100 м, 200 м. Серії бігу 3×30 м, 2×100 м, 2×200 м", "g": "Знати фази спринтерського бігу, види стартів та значення серійного (повторного) бігу для розвитку швидкості.", "k": "79, 82, 83, 84, 85, 86, 87, 88, 89, 93, 94, 97, 99, 101, 102, 103, 104, 105", "terms": [["Спринт", "біг на короткі дистанції (до 400 м) з максимальною швидкістю."], ["Низький старт", "старт зі стартових колодок; застосовують на 100, 200, 400 м."], ["Високий старт", "старт стоячи; застосовують на 30 м у школі та на довгих дистанціях."], ["Повторний (серійний) біг", "кілька відрізків з відпочинком між ними, напр. 3×30 м."]], "th": [{"h": "Фази спринтерського бігу", "p": [], "ul": ["старт — команди «На старт!», «Увага!», постріл (або «Руш!»);", "стартовий розбіг — перші 15–30 м, корпус поступово випрямляється, кроки збільшуються;", "біг по дистанції — максимальна швидкість, активна робота рук, біг на передній частині стопи;", "фініш — кидок грудьми або плечем на фінішну лінію, після фінішу — поступове зниження швидкості."]}, {"h": "Особливості 200 м", "p": ["Частину дистанції біжать по віражу (повороту): корпус нахиляють ліворуч, права рука працює ширше. Старт ставлять ближче до зовнішнього краю доріжки, щоб бігти по дотичній."], "ul": []}, {"h": "Серійний біг", "p": ["Повторний біг (3×30 м, 2×100 м, 2×200 м) розвиває швидкість і швидкісну витривалість. Між відрізками — відпочинок ходьбою до відновлення пульсу. Кожен відрізок пробігають з однаковою якістю техніки."], "ul": []}, {"h": "Типові помилки", "p": [], "ul": ["передчасне випрямлення на старті;", "біг «на п’ятках», закріпачені плечі;", "сповільнення перед фінішною лінією."]}], "f": "Світовий рекорд у бігу на 100 м (9,58 с) встановив Усейн Болт 2009 року — його середня швидкість становила майже 37,6 км/год.", "pr": ["Опишіть фази бігу на 100 м і зазначте головне завдання кожної.", "Обчисліть середню швидкість (м/с і км/год) бігуна, який пробіг 100 м за 14 с."], "q": ["Які фази має спринтерський біг?", "Чим низький старт відрізняється від високого?", "Як бігти по віражу?", "Для чого застосовують серійний біг?", "Як правильно фінішувати?"]}, {"n": "29", "t": "Біг на витривалість: повільний біг 6 хв, рівномірний біг до 1500 м", "g": "Знати особливості бігу на витривалість, правильну техніку й дихання, способи самоконтролю.", "k": "91, 92, 94, 96, 100", "terms": [["Витривалість", "здатність довго виконувати роботу без зниження ефективності."], ["Рівномірний біг", "біг з постійною помірною швидкістю."], ["Аеробне навантаження", "робота, під час якої організму вистачає кисню."]], "th": [{"h": "Техніка", "p": [], "ul": ["біг з високого старту;", "корпус майже вертикальний, плечі розслаблені;", "руки зігнуті приблизно під прямим кутом, рухаються вздовж тулуба;", "постановка стопи м’яка, з передньої частини або з перекатом;", "дихання ритмічне, через ніс і рот, на 2–3 кроки вдих і на 2–3 — видих."]}, {"h": "Як розподілити сили", "p": ["Не починати занадто швидко; тримати рівний темп, прискорюватися лише на останніх 100–200 м. Якщо з’являється задишка — трохи знизити темп."], "ul": []}, {"h": "Користь і самоконтроль", "p": [], "ul": ["біг на витривалість зміцнює серце, легені, судини, підвищує працездатність;", "оптимальний пульс під час оздоровчого бігу для підлітків — приблизно 130–160 уд/хв;", "після бігу пульс має знизитися до вихідного за 5–10 хвилин;", "«правило розмови»: під час повільного бігу можна говорити, не задихаючись."]}], "f": "", "pr": ["Складіть план поступового переходу від 3 до 6 хвилин безперервного бігу за 4 тижні (для самостійних занять після дозволу лікаря).", "Поясніть «правило розмови» і як за ним визначити інтенсивність."], "q": ["Що таке витривалість?", "Як правильно дихати під час тривалого бігу?", "Як розподілити сили на дистанції 1500 м?", "Який пульс оптимальний під час оздоровчого бігу?"]}, {"n": "30", "t": "Спортивна ходьба на відстань до 1000 м", "g": "Знати правила й техніку спортивної ходьби та її відмінність від бігу.", "k": "90, 95, 98", "terms": [["Спортивна ходьба", "олімпійська дисципліна: швидке пересування кроками з постійним контактом із землею."], ["Втрата контакту", "момент, коли обидві ноги в повітрі; у спортивній ходьбі заборонено."]], "th": [{"h": "Два головні правила", "p": [], "ul": ["постійний контакт із землею: одна нога ще не відірвалася, а друга вже торкається землі;", "опорна нога має бути випрямлена в коліні від моменту постановки на землю до вертикального положення."]}, {"h": "Техніка", "p": [], "ul": ["стопу ставлять на п’яту з перекатом на носок;", "активна робота тазу — він обертається навколо вертикальної осі, подовжуючи крок;", "руки зігнуті під кутом близько 90°, енергійно працюють;", "корпус прямий, погляд уперед."]}, {"h": "Порушення", "p": ["Суддя фіксує «втрату контакту» і «зігнуте коліно». За три попередження спортсмена дискваліфікують."], "ul": []}], "f": "Українські спортсмени у спортивній ходьбі неодноразово здобували медалі чемпіонатів світу та Європи.", "pr": ["Порівняйте спортивну ходьбу і біг: 3 спільні й 3 відмінні ознаки.", "Поясніть, чому за правилами коліно опорної ноги має бути випрямленим."], "q": ["Які два головні правила спортивної ходьби?", "Як ставлять стопу?", "Яку роль відіграє таз у техніці ходьби?", "За що дискваліфікують спортсменів?"]}, {"n": "31", "t": "Стрибки в довжину з місця", "g": "Знати техніку стрибка в довжину з місця та правила вимірювання результату.", "k": "80, 83, 89, 91, 96, 98, 100, 102", "terms": [["Вибухова сила", "здатність розвинути максимальне зусилля за найкоротший час."], ["Мах руками", "рух рук, що допомагає поштовху."]], "th": [{"h": "Техніка", "p": [], "ul": ["вихідне положення: ноги на ширині стопи чи плечей, носки біля лінії;", "підготовка: руки відводяться назад, ноги згинаються в колінах, корпус нахилений уперед;", "поштовх: одночасне розгинання ніг і мах руками вперед-угору;", "політ: ноги підтягнуті до грудей;", "приземлення: на обидві ноги з перекатом з п’ят на носки, коліна згинаються, руки вперед, щоб не впасти назад."]}, {"h": "Вимірювання", "p": ["Результат вимірюють від лінії поштовху до найближчого сліду, залишеного будь-якою частиною тіла. Тому падати назад на руки не можна — результат зменшиться."], "ul": []}, {"h": "Контрольний норматив (довідково)", "p": ["Стрибок у довжину з місця входить до державних тестів фізичної підготовленості; нормативи для юнаків і дівчат визначає навчальна програма."], "ul": []}], "f": "", "pr": ["Опишіть фази стрибка в довжину з місця та помилки в кожній.", "Поясніть, від якої точки вимірюють результат і чому важливо не падати назад."], "q": ["Яке вихідне положення перед стрибком?", "Навіщо робити мах руками?", "Як правильно приземлятися?", "Як вимірюють результат?"]}, {"n": "32", "t": "Стрибки в довжину з розбігу способами «зігнувши ноги» та «прогинаючись»", "g": "Знати фази стрибка в довжину з розбігу та особливості способів «зігнувши ноги» і «прогинаючись».", "k": "79, 80, 81, 82, 85, 87, 92, 97, 101, 104", "terms": [["Брусок для відштовхування", function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  if (l.qz) return shuffle(l.qz).slice(0, 5).map(x => ({ q: x.q, sub: "", why: x.why || "", opts: shuffle(x.o.map((o, j) => [o, j === x.a])) }));
  const s = l.subj;
  const uniq = arr => { const seen = new Set(); return arr.filter(([t]) => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const themeTerms = uniq(l.theme.lessons.flatMap(x => x.terms));
  const subjTerms = uniq(s.flat.flatMap(x => x.terms));
  let pool = shuffle(uniq(l.terms));
  if (pool.length < 5) pool = pool.concat(shuffle(themeTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  if (pool.length < 5) pool = pool.concat(shuffle(subjTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  pool = pool.slice(0, 5);
  return pool.map(([term, def], i) => {
    const others = shuffle(themeTerms.filter(t => norm(t[0]) !== norm(term) && t[1] !== def));
    let dis = others.slice(0, 3);
    if (dis.length < 3) dis = dis.concat(shuffle(subjTerms.filter(t => norm(t[0]) !== norm(term) && !dis.includes(t))).slice(0, 3 - dis.length));
    const byDef = i % 2 === 1;
    const opts = shuffle([[byDef ? term : def, true], ...dis.map(d => [byDef ? d[0] : d[1], false])]);
    return byDef
      ? { q: "Який термін відповідає визначенню?", sub: def, opts }
      : { q: "Що означає термін «" + term + "»?", sub: "", opts };
  });
}

function renderToc(){
  const s = DATA.find(x => x.id === cur.s);
  document.documentElement.style.setProperty("--subj", COLORS[s.id] || COLORS[s.id.replace(/\d+$/, "")]);
  [...tabs.children].forEach(b => b.setAttribute("aria-selected", b.dataset.s === s.id));
  const qv = norm(document.getElementById("search").value || "");
  const toc = document.getElementById("toc"); toc.innerHTML = "";
  let shown = 0;
  s.themes.forEach(t => {
    const ls = t.lessons.filter(l => !qv || norm(l.t).includes(qv) || l.terms.some(x => norm(x[0]).includes(qv)));
    if (!ls.length) return;
    const d = document.createElement("div"); d.className = "theme";
    d.innerHTML = "<h3>" + esc(t.name) + "</h3>";
    ls.forEach(l => {
      shown++;
      const r = results[l.id];
      const b = document.createElement("button"); b.className = "les";
      b.setAttribute("aria-current", l.id === cur.id);
      const no = s.id === "zu" ? "№ " + l.n : l.n;
      b.innerHTML = '<span class="no">' + esc(no) + '</span><span class="tt">' + esc(l.t) + '</span>' +
        (r ? '<span class="st ' + (r >= 4 ? "done" : "part") + '">' + r + "/5</span>" : "");
      b.onclick = () => open(l.id);
      d.appendChild(b);
    });
    toc.appendChild(d);
  });
  if (!shown) toc.innerHTML = '<p class="empty">Нічого не знайдено. Спробуйте інше слово.</p>';
  const ql = s.flat.filter(l => !l.noquiz), done = ql.filter(l => (results[l.id] || 0) >= 4).length;
  document.getElementById("progTxt").textContent = done + " / " + ql.length;
  document.getElementById("progBar").style.width = (100 * done / ql.length) + "%";
}

function renderLesson(){
  const l = LES[cur.id], s = l.subj;
  const A = document.getElementById("art");
  let h = '<div class="eyebrow">' + esc(s.name) + " · " + esc(l.theme.name) + "</div>";
  h += "<h1>" + esc(l.t) + "</h1><div class=\"meta\">";
  h += '<span class="chip">' + (s.id === "zu" ? "Заняття " : s.id.startsWith("pe") ? "Конспект " : s.id === "tech" ? "Тема " : "Урок ") + esc(l.n) + "</span>";
  if (l.noquiz) h += '<span class="chip">Творчий проєкт</span>';
  if (l.book) h += '<a class="chip" href="' + esc(l.book.href) + '" target="_blank" rel="noopener">' + esc(l.book.label) + ' ↗</a>';
  if (l.k) h += '<span class="chip">Уроки за КТП: ' + esc(l.k.replace(/^Уроки за КТП:\s*/, "")) + "</span>";
  h += "</div>";
  if (l.g) h += '<div class="goal"><b>Мета.</b>' + esc(l.g) + "</div>";
  if (l.terms.length && !l.bl) { h += "<h2>Ключові поняття</h2><dl class=\"terms\">" + l.terms.map(([t, d]) => "<dt>" + esc(t) + "</dt><dd>" + esc(d) + "</dd>").join("") + "</dl>"; }
  if (l.bl) {
    h += '<div class="prose">';
    const li = ([a, b]) => "<li>" + (a ? "<b>" + esc(a) + "</b> " : "") + esc(b) + "</li>";
    l.bl.forEach(b => {
      if (b.k === "h2") h += "</div><h2>" + esc(b.v) + '</h2><div class="prose">';
      else if (b.k === "h3") h += "<h3>" + esc(b.v) + "</h3>";
      else if (b.k === "p") h += "<p>" + esc(b.v) + "</p>";
      else if (b.k === "lead") h += '<p class="lead">' + esc(b.v) + "</p>";
      else if (b.k === "call") h += '<div class="call">' + esc(b.v) + "</div>";
      else if (b.k === "fig") h += '<figure class="fig"><img src="' + b.src + '" alt="' + esc(b.alt) + '" loading="lazy"></figure>';
      else if (b.k === "ul") h += "<ul>" + b.v.map(li).join("") + "</ul>";
      else if (b.k === "ol" || b.k === "crit") h += "<ol>" + b.v.map(li).join("") + "</ol>";
      else if (b.k === "steps") h += '<ol class="steps">' + b.v.map(([a, c]) => "<li><b>" + esc(a) + "</b>" + esc(c) + "</li>").join("") + "</ol>";
      else if (b.k === "terms") h += '<ul class="tgrid">' + b.v.map(([a, c]) => "<li><b>" + esc(a) + "</b>" + esc(c) + "</li>").join("") + "</ul>";
      else if (b.k === "cards") h += '<div class="cardsx">' + b.v.map(c => '<article class="cardx"><img src="' + c.src + '" alt="' + esc(c.alt) + '" loading="lazy"><div>' + (c.h ? "<h4>" + esc(c.h) + "</h4>" : "") + c.v.map(([a, d]) => "<p>" + (a ? "<b>" + esc(a) + "</b>" : "") + esc(d) + "</p>").join("") + "</div></article>").join("") + "</div>";
    });
    h += "</div>";
  }
  if (l.th.length) {
    h += "<h2>" + (l.terms.length ? "Теоретичний матеріал" : "Узагальнення") + '</h2><div class="prose">';
    l.th.forEach(b => {
      if (b.h) h += "<h4>" + esc(b.h) + "</h4>";
      b.p.forEach(p => h += "<p>" + esc(p) + "</p>");
      if (b.ul.length) h += "<ul>" + b.ul.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
    });
    h += "</div>";
  }
  if (l.f) h += '<div class="fact"><b>Цікаво знати</b>' + esc(l.f) + "</div>";
  if (l.pr.length) h += '<h2>Практичне завдання</h2><div class="prose"><ul class="tasks">' + l.pr.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
  if (l.q.length) h += '<h2>Питання для самоперевірки</h2><div class="prose"><ol>' + l.q.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol></div>";
  if (!l.noquiz) h += '<section class="quiz" id="quiz"></section>';
  A.innerHTML = h;
  A.querySelectorAll(".fig img,.cardx img").forEach(im => im.onclick = () => {
    const d = document.createElement("div"); d.className = "lb"; d.innerHTML = '<img alt="">'; d.firstChild.src = im.src; d.firstChild.alt = im.alt;
    d.onclick = () => d.remove(); document.body.appendChild(d); });
  if (!l.noquiz) renderQuiz(l);
  const i = s.flat.indexOf(l), pv = s.flat[i - 1], nx = s.flat[i + 1];
  const P = document.getElementById("pager"); P.innerHTML = "";
  [[pv, "← Попередній"], [nx, "Наступний →"]].forEach(([x, lab]) => { if (!x) return;
    const b = document.createElement("button"); b.innerHTML = esc(lab) + "<b>" + esc(x.t) + "</b>"; b.onclick = () => open(x.id); P.appendChild(b); });
}

function renderQuiz(l){
  const Q = makeQuiz(l), box = document.getElementById("quiz");
  const prev = results[l.id];
  let h = '<div class="qhead"><h2>Тест · 5 завдань</h2><p>' + (prev ? "Найкращий результат: " + prev + " з 5" : "Оберіть одну відповідь у кожному завданні") + "</p></div><form id=\"qf\">";
  Q.forEach((q, i) => {
    h += '<div class="q"><div class="qt"><span>' + (i + 1) + ".</span><div>" + esc(q.q) + (q.sub ? "<br><em>" + esc(q.sub) + "</em>" : "") + '</div></div><div class="opts">';
    q.opts.forEach(([t], j) => h += '<label class="opt"><input type="radio" name="q' + i + '" id="q' + i + "o" + j + '" value="' + j + '"><span>' + esc(t) + "</span></label>");
    h += "</div></div>";
  });
  h += '<div class="qfoot"><button class="btn" type="submit" id="chk" disabled>Перевірити</button><button class="btn ghost" type="button" id="again">Інші питання</button><span class="score" id="sc" aria-live="polite"></span></div></form>';
  box.innerHTML = h;
  const f = document.getElementById("qf"), chk = document.getElementById("chk");
  f.addEventListener("change", () => { chk.disabled = Q.some((_, i) => !f["q" + i] || ![...f.querySelectorAll('[name="q' + i + '"]')].some(x => x.checked)); });
  document.getElementById("again").onclick = () => renderQuiz(l);
  f.addEventListener("submit", e => {
    e.preventDefault(); if (f.classList.contains("checked")) return;
    let ok = 0;
    Q.forEach((q, i) => {
      const inputs = [...f.querySelectorAll('[name="q' + i + '"]')];
      inputs.forEach((inp, j) => { inp.disabled = true; const lab = inp.parentElement;
        if (q.opts[j][1]) lab.classList.add("right"); else if (inp.checked) lab.classList.add("wrong"); });
      if (q.why) { const w = document.createElement("p"); w.className = "why"; w.textContent = q.why; inputs[0].closest(".opts").after(w); }
      const sel = inputs.findIndex(x => x.checked); if (sel >= 0 && q.opts[sel][1]) ok++;
    });
    f.classList.add("checked"); chk.disabled = true;
    const sc = document.getElementById("sc");
    sc.className = "score " + (ok >= 4 ? "good" : ok >= 3 ? "mid" : "low");
    sc.textContent = "Результат: " + ok + " з 5. " + (ok === 5 ? "Чудово!" : ok >= 4 ? "Добре засвоєно." : ok >= 3 ? "Повторіть ключові поняття." : "Перечитайте конспект і спробуйте ще раз.");
    if (ok > (results[l.id] || 0)) { results[l.id] = ok; store.set(results); }
    renderToc();
  });
}

function open(id){
  cur = { s: LES[id].subj.id, id };
  try { localStorage.setItem("yasno-last", id); } catch(e){}
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  renderToc(); renderLesson();
  document.getElementById("side").classList.remove("open");
  document.getElementById("tocBtn").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}
document.getElementById("search").addEventListener("input", renderToc);
document.getElementById("tocBtn").onclick = e => { const sd = document.getElementById("side"); const o = sd.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
open(cur.id);
</script>
