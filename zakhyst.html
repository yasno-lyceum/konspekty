  set(o){ try { localStorage.setItem("yasno-quiz", JSON.stringify(o)); } catch(e){} }
};
let results = store.get();

// flatten
const LES = {};
DATA.forEach(s => { s.flat = []; s.themes.forEach((t, ti) => t.lessons.forEach((l, li) => {
  l.id = s.id + "-" + s.flat.length; l.subj = s; l.theme = t; l.ti = ti; s.flat.push(l); LES[l.id] = l; })); });

let cur = { s: DATA[0].id, id: DATA[0].flat[0].id };
if (DATA.length === 1) { document.getElementById("tabs").hidden = true;
  const bk = document.createElement("a"); bk.className = "back"; bk.href = "index.html#k10"; bk.textContent = "← Усі предмети";
  document.querySelector(".top-in").appendChild(bk); }
try { const h = location.hash.slice(1); if (LES[h]) cur = { s: LES[h].subj.id, id: h }; else { const last = localStorage.getItem("yasno-last"); if (last && LES[last]) cur = { s: LES[last].subj.id, id: last }; } } catch(e){}

const tabs = document.getElementById("tabs");
DATA.forEach(s => {
  const b = document.createElement("button");
  b.className = "tab"; b.role = "tab"; b.style.setProperty("--c", COLORS[s.id] || COLORS[s.id.replace(/\d+$/, "")]);
  b.innerHTML = "<i></i>" + esc(s.short); b.dataset.s = s.id;
  b.onclick = () => { if (cur.s !== s.id) open(s.flat[0].id); };
  tabs.appendChild(b);
});
(typeof LINKS !== "undefined" ? LINKS : []).forEach(x => {
  const a = document.createElement("a");
  a.className = "tab"; a.href = x.href; a.style.setProperty("--c", x.c);
  a.innerHTML = "<i></i>" + esc(x.name) + ' <span aria-hidden="true">↗</span>';
  a.title = "Відкрити курс «" + x.name + "»";
  tabs.appendChild(a);
});

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = t => t.toLowerCase().replace(/[«»"()]/g, "").trim();

function makeQuiz(l){
  if (l.qz) return shuffle(l.qz).slice(0, 5).map(x => ({ q: x.q, sub: "", why: x.why || "", opts: shuffle(x.o.map((o, j) => [o, j === x.a])) }));
  const s = l.subj;
  const uniq = arr => { const seen = new Set(); return arr.filter(([t]) => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const themeTerms = uniq(l.theme.lessons.flatMap(x => x.terms));
  const subjTerms = uniq(s.flat.flatMap(x => x.terms));
  let pool = shuffle(uniq(l.terms));
  if (pool.length < 5) pool = pool.concat(shuffle(themeTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  if (pool.length < 5) pool = pool.concat(shuffle(subjTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  pool = pool.slice(0, 5);
  return pool.map(([term, def], i) => {
    const others = shuffle(themeTerms.filter(t => norm(t[0]) !== norm(term) && t[1] !== def));
    let dis = others.slice(0, 3);
    if (dis.length < 3) dis = dis.concat(shuffle(subjTerms.filter(t => norm(t[0]) !== norm(term) && !dis.includes(t))).slice(0, 3 - dis.length));
    const byDef = i % 2 === 1;
    const opts = shuffle([[byDef ? term : def, true], ...dis.map(d => [byDef ? d[0] : d[1], false])]);
    return byDef
      ? { q: "Який термін відповідає визначенню?", sub: def, opts }
      : { q: "Що означає термін «" + term + "»?", sub: "", opts };
  });
}

function renderToc(){
  const s = DATA.find(x => x.id === cur.s);
  document.documentElement.style.setProperty("--subj", COLORS[s.id] || COLORS[s.id.replace(/\d+$/, "")]);
  [...tabs.children].forEach(b => b.setAttribute("aria-selected", b.dataset.s === s.id));
  const qv = norm(document.getElementById("search").value || "");
  const toc = document.getElementById("toc"); toc.innerHTML = "";
  let shown = 0;
  s.themes.forEach(t => {
    const ls = t.lessons.filter(l => !qv || norm(l.t).includes(qv) || l.terms.some(x => norm(x[0]).includes(qv)));
    if (!ls.length) return;
    const d = document.createElement("div"); d.className = "theme";
    d.innerHTML = "<h3>" + esc(t.name) + "</h3>";
    ls.forEach(l => {
      shown++;
      const r = results[l.id];
      const b = document.createElement("button"); b.className = "les";
      b.setAttribute("aria-current", l.id === cur.id);
      const no = s.id === "zu" ? "№ " + l.n : l.n;
      b.innerHTML = '<span class="no">' + esc(no) + '</span><span class="tt">' + esc(l.t) + '</span>' +
        (r ? '<span class="st ' + (r >= 4 ? "done" : "part") + '">' + r + "/5</span>" : "");
      b.onclick = () => open(l.id);
      d.appendChild(b);
    });
    toc.appendChild(d);
  });
  if (!shown) toc.innerHTML = '<p class="empty">Нічого не знайдено. Спробуйте інше слово.</p>';
  const ql = s.flat.filter(l => !l.noquiz), done = ql.filter(l => (results[l.id] || 0) >= 4).length;
  document.getElementById("progTxt").textContent = done + " / " + ql.length;
  document.getElementById("progBar").style.width = (100 * done / ql.length) + "%";
}

function renderLesson(){
  const l = LES[cur.id], s = l.subj;
  const A = document.getElementById("art");
  let h = '<div class="eyebrow">' + esc(s.name) + " · " + esc(l.theme.name) + "</div>";
  h += "<h1>" + esc(l.t) + "</h1><div class=\"meta\">";
  h += '<span class="chip">' + (s.id === "zu" ? "Заняття " : s.id.startsWith("pe") ? "Конспект " : s.id === "tech" ? "Тема " : "Урок ") + esc(l.n) + "</span>";
  if (l.noquiz) h += '<span class="chip">Творчий проєкт</span>';
  if (l.book) h += '<a class="chip" href="' + esc(l.book.href) + '" target="_blank" rel="noopener">' + esc(l.book.label) + ' ↗</a>';
  if (l.k) h += '<span class="chip">Уроки за КТП: ' + esc(l.k.replace(/^Уроки за КТП:\s*/, "")) + "</span>";
  h += "</div>";
  if (l.g) h += '<div class="goal"><b>Мета.</b>' + esc(l.g) + "</div>";
  if (l.terms.length && !l.bl) { h += "<h2>Ключові поняття</h2><dl class=\"terms\">" + l.terms.map(([t, d]) => "<dt>" + esc(t) + "</dt><dd>" + esc(d) + "</dd>").join("") + "</dl>"; }
  if (l.bl) {
    h += '<div class="prose">';
    const li = ([a, b]) => "<li>" + (a ? "<b>" + esc(a) + "</b> " : "") + esc(b) + "</li>";
    l.bl.forEach(b => {
      if (b.k === "h2") h += "</div><h2>" + esc(b.v) + '</h2><div class="prose">';
      else if (b.k === "h3") h += "<h3>" + esc(b.v) + "</h3>";
      else if (b.k === "p") h += "<p>" + esc(b.v) + "</p>";
      else if (b.k === "lead") h += '<p class="lead">' + esc(b.v) + "</p>";
      else if (b.k === "call") h += '<div class="call">' + esc(b.v) + "</div>";
      else if (b.k === "fig") h += '<figure class="fig"><img src="' + b.src + '" alt="' + esc(b.alt) + '" loading="lazy"></figure>';
      else if (b.k === "ul") h += "<ul>" + b.v.map(li).join("") + "</ul>";
      else if (b.k === "ol" || b.k === "crit") h += "<ol>" + b.v.map(li).join("") + "</ol>";
      else if (b.k === "steps") h += '<ol class="steps">' + b.v.map(([a, c]) => "<li><b>" + esc(a) + "</b>" + esc(c) + "</li>").join("") + "</ol>";
      else if (b.k === "terms") h += '<ul class="tgrid">' + b.v.map(([a, c]) => "<li><b>" + esc(a) + "</b>" + esc(c) + "</li>").join("") + "</ul>";
      else if (b.k === "cards") h += '<div class="cardsx">' + b.v.map(c => '<article class="cardx"><img src="' + c.src + '" alt="' + esc(c.alt) + '" loading="lazy"><div>' + (c.h ? "<h4>" + esc(c.h) + "</h4>" : "") + c.v.map(([a, d]) => "<p>" + (a ? "<b>" + esc(a) + "</b>" : "") + esc(d) + "</p>").join("") + "</div></article>").join("") + "</div>";
    });
    h += "</div>";
  }
  if (l.th.length) {
    h += "<h2>" + (l.terms.length ? "Теоретичний матеріал" : "Узагальнення") + '</h2><div class="prose">';
    l.th.forEach(b => {
      if (b.h) h += "<h4>" + esc(b.h) + "</h4>";
      b.p.forEach(p => h += "<p>" + esc(p) + "</p>");
      if (b.ul.length) h += "<ul>" + b.ul.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
    });
    h += "</div>";
  }
  if (l.f) h += '<div class="fact"><b>Цікаво знати</b>' + esc(l.f) + "</div>";
  if (l.pr.length) h += '<h2>Практичне завдання</h2><div class="prose"><ul class="tasks">' + l.pr.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
  if (l.q.length) h += '<h2>Питання для самоперевірки</h2><div class="prose"><ol>' + l.q.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol></div>";
  if (!l.noquiz) h += '<section class="quiz" id="quiz"></section>';
  A.innerHTML = h;
  A.querySelectorAll(".fig img,.cardx img").forEach(im => im.onclick = () => {
    const d = document.createElement("div"); d.className = "lb"; d.innerHTML = '<img alt="">'; d.firstChild.src = im.src; d.firstChild.alt = im.alt;
    d.onclick = () => d.remove(); document.body.appendChild(d); });
  if (!l.noquiz) renderQuiz(l);
  const i = s.flat.indexOf(l), pv = s.flat[i - 1], nx = s.flat[i + 1];
  const P = document.getElementById("pager"); P.innerHTML = "";
  [[pv, "← Попередній"], [nx, "Наступний →"]].forEach(([x, lab]) => { if (!x) return;
    const b = document.createElement("button"); b.innerHTML = esc(lab) + "<b>" + esc(x.t) + "</b>"; b.onclick = () => open(x.id); P.appendChild(b); });
}

function renderQuiz(l){
  const Q = makeQuiz(l), box = document.getElementById("quiz");
  const prev = results[l.id];
  let h = '<div class="qhead"><h2>Тест · 5 завдань</h2><p>' + (prev ? "Найкращий результат: " + prev + " з 5" : "Оберіть одну відповідь у кожному завданні") + "</p></div><form id=\"qf\">";
  Q.forEach((q, i) => {
    h += '<div class="q"><div class="qt"><span>' + (i + 1) + ".</span><div>" + esc(q.q) + (q.sub ? "<br><em>" + esc(q.sub) + "</em>" : "") + '</div></div><div class="opts">';
    q.opts.forEach(([t], j) => h += '<label class="opt"><input type="radio" name="q' + i + '" id="q' + i + "o" + j + '" value="' + j + '"><span>' + esc(t) + "</span></label>");
    h += "</div></div>";
  });
  h += '<div class="qfoot"><button class="btn" type="submit" id="chk" disabled>Перевірити</button><button class="btn ghost" type="button" id="again">Інші питання</button><span class="score" id="sc" aria-live="polite"></span></div></form>';
  box.innerHTML = h;
  const f = document.getElementById("qf"), chk = document.getElementById("chk");
  f.addEventListener("change", () => { chk.disabled = Q.some((_, i) => !f["q" + i] || ![...f.querySelectorAll('[name="q' + i + '"]')].some(x => x.checked)); });
  document.getElementById("again").onclick = () => renderQuiz(l);
  f.addEventListener("submit", e => {
    e.preventDefault(); if (f.classList.contains("checked")) return;
    let ok = 0;
    Q.forEach((q, i) => {
      const inputs = [...f.querySelectorAll('[name="q' + i + '"]')];
      inputs.forEach((inp, j) => { inp.disabled = true; const lab = inp.parentElement;
        if (q.opts[j][1]) lab.classList.add("right"); else if (inp.checked) lab.classList.add("wrong"); });
      if (q.why) { const w = document.createElement("p"); w.className = "why"; w.textContent = q.why; inputs[0].closest(".opts").after(w); }
      const sel = inputs.findIndex(x => x.checked); if (sel >= 0 && q.opts[sel][1]) ok++;
    });
    f.classList.add("checked"); chk.disabled = true;
    const sc = document.getElementById("sc");
    sc.className = "score " + (ok >= 4 ? "good" : ok >= 3 ? "mid" : "low");
    sc.textContent = "Результат: " + ok + " з 5. " + (ok === 5 ? "Чудово!" : ok >= 4 ? "Добре засвоєно." : ok >= 3 ? "Повторіть ключові поняття." : "Перечитайте конспект і спробуйте ще раз.");
    if (ok > (results[l.id] || 0)) { results[l.id] = ok; store.set(results); }
    renderToc();
  });
}

function open(id){
  cur = { s: LES[id].subj.id, id };
  try { localStorage.setItem("yasno-last", id); } catch(e){}
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  renderToc(); renderLesson();
  document.getElementById("side").classList.remove("open");
  document.getElementById("tocBtn").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}
document.getElementById("search").addEventListener("input", renderToc);
document.getElementById("tocBtn").onclick = e => { const sd = document.getElementById("side"); const o = sd.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
open(cur.id);
</script>
