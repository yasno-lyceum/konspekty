<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конспекти · Захист України · 10 клас</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: класний «підручник» — бічний зміст розділів зліва, колонка читання ~68 знаків справа, тест вбудований наприкінці кожного уроку */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EAEEF4; --ink:#152030; --muted:#566275; --line:#D9DFE8;
  --accent:#1F4E79; --accent-soft:#E3ECF6; --copper:#B4521A; --copper-soft:#FBEDE3;
  --ok:#23703A; --ok-soft:#E3F2E7; --bad:#B42323; --bad-soft:#FBE6E6;
  --s-art:#8A3866; --s-zu:#56652A; --s-pe:#0F766E; --s-tech:#B4441C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto;flex-wrap:wrap}
.tab{text-decoration:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--subj);border-radius:6px;transition:width .3s}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:12px}
.theme{margin-bottom:14px}
.theme h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:700;line-height:1.35}
.les{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.35}
.les:hover{background:var(--sunk)}
.les[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.les .no{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.les .tt{flex:1;min-width:0}
.les .st{flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--copper-soft);color:var(--copper)}
.empty{color:var(--muted);font-size:13px;padding:8px}

main{min-width:0}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subj)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
a.chip{color:var(--accent);text-decoration:none}
a.chip:hover{text-decoration:underline}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-family:var(--f-body);font-size:16px;line-height:1.55;max-width:68ch}
.goal b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:30px 0 12px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-family:var(--f-body);font-size:16.5px;line-height:1.65;max-width:68ch}
.prose h4{font-family:var(--f-ui);font-size:15px;font-weight:700;margin:20px 0 6px}
.prose p{margin:0 0 10px;text-indent:1.4em}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em}
.prose li{margin-bottom:5px}
.terms{display:grid;grid-template-columns:minmax(120px,30%) 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:76ch}
.terms dt,.terms dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}
.terms dt{font-weight:700;background:var(--sunk);font-size:14px}
.terms dd{font-family:var(--f-body);font-size:15px}
.fact{margin-top:20px;background:var(--copper-soft);border-radius:var(--r);padding:14px 16px;max-width:68ch;font-family:var(--f-body);font-size:15.5px}
.fact b{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.prose .lead{text-indent:0;font-size:17.5px}
.prose h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:22px 0 8px}
.prose h2x{display:block}
.prose li b{font-family:var(--f-ui);font-size:.95em}
.call{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;max-width:68ch}
.fig{margin:14px 0 18px;max-width:68ch}
.fig img,.cardx img{display:block;width:100%;height:auto;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.cardsx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0 20px}
.cardx{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.cardx img{aspect-ratio:16/10;object-fit:cover;border-radius:0}
.cardx div{padding:10px 12px 12px;font-family:var(--f-body);font-size:14.5px}
.cardx h4{margin:0 0 4px;font-family:var(--f-ui);font-size:15px}
.cardx p{margin:0 0 6px;text-indent:0}
.cardx p b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subj)}
.prose .tgrid{padding-left:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px;padding:0;list-style:none}
.tgrid li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--surface);margin:0}
.tgrid li b{display:block;color:var(--subj);font-family:var(--f-ui)}
.steps{counter-reset:st;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.steps li::before{content:counter(st);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-ui);text-align:center}
.steps li b{display:block;font-family:var(--f-ui)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tasks li::marker{content:"✎  ";color:var(--copper)}

.quiz{margin-top:34px;border:1.5px solid var(--subj);border-radius:14px;padding:clamp(16px,3vw,26px);background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.qhead h2{margin:0;color:var(--ink)}
.qhead h2::after{display:none}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.q{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt span{color:var(--subj);font-variant-numeric:tabular-nums;flex:0 0 auto}
.q .qt div{min-width:0}
.q .qt em{font-family:var(--f-body);font-weight:400}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.opt span{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.checked .opt{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);font-family:var(--f-body)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)} .score.mid{color:var(--copper)} .score.low{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:14px}
.pager button:last-child{text-align:right;margin-left:auto}

@media (max-width:880px){
  .back{padding:6px 10px;font-size:13px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:inline-block}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px}
  .tab:last-child:nth-child(odd){grid-column:1/-1}
  .tab{flex:1 1 auto;justify-content:center;padding:7px 6px;font-size:12.5px;gap:5px;white-space:nowrap}
  .terms{grid-template-columns:1fr}
  .terms dt{border-top:1px solid var(--line)}
  .terms dd{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = [{"id": "zu", "name": "Захист України", "short": "Захист України", "themes": [{"name": "Тренінг 1. Основи національної безпеки та оборони України", "lessons": [{"n": "1–2", "t": "Взаємодія між громадянами / громадянками і державою у захисті країни", "g": "Зрозуміти, чому оборона країни починається з довіри, співпраці та відповідальності кожного громадянина й громадянки, і як розподіл благ у суспільстві впливає на згуртованість держави.", "k": "", "terms": [["Держава", "політична організація суспільства на певній території з публічною владою, законами та бюджетом."], ["Суспільне (спільне) благо", "те, що корисне всім: безпека, дороги, освіта, медицина; воно створюється спільними внесками громадян."], ["Довіра", "впевненість, що інші люди й держава діятимуть чесно та в спільних інтересах."], ["Громадський контроль", "право й можливість громадян перевіряти, як держава використовує ресурси."], ["Середній клас", "люди зі стабільним доходом і доступом до освіти, роботи, базової фінансової безпеки."]], "th": [{"h": "Про предмет «Захист України»", "p": ["Протягом двох років ви опануєте знання й навички, потрібні громадянину та громадянці країни, що захищається від збройної агресії: основи національної безпеки, будову війська, орієнтування на місцевості, домедичну допомогу, правила безпечного поводження зі зброєю тощо. Головна ідея курсу: оборона — справа не лише армії, а всього суспільства."], "ul": []}, {"h": "Гра «Дві держави»: чого вона вчить", "p": ["На уроці ви грали ролі громадян двох держав — «Трикутник» і «Коло». Обидві держави мали однаковий загальний бюджет і однакові умови від «Світового ринку». Відрізнявся лише розподіл «успіхів» між людьми:"], "ul": ["у «Трикутнику» більшість громадян мала 1–2 «успіхи», а кілька людей — дуже багато (суспільство олігархів і бідних);", "у «Колі» переважав середній клас — «успіхи» були розподілені рівномірніше.", "Щоб держава зростала, громадяни мали добровільно вкладати свої «успіхи» в державну скарбницю. Коли люди не довіряли одне одному й державі, кожен грав «на себе» — і програвали всі."]}, {"h": "Головні висновки", "p": [], "ul": ["Довіру, співпрацю й домовленості легше будувати там, де якомога менше людей почувається погано — економічно, психологічно, морально, правово.", "Держава, що дбає лише про інтереси окремих людей «коштом системи», стає слабшою.", "Розбудова довіри — складний процес: потрібно відкриватися, переконувати, ризикувати й бути чесним.", "Корупція, обман і нерівність руйнують систему довіри, а прозорість і громадський контроль її зміцнюють.", "Кожен громадянин і кожна громадянка своїми рішеннями впливає на силу держави."]}, {"h": "Громадяни і держава у захисті країни", "p": ["Держава забезпечує безпеку, охорону прав, захист кордонів. Громадяни сплачують податки, виконують закони, долучаються до волонтерства, служать у війську, беруть участь у громадському житті й контролюють владу. Коли ці дві сторони довіряють одна одній, країна стає стійкою навіть у найскладніші часи."], "ul": []}], "f": "Дослідження показують: у країнах з вищим рівнем довіри між людьми економіка зростає швидше, а корупції менше, бо на перевірки й «страховки» від обману витрачається менше ресурсів.", "pr": ["Пригадайте хід гри «Дві держави» та дайте письмові відповіді: яку стратегію обрали ви й чому? Що допомогло або завадило вашій державі?", "Наведіть 3 приклади з реального життя (школа, громада, країна), коли спільні внески людей створили благо для всіх.", "Складіть «правила довіри» для вашого класу (5–7 пунктів)."], "q": ["Чим відрізнялися держави «Трикутник» і «Коло»?", "Чому в державі з середнім класом легше досягти спільної мети?", "Які дії громадян і держави руйнують довіру?", "Що таке громадський контроль і навіщо він потрібен?", "Як особисто ви можете зміцнювати довіру в громаді?"]}, {"n": "3", "t": "Конституційний обов’язок. Військовий обов’язок", "g": "Зрозуміти, що таке військовий обов’язок, ознайомитися з різними моделями військової служби у світі та сформувати власну обґрунтовану думку про оптимальну модель для України.", "k": "", "terms": [["Конституційний обов’язок", "обов’язок, закріплений у Конституції. Стаття 65 Конституції України: захист Вітчизни, незалежності та територіальної цілісності України, шанування її державних символів є обов’язком громадян України."], ["Військовий обов’язок", "встановлений законом обов’язок громадян щодо підготовки до служби, взяття на військовий облік, проходження служби та перебування в запасі."], ["Призов", "обов’язкове залучення громадян до військової служби."], ["Контрактна служба", "добровільна служба на підставі контракту."], ["Альтернативна (цивільна) служба", "служба замість військової для тих, кому переконання не дозволяють брати до рук зброю."], ["Резерв (запас)", "громадяни, які пройшли підготовку і можуть бути швидко мобілізовані."]], "th": [{"h": "Навіщо потрібен військовий обов’язок", "p": ["Військовий обов’язок забезпечує державі можливість мати навчене військо й резерв. Водночас він виховує відповідальність, єдність і готовність суспільства до захисту. Питання, як справедливо розподілити тягар оборони, — одне з найскладніших для кожної країни."], "ul": []}, {"h": "Моделі військової служби у світі", "p": [], "ul": ["Ізраїль — універсальна служба для чоловіків і жінок з 18 років (чоловіки — близько 32 міс., жінки — 24 міс.); служба — частина національної ідентичності.", "Швеція і Норвегія — вибірковий призов для обох статей: усі проходять відбір (медичні та психологічні тести), а служать найпридатніші й найвмотивованіші (9–12 міс.).", "Швейцарія — обов’язкова служба для чоловіків із трьома варіантами: військова, цивільна або податок на оборону; короткі курси щороку.", "Естонія — обов’язковий призов для чоловіків (8 або 11 міс.) і великий навчений резерв для територіальної оборони.", "Австрія — вибір між військовою (6 міс.) і цивільною (9 міс.) службою.", "Сінгапур — «Національна служба» для всіх чоловіків (24 міс.) у війську, поліції чи цивільній обороні, потім — резерв до 40 років.", "Туреччина — служба для чоловіків, але можна легально «відкупитися» фіксованим внеском.", "Єгипет — тривалість служби залежить від рівня освіти (18–36 міс.).", "Південна Корея — одна з найдовших служб (18–21 міс.) через тривалий конфлікт з КНДР.", "Північна Корея — служба для чоловіків і жінок тривалістю багато років; частина ідеологічного контролю режиму."]}, {"h": "Компроміси кожної моделі", "p": ["Не існує єдиної «правильної» моделі. Кожна країна обирає систему з огляду на свою історію, загрози, економіку й культуру. Тривала служба зменшує економічну активність молоді; обов’язковість для всіх обмежує особисту свободу; можливість «відкупу» порушує рівність; вибірковий призов залежить від мотивації людей. Для країни, що протистоїть агресору, особливо важливо мати великий і добре навчений резерв."], "ul": []}], "f": "Після повномасштабного вторгнення росії Швеція та Фінляндія відмовилися від багаторічного нейтралітету й вступили до НАТО, а кілька європейських країн почали обговорювати або повертати обов’язковий призов.", "pr": ["Уявіть, що ви працюєте в Міністерстві оборони. Запропонуйте модель військової служби для України після війни: призовний вік, тривалість, чи обов’язкова служба для жінок, чи є альтернативна служба. Поясніть свій вибір.", "Оберіть одну країну з уроку і складіть її «картку»: служба для жінок, призовний вік, термін, вид служби, переваги й недоліки для України."], "q": ["Що каже стаття 65 Конституції України?", "Чим призов відрізняється від контрактної служби?", "Що таке вибірковий призов? Наведіть приклад країни.", "Які переваги й недоліки має модель Швейцарії?", "Чому для України важливо мати великий навчений резерв?"]}, {"n": "4", "t": "Територіальна цілісність держави. Національний спротив", "g": "Розуміти поняття «територіальна цілісність» і «національний спротив», знати складники національного спротиву та відрізняти легітимний спротив від деструктивної поведінки.", "k": "", "terms": [["Територіальна цілісність", "неподільність і недоторканність території держави в межах її кордонів."], ["Національний спротив", "комплекс заходів для захисту держави за участю військових і цивільних, визначений Законом України «Про основи національного спротиву» (2021)."], ["Територіальна оборона (ТрО)", "система заходів для захисту території на місцевому рівні; включає Сили ТрО ЗСУ та добровольчі формування територіальних громад (ДФТГ)."], ["Рух опору", "воєнні, інформаційні та спеціальні заходи для відновлення суверенітету на тимчасово окупованих територіях."], ["Вандалізм", "навмисне пошкодження чужого майна; не є формою легітимного спротиву."]], "th": [{"h": "Правова основа", "p": [], "ul": ["Конституція України, ст. 2: «Суверенітет України поширюється на всю її територію. Україна є унітарною державою. Територія України в межах існуючого кордону є цілісною і недоторканною».", "Статут ООН (ст. 2, п. 4): держави не повинні застосовувати силу чи погрозу силою проти територіальної цілісності інших держав.", "Закон України «Про основи національного спротиву» № 1702-IX від 16.07.2021 визначає засади територіальної оборони, руху опору та підготовки громадян до національного спротиву."]}, {"h": "Три складники національного спротиву", "p": [], "ul": ["Територіальна оборона — підрозділи ТрО в кожній області й районі, навчання з тактичної медицини, поводження зі зброєю, виживання; добровільна участь цивільних (ДФТГ).", "Рух опору — діяльність на окупованих територіях: протести (Херсон, Мелітополь), рух «Жовта стрічка», саботаж, інформаційний спротив.", "Підготовка громадян до національного спротиву — зокрема предмет «Захист України» у школі, центри підготовки, волонтерські ініціативи."]}, {"h": "Форми спротиву", "p": [], "ul": ["збройний (партизанський рух, тотальна оборона);", "ненасильницький громадянський (протести, символіка, листівки);", "інформаційний (правдиві історії, контрнаративи, гумор);", "економічний (відмова співпрацювати з окупантами, збір допомоги своїм)."]}, {"h": "Історичні та сучасні приклади", "p": [], "ul": ["Холодноярська республіка (1919–1922) — селяни Холодного Яру створили збройні загони й захищали свою територію від більшовиків.", "Кенгірське повстання (1954) — політв’язні табору Степлаг (переважно українці) понад 40 днів без зброї боролися за людські умови.", "Кримськотатарський спротив після 2014 року — протести, правозахисні ініціативи, звернення до міжнародних організацій.", "Рух «Жовта стрічка» (з 2022 р.) — жителі окупованих територій вивішують стрічки й українську символіку.", "Зимова війна Фінляндії (1939–1940) — «тотальна оборона», коли кожен громадянин мав свою роль.", "Ізраїль — підготовка молоді до служби (табори Gadna, курси Mechina)."]}, {"h": "Спротив чи вандалізм?", "p": ["Легітимний спротив спрямований на захист держави й громади та не шкодить своїм. Наприклад, вивісити український прапор в окупованому місті чи зібрати медикаменти для ЗСУ — це спротив. А зіпсувати приватний білборд чи шкільну стіну — вандалізм, навіть якщо мотив патріотичний. Уміння розрізняти ці дії — ознака критичного мислення."], "ul": []}], "f": "Під час Зимової війни невелика Фінляндія змогла зупинити значно сильнішого агресора завдяки єдності суспільства, і її досвід «тотальної оборони» сьогодні вивчають в Україні.", "pr": ["Визначте, спротив це чи ні, і поясніть: а) волонтери зібрали медикаменти для ЗСУ через Telegram-канал; б) група людей розмалювала фарбою білборд проросійського бренду; в) школярка записала подкаст про життя в прифронтовому місті; г) водій відмовився перевозити вантаж для окупантів.", "Оберіть завдання: напишіть щоденниковий запис від імені героя чи героїні спротиву АБО створіть інфографіку «Як працює ТрО / ДФТГ» АБО запитайте рідних, чи були в історії вашої родини приклади боротьби за Україну."], "q": ["Що означає територіальна цілісність? Яка стаття Конституції її закріплює?", "Назвіть три складники національного спротиву.", "Які форми спротиву ви знаєте?", "Чим легітимний спротив відрізняється від вандалізму?", "Чого вчать приклади Холодного Яру та Зимової війни?"]}, {"n": "5", "t": "Сектор безпеки та оборони України", "g": "Знати, які органи входять до сектору безпеки та оборони України і за що вони відповідають, розуміти, як формується й використовується оборонний бюджет і чому життя воїна безцінне.", "k": "", "terms": [["Сектор безпеки та оборони", "система державних органів, Збройних Сил, інших формувань і громадян, що захищають національну безпеку (Закон України «Про національну безпеку України»)."], ["Оборонний бюджет", "кошти держави на потреби оборони: забезпечення військових, озброєння, підготовку тощо."], ["Оборонно-промисловий комплекс (ОПК)", "підприємства, які розробляють і виробляють зброю та техніку."]], "th": [{"h": "«Будинок оборони»", "p": ["Сектор безпеки та оборони можна уявити як будинок. Дах — Україна (державність, територія, народ). Колони — сили безпеки й оборони. Майстерня поруч — оборонно-промисловий комплекс. Фундамент — громадяни: податки, добровольці, волонтери, резерв. Якщо вибити одну колону, будинок завалиться — тому всі складники мають працювати разом."], "ul": []}, {"h": "Складники сектору («колони»)", "p": [], "ul": ["Збройні Сили України (ЗСУ) — захист суверенітету й територіальної цілісності, ведення бойових дій, захист неба;", "Національна гвардія (НГУ) — охорона стратегічних об’єктів, боротьба з диверсійними групами;", "Служба безпеки України (СБУ) — контррозвідка, боротьба з тероризмом, кіберзахист;", "Державна прикордонна служба (ДПСУ) — охорона кордону;", "Державна служба з надзвичайних ситуацій (ДСНС) — рятувальні операції, гасіння пожеж;", "Національна поліція — громадська безпека, розслідування злочинів;", "Державна міграційна служба, Служба судової охорони, Управління державної охорони (охорона вищих посадових осіб);", "Держспецзв’язку — захист інформації та державних комунікацій;", "Державна спеціальна служба транспорту, Антитерористичний центр при СБУ, розвідувальні органи України."]}, {"h": "Оборонний бюджет", "p": ["Після 2014 року, а особливо після 2022-го, витрати України на оборону різко зросли. Проте бюджет росії значно більший, тому Україна не може перемагати «кількістю» — її сила в розумному використанні ресурсів, технологіях і професіоналізмі людей. Гроші оборонного бюджету йдуть на:"], "ul": ["грошове забезпечення та компенсації військовим і їхнім родинам;", "озброєння, техніку, дрони;", "підготовку військових — інвестицію, що зберігає життя."]}, {"h": "Людина — головна цінність", "p": ["Танк можна виготовити заново за рік чи два, а людину замінити неможливо. Саме людина оцінює ситуацію, ухвалює рішення під тиском, керує технікою. Дрон може бути дешевшим і мобільнішим за танк, але без оператора не працює ні дрон, ні танк. Тому ефективне лідерство й добра підготовка, які зберігають життя, — найкраща інвестиція."], "ul": []}], "f": "Україна стала одним зі світових лідерів у виробництві та застосуванні безпілотників — значна частина їх створюється завдяки волонтерам і приватним компаніям.", "pr": ["Намалюйте схему «Будинок оборони» і розмістіть на ній: охорона кордону, контррозвідка, рятування під час пожеж, захист інформації, виробництво дронів, добровольці, податки, захист неба від ракет.", "Уявіть, що маєте умовні 100 млн грн. Розподіліть їх між: зарплатами й компенсаціями, дронами й технікою, підготовкою військових. Поясніть свій вибір.", "Створіть коротку презентацію або інфографіку про один орган сектору безпеки й оборони."], "q": ["Які органи входять до сектору безпеки та оборони України?", "За що відповідають ДПСУ, СБУ, ДСНС?", "Що є «фундаментом» сектору оборони?", "На що витрачається оборонний бюджет?", "Чому кажуть, що життя воїна безцінне?"]}, {"n": "6", "t": "Роль НАТО. Стратегічні партнери України у сфері безпеки. Коаліція демократичних держав у протистоянні авторитаризму", "g": "Розуміти відмінності між демократією та авторитаризмом, знати, що таке НАТО, як працює колективна оборона і хто є стратегічними партнерами України.", "k": "", "terms": [["Демократія", "політичний режим, де влада обирається народом, діють вільні вибори, свобода слова, незалежний суд."], ["Авторитаризм", "режим, де влада зосереджена в руках однієї особи чи групи, а права й свободи обмежені."], ["НАТО", "Організація Північноатлантичного договору — військово-політичний союз, створений 1949 року."], ["Колективна оборона (стаття 5)", "принцип: напад на одну країну-члена вважається нападом на всіх."]], "th": [{"h": "Демократії та авторитарні режими", "p": ["Україну підтримує переважно коаліція демократичних держав: США, Велика Британія, Польща, Німеччина, Литва, Канада, Франція та інші. Росію підтримують авторитарні режими — Іран, КНДР, частково Китай. Лінія розлому у війні збігається з протистоянням «демократія — авторитаризм»: демократії захищають право народів самостійно обирати свій шлях."], "ul": []}, {"h": "Що таке НАТО", "p": [], "ul": ["створене 1949 року для захисту демократичних країн від зовнішніх загроз;", "більшість членів — демократії, хоча є винятки й складні випадки (наприклад, Туреччина);", "стаття 5 — принцип колективної оборони. Вона не зобов’язує автоматично вступати у війну, але кожен член має допомогти так, як вважає за потрібне; шанси на допомогу значно зростають;", "країна-член зберігає суверенітет і незалежність, але отримує гарантії безпеки."]}, {"h": "Україна і НАТО", "p": ["Україна поки не є членом Альянсу, але має статус особливого партнера й отримує значну підтримку: навчання військових, передача зброї, обмін розвідданими, підготовка пілотів, фінансова допомога. Членство в НАТО є стратегічною метою України, закріпленою в Конституції."], "ul": []}, {"h": "Чому демократія — перевага", "p": ["Існує міф, що авторитарні режими ухвалюють рішення швидше й тому сильніші. Насправді демократії мають важливі переваги: відкриту критику помилок, вільний обмін ідеями, довіру суспільства, надійних союзників. Для України збереження демократії — умова підтримки партнерів і майбутнього в європейській спільноті."], "ul": []}], "f": "Єдиний раз в історії стаття 5 НАТО була застосована після терористичних атак на США 11 вересня 2001 року.", "pr": ["Розподіліть країни на дві колонки «Демократії» та «Авторитарні режими»: США, Польща, Велика Британія, Німеччина, Литва, Канада, Туреччина, Франція, РФ, Китай, Іран, КНДР. Позначте, хто підтримує Україну.", "Напишіть 5–7 речень на тему «Чому НАТО важливе для України»."], "q": ["Чим демократія відрізняється від авторитаризму?", "Коли і навіщо створено НАТО?", "Що означає стаття 5? Чи зобов’язує вона вступати у війну?", "Як партнери допомагають Україні?", "Чи втрачає країна незалежність, вступаючи до НАТО?"]}, {"n": "7", "t": "Волонтерський рух як складник підвищення спроможності Сил оборони. Способи реалізувати свій талант в обороні України", "g": "Ознайомитися з найвпливовішими громадськими ініціативами, що зміцнюють обороноздатність України, зрозуміти, що кожна з них починалася з малого, і подумати, як можете долучитися ви.", "k": "", "terms": [["Волонтерство", "добровільна безоплатна діяльність на користь інших людей чи суспільства."], ["Громадянське суспільство", "активні громадяни та їхні об’єднання, що діють незалежно від держави задля спільного блага."], ["Низова ініціатива", "проєкт, створений звичайними людьми «знизу», а не державою."]], "th": [{"h": "Волонтери — частина оборони", "p": ["З 2014 року, а особливо після 2022-го, волонтерський рух став одним із «фундаментів» оборони України. Волонтери забезпечують військових спорядженням, дронами, автомобілями, ліками, навчають, підтримують родини й ветеранів, допомагають переселенцям."], "ul": []}, {"h": "Великі справи починаються з малого", "p": [], "ul": ["Фонд «Повернись живим» почався з одного допису засновника у фейсбуці 2014 року — нині це один з найбільших фондів підтримки армії.", "Victory Drones виросли з невеликої школи пілотування дронів у Києво-Могилянській академії.", "Багато місцевих ініціатив: плетіння маскувальних сіток, виготовлення окопних свічок, збори на конкретні підрозділи."]}, {"h": "Що об’єднує успішні ініціативи", "p": [], "ul": ["їх почали «звичайні» люди з малих кроків;", "віра в ідею та важливість своєї справи;", "розуміння довгострокового впливу — «гра в довгу»;", "уміння залучати інших і будувати команду;", "прозорість і звітність перед донорами."]}, {"h": "Як реалізувати свій талант", "p": ["Кожен може знайти свою роль: програмісти — створювати корисні застосунки, дизайнери — інформаційні кампанії, спортсмени — благодійні забіги, майстри — виготовляти потрібні речі, блогери — поширювати правдиву інформацію. Важливо допомагати безпечно: перевіряти фонди й збори, не поширювати чутливу інформацію про військових."], "ul": []}], "f": "Українські волонтерські фонди щороку збирають мільярди гривень на потреби армії — значна частина внесків складається з невеликих донатів звичайних людей.", "pr": ["Знайдіть інформацію про одну волонтерську ініціативу (всеукраїнську чи у вашій громаді) і опишіть: хто і як її започаткував, з чого почали, чого досягли зараз.", "Складіть план власної маленької ініціативи на підтримку оборони: що, для кого, хто допоможе, які перші три кроки."], "q": ["Яку роль відіграють волонтери в обороні України?", "З чого починався фонд «Повернись живим»?", "Які спільні риси мають успішні громадські ініціативи?", "Як перевірити, що збір коштів надійний?", "Як ви можете застосувати свої таланти для підтримки оборони?"]}, {"n": "8", "t": "Адаптація суспільства до потреб військовослужбовців і ветеранів війни, зокрема осіб з інвалідністю внаслідок війни", "g": "Пояснити, що таке адаптація ветеранів і чому вона потрібна всьому суспільству, навчитися використовувати «Мову єдності» та усвідомити власну роль у підтримці захисників і захисниць.", "k": "", "terms": [["Ветеран / ветеранка війни", "людина, яка захищала Україну під час війни."], ["Адаптація", "процес повернення до цивільного життя: медичний, психологічний, соціальний; двосторонній — змінюється і людина, і суспільство."], ["Стигматизація", "навішування образливих «ярликів» на людину чи групу."], ["«Мова єдності»", "принципи спілкування між цивільними та військовими, що допомагають уникати упереджень."], ["Інклюзія", "створення умов, за яких кожна людина може брати повноцінну участь у житті суспільства."]], "th": [{"h": "Чому потрібна адаптація", "p": ["Повертаючись зі служби, військові стикаються з новими викликами: наслідки поранень, потреба в реабілітації, пошук роботи, відновлення стосунків. Адаптація — справа не лише держави, а й громади, школи та кожного з нас. Ветерани не потребують жалю — вони потребують рівних можливостей."], "ul": []}, {"h": "Принципи «Мови єдності»", "p": [], "ul": ["Спільність: цивільні та військові — дві частини одного суспільства.", "Різниця досвідів: військові мають особливий досвід, до якого варто ставитися з повагою, але вони не «особливі люди».", "Повага й емпатія замість жалю: говоріть з людиною як з рівною, а не як із «жертвою».", "Екологічна комунікація: уникайте фраз, що знецінюють досвід — «Я тебе розумію», «Коли перемога?», «Мені тебе шкода».", "Протидія стереотипам: ветерани — не «надлюди» і не «небезпечні контужені»."]}, {"h": "Слова мають значення", "p": [], "ul": ["кажіть «ветеран / ветеранка», а не «жертва війни»;", "«людина з інвалідністю», а не «інвалід»;", "не визначайте людину однією рисою;", "слова можуть бути таким самим бар’єром, як сходи без пандуса."]}, {"h": "Що може зробити кожен", "p": [], "ul": ["щиро дякувати захисникам і захисницям;", "поважати особистий простір і не ставити некоректних запитань;", "звертати увагу на доступність громади (пандуси, ліфти, зручна навігація);", "підтримувати ветеранський бізнес і спорт;", "вшановувати пам’ять полеглих."]}], "f": "«Ігри Нескорених» (Invictus Games) — міжнародні змагання для військових і ветеранів із пораненнями; українська збірна бере в них участь з 2017 року, а в Україні проводять Національні Ігри Нескорених.", "pr": ["Обговоріть ситуацію й запропонуйте рішення: до школи на роботу прийшов ветеран із протезом, а частина батьків проти. Як має діяти адміністрація? Використайте принципи «Мови єдності».", "Створіть інфографіку «5 правил Мови єдності у спілкуванні з ветеранами».", "Перевірте, наскільки доступні для людей з інвалідністю магазин, пошта чи лікарня у вашій громаді. Запишіть спостереження."], "q": ["Що таке адаптація ветеранів? Чому вона двостороння?", "Назвіть принципи «Мови єдності».", "Яких фраз варто уникати в розмові з ветераном?", "Чим небезпечна стигматизація?", "Що особисто ви можете зробити, щоб ваша громада була дружньою до ветеранів?"]}]}, {"name": "Тренінг 2. Основи управління та планування: склад і структура Сил оборони, звання, знаки розрізнення", "lessons": [{"n": "1", "t": "Домени — простори ведення бойових дій", "g": "Знати п’ять доменів ведення бойових дій, їхні особливості та розуміти, як домени пов’язані з видами Збройних Сил України.", "k": "", "terms": [["Домен", "узагальнений простір (середовище), де ведуться бойові дії, зі своїми умовами, засобами й тактиками."], ["Вид збройних сил", "складник збройних сил, призначений переважно для ведення бойових дій у певному домені."], ["НРК", "наземний роботизований комплекс."], ["БпЛА", "безпілотний літальний апарат."]], "th": [{"h": "П’ять доменів", "p": [], "ul": ["Суша — найдавніший домен. Бої за території, ресурси, населення. Ключові — піхота, танки, артилерія, інженери. Перспектива, яку успішно розвиває Україна, — наземні роботизовані комплекси.", "Море — з перших морських битв 3–5 тис. років тому. Боротьба за морські шляхи, порти, узбережжя. Кораблі: катери, корвети, фрегати, есмінці, підводні човни, авіаносці. Україна — лідер у застосуванні морських безпілотників.", "Повітря — вперше стало доменом у Першій світовій війні (1914–1918). Боротьба за панування в повітрі: літаки, гелікоптери, а нині — БпЛА.", "Космос — з ХХ ст. Прямих боїв у космосі не було; міжнародне право забороняє розміщувати там ядерну зброю та військові бази. Головне — супутники для зв’язку, навігації, розвідки.", "Кіберпростір — з кінця ХХ — початку ХХІ ст. Невидимий домен без чітких меж: сервери, мережі, кабелі, комп’ютери. Зброя — хакерські атаки та шкідливі програми."]}, {"h": "Домени перетинаються", "p": ["Удар з повітря знищує наземні цілі; кібератака може знеструмити критичний об’єкт і спричинити жертви; супутники допомагають наводити зброю на суші та морі. Сучасна війна — це взаємодія всіх доменів одночасно."], "ul": []}, {"h": "Види Збройних Сил України", "p": ["Традиційно армії будують за трьома доменами. ЗСУ складаються з трьох видів:"], "ul": ["Сухопутні війська (суша);", "Повітряні Сили (повітря);", "Військово-Морські Сили (море)."]}, {"h": "", "p": ["Сучасні армії світу додають структури для космосу й кіберпростору (наприклад, Космічні сили США)."], "ul": []}], "f": "Україна першою у світі масштабно застосувала морські дрони проти військового флоту — це змусило ворога відвести значну частину кораблів із західної частини Чорного моря.", "pr": ["Заповніть таблицю «Домен — з якого часу — основні засоби — чого можна досягти».", "Придумайте (опишіть словами) емблеми для Космічних сил і Кіберсил у стилі емблем ЗСУ: які кольори й символи ви б використали?"], "q": ["Що таке домен ведення бойових дій?", "Назвіть п’ять доменів і їхні ключові засоби.", "Коли повітря стало доменом війни?", "Чим кіберпростір відрізняється від інших доменів?", "З яких трьох видів складаються ЗСУ?"]}, {"n": "2", "t": "Окремі роди військ (сил) — важлива і специфічна складова", "g": "Розрізняти види збройних сил і роди військ, знати окремі роди військ (сил) ЗСУ та розуміти роль логістики й підтримки в бою.", "k": "", "terms": [["Рід військ (сил)", "спеціалізований складник збройних сил зі своїми завданнями, озброєнням і способами дій."], ["Окремий рід військ (сил)", "рід, що не входить до жодного виду ЗСУ і підпорядковується напряму."], ["Логістика", "забезпечення військ усім необхідним: їжею, пальним, боєприпасами, ліками, ремонтом."], ["РЕБ", "радіоелектронна боротьба — зокрема захист від дронів."]], "th": [{"h": "Аналогія з університетом", "p": ["Збройні сили — це університет, вид збройних сил — факультет, рід військ — кафедра. Роди можуть входити до видів або бути окремими."], "ul": []}, {"h": "Окремі роди військ (сил) ЗСУ", "p": [], "ul": ["Сили спеціальних операцій (ССО) — елітні оператори: глибока розвідка й диверсії в тилу ворога, протидія тероризму, підтримка руху опору;", "Сили безпілотних систем (СБС) — новітній рід, «армія дронів»;", "Сили територіальної оборони (ТрО) — комплектуються за регіональним принципом, захищають свою громаду й регіон;", "Сили логістики — зберігання та доставка всього необхідного, ремонт техніки;", "Сили підтримки — інженери, сапери, фахівці РЕР і РЕБ, РХБЗ, топографи, метеорологи, кінологи;", "Медичні сили — від допомоги на полі бою до лікування у шпиталях;", "Десантно-штурмові війська (ДШВ) — наймобільніший рід, штурми й десанти;", "Війська зв’язку та кібербезпеки — щоб накази й доповіді вчасно й таємно доходили до адресата."]}, {"h": "Чому танк не воюватиме без логістики та підтримки", "p": [], "ul": ["екіпаж голодний і без води — не підвезли харчування;", "немає бронежилетів і форми — не доставили екіпірування;", "танк не заводиться — немає пального;", "не може стріляти — немає боєприпасів;", "його легко знищить артилерія — не вирито укриття і не замасковано;", "стане мішенню дронів — не прикриває РЕБ;", "може підірватися на міні — ніхто не розмінував шлях."]}, {"h": "Висновок", "p": ["Про логістів, інженерів і зв’язківців рідко знімають фільми, але без них жоден бойовий підрозділ не виконає завдання. У сучасній війні логістика ще й небезпечна: ворожі дрони полюють на транспорт постачання."], "ul": []}], "f": "Військові часто кажуть: «Аматори говорять про тактику, професіонали — про логістику».", "pr": ["Складіть схему «Структура ЗСУ»: 3 види + окремі роди військ (сил) з коротким описом завдань кожного.", "Пригадайте гру «Ланцюжок постачання». Напишіть: чому логістика важлива і які в неї ризики в умовах сучасної війни?"], "q": ["Чим вид збройних сил відрізняється від роду військ?", "Назвіть окремі роди військ (сил) ЗСУ.", "Які завдання виконують Сили підтримки?", "Чому ТрО комплектують за регіональним принципом?", "Наведіть 4 причини, чому танк не воюватиме без логістики й підтримки."]}, {"n": "3", "t": "Як не заплутатись у всіх цих видах і родах? Нарукавні знаки. Органи управління. Звання вищого офіцерського складу", "g": "Розпізнавати нарукавні знаки видів та окремих родів ЗСУ, знати, що таке органи військового управління, з’єднання, частини й підрозділи, та впізнавати звання вищого офіцерського складу.", "k": "", "terms": [["Нарукавний знак", "офіційна назва емблеми на рукаві (неофіційно — «шеврон» чи «патч», але «шеврон» — неточний термін)."], ["Органи військового управління", "штаби й командування (Генштаб ЗСУ, командування видів і родів), що керують боєм."], ["З’єднання", "велике формування з кількох військових частин (наприклад, корпус)."], ["Військова частина", "формування зі своїм командиром, номером (в/ч А1234), печаткою, бойовим прапором."], ["Підрозділ", "складник військової частини (батальйон, рота, взвод)."]], "th": [{"h": "Нарукавні знаки видів ЗСУ", "p": [], "ul": ["Сухопутні війська — зелений щит вістрям донизу (суша — внизу);", "Повітряні Сили — синій щит вістрям догори (небо — вгорі);", "Військово-Морські Сили — з якорем."]}, {"h": "Нарукавні знаки окремих родів", "p": [], "ul": ["ДШВ — щит у формі парашута, маруновий колір;", "Війська зв’язку та кібербезпеки — чорний тризуб, схожий на антену;", "ССО — щит у формі діаманта і двозуб Святослава Хороброго;", "ТрО — вгорі мур фортечної стіни (захист своєї «фортеці» — громади)."]}, {"h": "Хто всім командує", "p": ["Військові частини поділяються на підрозділи та об’єднуються в з’єднання. Окремі батальйони мають унікальні номери (слово «окремий» — підказка), а лінійні батальйони бригади нумеруються 1-й, 2-й, 3-й."], "ul": []}, {"h": "Звання вищого офіцерського складу", "p": ["У ЗСУ 44 звання: 22 армійських і 22 корабельних. Генерали та адмірали мають на погонах схрещені булави — давній символ влади козацьких гетьманів. Чим більше зірок — тим вище звання."], "ul": ["армійські: бригадний генерал, генерал-майор, генерал-лейтенант, генерал;", "корабельні: коммодор, контр-адмірал, віце-адмірал, адмірал."]}, {"h": "Кольори погонів", "p": [], "ul": ["ВМС — чорний; Повітряні Сили — синій; ССО — сірий (символ — вовкулаки, як козаки-характерники); решта — зелений.", "У польових умовах носять камуфляж і погони без яскравих кольорів.", "На фронті знаки розрізнення часто не носять, щоб не стати пріоритетною ціллю снайпера чи дрона."]}], "f": "Система звань із бригадним генералом і коммодором діє в Україні з 2020 року — за стандартами НАТО; звання генерал-полковника тепер не присвоюють.", "pr": ["Намалюйте (схематично) нарукавні знаки Сухопутних військ, Повітряних Сил, ВМС, ССО, ТрО і підпишіть, як їх запам’ятати.", "Запитайте рідних чи знайомих військових, які в них звання й нарукавний знак, і що вони означають."], "q": ["Чому краще не називати нарукавні знаки «шевронами»?", "Як відрізнити нарукавні знаки Сухопутних військ і Повітряних Сил?", "Чим військова частина відрізняється від підрозділу та з’єднання?", "Назвіть армійські звання вищого офіцерського складу.", "Чому на передовій часто не носять знаків розрізнення?"]}, {"n": "4", "t": "Чи тільки ЗСУ захищають державу?", "g": "Розуміти, що Сили оборони України ширші за ЗСУ, знати їхні складники та приклади взаємодії під час захисту країни.", "k": "", "terms": [["Сили оборони України", "ЗСУ та інші військові формування і правоохоронні органи, що захищають державу."], ["ППО", "протиповітряна оборона."], ["Мобільна вогнева група", "підрозділ, що збиває дрони-камікадзе з кулеметів, встановлених на автомобілях."]], "th": [{"h": "Не лише ЗСУ", "p": ["Стаття 17 Конституції покладає оборону України на Збройні Сили. Але сьогодні державу захищають і інші структури Сил оборони:"], "ul": ["Національна гвардія — охорона порядку й стратегічних об’єктів, повноцінна участь у бойових діях (бригади «Азов», «Хартія» та інші; оборона Маріуполя);", "СБУ — протидія ворожій агентурі, глибинні операції;", "Головне управління розвідки МО (ГУР) — військова розвідка;", "Державна прикордонна служба — охорона кордону й бойові бригади;", "Державна спеціальна служба транспорту — відновлення доріг, залізниць, мостів;", "Військова служба правопорядку — правопорядок серед військових;", "Національна поліція — правопорядок, евакуація, має бойові бригади;", "ДСНС — рятує життя, гасить пожежі, розбирає завали."]}, {"h": "Взаємодія під час нічної атаки дронів", "p": [], "ul": ["Радіотехнічні війська Повітряних Сил — виявляють цілі та передають дані;", "Зенітні ракетні війська — збивають цілі комплексами ППО (Patriot, NASAMS, IRIS-T тощо);", "Авіація — збиває дрони з літаків і гелікоптерів;", "Мобільні вогневі групи — збивають «шахеди» з кулеметів;", "Поліція — охороняє місце влучання, допомагає евакуюватися, документує злочини;", "ДСНС — гасить пожежі, розбирає завали, надає допомогу, облаштовує пункти обігріву."]}, {"h": "Висновок", "p": ["Вигук «Слава ЗСУ!» — щира подяка, але варто пам’ятати про всіх: прикордонників, гвардійців, рятувальників, поліцейських, розвідників. Перемога — результат спільної роботи всіх Сил оборони."], "ul": []}], "f": "Під час масованих атак ракетами та дронами в захисті одного міста одночасно можуть брати участь підрозділи кількох різних структур — від радіотехнічних військ до ДСНС.", "pr": ["Оберіть ситуацію (нічна атака дронів, ворожа диверсійна група біля мосту, пожежа після влучання) і опишіть, які складники Сил оборони діють і що робить кожен.", "Придумайте свій варіант подяки, що охоплює всіх захисників, а не лише ЗСУ."], "q": ["Яка стаття Конституції покладає оборону на ЗСУ?", "Назвіть 6 складників Сил оборони, крім ЗСУ.", "Хто виявляє ворожі цілі в повітрі, а хто їх збиває?", "Яку роль відіграють ДСНС і поліція після удару по місту?", "Чому перемога — справа всіх Сил оборони?"]}, {"n": "5", "t": "Ієрархічна структура армії", "g": "Знати ієрархію військових формувань від вогневої групи до корпусу, їхню орієнтовну чисельність і позначення на картах.", "k": "", "terms": [["Військове формування", "загальна назва для підрозділів, частин і з’єднань."], ["Батарея / дивізіон", "назви роти / батальйону в артилерії та ППО."], ["Масштабування позитивного досвіду", "розширення успішного підрозділу до вищого рівня (батальйон → полк → бригада)."]], "th": [{"h": "Від малого до великого (як LEGO)", "p": ["Відділення об’єднуються у взводи, взводи — в роти, роти — в батальйони, батальйони — в бригади (або полки), бригади — в корпуси. Чисельність дуже орієнтовна й залежить від роду військ:"], "ul": ["вогнева група / розрахунок / екіпаж — 2–4 особи (позначення Ø);", "відділення — 5–15 (близько 10) — ●;", "взвод — 15–45 (близько 30) — ●●●;", "рота / батарея — 60–250 (близько 100) — I;", "батальйон / дивізіон — 300–800 (близько 500) — II;", "полк / центр — 1–2,5 тис. — III;", "бригада — 2–5 тис. — X;", "корпус — 30+ тис. — XXX."]}, {"h": "Особливості ЗСУ", "p": [], "ul": ["основа — батальйонно-бригадна система: батальйони об’єднуються в бригади;", "полки є переважно в ППО, Силах підтримки й логістики; у ССО аналог полку — «центр»;", "нині створюється корпусна система: кілька бригад різної спеціалізації разом із медиками, логістами, безпілотниками утворюють корпус;", "дивізій і секцій в ЗСУ немає."]}, {"h": "Як запам’ятати", "p": ["Мнемоніка: «Від сірого вовка рудий бігав павич, брикався, драконив, кричав: “Абордаж!”» — відділення, взвод, рота, батальйон, полк, бригада, корпус, армія."], "ul": []}], "f": "Механізована рота може мати близько 100 осіб, а танкова — лише близько 30, хоча обидві називаються «рота».", "pr": ["Побудуйте схему-піраміду військових формувань від вогневої групи до корпусу з орієнтовною чисельністю та позначеннями на картах.", "Придумайте власну мнемоніку для запам’ятовування ієрархії."], "q": ["Назвіть військові формування від найменшого до найбільшого.", "Як називаються рота й батальйон в артилерії?", "Які формування не використовуються в ЗСУ?", "Як позначають на картах бригаду і батальйон?", "Що таке корпусна система?"]}, {"n": "6–7", "t": "Починаємо вчитися читати карти та грати у воргейми", "g": "Розуміти призначення військових карт, читати основні умовні тактичні знаки (належність, розмір і роль формування) та знати, що таке воргейм.", "k": "", "terms": [["Умовні тактичні знаки", "уніфіковані символи НАТО (NATO Joint Military Symbology) для позначення військ і об’єктів на картах."], ["Мережецентрична система", "цифрова система управління, де всі бачать бойову обстановку на карті в реальному часі (наприклад, «Кропива»)."], ["Дружній вогонь (friendly fire)", "помилковий вогонь по своїх."], ["Воргейм", "воєнна гра — симуляція збройного конфлікту для навчання та планування."]], "th": [{"h": "Навіщо карта", "p": ["Без карти неможливі планування, оборона, артилерійський вогонь, розвідка. Сучасні карти дедалі частіше цифрові: на планшеті командири бачать своїх (щоб уникнути дружнього вогню), позначають ворожі цілі, які одразу бачать усі. Щоб карти були зрозумілими всім, використовують єдині знаки."], "ul": []}, {"h": "Належність військ (колір і форма рамки)", "p": [], "ul": ["свої / союзні — синій прямокутник;", "ворожі — червоний ромб;", "нейтральні — зелений квадрат;", "невідомі (неідентифіковані) — жовта рамка «квітка».", "Розпізнати своїх і чужих у бою складно: обидві сторони можуть мати схожу техніку й форму, тому використовують додаткові знаки — кольоровий скотч на рукавах, символи на техніці."]}, {"h": "Розмір, штаб і роль", "p": [], "ul": ["розмір формування позначають над рамкою (●, ●●●, I, II, X тощо);", "штаб — прапорець: місце «держака» вказує на розташування;", "роль (функція) — символ у рамці: піхота (схрещені лінії, як патронташі), танки (овал-гусениця), артилерія (крапка-ядро), розвідка (діагональ-ремінь), інженери, зв’язок (блискавка), ППО (дуга-«парасолька»), медики (хрест), постачання, ремонт (ключ), безпілотники тощо;", "знаки поєднуються: піхота + гусениця = механізована піхота."]}, {"h": "Воргейми", "p": ["Воргейм — гра на карті з фішками підрозділів, кубиками й наказами, що імітує бойові дії. Воргейми використовують і в ЗСУ для планування операцій. Вони вчать мислити на кілька кроків уперед, враховувати місцевість, взаємодію та логістику. Схожі принципи ви знайдете у стратегічних комп’ютерних і настільних іграх."], "ul": []}], "f": "Карти OSINT-аналітиків (наприклад, DeepState) використовують ті самі принципи умовних позначень, тож навички з уроку допоможуть вам читати їх.", "pr": ["Намалюйте умовні знаки: свій механізований батальйон, ворожий танковий взвод, свою артилерійську батарею, невідомий підрозділ, свій штаб бригади.", "Відкрийте будь-яку публічну карту OSINT-аналітиків і знайдіть 3 умовні позначення. Поясніть, що вони означають."], "q": ["Навіщо потрібні єдині умовні знаки на картах?", "Як позначають своїх, ворожих, нейтральних і невідомих?", "Де на знаку вказують розмір формування?", "Як позначають штаб?", "Що таке воргейм і чого він навчає?"]}, {"n": "опційно", "t": "Аналіз проведених дій (After Action Review, AAR)", "g": "Знати, що таке аналіз проведених дій (АПД), навіщо його використовують у війську та як застосовувати в цивільному житті.", "k": "", "terms": [["АПД (AAR)", "аналіз проведених дій — структурований розбір виконаного завдання для навчання на досвіді; стандарт НАТО."]], "th": [{"h": "Що таке АПД", "p": ["After Action Review (AAR) — інструмент, розроблений в армії США, який сьогодні застосовують у найсучасніших підрозділах Сил оборони України на всіх рівнях — від відділення до найвищих штабів. Після виконання завдання команда разом відповідає на запитання:"], "ul": ["Що планували зробити?", "Що сталося насправді?", "Чому виникла різниця?", "Що зробимо так само наступного разу, а що — інакше?"]}, {"h": "Головні правила", "p": [], "ul": ["не шукати винних і не принижувати — розбирати ситуацію, а не людей;", "говорити чесно, незалежно від звання;", "робити конкретні висновки для майбутніх дій."]}, {"h": "", "p": ["АПД формує здорову культуру в колективі, розвиває професійність і мотивацію кожного. Його можна застосувати і в цивільному житті: після поїздки з друзями, командного проєкту, спортивних змагань, ремонту чи контрольної роботи."], "ul": []}], "f": "", "pr": ["Проведіть АПД будь-якої своєї недавньої справи (контрольна, змагання, шкільний проєкт) за чотирма запитаннями. Запишіть висновки."], "q": ["Що таке АПД і де його придумали?", "Які чотири запитання ставлять під час АПД?", "Чому під час АПД не можна шукати винних?", "Як АПД впливає на мотивацію команди?"]}, {"n": "8", "t": "Від взводу до бригади. Офіцерський, сержантський і рядовий склад", "g": "Знати звання та знаки розрізнення молодшого й старшого офіцерського, сержантського та рядового складу, розуміти роль сержантів і рядових у бою.", "k": "", "terms": [["Офіцерський склад", "командири від взводу й вище (молодші, старші, вищі офіцери)."], ["Сержантський склад", "основа управління в бою, «місток» між рядовими та офіцерами."], ["Рекрут", "наймолодше звання — під час навчання до складання присяги; без знаків розрізнення."]], "th": [{"h": "Масштабування досвіду", "p": ["Найкращим підрозділам дають більше ресурсів і розширюють їх: «Птахи Мадяра» пройшли шлях від взводу до бригади, «Азов» — від батальйону до бригади; з’являються полки та бригади Сил безпілотних систем, штурмові полки. Розширити ефективний підрозділ часто краще, ніж створювати новий з нуля."], "ul": []}, {"h": "Офіцери", "p": [], "ul": ["молодші: молодший лейтенант, лейтенант, старший лейтенант, капітан;", "старші: майор, підполковник, полковник;", "зазвичай лейтенанти командують взводами, капітани — ротами, підполковники — батальйонами, полковники — бригадами; на війні посаду часто обіймають люди з нижчим званням;", "корабельні звання: молодший лейтенант, лейтенант, старший лейтенант, капітан-лейтенант, капітан 3, 2 і 1 рангу."]}, {"h": "Сержанти", "p": ["Сержанти відповідають за дисципліну, навчання, повсякденне життя підрозділу й контроль виконання наказів. Вони командують відділеннями, часто — взводами."], "ul": ["молодший сержантський склад: молодший сержант (командир відділення), сержант (командир бойової машини, танка);", "старший: старший сержант (головний сержант взводу), головний сержант (роти), штаб-сержант (батальйону);", "вищий: майстер-сержант (бригади), старший майстер-сержант (роду військ), головний майстер-сержант (виду ЗСУ, Генштабу, ЗСУ)."]}, {"h": "Рядові", "p": ["Рядовий склад — рекрут, солдат, старший солдат — найчисленніший. Саме рядові тримають позиції, ведуть вогонь, керують дронами й машинами, забезпечують логістику. Від їхньої підготовки й мотивації залежить боєздатність підрозділу. У Силах оборони служать і сотні тисяч жінок — від солдата до генерала."], "ul": []}], "f": "Головний сержант ЗСУ — єдиний сержант, який носить зірку на погоні.", "pr": ["Складіть таблицю «Звання — погон (схематично) — типова посада» для рядового, сержантського й офіцерського складу.", "Поясніть своїми словами, чому сержантів називають «хребтом армії»."], "q": ["Назвіть звання молодшого та старшого офіцерського складу.", "Хто зазвичай командує взводом, ротою, батальйоном, бригадою?", "Які обов’язки мають сержанти?", "Що таке звання «рекрут»?", "Що таке масштабування позитивного досвіду? Наведіть приклад."]}]}, {"name": "Тренінг 3. Військове лідерство. Озброєння та військова техніка. Безпечне поводження зі зброєю", "lessons": [{"n": "1–2", "t": "Військове лідерство України: від історії до сучасності та доктрини", "g": "Усвідомити, що лідерство — це навичка й відповідальність, а не лише звання; визначити ключові риси лідера на прикладах українських військових і зіставити їх із Доктриною розвитку військового лідерства ЗСУ та принципом Mission Command.", "k": "", "terms": [["Лідерство", "здатність брати відповідальність, ухвалювати рішення, вести за собою людей і досягати спільної мети."], ["Доктрина розвитку військового лідерства ЗСУ", "офіційний документ (затверджений Генштабом ЗСУ у грудні 2020 р.), що визначає рівні лідерства та якості військового лідера відповідно до стандартів НАТО."], ["Mission Command (делеговане керівництво)", "підхід НАТО: командир пояснює мету (намір), а підлеглі мають свободу й ініціативу, як її досягти."], ["Намір командира (Commander’s Intent)", "чітке формулювання того, чого треба досягти, а не того, як саме діяти."]], "th": [{"h": "Лідерство — це рішення під тиском", "p": ["Командири часто ухвалюють рішення швидко, на основі неповної інформації та з відповідальністю за життя інших. Лідерство проявляється у взятті відповідальності, ініціативі, комунікації, етиці та стресостійкості."], "ul": []}, {"h": "Микола Верхогляд: Жепа, 1995", "p": ["Полковник Микола Верхогляд командував українськими миротворцями ООН у боснійському анклаві Жепа. Коли над мирним населенням нависла загроза різанини (як незадовго до того в Сребрениці), він особисто пішов на переговори з сербською стороною, фактично всупереч наказу про відступ. Завдяки його рішучості й умінню домовлятися вдалося врятувати близько 12 тисяч людей. Це приклад гуманітарного лідерства та ініціативи."], "ul": []}, {"h": "Денис Прокопенко: Маріуполь і «Азовсталь», 2022", "p": ["Командир полку «Азов» Денис Прокопенко («Редіс») очолював оборону Маріуполя — 86 днів, з них 82 у повному оточенні на «Азовсталі». Гарнізон скував великі сили ворога й виграв для країни критично важливий час. Виконуючи наказ вищого командування, Прокопенко ухвалив надважке рішення про вихід гарнізону в полон задля збереження життів. Захисники «Азовсталі» стали символом незламності."], "ul": []}, {"h": "Євген Коновалець: міжвоєнний період", "p": ["Після поразки Української революції полковник Євген Коновалець 1920 року заснував Українську військову організацію (УВО), а 1929-го очолив Організацію українських націоналістів (ОУН). Не маючи держави й ресурсів, він зберіг ідею незалежності, розбудував підпільну мережу й готував кадри. 1938 року загинув від рук агента НКВС. Це приклад стратегічного бачення й віри в безнадійних умовах."], "ul": []}, {"h": "Доктрина ЗСУ та Mission Command", "p": [], "ul": ["Ключові якості лідера за Доктриною: відповідальність, ініціативність, комунікабельність, вмотивованість, психологічна стійкість.", "Рівні лідерства: особистісний, організаційний, стратегічний.", "Принципи Mission Command: чіткий намір командира; делегування повноважень; дисциплінована ініціатива; спільне розуміння мети; готовність прийняти ризик помилки.", "Горизонтальне лідерство: авторитет здобувається особистими якостями й ефективністю, а не лише званням (приклад — Дмитро «Да Вінчі» Коцюбайло)."]}, {"h": "Лідерство в цивільному житті", "p": ["Ці якості потрібні не лише на війні: у школі, команді, громадській діяльності, бізнесі. Людина, яка вміє брати відповідальність і ухвалювати виважені рішення, стане опорою для інших у будь-якій сфері."], "ul": []}], "f": "Український миротворчий контингент у Жепі — одна з найменш відомих, але найблагородніших сторінок історії українського війська: про неї розповідали BBC та інші світові медіа.", "pr": ["Заповніть таблицю «Портрет українського військового лідера»: для Верхогляда, Прокопенка й Коновальця вкажіть прояви відповідальності, ініціативи, комунікації, стресостійкості та ціну лідерства.", "Складіть «кейс-карту» іншого українського військового лідера (наприклад, Дмитра Коцюбайла): ситуація, дилема, рішення, якості.", "Або напишіть есе «Які лідерські якості знадобляться мені в житті та майбутній професії»."], "q": ["Чому лідерство — це навичка, а не лише звання?", "Яке рішення ухвалив Микола Верхогляд і які якості він проявив?", "Що таке Mission Command і намір командира?", "Які якості лідера визначає Доктрина ЗСУ?", "Де в цивільному житті потрібні лідерські якості?"]}, {"n": "3–4", "t": "Озброєння та військова техніка: призначення, види та типи", "g": "Ознайомитися з класифікацією сучасного озброєння та військової техніки, їхнім призначенням і загальною роллю на полі бою.", "k": "", "terms": [["Озброєння", "зброя та засоби, що забезпечують її застосування."], ["Військова техніка", "машини й системи для ведення бою та забезпечення військ."], ["Ефективна дальність", "відстань, на якій зброя надійно вражає ціль."], ["ППО", "протиповітряна оборона."]], "th": [{"h": "Основні групи озброєння та техніки", "p": [], "ul": ["Стрілецька зброя — пістолети, автомати, гвинтівки, кулемети; основна зброя піхотинця.", "Гранатомети та протитанкові засоби — ручні протитанкові гранатомети, протитанкові ракетні комплекси (ПТРК, наприклад Javelin, Stugna-P).", "Бронетехніка — танки, бойові машини піхоти (БМП), бронетранспортери (БТР), броньовані автомобілі; захищають і перевозять екіпаж та піхоту.", "Артилерія — міномети, гармати, гаубиці (самохідні й буксировані), реактивні системи залпового вогню (РСЗВ, наприклад HIMARS).", "Засоби ППО — переносні зенітні комплекси, зенітні ракетні комплекси (Patriot, NASAMS, IRIS-T), зенітні кулеметні установки.", "Авіація — літаки та гелікоптери різного призначення.", "Безпілотні системи — розвідувальні й ударні дрони (зокрема FPV), наземні та морські безпілотники.", "Засоби зв’язку, радіоелектронної боротьби (РЕБ) і розвідки."]}, {"h": "Від чого залежить вибір озброєння", "p": [], "ul": ["завдання (оборона, наступ, розвідка, прикриття);", "дальність і точність ураження;", "мобільність і захищеність;", "вартість та можливість виробництва;", "підготовка людей, які ним керують."]}, {"h": "Сучасні тенденції", "p": ["Війна в Україні змінила уявлення про озброєння: дешеві дрони знищують дорогу техніку, РЕБ стала критично важливою, а мережеве поєднання розвідки й вогню пришвидшило ураження цілей. Але незмінним залишається головне: будь-яка зброя працює лише в руках навченої людини."], "ul": []}], "f": "Україна стала першою країною, що створила окремий рід військ — Сили безпілотних систем.", "pr": ["Складіть схему-класифікацію «Озброєння та військова техніка» з прикладами для кожної групи.", "Оберіть один вид техніки та підготуйте коротку картку: призначення, хто застосовує (рід військ), переваги й вразливості."], "q": ["Назвіть основні групи озброєння та військової техніки.", "Чим БМП відрізняється від танка за призначенням?", "Для чого призначені засоби ППО?", "Як дрони змінили сучасну війну?", "Чому без навченої людини жодна зброя не ефективна?"]}, {"n": "5", "t": "Порядок зберігання зброї та боєприпасів", "g": "Знати основні правила зберігання зброї й боєприпасів, розуміти наслідки їх порушення та вміти оцінювати, чи правильно організовано зберігання.", "k": "", "terms": [["Облік зброї", "реєстрація кожної одиниці зброї (номер, журнал видачі та повернення з підписами)."], ["Інвентаризація", "регулярна перевірка наявності та стану зброї."], ["ММГ", "масогабаритний макет зброї, що використовують на уроках."]], "th": [{"h": "Основні принципи зберігання", "p": [], "ul": ["Зброю зберігають у спеціально обладнаному місці: сейфі, металевій шафі, кімнаті з обмеженим доступом, сигналізацією.", "Кожна одиниця зброї обліковується: номер, журнал видачі, підписи отримувача та чергового.", "Зброю й боєприпаси зберігають окремо.", "Доступ мають лише відповідальні особи; ключі — тільки в них.", "Регулярно проводять перевірку (інвентаризацію).", "Зброю ніколи не залишають без нагляду — навіть «на 5 хвилин»."]}, {"h": "Наслідки порушень", "p": ["Недбале зберігання може призвести до випадкових пострілів, каліцтва чи смерті людей, крадіжок зброї. Важливо пам’ятати не лише про юридичну відповідальність, а й про непоправну шкоду людському життю. Незаконне носіння, зберігання, придбання чи передача вогнепальної зброї та боєприпасів — кримінальний злочин (ст. 263 Кримінального кодексу України)."], "ul": []}, {"h": "Правильно чи неправильно?", "p": [], "ul": ["Автомати в металевій шафі на два замки, ключі у відповідальної особи — правильно.", "Сейф залишили відімкненим, «бо відійшли на 5 хвилин» — неправильно.", "Ключ від сейфа лежить у шухляді «на всякий випадок» — неправильно.", "Набої в шухляді, «бо без зброї вони не небезпечні» — неправильно: боєприпаси також потребують захищеного зберігання.", "Макети в незамкненій шафі в зачиненому класі — ризиковано: потрібен замок і контроль."]}], "f": "", "pr": ["Оцініть кожну ситуацію як «правильно» чи «неправильно», поясніть можливі наслідки та як виправити: а) учень після тренування залишив макет на парті й пішов пити воду; б) у кімнату зберігання мають доступ лише дві відповідальні особи; в) зброя зберігається не в сейфі, але в замкненій кімнаті.", "Складіть пам’ятку «6 правил зберігання зброї»."], "q": ["Де і як мають зберігатися зброя та боєприпаси?", "Навіщо потрібен облік кожної одиниці зброї?", "Чому зброю й боєприпаси зберігають окремо?", "До чого можуть призвести порушення правил зберігання?", "Яку відповідальність передбачає ст. 263 ККУ?"]}, {"n": "6", "t": "Заходи безпеки при поводженні зі зброєю. Кодекс стрільця", "g": "Знати напам’ять чотири золоті правила Кодексу стрільця та розширені 12 правил безпеки, вміти розпізнавати їх порушення.", "k": "", "terms": [["Кодекс стрільця", "правила безпечного поводження зі зброєю, обов’язкові для кожного."], ["Осічка / затримка", "ситуація, коли постріл не відбувся або зброя перестала працювати належним чином."]], "th": [{"h": "Чотири золоті правила", "p": [], "ul": ["1. Завжди поводься зі зброєю так, ніби вона заряджена.", "2. Не направляй зброю на людей чи предмети, у які не збираєшся стріляти.", "3. Тримай палець поза спусковим гачком, доки не готовий зробити постріл.", "4. Завжди знай, що перед ціллю і що за нею."]}, {"h": "Розширений Кодекс (ще 8 правил)", "p": [], "ul": ["5. Не залишай зброю без нагляду.", "6. Не жартуй зі зброєю.", "7. Передаючи зброю іншій особі, перевір її стан: розряджена, затвор відкритий, магазин від’єднаний.", "8. Патрон у патронник — лише за командою або в разі потреби.", "9. Боєприпаси зберігай окремо від зброї.", "10. У разі осічки чи затримки тримай зброю в напрямку мішені й дій за стандартною процедурою.", "11. Використовуй лише справні зброю та патрони.", "12. Відповідальність за безпеку завжди несе стрілець."]}, {"h": "Чому правила однакові навіть для макета", "p": ["Правила діють і для навчальних макетів: так формується звичка, яка згодом може врятувати життя. Жарт «Бах!» з макетом, палець на спусковому гачку «щоб швидше зреагувати» чи передача зброї без перевірки — грубі порушення."], "ul": []}], "f": "Більшість нещасних випадків зі зброєю стається через порушення саме перших трьох правил — людина була певна, що зброя розряджена.", "pr": ["Запишіть чотири золоті правила на форзаці зошита й вивчіть напам’ять.", "Визначте порушене правило: а) учень навів макет на однокласницю, «щоб показати, як тримати»; б) учениця взяла в друга зброю й не перевірила, чи вона розряджена; в) після тренування учениця хоче забрати навчальні патрони додому."], "q": ["Назвіть чотири золоті правила Кодексу стрільця.", "Як правильно передавати зброю іншій людині?", "Коли можна досилати патрон у патронник?", "Що робити в разі осічки?", "Хто несе відповідальність за безпеку під час стрільби?"]}, {"n": "7–8", "t": "Класифікація та будова вогнепальної зброї. АК-74 та AR-15", "g": "Знати основні класи стрілецької зброї, загальну будову автоматів АК-74 та AR-15 і відмінності між ними, розуміти значення догляду за зброєю.", "k": "", "terms": [["Стрілецька зброя", "вогнепальна зброя калібру до 20 мм: пістолети, автомати, гвинтівки, кулемети."], ["Купчастість", "здатність зброї влучати кулями близько одна до одної."], ["Масогабаритний макет (ММГ)", "навчальна копія зброї, що повторює розміри й вагу оригіналу."]], "th": [{"h": "Класи стрілецької зброї", "p": [], "ul": ["пістолети — особиста зброя для самозахисту на малих відстанях;", "автомати — основна зброя піхотинця;", "гвинтівки (зокрема снайперські) — для точної стрільби на більші відстані;", "кулемети — для інтенсивного вогню й підтримки підрозділу."]}, {"h": "Основні частини автомата (загально)", "p": ["І АК-74, і AR-15 (в Україні — UAR-15) мають спільні основні частини: ствол, ствольну коробку, затворну групу (затворна рама і затвор), газовідвідну систему, ударно-спусковий механізм, прицільні пристрої, приклад, магазин. Розбирання й збирання вивчають на макетах під керівництвом учителя — воно потрібне для чищення, змащування та усунення затримок."], "ul": []}, {"h": "Порівняння АК-74 та AR-15", "p": [], "ul": ["AR-15 — переваги: легко встановити додаткові приціли (оптичні, коліматорні, тепловізійні, нічного бачення) без втручання в конструкцію; висока купчастість; регульований приклад; мінімальне підкидання дула. Недолік: чутливіший до бруду, потребує регулярного чищення.", "АК — переваги: стійкий до бруду й надійний у складних умовах; можна встановити підствольний гранатомет. Недоліки: складніше встановити сучасні приціли без втручання в конструкцію; відчутне підкидання дула; нерегульований приклад.", "Відмінності конструкції впливають на тактику застосування зброї."]}, {"h": "Догляд за зброєю", "p": ["Зброю регулярно чистять і змащують (шомпол, протяжка, піна, мастила, серветки), перевіряють відсутність люфтів. Перед будь-якими діями обов’язково перевіряють, що зброя розряджена, і працюють уважно, щоб не загубити деталі. Ствол біля дульного зрізу чистять акуратно, щоб не пошкодити нарізи."], "ul": []}], "f": "Автомат Калашникова вважається найпоширенішою зброєю у світі — вироблено десятки мільйонів одиниць, а AR-15 став основою для цілого сімейства сучасних гвинтівок, зокрема українських.", "pr": ["Складіть порівняльну таблицю «АК-74 / AR-15»: переваги, недоліки, для яких умов краще підходить.", "Намалюйте схему автомата й підпишіть основні частини.", "На уроці під керівництвом учителя відпрацюйте неповне розбирання та збирання макета, коментуючи кожну дію і дотримуючись Кодексу стрільця."], "q": ["Назвіть основні класи стрілецької зброї та їхнє призначення.", "Які основні частини має автомат?", "Назвіть переваги AR-15 і переваги АК.", "Навіщо потрібне розбирання та збирання зброї?", "Які правила безпеки діють під час чищення зброї?"]}]}, {"name": "Тренінг 4. Індивідуальні навички поводження зі стрілецькою зброєю (практичний)", "lessons": [{"n": "1–2", "t": "Тактична стійка. Положення для стрільби з коліна та лежачи", "g": "Знати види стійок, елементи тактичної стійки та варіанти положень з коліна й лежачи, їхні переваги й недоліки.", "k": "", "terms": [["Тактична стійка", "базове положення стрільця, найбільш наближене до умов бою; від нього залежать точність, швидкість реакції й безпека."], ["Силует", "видимий для противника обрис тіла; знижений силует — менша ціль."], ["Робоче / неробоче плече", "плече, до якого зазвичай упирають приклад (у правші — праве), та протилежне."]], "th": [{"h": "Види стійок", "p": ["Розрізняють стройову (гвардійську), спортивну та тактичну стійки. На уроках відпрацьовують тактичну — вона найближча до умов бою."], "ul": []}, {"h": "Елементи тактичної стійки (для правші)", "p": [], "ul": ["стопи паралельні, носки в бік цілі; ліва нога попереду, права — трохи позаду;", "ноги на ширині плечей — стабільність і свобода руху;", "коліна злегка зігнуті, «пружні»;", "таз, стегна й груди — фронтально до цілі, верх корпусу трохи подано вперед;", "приклад упирається в «нішу» між плечем і ключицею, правий лікоть притиснутий до корпусу;", "зброю підводять до рівня очей, а не опускають голову до прицілу."]}, {"h": "Положення з коліна", "p": [], "ul": ["Високе коліно — швидко займати, знижує силует, але не дуже стабільне.", "Навпочіпки — швидкий перехід, але погано компенсує віддачу.", "На два коліна — швидко й суттєво зменшує силует, але важко піднятися зі спорядженням.", "Класичне середнє коліно — три точки опори, найстабільніше при збереженні мобільності.", "Низьке коліно — майже як лежачи, але складно змінювати позицію.", "Бережіть коліна — використовуйте наколінники."]}, {"h": "Положення лежачи", "p": [], "ul": ["найстабільніше для стрільби;", "зброя, корпус і опорна нога утворюють одну лінію;", "лікті впираються в землю й розведені для стабільності;", "магазин ніколи не ставлять на землю."]}], "f": "Під час відпрацювання стійки команди дублюють хором — так тренують і витривалість, і передавання команд у бою.", "pr": ["Опишіть по пунктах елементи тактичної стійки (можна з малюнком).", "Складіть таблицю «Положення з коліна: переваги / недоліки» для п’яти варіантів.", "На уроці під контролем учителя відпрацюйте в парах стійку та положення, перевіряючи одне одного."], "q": ["Які види стійок ви знаєте? Чому відпрацьовують тактичну?", "Куди упирається приклад у тактичній стійці?", "Яке положення з коліна найстабільніше і чому?", "Чому положення лежачи вважають найстабільнішим?", "Чому магазин не можна ставити на землю?"]}, {"n": "3", "t": "Положення зброї «ствол вгору» та «ствол вниз». Перекладання зброї на неробоче плече", "g": "Знати, коли застосовують положення «ствол вгору» та «ствол вниз», і навіщо перекладають зброю на неробоче плече.", "k": "", "terms": [["Перекладання зброї", "перенесення приклада на неробоче плече, щоб вести вогонь з-за укриття з меншим силуетом."]], "th": [{"h": "Безпечне положення під час руху", "p": ["Під час пересування ствол не повинен бути спрямований на людей поруч, на власні ноги чи в землю (щоб не забити ствол ґрунтом при падінні)."], "ul": []}, {"h": "«Ствол вгору»", "p": [], "ul": ["зброя у двох руках, ствол під кутом догори й трохи вбік;", "застосовують у тісних приміщеннях і в колоні, щоб не спрямовувати ствол на людей попереду;", "ризики: ствол може чіплятися за гілки, дверні отвори; під час посадки на техніку треба контролювати, щоб ствол не був спрямований на людей."]}, {"h": "«Ствол вниз»", "p": [], "ul": ["зброя у двох руках, ствол спрямований донизу;", "застосовують на відкритій місцевості, коли попереду нікого немає — так швидко вивести зброю в потрібний сектор;", "обидва положення правильні — вибір залежить від ситуації."]}, {"h": "Перекладання на неробоче плече", "p": [], "ul": ["мета — стріляти з-за укриття, показуючи противнику мінімум тіла;", "неповне перекладання — приклад на інше плече, руки не міняються;", "повне перекладання — додатково змінюється хват рук; складніше, але дає кращий контроль;", "позиція ніг не змінюється: задня нога залишається опорною."]}], "f": "", "pr": ["Опишіть дві ситуації, коли доречне положення «ствол вгору», і дві — «ствол вниз».", "Поясніть різницю між неповним і повним перекладанням зброї."], "q": ["Навіщо контролювати положення ствола під час руху?", "Коли застосовують положення «ствол вгору»?", "Коли краще використовувати «ствол вниз»?", "Навіщо перекладати зброю на неробоче плече?", "Чим повне перекладання відрізняється від неповного?"]}, {"n": "4–7", "t": "Сектори «годинника». Реагування на контакт з місця, з коліна, лежачи. Одно- та багатокрокове зміщення", "g": "Розуміти систему секторів «годинника», загальний алгоритм реагування та принципи зміщення й завершальних перевірок.", "k": "", "terms": [["Сектори «годинника»", "спосіб позначення напрямків відносно стрільця: 12 — прямо, 3 — праворуч, 6 — позаду, 9 — ліворуч."], ["Контакт", "виявлення противника або загрози."], ["Зміщення", "переміщення на крок чи кілька кроків, щоб зійти з лінії вогню або зайняти укриття."]], "th": [{"h": "Сектори «годинника»", "p": ["Уявіть, що стоїте в центрі циферблата і дивитеся на 12. Тоді 3 — праворуч, 6 — позаду, 9 — ліворуч. Так швидко й однозначно позначають напрямок загрози: «Контакт, 9 година!»."], "ul": []}, {"h": "Загальний алгоритм реагування", "p": [], "ul": ["знизити силует;", "опустити ствол униз (під час розвороту ствол не повинен «гуляти» вище лінії пояса);", "повернути голову й ідентифікувати ціль;", "розвернути стопу в бік сектору й підставити іншу ногу;", "вкласти зброю та вивести її вперед у класичне положення."]}, {"h": "Зміщення", "p": [], "ul": ["однокрокове — один крок, щоб зійти з лінії вогню або створити простір для дій;", "багатокрокове — два кроки й більше, щоб зайняти укриття чи змінити позицію;", "вперед рухаються плавно з п’ятки на носок (стійкість і тиша), назад — з носка на п’ятку (баланс);", "силует знижений, ствол під час переведення — донизу."]}, {"h": "Завершальні перевірк
