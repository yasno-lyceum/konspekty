епіано)."], ["Пекінська опера", "китайський музичний театр, що поєднує спів, декламацію, акробатику, пантоміму."], ["Ґаґаку", "давня придворна музика Японії."], ["Пхансорі", "корейський жанр оповіді-співу під барабан."], ["Кабукі, Но", "традиційні японські театри."]], "th": [{"h": "Спільні риси", "p": [], "ul": ["пентатоніка — основа мелодій;", "увага до тембру окремого звуку, до пауз і тиші;", "зв’язок музики з філософією, природою, театром;", "мелодія важливіша за гармонію; часте одноголосся."]}, {"h": "Китай", "p": [], "ul": ["ґуцінь — 7-струнна цитра, інструмент учених і філософів (Конфуцій грав на ньому);", "піпа — 4-струнна лютня; ерху — 2-струнна «скрипка», звук якої нагадує людський голос;", "ді — бамбукова флейта; шен — губний орган з бамбукових трубочок;", "Пекінська опера (з кінця XVIII ст.) — синтез співу, акробатики, бойових мистецтв; колір гриму має значення: червоний — вірність і мужність, чорний — чесність, білий — підступність. Внесена до спадщини ЮНЕСКО."]}, {"h": "Японія", "p": [], "ul": ["ґаґаку — придворна оркестрова музика, одна з найдавніших у світі;", "кото — 13-струнна цитра; сямісен — 3-струнна лютня; сякухаті — бамбукова флейта;", "тайко — великі барабани, виступи яких схожі на бойове мистецтво;", "театр Но — повільний, філософський, актори в масках; кабукі — яскраві костюми та грим кумадорі; бунраку — ляльковий театр;", "сучасність: J-pop, музика до аніме (Джо Хісаісі — композитор фільмів Хаяо Міядзакі)."]}, {"h": "Корея", "p": [], "ul": ["каягим — 12-струнна цитра;", "пхансорі — один співак і барабанщик із барабаном пук розповідають історію протягом кількох годин;", "самульнорі — ансамбль із чотирьох ударних інструментів, що символізують грім, дощ, хмари й вітер;", "сучасність: K-pop — яскраве шоу, де музика, хореографія, мода і відео однаково важливі (BTS, BLACKPINK)."]}], "f": "Звук ерху називають «плачем» — на цьому інструменті лише дві струни, а смичок затиснутий між ними.", "pr": ["Прослухайте фрагменти гри на ерху, кото та виступ барабанів тайко. Опишіть кожен тембр одним-двома образами з природи (наприклад, «як вітер у бамбуку»).", "Зіграйте пентатоніку: на фортепіано чи в онлайн-піаніно натискайте лише чорні клавіші — придумайте коротку мелодію. Що вона вам нагадує?", "Намалюйте ескіз гриму для героя пекінської опери, використовуючи символіку кольорів."], "q": ["Що таке пентатоніка?", "Назвіть по два інструменти Китаю, Японії та Кореї.", "Що означають кольори гриму в пекінській опері?", "Чим відрізняються театри Но і кабукі?", "Які сучасні музичні явища Далекого Сходу популярні у світі?"]}, {"n": "23", "t": "Японські сади. Чайна церемонія", "g": "Зрозуміти філософію японського саду та чайної церемонії, їхні види, елементи й символіку.", "k": "", "terms": [["Каресансуй", "«сухий» сад каменів і піску."], ["Ваби-сабі", "японська естетика краси простого, недосконалого, мінливого."], ["Тяною (тядо)", "«шлях чаю» — японська чайна церемонія."], ["Тясіцу", "чайний будиночок."], ["Ікебана", "мистецтво складання квіткових композицій."]], "th": [{"h": "Японський сад — природа в мініатюрі", "p": ["Японський сад — це не клумби, а модель Всесвіту. Камені символізують гори й острови, пісок або вода — море, мох — ліс. Сад призначений для споглядання й роздумів."], "ul": ["сухий сад каменів (каресансуй) — найвідоміший у храмі Рьоан-дзі в Кіото: 15 каменів на білому гравії, але з жодної точки не видно всіх 15 одночасно; гравій розчісують граблями, створюючи «хвилі»;", "сад зі ставком — для прогулянок або споглядання з павільйону;", "чайний сад (родзі) — стежка до чайного будиночка, що допомагає «залишити» буденні турботи;", "елементи: кам’яні ліхтарі, містки, бамбукові огорожі, клени, сакура, сосни, короп у ставку."]}, {"h": "", "p": ["До мистецтва японського саду близькі бонсай (вирощування мініатюрних дерев) та ікебана (композиція з квітів, гілок і листя, яка часто має три головні лінії — «небо», «людина», «земля»).", "В Україні є Корейський традиційний сад у Національному ботанічному саду імені М. М. Гришка в Києві, а японські сади — в ботанічних садах кількох міст."], "ul": []}, {"h": "Чайна церемонія", "p": ["Чай прийшов до Японії з Китаю, а в XVI ст. майстер Сен-но Рікю перетворив чаювання на мистецтво й духовну практику. Чотири принципи чайної церемонії:"], "ul": ["ва — гармонія;", "кей — повага;", "сей — чистота;", "дзяку — спокій."]}, {"h": "", "p": ["Церемонія відбувається в маленькому чайному будиночку (тясіцу). Вхід до нього дуже низький — навіть знатний гість мусить схилитися: перед чаєм усі рівні. Господар готує зелений порошковий чай маття: насипає його в чашу (тяван), заливає гарячою водою й збиває бамбуковим віничком (тясен). Гість приймає чашу, повертає її, милується нею, п’є і дякує. Кожен рух виважений, а увагу приділяють і сувою на стіні, і квіткам, і посуду.", "У Китаї існує своя чайна традиція — гунфу-ча, де головне — майстерність заварювання та смак чаю."], "ul": []}], "f": "Японське прислів’я, пов’язане з чайною церемонією, — «ітіґо ітіе»: «одна зустріч — одна можливість». Кожна зустріч неповторна, тому її слід цінувати.", "pr": ["Створіть проєкт міні-саду каменів: у коробці або на аркуші розмістіть 3–5 «каменів» і намалюйте «хвилі» піску. Поясніть, що символізує кожен елемент.", "Або: складіть ікебану з гілок, листя й квітів, які є під рукою (три головні лінії: «небо», «людина», «земля»), сфотографуйте та опишіть.", "Напишіть, як принципи ва, кей, сей, дзяку можна застосувати у вашому житті."], "q": ["Що символізують камені, пісок і мох у японському саду?", "Чим особливий сад храму Рьоан-дзі?", "Хто такий Сен-но Рікю?", "Назвіть чотири принципи чайної церемонії.", "Чому вхід до чайного будиночка такий низький?"]}]}, {"name": "Тема 4. Мистецтво індійського культурного регіону (4 год.)", "lessons": [{"n": "24", "t": "Синтез архітектури і скульптури", "g": "Зрозуміти, як в індійських храмах архітектура й скульптура зливаються в єдине ціле, знати основні типи споруд і видатні пам’ятки Індії.", "k": "", "terms": [["Ступа", "буддійська культова споруда у формі напівсфери, де зберігаються реліквії."], ["Торана", "різьблені кам’яні ворота ступи."], ["Шикхара", "високий вежоподібний дах-вершина індуїстського храму на півночі Індії."], ["Гопурам", "величезна ступінчаста вежа-брама храмів Південної Індії."], ["Синтез мистецтв", "поєднання кількох видів мистецтва в одному творі."]], "th": [{"h": "Храм як модель Всесвіту", "p": ["Індія — батьківщина індуїзму, буддизму, джайнізму, сикхізму; тут поширений і іслам. Кожна релігія залишила свої шедеври. В індійському храмі архітектура і скульптура нероздільні: стіни, колони, вежі вкриті тисячами рельєфів і статуй богів, тварин, танцівниць, квітів. Храм уявляли як священну гору Меру — центр Всесвіту."], "ul": []}, {"h": "Буддійська архітектура", "p": [], "ul": ["Ступа в Санчі (ІІІ ст. до н. е., за часів царя Ашоки) — напівсфера, оточена огорожею з чотирма різьбленими воротами-торанами, які розповідають про життя Будди;", "печерні храми Аджанти — вирубані в скелі монастирі з чудовими фресками;", "Елора — комплекс із 34 печерних храмів різних релігій; храм Кайласа (VIII ст.) вирубаний з однієї скелі згори донизу, як величезна скульптура."]}, {"h": "Індуїстські храми", "p": [], "ul": ["Кхаджурахо (Х–ХІ ст.) — храми з високими шикхарами, вкриті витонченою скульптурою;", "Сонячний храм у Конараку (XIII ст.) — у формі колісниці бога Сонця з 24 різьбленими колесами й кіньми;", "храм Мінакші в Мадураї — гопурами заввишки до 50 м, вкриті тисячами розписаних фігур;", "скульптура: «Шива Натараджа» — бронзова статуя танцюючого Шиви в колі полум’я (доба Чола); тримурті (тригола статуя) в печерах острова Елефанта."]}, {"h": "Мистецтво Великих Моголів", "p": ["У XVI–XVII ст. Індією правили мусульманські імператори з династії Великих Моголів. Вони поєднали індійські та перські традиції."], "ul": ["Тадж-Махал в Агрі (1632–1653) — мавзолей, який імператор Шах-Джахан звів на честь дружини Мумтаз-Махал. Білий мармур інкрустований напівдорогоцінним камінням, будівля ідеально симетрична, відбивається у воді каналу;", "Червоний форт у Делі, мінарет Кутб-Мінар."]}, {"h": "Сучасність", "p": ["«Храм Лотоса» в Делі (1986) — будівля у формі квітки лотоса з 27 мармурових «пелюсток»; сучасна архітектура міста Чандігарх за проєктом Ле Корбюзьє."], "ul": []}], "f": "Колір мармуру Тадж-Махалу змінюється протягом дня: вранці він рожевуватий, удень — сліпучо-білий, а в місячному світлі — золотавий.", "pr": ["Підготуйте «картку-екскурсію» про одну пам’ятку Індії (Тадж-Махал, Кайласа, Конарак, Мінакші, Санчі): фото або малюнок, де і коли збудовано, релігія, 3 цікаві факти, як у ній поєднуються архітектура і скульптура.", "Розгляньте статую «Шива Натараджа» та поясніть символіку: коло полум’я, чотири руки, піднята нога, карлик під ногою."], "q": ["Чому індійський храм називають «моделлю Всесвіту»?", "Що таке ступа і торана?", "Чим унікальний храм Кайласа в Елорі?", "Як виглядає Сонячний храм у Конараку?", "Хто і навіщо збудував Тадж-Махал?"]}, {"n": "25", "t": "Музика Індії. Рага. Музичний інструментарій", "g": "Дізнатися про дві традиції класичної музики Індії, поняття раги й тали, основні індійські інструменти та відомих виконавців.", "k": "", "terms": [["Рага", "мелодична основа (лад + характерні звороти), на якій музикант імпровізує; кожна рага має свій настрій і час виконання."], ["Тала", "ритмічний цикл (наприклад, тінтал — 16 долей)."], ["Раса", "емоційний настрій, «смак» твору."], ["Бурдон", "тривалий незмінний звук-фон (його створює тампура)."]], "th": [{"h": "Дві традиції", "p": ["Класична музика Індії існує в двох традиціях: хіндустанській (Північна Індія, з перським впливом) та карнатичній (Південна Індія). Обидві спираються на давній трактат «Натьяшастра» (приписують мудрецю Бхараті) і на три основи: рагу, талу та імпровізацію."], "ul": []}, {"h": "Рага", "p": ["Слово «рага» означає «забарвлення», «те, що зачаровує душу». Рага — не готова мелодія, а набір правил: які звуки використовувати, у якому порядку підніматися й спускатися, які звороти характерні. На цій основі музикант щоразу творить нову імпровізацію. Кожна рага пов’язана з певним часом доби (ранкові, вечірні, нічні раги), порою року й настроєм (раса): любов, смуток, мужність, спокій. Виконання раги може тривати від кількох хвилин до години й більше.", "Традиційна форма: повільний вступ без ритму (алап), поступове прискорення, приєднання ударних і віртуозний фінал."], "ul": []}, {"h": "Інструменти", "p": [], "ul": ["ситар — довгогрифовий струнний інструмент із резонатором із гарбуза; має струни, що звучать «у відповідь» (резонансні);", "віна — один з найдавніших струнних інструментів, пов’язаний з богинею мудрості Сарасваті;", "сарод (струнний без ладів), сарангі (смичковий, найближчий до людського голосу);", "табла — пара барабанів, на яких грають пальцями; складна система складів-звуків;", "мрідангам — двосторонній барабан (карнатична музика);", "бансурі — бамбукова флейта, інструмент бога Крішни;", "шехнай — дерев’яний духовий інструмент (звучить на весіллях);", "тампура — створює безперервний бурдон, фон для раги."]}, {"h": "Видатні музиканти", "p": [], "ul": ["Раві Шанкар (ситар) — познайомив Захід з індійською музикою; навчав гітариста гурту The Beatles Джорджа Гаррісона, після чого ситар зазвучав у піснях «бітлів»;", "Закір Хуссейн (табла), Харіпрасад Чаурасія (бансурі), Бісмілла Хан (шехнай)."]}], "f": "За легендою, раги можуть впливати на природу: вечірня рага «Діпак» нібито запалює світильники, а рага «Мегх Малхар» викликає дощ.", "pr": ["Прослухайте фрагмент раги у виконанні Раві Шанкара (5–10 хв). Визначте: коли з’являються ударні, як змінюється темп, який настрій (раса) панує. Для якого часу доби, на вашу думку, ця рага?", "Створіть «картку інструмента»: малюнок одного індійського інструмента, група (струнні, духові, ударні), як на ньому грають, особливості звучання."], "q": ["Чим відрізняються хіндустанська та карнатична традиції?", "Що таке рага і тала?", "Чому одну й ту саму рагу щоразу виконують по-різному?", "Назвіть 5 індійських інструментів.", "Як Раві Шанкар вплинув на західну музику?"]}, {"n": "26", "t": "Символічність танцювального мистецтва", "g": "Дізнатися про класичні танці Індії, мову жестів (мудри), вираз обличчя та зв’язок танцю з міфологією.", "k": "", "terms": [["Мудра (хаста)", "символічний жест руки в індійському танці."], ["Абхіная", "виразність: передача змісту через обличчя, очі, жести."], ["Нрітта", "«чистий» танець — ритмічні рухи без сюжету."], ["Нрітья", "виразний танець, що передає почуття й сюжет."], ["Ґунґру", "дзвіночки на щиколотках танцівника."]], "th": [{"h": "Танець — молитва й розповідь", "p": ["В Індії танець вважається священним мистецтвом. За міфологією, Всесвіт творить і руйнує своїм космічним танцем бог Шива — Натараджа («цар танцю»). Давній трактат «Натьяшастра» описує правила танцю, музики і театру. Класичний танець складається з трьох частин: нрітта (чистий ритм), нрітья (вираження почуттів) і натья (драма, сюжет)."], "ul": []}, {"h": "Мова тіла", "p": [], "ul": ["мудри: для однієї руки описано 28 жестів, для двох рук — 24; один і той самий жест може означати різне (наприклад, «патака» — розкрита долоня — це і прапор, і хмара, і ліс, і благословення);", "очі та брови — окрема «мова»; танцівники роками тренують рухи очей;", "дев’ять рас (почуттів): любов, сміх, смуток, гнів, мужність, страх, відраза, подив, спокій;", "ритм, що вибивають ногами, підсилений дзвіночками ґунґру."]}, {"h": "Класичні танці Індії", "p": [], "ul": ["бхаратанатьям (Тамілнад) — геометрично чіткі пози, напівприсід, виразні мудри;", "катхак (Північна Індія) — швидкі оберти й віртуозне вибивання ритму ногами; сформувався під впливом придворної культури Моголів;", "катхакалі (Керала) — танець-драма, виконують чоловіки з яскравим гримом і великими спідницями; сюжети з епосів «Рамаяна» і «Махабхарата»;", "одіссі (Орісса) — плавні, скульптурні пози, як у храмових статуях;", "маніпурі, кучипуді, мохініяттам, сатрія — інші визнані класичні стилі."]}, {"h": "Народні танці й сучасність", "p": ["Окрім класичних, в Індії безліч народних танців: бхангра (Пенджаб) — енергійний танець свята врожаю, ґарба (Гуджарат) — коловий танець із паличками. Сучасний «боллівудський» танець поєднує класичні мудри, народні рухи й західну хореографію."], "ul": []}], "f": "Підготовка танцівника катхакалі до виступу — нанесення гриму й одягання костюма — може тривати 3–4 години.", "pr": ["Вивчіть і відтворіть 4 мудри: патака (пряма долоня — прапор, хмара), тріпатака (безіменний палець зігнутий — корона, дерево), ардхачандра (великий палець відведено — півмісяць), алападма (пальці розкриті віялом — розквітлий лотос). Сфотографуйте або замалюйте їх і складіть із них коротку «історію».", "Перегляньте фрагменти бхаратанатьяму і катхаку та порівняйте їх (рухи, костюм, темп, музика)."], "q": ["Чому танець в Індії вважається священним?", "Що таке нрітта, нрітья і натья?", "Що таке мудра? Наведіть приклади.", "Назвіть 4 класичні танці Індії та їхні особливості.", "Хто такий Шива Натараджа?"]}, {"n": "27", "t": "Індійський кінематограф", "g": "Дізнатися про історію та особливості кіно Індії, центри кіновиробництва, видатних режисерів і акторів.", "k": "", "terms": [["Боллівуд", "кіноіндустрія Мумбаї (колишній Бомбей), фільми мовою гінді."], ["Масала-фільм", "фільм, що поєднує кілька жанрів: драму, комедію, бойовик, мелодраму, мюзикл."], ["Плейбек-співак", "співак, чий голос звучить у піснях замість голосу актора."]], "th": [{"h": "Історія", "p": [], "ul": ["1913 — перший індійський повнометражний фільм «Раджа Харішчандра» режисера Дадасахеба Пхальке, «батька індійського кіно»;", "1931 — перший звуковий фільм «Алам Ара»; відтоді пісні стали невід’ємною частиною індійського кіно;", "1950-ті — «золота доба»: Радж Капур («Бродяга», 1951) — фільм був надзвичайно популярний і в СРСР, зокрема в Україні;", "Сатьяджит Рей (Бенгалія) — «Пісня дороги» (1955), вершина авторського кіно; 1992 р. отримав почесний «Оскар»."]}, {"h": "Кіноцентри Індії", "p": ["Індія випускає найбільше фільмів у світі. Кіно знімають різними мовами:"], "ul": ["Боллівуд — Мумбаї, мова гінді;", "Толлівуд — телугу; Коллівуд — тамільська мова та інші регіональні кіноіндустрії."]}, {"h": "Особливості індійського кіно", "p": [], "ul": ["численні пісні й танці, які розкривають почуття героїв;", "поєднання жанрів (масала);", "велика тривалість — часто близько трьох годин з антрактом;", "яскраві костюми, мальовничі пейзажі;", "теми: кохання, родина, дружба, боротьба добра зі злом, соціальна несправедливість;", "плейбек-співаки: Лата Мангешкар записала тисячі пісень для фільмів."]}, {"h": "Зірки й сучасність", "p": ["Амітабх Баччан, Шахрукх Кхан, Аамір Кхан («Лагаан», «Три ідіоти») — зірки світового масштабу. Фільм «RRR» (2022) отримав «Оскар» за пісню «Naatu Naatu». Цікаво, що танцювальну сцену до цієї пісні знімали в Києві, біля Маріїнського палацу, 2021 року."], "ul": []}], "f": "Сцену «Naatu Naatu» з фільму «RRR», знятого біля Маріїнського палацу в Києві, переглянули в мережі сотні мільйонів разів.", "pr": ["Перегляньте музичний фрагмент «Naatu Naatu» або пісню з іншого індійського фільму. Визначте: які почуття героїв передає танець, які елементи класичного та народного танцю ви помітили, де відбувається дія.", "Складіть «рецепт» масала-фільму: які жанри, персонажі, пісні та «інгредієнти» обов’язкові. Придумайте назву свого фільму."], "q": ["Хто вважається «батьком індійського кіно»?", "Що таке Боллівуд?", "Назвіть 4 особливості індійського кіно.", "Чим відомий Сатьяджит Рей?", "Як пов’язані фільм «RRR» та Україна?"]}]}, {"name": "Тема 5. Мистецтво арабо-мусульманського культурного регіону (6 год.)", "lessons": [{"n": "28", "t": "Архітектура арабо-мусульманського культурного регіону", "g": "Дізнатися про основні типи споруд, архітектурні елементи та найвідоміші пам’ятки арабо-мусульманського світу.", "k": "", "terms": [["Мечеть", "мусульманська молитовна споруда."], ["Мінарет", "вежа біля мечеті, з якої скликають на молитву."], ["Міхраб", "ніша в стіні мечеті, що вказує напрямок на Мекку."], ["Мукарнаси", "«сталактитові» склепіння з багатьох дрібних комірок."], ["Медресе", "мусульманський навчальний заклад."], ["Айван", "велика склепінчаста арка-портал, відкрита з одного боку."]], "th": [{"h": "Регіон і його особливості", "p": ["Арабо-мусульманський культурний регіон охоплює Близький Схід, Північну Африку, Іран, Туреччину, Середню Азію; колись до нього належала й Південна Іспанія (Андалусія). Мистецтво регіону поєднало арабські, перські, візантійські, тюркські традиції. У релігійних спорудах зазвичай не зображують людей і тварин, тому провідну роль відіграють орнамент і каліграфія."], "ul": []}, {"h": "Мечеть та її елементи", "p": [], "ul": ["внутрішній двір із фонтаном або басейном для омовіння;", "молитовна зала, часто з багатьма колонами або великим куполом;", "міхраб — прикрашена ніша, звернена до Мекки; мінбар — кафедра;", "мінарети — від одного до шести і більше;", "арки різних форм: підковоподібні, стрілчасті, багатолопатеві;", "мукарнаси, мозаїка, кахлі, різьблення по каменю й гіпсу."]}, {"h": "Шедеври", "p": [], "ul": ["Купол Скелі в Єрусалимі (691 р.) — одна з найдавніших пам’яток ісламської архітектури, восьмикутна будівля з золотим куполом;", "Мечеть-собор у Кордові (Іспанія) — «ліс» колон із червоно-білими смугастими арками;", "Альгамбра в Гранаді (XIII–XIV ст.) — палац із тонким різьбленням стін, Двір левів, мукарнасові склепіння;", "Блакитна мечеть (Султанахмет) у Стамбулі (1609–1616) — шість мінаретів, інтер’єр із тисяч блакитних ізникських кахлів;", "мечеть Сулейманіє в Стамбулі — творіння архітектора Сінана;", "площа Регістан у Самарканді — три медресе, вкриті яскравою мозаїкою;", "Мечеть шейха Заїда в Абу-Дабі (2007) — сучасна біломармурова мечеть."]}, {"h": "Світські споруди та сучасність", "p": ["Окрім мечетей, будували палаци, караван-сараї (заїжджі двори для купців), лазні-хамами, базари, фортеці. Сучасна архітектура регіону відома рекордами: хмарочос Бурдж-Халіфа в Дубаї (828 м) — найвища будівля світу."], "ul": []}, {"h": "Зв’язок з Україною", "p": ["У Криму, в Бахчисараї, зберігся Ханський палац (XVI ст.) — резиденція кримських ханів із мечетями, двориками та знаменитим «Фонтаном сліз». Це пам’ятка культури кримськотатарського народу, корінного народу України."], "ul": []}], "f": "У Двір левів Альгамбри вода надходить через фонтан із 12 мармуровими левами; за легендою, в давнину він працював як годинник — щогодини вода текла з пащі іншого лева.", "pr": ["Намалюйте схему мечеті та підпишіть її основні елементи: купол, мінарет, двір, фонтан, молитовна зала, міхраб.", "Намалюйте три види арок (підковоподібна, стрілчаста, багатолопатева) і знайдіть фото споруди з кожним видом."], "q": ["Чому в релігійному мистецтві регіону переважають орнамент і каліграфія?", "Назвіть основні елементи мечеті.", "Що таке мукарнаси?", "Чим відомі Альгамбра і Блакитна мечеть?", "Яка пам’ятка арабо-мусульманської культури є в Україні?"]}, {"n": "29", "t": "Каліграфія. Арабеска", "g": "Зрозуміти, чому каліграфія стала провідним мистецтвом ісламського світу, розрізняти її стилі та знати, що таке арабеска і геометричний орнамент.", "k": "", "terms": [["Каліграфія", "мистецтво красивого письма."], ["Калам", "очеретяне перо для письма."], ["Куфі", "найдавніший кутастий стиль арабського письма."], ["Арабеска", "складний безперервний орнамент із переплетених рослинних мотивів."], ["Гірих", "геометричний орнамент із зірок і багатокутників."], ["Туґра", "вензель-підпис османського султана."]], "th": [{"h": "Слово як мистецтво", "p": ["Арабське письмо пишуть справа наліво, в алфавіті 28 літер, більшість яких з’єднуються між собою. Оскільки в мечетях не зображують живих істот, найвищим мистецтвом стала каліграфія. Нею прикрашали книги, стіни мечетей і палаців, посуд, тканини, монети. Каліграфи навчалися багато років, а їхні імена шанували не менше, ніж імена художників."], "ul": []}, {"h": "Стилі каліграфії", "p": [], "ul": ["куфі — кутастий, чіткий, «архітектурний»; використовувався в ранніх рукописах і на стінах;", "насх — округлий, легко читається; основа друкованих шрифтів;", "сульс — великий, урочистий, для написів на будівлях;", "дивані — химерно-витончений стиль канцелярії Османської імперії;", "насталік — «висячий», похилий стиль Ірану;", "магрибі — стиль Північної Африки."]}, {"h": "", "p": ["Каліграфи вміли складати з літер цілі картини — зображення птахів, кораблів, левів (каліграми). Туґра — складний вензель султана — ставилася на указах як підпис і печатка."], "ul": []}, {"h": "Арабеска і геометричний орнамент", "p": ["Арабеска — нескінченний орнамент із гілок, листя, квітів, що переплітаються та ростуть одне з одного. У ній немає початку й кінця — це символ нескінченності та гармонії світу.", "Гірих — геометричний орнамент із 6-, 8-, 10-, 12-променевих зірок і багатокутників. Його будують за допомогою циркуля й лінійки, і він демонструє глибокі математичні знання майстрів."], "ul": []}, {"h": "Слово «арабеска» в інших мистецтвах", "p": [], "ul": ["у балеті арабеск — поза, коли танцівник стоїть на одній нозі, а другу витягує назад;", "у музиці — п’єса з вишуканою, «візерунчастою» мелодією (Роберт Шуман, Клод Дебюссі «Дві арабески»)."]}], "f": "Деякі середньовічні візерунки гірих у мечетях Ірану побудовані за принципом, який математики на Заході описали лише у ХХ ст., — так званих «квазікристалічних» мозаїк.", "pr": ["Побудуйте циркулем і лінійкою восьмипроменеву зірку та розвиньте з неї геометричний орнамент (гірих). Розфарбуйте у 2–3 кольори (синій, бірюзовий, золотий).", "Або: намалюйте арабеску в колі чи квадраті — безперервна гілка з листям і квітами, що переплітаються.", "Або: створіть свою «каліграму» — напишіть своє ім’я українською так, щоб літери утворили зображення (птах, риба, квітка)."], "q": ["Чому каліграфія стала провідним мистецтвом ісламського світу?", "Назвіть 4 стилі арабської каліграфії.", "Що таке туґра?", "Чим арабеска відрізняється від гіриху?", "Що означає слово «арабеска» в балеті та музиці?"]}, {"n": "30", "t": "Декоративно-ужиткове мистецтво регіону: килимарство, кераміка, ткацтво. Книжкова мініатюра", "g": "Ознайомитися з перськими килимами, ізникською керамікою, тканинами Сходу та мистецтвом книжкової мініатюри.", "k": "", "terms": [["Ворсовий килим", "килим, виготовлений вузликами, що утворюють ворс."], ["Кілім", "безворсовий, тканий килим."], ["Люстр", "кераміка з металевим відблиском поливи."], ["Мініатюра", "невелике, дуже детальне зображення, що ілюструє рукописну книгу."], ["Орнек", "кримськотатарський орнамент, внесений до спадщини ЮНЕСКО."]], "th": [{"h": "Килимарство", "p": ["Килим на Сході — не лише прикраса: він був підлогою, ліжком, стіною намету, молитовним місцем і показником багатства. Найславетніші — перські килими (міста Тебриз, Ісфахан, Кашан). Ворсовий килим в’яжуть вручну вузликами: у дорогому килимі їх може бути понад мільйон на квадратний метр, а робота триває роки."], "ul": ["візерунки: центральний медальйон, «сад» (символ раю), рослинні та геометричні мотиви;", "молитовні килими з зображенням арки-міхраба;", "Ардебільський килим (1539–1540, зберігається в Лондоні) — один з найдавніших датованих килимів світу;", "кіліми — безворсові килими з геометричним візерунком (Туреччина, Кавказ, Середня Азія)."]}, {"h": "Кераміка", "p": [], "ul": ["Ізник (Туреччина, XVI ст.) — біла кераміка з кобальтово-синіми, бірюзовими та яскраво-червоними квітами (тюльпани, гвоздики); кахлі прикрашають мечеті Стамбула;", "люстрова кераміка з «золотим» металевим блиском (Ірак, Іран, Іспанія);", "кахлі та мозаїка Ірану й Середньої Азії — цілі стіни й куполи вкриті синьо-бірюзовою керамікою."]}, {"h": "Ткацтво та інші ремесла", "p": [], "ul": ["дамаск (від міста Дамаск) — тканина з візерунком, що виблискує;", "муслін (від міста Мосул) — тонка легка бавовняна тканина;", "сюзане — вишиті покривала Середньої Азії (Бухара);", "металеві вироби з інкрустацією, скляні світильники для мечетей;", "кримськотатарський орнамент «орнек» — у 2021 р. внесений до Репрезентативного списку нематеріальної культурної спадщини ЮНЕСКО."]}, {"h": "Книжкова мініатюра", "p": ["Рукописні книги прикрашали мініатюрами — яскравими малюнками з тонкими деталями. Особливості:"], "ul": ["площинність, відсутність лінійної перспективи — те, що далі, зображено вище;", "яскраві мінеральні фарби й золото;", "дрібні деталі одягу, рослин, візерунків;", "поєднання зображення з каліграфічним текстом і орнаментальною рамкою."]}, {"h": "", "p": ["Школи мініатюри: багдадська (аль-Васіті, ілюстрації до «Макам» аль-Харірі, 1237 р.), перська (Кемаледдін Бехзад, Герат, кінець XV — початок XVI ст.; ілюстрації до «Шахнаме» Фірдоусі), османська, могольська (Індія)."], "ul": []}], "f": "Назви тканин «дамаск» і «муслін» походять від міст Дамаск і Мосул, звідки ці тканини потрапили до Європи.", "pr": ["Створіть ескіз килима у східному стилі: центральний медальйон, кутові елементи, бордюр з рослинним орнаментом. Використайте символічні кольори (червоний, синій, золотий).", "Або: намалюйте мініатюру за мотивами східної казки («Тисяча і одна ніч») — площинно, з яскравими кольорами, дрібними візерунками та орнаментальною рамкою з написом."], "q": ["Яку роль відігравав килим у житті людей Сходу?", "Чим відрізняються ворсовий килим і кілім?", "Чим відома кераміка Ізника?", "Назвіть 4 особливості книжкової мініатюри.", "Хто такий Кемаледдін Бехзад?"]}, {"n": "31", "t": "Особливості музичного мистецтва регіону (макам). Музичний інструментарій", "g": "Дізнатися про систему макамів, особливості звучання музики арабо-мусульманського регіону, її інструменти та вплив на європейську музику.", "k": "", "terms": [["Макам", "ладово-мелодична система (і окремий лад) арабської, турецької, азербайджанської та інших традицій."], ["Мікротони", "інтервали, менші за півтон (наприклад, чверть тону)."], ["Таксим", "вільна інструментальна імпровізація, вступ до твору."], ["Мугам", "азербайджанська класична музична традиція (у спадщині ЮНЕСКО)."]], "th": [{"h": "Макам", "p": ["Макам — це і лад, і набір правил розвитку мелодії, і певний настрій. Як індійська рага, макам — основа для імпровізації. Макамів дуже багато (десятки в арабській і турецькій традиціях), і кожен має назву: раст, баяті, хіджаз, сіка тощо.", "Особливість — мікротони: у музиці Сходу є звуки «між» клавішами фортепіано, тому вона звучить незвично для європейського вуха. Мелодія багато прикрашена (мелізми), ритм буває складним. Часто одну мелодію одночасно виконують кілька інструментів, трохи по-різному її прикрашаючи (гетерофонія)."], "ul": []}, {"h": "Споріднені традиції", "p": [], "ul": ["арабський макам;", "перський дастґях;", "турецький макам;", "азербайджанський мугам;", "шашмаком (Узбекистан, Таджикистан)."]}, {"h": "Інструменти", "p": [], "ul": ["уд — лютня без ладів, «цар інструментів»; саме від арабського «аль-уд» походить європейське слово «лютня»;", "канун — щипкова цитра з кількома десятками струн, лежить на колінах;", "най — очеретяна поздовжня флейта з м’яким «дихаючим» звуком;", "саз (баглама) — турецька лютня з довгим грифом;", "кеманча — смичковий інструмент, який тримають вертикально;", "ребаб — смичковий, один з предків скрипки;", "ударні: дарбука (келихоподібний барабан), рік (бубон із тарілочками), деф (велика рамкова бубна);", "зурна — гучний духовий інструмент для свят і вулиці."]}, {"h": "Співаки та вплив на Європу", "p": ["Умм Кульсум (Єгипет) — «Зірка Сходу»; її концерти тривали годинами. Фейруз (Ліван) — одна з найвідоміших арабських співачок.", "Музика Сходу вплинула на європейців: від уда походить лютня, від ребаба — смичкові; військові оркестри яничарів (мехтер) надихнули Моцарта на «Турецький марш» (рондо alla turca), а Римського-Корсакова — на сюїту «Шехеразада»."], "ul": []}], "f": "Європейська лютня, популярна в епоху Відродження, прийшла через Іспанію від арабського уда — навіть назва інструмента походить від арабського «аль-уд» («дерево»).", "pr": ["Прослухайте таксим на уді та «Турецький марш» Моцарта. Порівняйте: інструменти, ритм, мелодію, настрій. Що Моцарт «запозичив» зі Сходу?", "Складіть кросворд (8–10 слів) на тему «Музичні інструменти арабо-мусульманського регіону»."], "q": ["Що таке макам?", "Що таке мікротони і як вони впливають на звучання?", "Назвіть 5 інструментів регіону та їхні групи.", "Яке європейське слово походить від назви «уд»?", "Як музика Сходу вплинула на європейських композиторів?"]}, {"n": "32", "t": "Танцювальне мистецтво арабо-мусульманського культурного регіону", "g": "Ознайомитися з традиційними танцями регіону, їхнім значенням і символікою, а також зі східними мотивами у світовому балеті.", "k": "", "terms": [["Ракс шаркі", "«східний танець» — класичний сольний танець Єгипту (у Європі його називають «танцем живота»)."], ["Дабке", "груповий лінійний танець Леванту з притупуванням."], ["Сема", "обертальний духовний танець дервішів ордену Мевлеві."], ["Танура", "єгипетський обертальний танець у багатошарових кольорових спідницях."]], "th": [{"h": "Загальні риси", "p": ["Танці регіону дуже різні — від святкових народних до духовних. Спільне: зв’язок з музикою макамів і ударними інструментами, увага до пластики рук і корпусу, імпровізаційність, особлива роль свят і весіль."], "ul": []}, {"h": "Основні танці", "p": [], "ul": ["Ракс шаркі (Єгипет) — сольний танець з плавними й різкими рухами стегон, корпусу, рук; виконується під оркестр або дарбуку; уславили його танцівниці Самія Гамаль і Тахія Каріока, які знімались у єгипетському кіно;", "дабке (Ліван, Сирія, Палестина, Йорданія) — учасники тримаються за руки чи плечі й утворюють лінію; ритмічне притупування символізує єдність громади; танцюють на весіллях і святах;", "халіджі (країни Перської затоки) — жіночий танець з граційними рухами голови й волосся та розшитими сукнями;", "тахтіб (Єгипет) — чоловічий танець із палицями, що походить від бойового мистецтва; внесений до спадщини ЮНЕСКО;", "танура (Єгипет) — танцівник обертається довгий час, піднімаючи й розкручуючи кольорові спідниці, що нагадують квіти;", "халай (Туреччина) — коловий танець під барабан і зурну;", "хайтарма — кримськотатарський народний танець."]}, {"h": "Сема — танець дервішів", "p": ["Орден Мевлеві, заснований послідовниками поета-містика Джалаледдіна Румі (XIII ст., місто Конья, Туреччина), створив обряд сема. Дервіші в білих сорочках і високих повстяних шапках обертаються з розкритими руками: права долоня звернена вгору (отримати благословення неба), ліва — донизу (передати його землі). Обертання символізує рух планет навколо Сонця та шлях людини до Бога. Церемонія внесена до списку нематеріальної спадщини ЮНЕСКО."], "ul": []}, {"h": "Східні мотиви у світовому мистецтві", "p": ["«Арабський танець» у балеті П. Чайковського «Лускунчик», балет «Шехеразада» на музику Римського-Корсакова (трупа Дягілєва, костюми Льва Бакста), поза «арабеск» у класичному балеті — приклади того, як європейська хореографія надихалася Сходом."], "ul": []}], "f": "Дервіші під час сема можуть обертатися понад пів години поспіль і не втрачати рівноваги — вони фіксують погляд на власній руці.", "pr": ["Перегляньте фрагменти двох танців (наприклад, сема і дабке) та порівняйте їх за планом: хто виконує, костюм, музика й інструменти, рухи, символіка, призначення (свято, обряд, сцена).", "Намалюйте ескіз костюма для одного з танців регіону (танура, халіджі, дабке, сема), враховуючи його символіку."], "q": ["Які спільні риси мають танці арабо-мусульманського регіону?", "Що таке дабке і що він символізує?", "Що означають рухи рук у сема?", "Чим особливий танець танура?", "Де в європейському балеті звучать східні мотиви?"]}, {"n": "33", "t": "Урок узагальнення знань. Підсумковий урок за рік", "g": "Систематизувати знання про мистецтво арабо-мусульманського регіону та всіх культурних регіонів, вивчених протягом року.", "k": "", "terms": [], "th": [{"h": "Арабо-мусульманський регіон: повторюємо", "p": [], "ul": ["Архітектура: мечеть (купол, мінарет, міхраб), мукарнаси, арки; Купол Скелі, Альгамбра, Блакитна мечеть, Регістан, Бахчисарайський Ханський палац.", "Каліграфія: куфі, насх, сульс, дивані, насталік; туґра; арабеска і гірих.", "Декоративне мистецтво: перські килими, кілім, ізникська кераміка, дамаск, муслін, орнек.", "Мініатюра: аль-Васіті, Бехзад, «Шахнаме».", "Музика: макам, мікротони, уд, канун, най, дарбука; Умм Кульсум.", "Танці: ракс шаркі, дабке, танура, сема."]}, {"h": "Мистецтво світу за рік: порівнюємо регіони", "p": [], "ul": ["Африка — маски, скульптура, поліритмія, вплив на модернізм;", "Америка — доколумбові піраміди, хмарочоси, джаз, Голлівуд, поп-арт, карнавал;", "Далекий Схід — дерев’яні храми, живопис тушшю, порцеляна, сади, чайна церемонія;", "Індія — синтез архітектури і скульптури, рага, мудри, Боллівуд;", "Арабо-мусульманський світ — орнамент і каліграфія, килими, мініатюра, макам."]}], "f": "", "pr": ["Тест: 1) Ніша в мечеті, що вказує на Мекку, — … 2) Найдавніший кутастий стиль письма — … 3) Геометричний орнамент із зірок — … 4) Місто-центр кераміки в Туреччині — … 5) Ладова система арабської музики — … 6) Від якого інструмента походить лютня? 7) Танець дервішів — … 8) Палац у Гранаді — … 9) Автор перських мініатюр XV–XVI ст. — … 10) Кримськотатарський орнамент у списку ЮНЕСКО — …", "Підсумковий проєкт (на вибір): а) «Мистецька карта світу» — контурна карта з позначеними пам’ятками й символами кожного регіону; б) віртуальна екскурсія (презентація) «Мої 10 улюблених шедеврів року»; в) орнамент-«діалог культур», що поєднує мотиви різних регіонів; г) есе «Що об’єднує мистецтво різних народів?»."], "q": ["Яке мистецтво якого регіону вас найбільше вразило за рік і чому?", "Які спільні риси ви помітили в мистецтві різних регіонів?", "Як мистецтво різних культур впливало одне на одного? Наведіть 3 приклади.", "Чому важливо знати й поважати мистецтво інших народів?"]}]}]}];
const LINKS = [];
const COLORS = {art:"var(--s-art)", zu:"var(--s-zu)", pe:"var(--s-pe)", tech:"var(--s-tech)"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("yasno-quiz") || "{}"); } catch(e){ return {}; } },
  set(o){ try { localStorage.setItem("yasno-quiz", JSON.stringify(o)); } catch(e){} }
};
let results = store.get();

// flatten
const LES = {};
DATA.forEach(s => { s.flat = []; s.themes.forEach((t, ti) => t.lessons.forEach((l, li) => {
  l.id = s.id + "-" + s.flat.length; l.subj = s; l.theme = t; l.ti = ti; s.flat.push(l); LES[l.id] = l; })); });

let cur = { s: DATA[0].id, id: DATA[0].flat[0].id };
if (DATA.length === 1) document.getElementById("tabs").hidden = true;
try { const h = location.hash.slice(1); if (LES[h]) cur = { s: LES[h].subj.id, id: h }; else { const last = localStorage.getItem("yasno-last"); if (last && LES[last]) cur = { s: LES[last].subj.id, id: last }; } } catch(e){}

const tabs = document.getElementById("tabs");
DATA.forEach(s => {
  const b = document.createElement("button");
  b.className = "tab"; b.role = "tab"; b.style.setProperty("--c", COLORS[s.id]);
  b.innerHTML = "<i></i>" + esc(s.short); b.dataset.s = s.id;
  b.onclick = () => { if (cur.s !== s.id) open(s.flat[0].id); };
  tabs.appendChild(b);
});
(typeof LINKS !== "undefined" ? LINKS : []).forEach(x => {
  const a = document.createElement("a");
  a.className = "tab"; a.href = x.href; a.style.setProperty("--c", x.c);
  a.innerHTML = "<i></i>" + esc(x.name) + ' <span aria-hidden="true">↗</span>';
  a.title = "Відкрити курс «" + x.name + "»";
  tabs.appendChild(a);
});

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = t => t.toLowerCase().replace(/[«»"()]/g, "").trim();

function makeQuiz(l){
  if (l.qz) return shuffle(l.qz).slice(0, 5).map(x => ({ q: x.q, sub: "", why: x.why || "", opts: shuffle(x.o.map((o, j) => [o, j === x.a])) }));
  const s = l.subj;
  const uniq = arr => { const seen = new Set(); return arr.filter(([t]) => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const themeTerms = uniq(l.theme.lessons.flatMap(x => x.terms));
  const subjTerms = uniq(s.flat.flatMap(x => x.terms));
  let pool = shuffle(uniq(l.terms));
  if (pool.length < 5) pool = pool.concat(shuffle(themeTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  if (pool.length < 5) pool = pool.concat(shuffle(subjTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  pool = pool.slice(0, 5);
  return pool.map(([term, def], i) => {
    const others = shuffle(themeTerms.filter(t => norm(t[0]) !== norm(term) && t[1] !== def));
    let dis = others.slice(0, 3);
    if (dis.length < 3) dis = dis.concat(shuffle(subjTerms.filter(t => norm(t[0]) !== norm(term) && !dis.includes(t))).slice(0, 3 - dis.length));
    const byDef = i % 2 === 1;
    const opts = shuffle([[byDef ? term : def, true], ...dis.map(d => [byDef ? d[0] : d[1], false])]);
    return byDef
      ? { q: "Який термін відповідає визначенню?", sub: def, opts }
      : { q: "Що означає термін «" + term + "»?", sub: "", opts };
  });
}

function renderToc(){
  const s = DATA.find(x => x.id === cur.s);
  document.documentElement.style.setProperty("--subj", COLORS[s.id]);
  [...tabs.children].forEach(b => b.setAttribute("aria-selected", b.dataset.s === s.id));
  const qv = norm(document.getElementById("search").value || "");
  const toc = document.getElementById("toc"); toc.innerHTML = "";
  let shown = 0;
  s.themes.forEach(t => {
    const ls = t.lessons.filter(l => !qv || norm(l.t).includes(qv) || l.terms.some(x => norm(x[0]).includes(qv)));
    if (!ls.length) return;
    const d = document.createElement("div"); d.className = "theme";
    d.innerHTML = "<h3>" + esc(t.name) + "</h3>";
    ls.forEach(l => {
      shown++;
      const r = results[l.id];
      const b = document.createElement("button"); b.className = "les";
      b.setAttribute("aria-current", l.id === cur.id);
      const no = s.id === "zu" ? "№ " + l.n : l.n;
      b.innerHTML = '<span class="no">' + esc(no) + '</span><span class="tt">' + esc(l.t) + '</span>' +
        (r ? '<span class="st ' + (r >= 4 ? "done" : "part") + '">' + r + "/5</span>" : "");
      b.onclick = () => open(l.id);
      d.appendChild(b);
    });
    toc.appendChild(d);
  });
  if (!shown) toc.innerHTML = '<p class="empty">Нічого не знайдено. Спробуйте інше слово.</p>';
  const ql = s.flat.filter(l => !l.noquiz), done = ql.filter(l => (results[l.id] || 0) >= 4).length;
  document.getElementById("progTxt").textContent = done + " / " + ql.length;
  document.getElementById("progBar").style.width = (100 * done / ql.length) + "%";
}

function renderLesson(){
  const l = LES[cur.id], s = l.subj;
  const A = document.getElementById("art");
  let h = '<div class="eyebrow">' + esc(s.name) + " · " + esc(l.theme.name) + "</div>";
  h += "<h1>" + esc(l.t) + "</h1><div class=\"meta\">";
  h += '<span class="chip">' + (s.id === "zu" ? "Заняття " : s.id === "pe" ? "Конспект " : s.id === "tech" ? "Тема " : "Урок ") + esc(l.n) + "</span>";
  if (l.noquiz) h += '<span class="chip">Творчий проєкт</span>';
  if (l.book) h += '<a class="chip" href="' + esc(l.book.href) + '" target="_blank" rel="noopener">' + esc(l.book.label) + ' ↗</a>';
  if (l.k) h += '<span class="chip">Уроки за КТП: ' + esc(l.k.replace(/^Уроки за КТП:\s*/, "")) + "</span>";
  h += "</div>";
  if (l.g) h += '<div class="goal"><b>Мета.</b>' + esc(l.g) + "</div>";
  if (l.terms.length && !l.bl) { h += "<h2>Ключові поняття</h2><dl class=\"terms\">" + l.terms.map(([t, d]) => "<dt>" + esc(t) + "</dt><dd>" + esc(d) + "</dd>").join("") + "</dl>"; }
  if (l.bl) {
    h += '<div class="prose">';
    const li = ([a, b]) => "<li>" + (a ? "<b>" + esc(a) + "</b> " : "") + esc(b) + "</li>";
    l.bl.forEach(b => {
      if (b.k === "h2") h += "</div><h2>" + esc(b.v) + '</h2><div class="prose">';
      else if (b.k === "h3") h += "<h3>" + esc(b.v) + "</h3>";
      else if (b.k === "p") h += "<p>" + esc(b.v) + "</p>";
      else if (b.k === "lead") h += '<p class="lead">' + esc(b.v) + "</p>";
      else if (b.k === "call") h += '<div class="call">' + esc(b.v) + "</div>";
      else if (b.k === "fig") h += '<figure class="fig"><img src="' + b.src + '" alt="' + esc(b.alt) + '" loading="lazy"></figure>';
      else if (b.k === "ul") h += "<ul>" + b.v.map(li).join("") + "</ul>";
      else if (b.k === "ol" || b.k === "crit") h += "<ol>" + b.v.map(li).join("") + "</ol>";
      else if (b.k === "steps") h += '<ol class="steps">' + b.v.map(([a, c]) => "<li><b>" + esc(a) + "</b>" + esc(c) + "</li>").join("") + "</ol>";
      else if (b.k === "terms") h += '<ul class="tgrid">' + b.v.map(([a, c]) => "<li><b>" + esc(a) + "</b>" + esc(c) + "</li>").join("") + "</ul>";
      else if (b.k === "cards") h += '<div class="cardsx">' + b.v.map(c => '<article class="cardx"><img src="' + c.src + '" alt="' + esc(c.alt) + '" loading="lazy"><div>' + (c.h ? "<h4>" + esc(c.h) + "</h4>" : "") + c.v.map(([a, d]) => "<p>" + (a ? "<b>" + esc(a) + "</b>" : "") + esc(d) + "</p>").join("") + "</div></article>").join("") + "</div>";
    });
    h += "</div>";
  }
  if (l.th.length) {
    h += "<h2>" + (l.terms.length ? "Теоретичний матеріал" : "Узагальнення") + '</h2><div class="prose">';
    l.th.forEach(b => {
      if (b.h) h += "<h4>" + esc(b.h) + "</h4>";
      b.p.forEach(p => h += "<p>" + esc(p) + "</p>");
      if (b.ul.length) h += "<ul>" + b.ul.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
    });
    h += "</div>";
  }
  if (l.f) h += '<div class="fact"><b>Цікаво знати</b>' + esc(l.f) + "</div>";
  if (l.pr.length) h += '<h2>Практичне завдання</h2><div class="prose"><ul class="tasks">' + l.pr.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
  if (l.q.length) h += '<h2>Питання для самоперевірки</h2><div class="prose"><ol>' + l.q.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol></div>";
  if (!l.noquiz) h += '<section class="quiz" id="quiz"></section>';
  A.innerHTML = h;
  A.querySelectorAll(".fig img,.cardx img").forEach(im => im.onclick = () => {
    const d = document.createElement("div"); d.className = "lb"; d.innerHTML = '<img alt="">'; d.firstChild.src = im.src; d.firstChild.alt = im.alt;
    d.onclick = () => d.remove(); document.body.appendChild(d); });
  if (!l.noquiz) renderQuiz(l);
  const i = s.flat.indexOf(l), pv = s.flat[i - 1], nx = s.flat[i + 1];
  const P = document.getElementById("pager"); P.innerHTML = "";
  [[pv, "← Попередній"], [nx, "Наступний →"]].forEach(([x, lab]) => { if (!x) return;
    const b = document.createElement("button"); b.innerHTML = esc(lab) + "<b>" + esc(x.t) + "</b>"; b.onclick = () => open(x.id); P.appendChild(b); });
}

function renderQuiz(l){
  const Q = makeQuiz(l), box = document.getElementById("quiz");
  const prev = results[l.id];
  let h = '<div class="qhead"><h2>Тест · 5 завдань</h2><p>' + (prev ? "Найкращий результат: " + prev + " з 5" : "Оберіть одну відповідь у кожному завданні") + "</p></div><form id=\"qf\">";
  Q.forEach((q, i) => {
    h += '<div class="q"><div class="qt"><span>' + (i + 1) + ".</span><div>" + esc(q.q) + (q.sub ? "<br><em>" + esc(q.sub) + "</em>" : "") + '</div></div><div class="opts">';
    q.opts.forEach(([t], j) => h += '<label class="opt"><input type="radio" name="q' + i + '" id="q' + i + "o" + j + '" value="' + j + '"><span>' + esc(t) + "</span></label>");
    h += "</div></div>";
  });
  h += '<div class="qfoot"><button class="btn" type="submit" id="chk" disabled>Перевірити</button><button class="btn ghost" type="button" id="again">Інші питання</button><span class="score" id="sc" aria-live="polite"></span></div></form>';
  box.innerHTML = h;
  const f = document.getElementById("qf"), chk = document.getElementById("chk");
  f.addEventListener("change", () => { chk.disabled = Q.some((_, i) => !f["q" + i] || ![...f.querySelectorAll('[name="q' + i + '"]')].some(x => x.checked)); });
  document.getElementById("again").onclick = () => renderQuiz(l);
  f.addEventListener("submit", e => {
    e.preventDefault(); if (f.classList.contains("checked")) return;
    let ok = 0;
    Q.forEach((q, i) => {
      const inputs = [...f.querySelectorAll('[name="q' + i + '"]')];
      inputs.forEach((inp, j) => { inp.disabled = true; const lab = inp.parentElement;
        if (q.opts[j][1]) lab.classList.add("right"); else if (inp.checked) lab.classList.add("wrong"); });
      if (q.why) { const w = document.createElement("p"); w.className = "why"; w.textContent = q.why; inputs[0].closest(".opts").after(w); }
      const sel = inputs.findIndex(x => x.checked); if (sel >= 0 && q.opts[sel][1]) ok++;
    });
    f.classList.add("checked"); chk.disabled = true;
    const sc = document.getElementById("sc");
    sc.className = "score " + (ok >= 4 ? "good" : ok >= 3 ? "mid" : "low");
    sc.textContent = "Результат: " + ok + " з 5. " + (ok === 5 ? "Чудово!" : ok >= 4 ? "Добре засвоєно." : ok >= 3 ? "Повторіть ключові поняття." : "Перечитайте конспект і спробуйте ще раз.");
    if (ok > (results[l.id] || 0)) { results[l.id] = ok; store.set(results); }
    renderToc();
  });
}

function open(id){
  cur = { s: LES[id].subj.id, id };
  try { localStorage.setItem("yasno-last", id); } catch(e){}
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  renderToc(); renderLesson();
  document.getElementById("side").classList.remove("open");
  document.getElementById("tocBtn").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}
document.getElementById("search").addEventListener("input", renderToc);
document.getElementById("tocBtn").onclick = e => { const sd = document.getElementById("side"); const o = sd.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
open(cur.id);
</script>
