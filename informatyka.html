<style>
/* Layout: sticky header, left table of contents (КТП structure), one subsection open at a time; code is the hero material */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E7EAF0; --ink:#1A1F2A; --muted:#596173; --line:#D8DDE6;
  --acc:#2B57B8; --acc-soft:#E3EAFA; --gold:#C98A0B; --gold-soft:#FBF1D9;
  --code-bg:#1E2433; --code-ink:#E6E9F0; --code-com:#8A93A8; --code-str:#F2C46B; --code-kw:#8FB4FF; --code-num:#7FD8B5;
  --ok:#24784A; --ok-soft:#E1F3E8; --bad:#B8362B; --bad-soft:#FBE6E3;
  --shadow:0 1px 2px rgba(20,25,40,.06),0 4px 16px rgba(20,25,40,.05);
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151B; --surface:#1B1F27; --sunk:#252A34; --ink:#E8EBF0; --muted:#A2AAB8; --line:#2E3440;
  --acc:#8CAEFF; --acc-soft:#1F2A45; --gold:#F0BE55; --gold-soft:#3A2F17;
  --code-bg:#0D1017; --ok:#62CF91; --ok-soft:#183324; --bad:#F2806F; --bad-soft:#3A1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1B1F27; --sunk:#252A34; --ink:#E8EBF0; --muted:#A2AAB8; --line:#2E3440;
  --acc:#8CAEFF; --acc-soft:#1F2A45; --gold:#F0BE55; --gold-soft:#3A2F17;
  --code-bg:#0D1017; --ok:#62CF91; --ok-soft:#183324; --bad:#F2806F; --bad-soft:#3A1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance;line-height:1.25}
code{font-family:var(--mono);font-size:.88em;background:var(--acc-soft);color:var(--acc);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.logo{font-family:var(--mono);font-weight:600;font-size:15px;background:var(--code-bg);color:var(--code-str);padding:5px 9px;border-radius:8px;flex:none}
.brand b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:block}
.brand small{color:var(--muted);font-size:13px;display:block;line-height:1.3}

.shell{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:32px;align-items:start}
nav.toc{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.toc-toggle{display:none}
.toc h4{margin:18px 0 6px;font:600 11px/1.3 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.toc a,.toc .soon{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35}
.toc a:hover{background:var(--sunk)}
.toc a[aria-current="page"]{background:var(--acc-soft);color:var(--acc);font-weight:600}
.toc .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:26px}
.toc .t{flex:1}
.toc .st{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.toc .st.done{background:var(--ok-soft);color:var(--ok)}
.toc .soon{color:var(--muted)}
.toc .soon .st{background:transparent;border:1px dashed var(--line)}

main{min-width:0}
.view{max-width:800px}
.eyebrow{font:600 12px/1.3 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--acc);margin:0 0 10px}
.view>h1{font-family:var(--display);font-weight:700;font-size:clamp(25px,4vw,34px);letter-spacing:-.02em;margin:0 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.safety{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--gold-soft);font-size:14.5px;margin:0 0 22px}
.safety b{color:var(--gold)}
.lessons-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.lessons-nav button{font:600 13.5px/1.2 var(--body);padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lessons-nav button:hover{border-color:var(--acc);color:var(--acc)}

.lesson{margin-top:40px;scroll-margin-top:84px}
.lesson-head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
.lesson-head .num{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.lesson-head h2{margin:0;font-family:var(--display);font-weight:500;font-size:21px;letter-spacing:-.01em}
.prose h3{font-size:17px;margin:24px 0 8px}
.prose p{margin:0 0 14px;max-width:68ch}
.prose ul,.prose ol{margin:0 0 16px;padding-left:22px;max-width:68ch}
.prose li{margin:6px 0}
.prose li::marker{color:var(--acc)}
.note{background:var(--acc-soft);border-radius:12px;padding:12px 16px;margin:16px 0;font-size:15px}
.note code{background:var(--surface)}
pre.code{position:relative;background:var(--code-bg);color:var(--code-ink);font:14px/1.6 var(--mono);padding:40px 18px 16px;border-radius:12px;overflow-x:auto;margin:14px 0 18px;tab-size:4}
pre.code .com{color:var(--code-com)} pre.code .str{color:var(--code-str)} pre.code .kw{color:var(--code-kw)} pre.code .num{color:var(--code-num)} pre.code .pr{color:var(--code-com)}
.copy{position:absolute;top:8px;right:8px;font:600 12px var(--body);padding:4px 9px;border-radius:7px;border:1px solid #3A4256;background:#2A3144;color:#C8CEDB;cursor:pointer}
.copy:hover{color:#fff}
.tbl{overflow-x:auto;margin:12px 0 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px}
.tbl th{text-align:left;background:var(--sunk);font-weight:600;padding:9px 12px;white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl code{white-space:nowrap}

/* practice */
.block{margin-top:44px}
.block>h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0 0 12px}
.tasks{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:t}
.tasks li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 52px;position:relative;margin:0}
.tasks li::before{counter-increment:t;content:counter(t);position:absolute;left:16px;top:14px;width:24px;height:24px;border-radius:7px;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:13px;display:grid;place-items:center}
.tasks details{margin-top:8px}
.tasks summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;width:max-content}
.tasks details pre.code{margin-bottom:4px}
.tasks .ans{margin-top:8px}

/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px clamp(16px,3vw,28px) 26px;box-shadow:var(--shadow)}
.quiz-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:6px}
.quiz-head h2{margin:0;font-family:var(--display);font-weight:500;font-size:20px;margin-right:auto}
.score{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:4px 0 18px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.q{padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q p{margin:0 0 10px;font-weight:600}
.q p .qn{color:var(--acc);margin-right:6px;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:10px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .l{font-weight:700;color:var(--muted);min-width:18px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .l{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .l{color:var(--bad)}
.opt.dim{opacity:.55}
.fb{margin-top:8px;font-size:14px;font-weight:600}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.result{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acc-soft);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.result b{font-family:var(--display);font-size:22px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.result span{flex:1;min-width:180px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1.2 var(--body);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--surface)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:48%;min-width:0}
.pager a:hover{border-color:var(--acc)}
.pager a small{color:var(--muted);font-size:12.5px}
.pager a b{font-size:14.5px}
.pager a.next{margin-left:auto;text-align:right}

/* home */
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,42px);letter-spacing:-.025em;margin:0 0 12px}
.hero p{color:var(--muted);max-width:62ch;margin:0 0 18px;font-size:17px}
.hero pre.code{max-width:520px;margin:0 0 22px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 0;margin-top:28px}
.plan h2{font-family:var(--display);font-weight:500;font-size:18px;margin:14px 20px 6px}
.plan a,.plan div.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 20px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.plan a:hover{background:var(--acc-soft)}
.plan .n{font-family:var(--mono);font-weight:600;color:var(--acc)}
.plan .row{color:var(--muted)} .plan .row .n{color:var(--muted)}
.plan .k{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.plan .k.done{color:var(--ok)}
.plan .lsn{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.reset{margin-top:22px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--acc);font:inherit;text-decoration:underline;cursor:pointer}

@media (max-width:860px){
  .top .btn .lbl{display:none}
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 56px}
  nav.toc{position:static;max-height:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 10px 10px}
  .toc-toggle{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;padding:10px 4px;font:600 15px var(--body);color:var(--ink);cursor:pointer;text-align:left;gap:8px}
  .toc-toggle svg{width:18px;height:18px;transition:transform .2s;flex:none}
  nav.toc.open .toc-toggle svg{transform:rotate(180deg)}
  nav.toc:not(.open) .toc-list{display:none}
  .brand small{display:none}
  .pager a{max-width:100%;flex:1 1 220px}
  .plan a,.plan div.row{grid-template-columns:36px minmax(0,1fr);padding-inline:14px}
  .plan .k{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = {"SECTIONS":[{"id":"s11","topic":1,"code":"1.1","title":"Структура і способи виконання проєктів мовою Python","lessons":[{"n":1,"title":"Мова програмування. Класифікація та складові мов програмування","blocks":[["p","**Мова програмування** — це формальна мова, якою записують алгоритми так, щоб їх міг виконати комп'ютер. Програма, написана такою мовою, називається **вихідним кодом**."],["h","Складові мови програмування"],["ul",["**Алфавіт** — набір символів, які можна використовувати: латинські літери, цифри, знаки `+ - * / = ( ) :` тощо.","**Синтаксис** — правила запису команд. Наприклад, у Python після `if` умови обов'язково ставиться двокрапка.","**Семантика** — зміст команд, тобто що саме зробить комп'ютер, виконавши їх."]],["h","Класифікація мов програмування"],["table",["Ознака","Види","Приклади"],[["За рівнем","Машинні та низькорівневі (близькі до команд процесора); високорівневі (близькі до людської мови)","Асемблер; Python, Java, C++"],["За способом виконання","Компільовані; інтерпретовані; змішані (через байт-код)","C, C++, Go; Python, JavaScript; Java, C#"],["За парадигмою","Процедурні, об'єктно-орієнтовані, функціональні, логічні","Pascal; Java; Haskell; Prolog"]]],["p","**Транслятор** перекладає програму з мови програмування на машинний код. Є два види трансляторів:"],["ul",["**Компілятор** перекладає всю програму одразу й створює виконуваний файл. Програма працює швидко, але після кожної зміни її треба компілювати знову.","**Інтерпретатор** читає й виконує програму рядок за рядком. Помилку видно одразу там, де вона виникла, але виконання повільніше."]],["h","Мова Python"],["p","Python створив нідерландський програміст **Гвідо ван Россум** у **1991 році**. Назву мова отримала на честь британського комедійного шоу «Monty Python's Flying Circus», а не змії."],["ul",["Python — **високорівнева, інтерпретована** мова, яка підтримує кілька парадигм (процедурну, об'єктно-орієнтовану, функціональну).","Має простий і читабельний синтаксис: блоки коду виділяються **відступами**, а не дужками.","Працює на Windows, macOS, Linux, тобто є **кросплатформною**.","Має тисячі готових бібліотек для вебу, аналізу даних, штучного інтелекту, ігор, автоматизації."]]]},{"n":2,"title":"Особливості середовища розробки","blocks":[["p","**Середовище розробки (IDE)** — програма, яка об'єднує все потрібне для написання й запуску коду."],["h","Що є в середовищі розробки"],["ul",["**Редактор коду** з підсвічуванням синтаксису та автоматичними відступами.","**Автодоповнення** — підказки назв команд і змінних під час введення.","**Запуск програми** однією кнопкою або клавішею (зазвичай F5).","**Консоль** — вікно, де видно результат роботи програми та повідомлення про помилки.","**Налагоджувач (debugger)** — інструмент для покрокового виконання програми й перегляду значень змінних."]],["h","Популярні середовища для Python"],["table",["Середовище","Особливості"],[["IDLE","Встановлюється разом із Python. Просте, має інтерактивну консоль і редактор файлів."],["Thonny","Створене для початківців. Зручно показує покрокове виконання та значення змінних."],["Visual Studio Code","Універсальний редактор. Для Python потрібно встановити розширення Python."],["PyCharm","Професійне середовище з потужними інструментами для великих проєктів."],["Онлайн-середовища","Replit, Google Colab, OnlineGDB: працюють у браузері, нічого встановлювати не потрібно."]]],["note","Встановлюючи Python із сайту python.org, обов'язково поставте позначку **Add python.exe to PATH**. Тоді Python можна буде запускати з командного рядка."]]},{"n":3,"title":"Структура програмного проєкту","blocks":[["p","**Програмний проєкт** — це сукупність файлів, які разом утворюють програму. Невелика програма може складатися з одного файлу, а великий проєкт містить десятки файлів, розкладених по папках."],["h","Типовий склад проєкту"],["code","my_project/\n    main.py            # головний файл, з якого запускають програму\n    utils.py           # власний модуль із допоміжними функціями\n    data/\n        scores.txt     # файли з даними\n    images/\n        logo.png       # ресурси: зображення, звуки\n    requirements.txt   # список бібліотек, потрібних проєкту\n    README.md          # опис проєкту"],["h","Структура файлу з кодом"],["p","Код у файлі `.py` прийнято впорядковувати в такій послідовності:"],["ol",["Коментар з описом програми.","Підключення модулів (`import`).","Константи: значення, які не змінюються.","Функції.","Основна частина програми."]],["code","# Програма обчислює площу кола\nimport math\n\nPRECISION = 2\n\ndef circle_area(r):\n    return math.pi * r ** 2\n\nif __name__ == \"__main__\":\n    radius = float(input(\"Радіус: \"))\n    print(\"Площа:\", round(circle_area(radius), PRECISION))"],["p","Рядок `if __name__ == \"__main__\":` означає «виконати цю частину лише тоді, коли файл запущено напряму». Якщо файл підключити як модуль до іншої програми, цей блок не виконається."],["note","У Python **відступи мають значення**. Усі команди одного блоку записуються з однаковим відступом, стандартно 4 пробіли."]]},{"n":4,"title":"Виконання програмного коду в інтерактивному режимі","blocks":[["p","**Інтерактивний режим** (REPL) — це режим, у якому Python виконує кожну команду одразу після натискання Enter і показує результат. Його відкривають у IDLE, у консолі Thonny або командою `python` у терміналі."],["p","Ознака інтерактивного режиму — **запрошення** `>>>`. Після нього вводять команду."],["code",">>> 2 + 3 * 4\n14\n>>> 10 / 4\n2.5\n>>> name = \"Оля\"\n>>> \"Привіт, \" + name\n'Привіт, Оля'\n>>> type(3.14)\n\u003cclass 'float'>"],["h","Для чого зручний інтерактивний режим"],["ul",["Швидко перевірити, як працює команда чи функція.","Використати Python як калькулятор.","Переглянути довідку: `help(print)`.","Дізнатися тип значення: `type(5)`."]],["p","**Недолік:** команди ніде не зберігаються. Після закриття вікна все введене зникає. Для програм, які потрібно зберегти й запускати повторно, використовують файли."],["note","Вийти з інтерактивного режиму в терміналі можна командою `exit()`."]]},{"n":5,"title":"Виконання файлів програмного коду","blocks":[["p","**Файловий (скриптовий) режим** — програму записують у файл з розширенням `.py`, зберігають і запускають цілком."],["h","Як запустити файл"],["ul",["**IDLE**: File → New File, написати код, зберегти (Ctrl+S), натиснути **F5**.","**Thonny**: зберегти файл і натиснути зелену кнопку «Run» або **F5**.","**VS Code**: натиснути трикутник «Run Python File» угорі праворуч.","**Термінал**: перейти в папку з файлом і ввести `python hello.py`."]],["code","# hello.py\nname = input(\"Як тебе звати? \")\nprint(\"Привіт,\", name)\nprint(\"Ласкаво просимо до світу Python!\")"],["p","Команди у файлі виконуються **зверху вниз**, одна за одною. Якщо в коді є помилка, Python зупиняє виконання й показує **повідомлення про помилку (traceback)**, де вказано номер рядка та тип помилки."],["table",["Помилка","Коли виникає"],[["`SyntaxError`","Порушено правила запису: пропущено дужку, лапку чи двокрапку."],["`IndentationError`","Неправильні відступи."],["`NameError`","Використано змінну чи функцію, якої не існує (часто через помилку в назві)."],["`TypeError`","Дію застосовано до значень невідповідного типу, наприклад `\"5\" + 3`."]]],["h","Порівняння режимів"],["table",["","Інтерактивний","Файловий"],[["Як виконується","Кожна команда окремо, одразу","Уся програма від початку до кінця"],["Збереження коду","Не зберігається","Зберігається у файлі .py"],["Вивід результату","Автоматично","Лише через `print()`"],["Для чого","Перевірки, обчислення, експерименти","Повноцінні програми"]]]]}],"practice":[{"task":"Відкрийте інтерактивний режим і обчисліть: `15 * 4 - 7`, `100 / 8`, `2 ** 10`. Запишіть результати.","answer":"`53`, `12.5`, `1024`."},{"task":"Створіть файл `about_me.py`, який виводить на екран ваше ім'я, клас і улюблений предмет (кожне з нового рядка). Запустіть його.","answer":"print(\"Мене звати Олена\")\nprint(\"Я навчаюся в 10 класі\")\nprint(\"Мій улюблений предмет — інформатика\")","code":true},{"task":"Знайдіть і виправте помилки в коді: `print(\"Привіт\"` та `Print(\"Python\")`.","answer":"У першому рядку бракує закривної дужки: `print(\"Привіт\")`. У другому `Print` написано з великої літери, а Python розрізняє регістр: `print(\"Python\")`."}],"quiz":[{"q":"Хто створив мову Python?","o":["Білл Гейтс","Гвідо ван Россум","Лінус Торвальдс","Джеймс Гослінг"],"a":1},{"q":"Як називаються правила запису команд мови програмування?","o":["Алфавіт","Семантика","Синтаксис","Транслятор"],"a":2},{"q":"До якого типу належить Python за способом виконання?","o":["Компільована","Інтерпретована","Машинна","Логічна"],"a":1,"why":"Інтерпретатор Python читає й виконує програму рядок за рядком."},{"q":"Який символ є запрошенням в інтерактивному режимі Python?","o":["$","#",">>>","//"],"a":2},{"q":"Яке розширення мають файли з кодом Python?","o":[".pt",".py",".pyt",".txt"],"a":1},{"q":"Якою клавішею запускають програму в IDLE та Thonny?","o":["F1","F5","F12","Enter"],"a":1},{"q":"Який інструмент дозволяє виконувати програму покроково й бачити значення змінних?","o":["Компілятор","Налагоджувач (debugger)","Автодоповнення","Підсвічування синтаксису"],"a":1},{"q":"Яка помилка виникне, якщо пропустити закривну дужку в `print(\"Hi\"`?","o":["NameError","TypeError","SyntaxError","ValueError"],"a":2}]},{"id":"s12","topic":1,"code":"1.2","title":"Оператори, вирази і засоби опрацювання чисел","lessons":[{"n":6,"title":"Основні елементи мови програмування Python","blocks":[["h","Ідентифікатори"],["p","**Ідентифікатор** — це ім'я змінної, функції чи модуля. Правила:"],["ul",["складається з латинських літер, цифр і знака `_`;","не може починатися з цифри: `2x` — неправильно, `x2` — правильно;","**регістр має значення**: `age`, `Age` і `AGE` — три різні імена;","не може збігатися з ключовим словом."]],["p","Добре ім'я пояснює, що зберігає змінна: `price`, `student_count`, а не `a1` чи `xx`."],["h","Ключові слова"],["p","**Ключові слова** — зарезервовані слова мови, які мають особливе значення. Наприклад: `if`, `else`, `elif`, `for`, `while`, `def`, `return`, `import`, `and`, `or`, `not`, `True`, `False`, `None`."],["h","Змінні та присвоєння"],["p","**Змінна** — іменована ділянка пам'яті, що зберігає значення. Значення присвоюють знаком `=`:"],["code","age = 16\nname = \"Андрій\"\na, b = 3, 7      # множинне присвоєння\nx = y = 0        # одне значення двом змінним"],["h","Основні типи даних"],["table",["Тип","Назва","Приклади"],[["`int`","Ціле число","`5`, `-12`, `0`"],["`float`","Дійсне число (з крапкою)","`3.14`, `-0.5`, `2.0`"],["`str`","Рядок (текст)","`\"Привіт\"`, `'10'`"],["`bool`","Логічне значення","`True`, `False`"]]],["p","Дізнатися тип значення можна функцією `type()`: `type(2.0)` поверне `\u003cclass 'float'>`."],["h","Коментарі, введення та виведення"],["code","# Це коментар: Python його не виконує\nname = input(\"Введіть ім'я: \")   # введення з клавіатури\nprint(\"Привіт,\", name)            # виведення на екран\nprint(\"a\", \"b\", \"c\", sep=\"-\")      # a-b-c"]]},{"n":7,"title":"Поняття про перетворення типів даних","blocks":[["p","Функція `input()` **завжди повертає рядок**, навіть якщо користувач ввів число. Тому перед обчисленнями рядок треба перетворити на число."],["code","a = input(\"Перше число: \")   # користувач ввів 5\nb = input(\"Друге число: \")   # користувач ввів 3\nprint(a + b)                 # 53 — рядки «склеїлися»\n\na = int(a)\nb = int(b)\nprint(a + b)                 # 8"],["h","Функції перетворення"],["table",["Функція","Що робить","Приклад"],[["`int()`","Перетворює на ціле число (дробову частину відкидає)","`int(\"42\")` → `42`, `int(7.9)` → `7`"],["`float()`","Перетворює на дійсне число","`float(\"2.5\")` → `2.5`, `float(3)` → `3.0`"],["`str()`","Перетворює на рядок","`str(15)` → `\"15\"`"],["`bool()`","Перетворює на логічне значення","`bool(0)` → `False`, `bool(5)` → `True`"]]],["p","Найчастіше введення і перетворення записують в одному рядку:"],["code","n = int(input(\"Кількість учнів: \"))\nprice = float(input(\"Ціна: \"))"],["h","Автоматичне (неявне) перетворення"],["p","Якщо в одному виразі є `int` і `float`, результат буде `float`: `3 + 2.5` дорівнює `5.5`. А от рядок і число Python автоматично не поєднує: `\"Вік: \" + 16` дає помилку `TypeError`. Треба писати `\"Вік: \" + str(16)`."],["note","Якщо рядок не схожий на число, перетворення неможливе: `int(\"abc\")` спричинить помилку `ValueError`. Також `int(\"2.5\")` дає помилку, бо в рядку дійсне число. Правильно: `int(float(\"2.5\"))`."]]},{"n":8,"title":"Оператори і вирази. Логічні вирази. Таблиці істинності","blocks":[["p","**Вираз** — це запис, що складається з операндів (значень, змінних) і операторів та має певне значення. Наприклад, `a * 2 + 1`."],["h","Арифметичні оператори"],["table",["Оператор","Дія","Приклад","Результат"],[["`+`","Додавання","`7 + 2`","`9`"],["`-`","Віднімання","`7 - 2`","`5`"],["`*`","Множення","`7 * 2`","`14`"],["`/`","Ділення (результат завжди float)","`7 / 2`","`3.5`"],["`//`","Цілочисельне ділення","`7 // 2`","`3`"],["`%`","Остача від ділення","`7 % 2`","`1`"],["`**`","Піднесення до степеня","`2 ** 3`","`8`"]]],["note","Остачу `%` часто використовують, щоб перевірити парність: число `n` парне, якщо `n % 2 == 0`. Останню цифру числа дає `n % 10`."],["h","Оператори порівняння"],["p","`==` (дорівнює), `!=` (не дорівнює), `\u003c`, `>`, `\u003c=`, `>=`. Результат порівняння — логічне значення `True` або `False`. Не плутайте `=` (присвоєння) і `==` (порівняння)."],["h","Логічні оператори"],["ul",["`and` («і») — істина, лише коли **обидві** умови істинні.","`or` («або») — істина, коли **хоча б одна** умова істинна.","`not` («не») — змінює значення на протилежне."]],["table",["A","B","A and B","A or B","not A"],[["True","True","True","True","False"],["True","False","False","True","False"],["False","True","False","True","True"],["False","False","False","False","True"]]],["code","age = 16\nprint(age >= 14 and age \u003c= 18)   # True\nprint(age \u003c 10 or age > 60)      # False\nprint(not age == 16)             # False\nprint(14 \u003c= age \u003c= 18)           # True — подвійне порівняння"],["h","Пріоритет операцій (від вищого до нижчого)"],["ol",["Дужки `( )`","Піднесення до степеня `**`","Унарний мінус `-x`","`*`, `/`, `//`, `%`","`+`, `-`","Порівняння `==`, `!=`, `\u003c`, `>`, `\u003c=`, `>=`","`not`","`and`","`or`"]],["p","Наприклад, `2 + 3 * 4` дорівнює `14`, а `(2 + 3) * 4` дорівнює `20`. Зверніть увагу: `-2 ** 2` дорівнює `-4`, бо степінь виконується раніше за мінус."],["h","Скорочене присвоєння"],["code","x = 10\nx += 5    # те саме, що x = x + 5  → 15\nx -= 3    # x = x - 3  → 12\nx *= 2    # x = x * 2  → 24\nx //= 5   # x = x // 5 → 4"]]},{"n":9,"title":"Модулі, функції і методи для опрацювання числових даних","blocks":[["h","Вбудовані функції"],["p","Ці функції доступні без підключення модулів:"],["table",["Функція","Що робить","Приклад"],[["`abs(x)`","Модуль числа","`abs(-7)` → `7`"],["`round(x, n)`","Округлення до n знаків після коми","`round(3.14159, 2)` → `3.14`"],["`min()`, `max()`","Найменше / найбільше значення","`max(4, 9, 2)` → `9`"],["`pow(x, y)`","Степінь, як `x ** y`","`pow(2, 5)` → `32`"],["`divmod(a, b)`","Неповна частка й остача разом","`divmod(17, 5)` → `(3, 2)`"]]],["note","`round()` округлює «до парного», коли число рівно посередині: `round(2.5)` дає `2`, а `round(3.5)` дає `4`."],["h","Модуль math"],["p","**Модуль** — файл із готовими функціями. Щоб ними скористатися, модуль треба підключити командою `import`."],["code","import math\n\nprint(math.sqrt(16))       # 4.0 — квадратний корінь\nprint(math.pi)             # 3.141592653589793\nprint(math.floor(4.7))     # 4 — округлення вниз\nprint(math.ceil(4.2))      # 5 — округлення вгору\nprint(math.factorial(5))   # 120\nprint(math.gcd(12, 18))    # 6 — найбільший спільний дільник\nprint(math.sin(math.pi / 2))  # 1.0 — кути задають у радіанах"],["p","Можна підключити лише потрібні функції. Тоді назву модуля перед ними писати не треба:"],["code","from math import sqrt, pi\nprint(sqrt(25))   # 5.0"],["h","Модуль random"],["code","import random\n\nprint(random.randint(1, 6))   # випадкове ціле від 1 до 6 включно\nprint(random.random())        # випадкове дійсне від 0 до 1"],["h","Методи чисел і форматування"],["p","**Метод** — функція, яку викликають через крапку після значення. Наприклад, `(2.0).is_integer()` повертає `True`, бо 2.0 — ціле число."],["p","Щоб вивести число з потрібною кількістю знаків після коми, використовують **f-рядки**:"],["code","x = 2 / 3\nprint(f\"Результат: {x:.2f}\")   # Результат: 0.67"],["h","Приклад програми"],["code","# Гіпотенуза прямокутного трикутника\nimport math\n\na = float(input(\"Катет a: \"))\nb = float(input(\"Катет b: \"))\nc = math.sqrt(a ** 2 + b ** 2)\nprint(f\"Гіпотенуза: {c:.2f}\")"],["note","Цим уроком завершується підрозділ 1.2. Наприкінці проводиться тематична атестація."]]}],"practice":[{"task":"Напишіть програму, яка запитує два цілих числа і виводить їх суму, різницю, добуток, частку, цілу частку та остачу.","answer":"a = int(input(\"a = \"))\nb = int(input(\"b = \"))\nprint(\"Сума:\", a + b)\nprint(\"Різниця:\", a - b)\nprint(\"Добуток:\", a * b)\nprint(\"Частка:\", a / b)\nprint(\"Ціла частка:\", a // b)\nprint(\"Остача:\", a % b)","code":true},{"task":"Користувач вводить тризначне число. Виведіть суму його цифр. Підказка: використайте `//` і `%`.","answer":"n = int(input(\"Тризначне число: \"))\nsotni = n // 100\ndesyatky = n // 10 % 10\nodynytsi = n % 10\nprint(\"Сума цифр:\", sotni + desyatky + odynytsi)","code":true},{"task":"Обчисліть площу кола за введеним радіусом і виведіть результат з двома знаками після коми.","answer":"import math\nr = float(input(\"Радіус: \"))\nprint(f\"Площа: {math.pi * r ** 2:.2f}\")","code":true},{"task":"Запишіть логічний вираз, який дорівнює `True`, якщо число `x` парне і додатне.","answer":"`x % 2 == 0 and x > 0`"}],"quiz":[{"q":"Яке ім'я змінної є правильним у Python?","o":["2name","my-name","my_name","for"],"a":2,"why":"Ім'я не може починатися з цифри, містити дефіс або збігатися з ключовим словом."},{"q":"Який тип має значення `3.0`?","o":["int","float","str","bool"],"a":1},{"q":"Що поверне функція `input()`, якщо користувач введе 25?","o":["Ціле число 25","Дійсне число 25.0","Рядок \"25\"","Помилку"],"a":2,"why":"input() завжди повертає рядок."},{"q":"Чому дорівнює `17 // 5`?","o":["3.4","3","2","4"],"a":1},{"q":"Чому дорівнює `17 % 5`?","o":["3","2","3.4","0"],"a":1},{"q":"Яке значення має вираз `True and False`?","o":["True","False","None","Помилка"],"a":1},{"q":"Чому дорівнює `2 + 3 * 2 ** 2`?","o":["14","20","100","38"],"a":0,"why":"Спочатку 2 ** 2 = 4, потім 3 * 4 = 12, потім 2 + 12 = 14."},{"q":"Що виведе `print(int(7.9))`?","o":["8","7","7.9","Помилку"],"a":1,"why":"int() відкидає дробову частину, а не округлює."},{"q":"Яка команда правильно обчислює квадратний корінь з 16?","o":["sqrt(16) без імпорту","math.sqrt(16) після import math","math.root(16)","16 ** 2"],"a":1},{"q":"Що виведе `print(\"5\" + \"3\")`?","o":["8","53","Помилку","\"8\""],"a":1,"why":"Знак + для рядків їх склеює."}]},{"id":"s13","topic":1,"code":"1.3","title":"Реалізація базових алгоритмічних конструкцій","lessons":[{"n":10,"title":"Умовний оператор мовою програмування","blocks":[["p","**Розгалуження** — алгоритмічна конструкція, у якій виконання тих чи інших дій залежить від умови. У Python розгалуження записують за допомогою **умовного оператора** `if`."],["code","if умова:\n    команди   # виконуються, якщо умова істинна"],["p","**Умова** — логічний вираз, значення якого `True` або `False`. Найчастіше це порівняння: `x > 0`, `n % 2 == 0`, `name == \"Оля\"`."],["h","Правила запису"],["ul",["Після умови обов'язково ставиться **двокрапка** `:`.","Команди, що належать до `if`, записуються з **відступом** (4 пробіли). Відступ показує, де закінчується блок.","Умову можна складати з кількох частин за допомогою `and`, `or`, `not`."]],["code","age = int(input(\"Скільки тобі років? \"))\nif age >= 14:\n    print(\"Ти вже можеш отримати паспорт.\")\nprint(\"Дякую!\")   # без відступу: виконується завжди"],["code","n = int(input(\"Число: \"))\nif n % 2 == 0:\n    print(n, \"— парне\")"],["note","Часта помилка — написати `=` замість `==` в умові. Запис `if x = 5:` дає `SyntaxError`."]]},{"n":11,"title":"Повна та скорочена форма оператора розгалуження","blocks":[["p","**Скорочена форма** містить лише `if`: якщо умова хибна, нічого не відбувається. **Повна форма** має ще гілку `else` («інакше»), яка виконується, коли умова хибна."],["code","if умова:\n    команди_1   # якщо умова істинна\nelse:\n    команди_2   # якщо умова хибна"],["table",["Форма","Запис","Скільки гілок виконується"],[["Скорочена","`if`","Одна або жодна"],["Повна","`if … else`","Завжди рівно одна з двох"]]],["h","Приклад: більше з двох чисел"],["code","a = int(input(\"a = \"))\nb = int(input(\"b = \"))\nif a > b:\n    print(\"Більше:\", a)\nelse:\n    print(\"Більше:\", b)"],["h","Умовний вираз в одному рядку"],["p","Коли треба лише вибрати одне з двох значень, зручно використати **умовний (тернарний) вираз**:"],["code","m = a if a > b else b\nresult = \"парне\" if n % 2 == 0 else \"непарне\""]]},{"n":12,"title":"Послідовні та вкладені розгалуження","blocks":[["h","Ланцюжок умов: if – elif – else"],["p","Коли варіантів більше двох, використовують `elif` («інакше, якщо»). Умови перевіряються **по черзі згори вниз**, і виконується лише **перша** гілка, умова якої істинна."],["code","mark = int(input(\"Оцінка (1–12): \"))\nif mark >= 10:\n    print(\"Високий рівень\")\nelif mark >= 7:\n    print(\"Достатній рівень\")\nelif mark >= 4:\n    print(\"Середній рівень\")\nelse:\n    print(\"Початковий рівень\")"],["p","Друга умова `mark >= 7` перевіряється, лише якщо перша хибна, тому окремо писати `mark \u003c 10` не потрібно."],["h","Послідовні розгалуження"],["p","Кілька незалежних `if` поспіль перевіряються **всі**, і може спрацювати кілька гілок одночасно:"],["code","n = 30\nif n % 2 == 0:\n    print(\"Ділиться на 2\")\nif n % 3 == 0:\n    print(\"Ділиться на 3\")\nif n % 5 == 0:\n    print(\"Ділиться на 5\")\n# виведе всі три рядки"],["h","Вкладені розгалуження"],["p","**Вкладене розгалуження** — це `if` всередині іншого `if`. Внутрішня умова перевіряється, лише коли виконується зовнішня."],["code","x = float(input(\"x = \"))\ny = float(input(\"y = \"))\nif x > 0:\n    if y > 0:\n        print(\"I чверть\")\n    else:\n        print(\"IV чверть\")\nelse:\n    if y > 0:\n        print(\"II чверть\")\n    else:\n        print(\"III чверть\")"],["note","Точки на осях (коли `x` чи `y` дорівнює 0) ця програма відносить до сусідньої чверті. Як знайти такі випадки, розглянемо на наступних уроках про тестування."]]},{"n":13,"title":"Тестування розгалужених алгоритмів","blocks":[["p","**Тестування** — це запуск програми на заздалегідь підготовлених даних, щоб перевірити, чи правильно вона працює. Тестування не доводить, що помилок немає, але допомагає знайти ті, що є."],["p","**Тест** складається з двох частин: **вхідних даних** і **очікуваного результату**. Якщо фактичний результат не збігається з очікуваним, у програмі є помилка."],["h","Правила тестування розгалужень"],["ul",["Кожна гілка програми має бути виконана **хоча б одним тестом**.","Перевіряйте **граничні значення**: саме на межах умов (`>=` чи `>`) найчастіше помиляються.","Результати записуйте в таблицю тестів."]],["h","Таблиця тестів для програми «Рівень оцінки»"],["table",["№","Вхідні дані","Очікуваний результат","Що перевіряємо"],[["1","12","Високий рівень","Гілка 1"],["2","10","Високий рівень","Межа гілки 1"],["3","9","Достатній рівень","Межа гілки 2"],["4","7","Достатній рівень","Межа гілки 2"],["5","4","Середній рівень","Межа гілки 3"],["6","1","Початковий рівень","Гілка else"]]],["h","Автоматична перевірка"],["p","Перевірку можна записати в коді командою `assert`. Якщо умова хибна, програма зупиниться з помилкою `AssertionError`:"],["code","def level(mark):\n    if mark >= 10:\n        return \"Високий\"\n    elif mark >= 7:\n        return \"Достатній\"\n    elif mark >= 4:\n        return \"Середній\"\n    return \"Початковий\"\n\nassert level(10) == \"Високий\"\nassert level(9) == \"Достатній\"\nassert level(3) == \"Початковий\"\nprint(\"Усі тести пройдено\")"]]},{"n":14,"title":"Підготовка вхідних даних для тестування програм","blocks":[["p","Перебрати всі можливі вхідні дані неможливо, тому тести підбирають так, щоб невелика їх кількість перевірила програму якомога повніше."],["h","Які дані включати в тести"],["ul",["**Типові значення** з кожної групи, на яку програма реагує однаково (класи еквівалентності).","**Граничні значення**: саме значення межі та сусідні з ним.","**Особливі значення**: нуль, від'ємні числа, дуже великі числа.","**Некоректні дані**: те, що користувач може ввести помилково."]],["h","Приклад: квадратне рівняння ax² + bx + c = 0"],["code","import math\n\na = float(input(\"a = \"))\nb = float(input(\"b = \"))\nc = float(input(\"c = \"))\nif a == 0:\n    print(\"Рівняння не квадратне\")\nelse:\n    d = b ** 2 - 4 * a * c\n    if d > 0:\n        x1 = (-b + math.sqrt(d)) / (2 * a)\n        x2 = (-b - math.sqrt(d)) / (2 * a)\n        print(\"Два корені:\", x1, x2)\n    elif d == 0:\n        print(\"Один корінь:\", -b / (2 * a))\n    else:\n        print(\"Коренів немає\")"],["table",["a, b, c","D","Очікуваний результат"],[["1, -3, 2","1","Два корені: 2.0 1.0"],["1, -2, 1","0","Один корінь: 1.0"],["1, 1, 5","-19","Коренів немає"],["0, 2, 3","—","Рівняння не квадратне"]]],["h","Перевірка коректності введення"],["p","Програма має реагувати на неправильні дані повідомленням, а не неочікуваним результатом:"],["code","n = int(input(\"Кількість учнів: \"))\nif n \u003c= 0:\n    print(\"Помилка: кількість має бути додатною\")\nelse:\n    print(\"Учнів:\", n)"]]},{"n":15,"title":"Правила написання читабельного коду та коментарів до нього","blocks":[["p","Код читають значно частіше, ніж пишуть. Для Python правила оформлення зібрано в документі **PEP 8**."],["h","Основні правила PEP 8"],["ul",["Відступ — **4 пробіли**.","Імена змінних і функцій — малими літерами через підкреслення: `student_count`, `get_average`.","Константи — великими літерами: `MAX_SCORE = 12`.","Пробіли навколо операторів: `x = a + b`, а не `x=a+b`.","Довжина рядка — до 79 символів.","Порожній рядок між логічними частинами програми."]],["h","Погано і добре"],["code","# Погано\nq=int(input())\nw=int(input())\nif q>w:print(q)\nelse:print(w)"],["code","# Добре\nfirst = int(input(\"Перше число: \"))\nsecond = int(input(\"Друге число: \"))\n\nif first > second:\n    print(first)\nelse:\n    print(second)"],["h","Коментарі"],["ul",["Коментар починається знаком `#` і пояснює, **навіщо** зроблено саме так, а не переказує код.","Опис програми чи функції записують у **рядку документації** (docstring) у потрійних лапках."]],["code","def bmi(weight, height):\n    \"\"\"Обчислює індекс маси тіла. Вага в кг, зріст у метрах.\"\"\"\n    return weight / height ** 2\n\n# Ділимо на квадрат зросту, бо формула ІМТ = вага / зріст²\n"]]},{"n":16,"title":"Оператори циклу","blocks":[["p","**Цикл** — алгоритмічна конструкція, що забезпечує повторення команд. Одне виконання тіла циклу називається **ітерацією**. У Python є два оператори циклу: `while` і `for`."],["h","Цикл while (з передумовою)"],["p","Тіло циклу виконується, **поки умова істинна**. Умова перевіряється перед кожною ітерацією."],["code","i = 1\nwhile i \u003c= 5:\n    print(i)\n    i += 1     # без цього рядка цикл буде нескінченним"],["note","Якщо умова ніколи не стає хибною, цикл стає **нескінченним**. Зупинити програму можна комбінацією **Ctrl+C** або кнопкою «Stop» у середовищі."],["h","Цикл for (з параметром)"],["p","Цикл `for` перебирає по черзі всі значення послідовності. Найчастіше послідовність задають функцією `range()`:"],["table",["Запис","Значення","Пояснення"],[["`range(5)`","0, 1, 2, 3, 4","Від 0 до n−1"],["`range(2, 6)`","2, 3, 4, 5","Від a до b−1"],["`range(1, 10, 2)`","1, 3, 5, 7, 9","З кроком 2"],["`range(5, 0, -1)`","5, 4, 3, 2, 1","У зворотному порядку"]]],["code","for i in range(1, 6):\n    print(i, \"в квадраті =\", i ** 2)"],["h","Приклад: сума чисел від 1 до n"],["code","n = int(input(\"n = \"))\ns = 0\nfor i in range(1, n + 1):\n    s += i\nprint(\"Сума:\", s)"],["p","`for` перебирає не лише числа, а й символи рядка: `for letter in \"Python\": print(letter)`."]]},{"n":17,"title":"Порівняння операторів циклу","blocks":[["table",["","for","while"],[["Коли використовувати","Кількість повторень **відома** заздалегідь","Повторювати, **поки** виконується умова"],["Лічильник","Змінюється автоматично","Треба змінювати самостійно"],["Ризик нескінченного циклу","Немає (для range)","Є, якщо умова не змінюється"],["Приклад задачі","Вивести таблицю множення на 7","Вводити числа, доки не введуть 0"]]],["h","Та сама задача двома способами"],["code","# for\nfor i in range(10, 0, -1):\n    print(i)\n\n# while\ni = 10\nwhile i > 0:\n    print(i)\n    i -= 1"],["h","Задача, де потрібен саме while"],["code","# Скільки разів треба поділити число на 2, щоб воно стало меншим за 1?\nx = float(input(\"x = \"))\ncount = 0\nwhile x >= 1:\n    x /= 2\n    count += 1\nprint(count)"],["h","Керування циклом: break і continue"],["ul",["`break` — негайно **завершує** цикл.","`continue` — пропускає решту тіла і переходить до **наступної ітерації**."]],["code","while True:\n    word = input(\"Слово (stop — вихід): \")\n    if word == \"stop\":\n        break\n    print(word.upper())\n\nfor i in range(1, 11):\n    if i % 3 == 0:\n        continue        # пропускаємо числа, кратні 3\n    print(i, end=\" \")"]]},{"n":18,"title":"Поєднання повторення і розгалуження","blocks":[["p","Більшість реальних задач вимагає перевіряти умову на кожній ітерації циклу. Для цього `if` розміщують **у тілі циклу**."],["h","Підрахунок за умовою"],["code","# Скільки чисел від 1 до 100 діляться на 7?\ncount = 0\nfor i in range(1, 101):\n    if i % 7 == 0:\n        count += 1\nprint(count)   # 14"],["h","Введення до умови"],["code","# Користувач вводить числа, 0 — кінець. Знайти суму додатних.\ns = 0\nx = int(input())\nwhile x != 0:\n    if x > 0:\n        s += x\n    x = int(input())\nprint(\"Сума додатних:\", s)"],["h","Пошук найбільшого"],["code","n = int(input(\"Скільки чисел? \"))\nbiggest = int(input())\nfor i in range(n - 1):\n    x = int(input())\n    if x > biggest:\n        biggest = x\nprint(\"Найбільше:\", biggest)"],["h","Перевірка, чи число просте"],["code","n = int(input(\"n = \"))\nis_prime = n > 1\nfor d in range(2, int(n ** 0.5) + 1):\n    if n % d == 0:\n        is_prime = False\n        break\nprint(\"Просте\" if is_prime else \"Не просте\")"],["p","Дільники досить шукати до √n: якщо в числа є дільник, більший за √n, то є й парний йому, менший за √n."]]},{"n":19,"title":"Поняття рекурсії. Рекурентні послідовності","blocks":[["p","**Рекурсія** — спосіб розв'язання задачі, коли вона зводиться до такої самої задачі меншого розміру. У програмуванні **рекурсивна функція** викликає сама себе."],["p","Кожна рекурсія має дві обов'язкові частини:"],["ul",["**Базовий випадок** — простий випадок, відповідь на який відома одразу. Він зупиняє рекурсію.","**Рекурсивний крок** — зведення задачі до меншої."]],["code","def factorial(n):\n    if n \u003c= 1:                     # базовий випадок\n        return 1\n    return n * factorial(n - 1)    # рекурсивний крок\n\nprint(factorial(5))   # 5 * 4 * 3 * 2 * 1 = 120"],["note","Без базового випадку функція викликала б себе нескінченно. Python обмежує глибину рекурсії (близько 1000 викликів) і в такому разі видає помилку `RecursionError`."],["h","Рекурентні послідовності"],["p","**Рекурентна послідовність** — послідовність, кожен член якої обчислюється через попередні. Задають перші члени та формулу переходу."],["table",["Послідовність","Перші члени","Формула"],[["Арифметична прогресія","a₁ = 2, d = 3: 2, 5, 8, 11…","aₙ = aₙ₋₁ + d"],["Геометрична прогресія","b₁ = 1, q = 2: 1, 2, 4, 8…","bₙ = bₙ₋₁ · q"],["Числа Фібоначчі","1, 1, 2, 3, 5, 8, 13…","Fₙ = Fₙ₋₁ + Fₙ₋₂"]]],["h","Числа Фібоначчі циклом"],["code","n = int(input(\"Скільки членів? \"))\na, b = 1, 1\nfor i in range(n):\n    print(a, end=\" \")\n    a, b = b, a + b"],["p","Рекурентні послідовності зручно обчислювати циклом: на кожній ітерації нове значення отримують з попередніх, які зберігаються у змінних."]]},{"n":20,"title":"Вкладені цикли","blocks":[["p","**Вкладений цикл** — цикл усередині тіла іншого циклу. На кожну ітерацію **зовнішнього** циклу **внутрішній** виконується повністю. Якщо зовнішній цикл має n ітерацій, а внутрішній m, тіло внутрішнього виконається n · m разів."],["h","Таблиця множення"],["code","for i in range(1, 10):\n    for j in range(1, 10):\n        print(f\"{i * j:3}\", end=\"\")\n    print()   # перехід на новий рядок після кожного рядка таблиці"],["p","Параметр `end=\"\"` у `print()` забороняє перехід на новий рядок, а запис `{i * j:3}` вирівнює число по ширині 3 символи."],["h","Фігури із символів"],["code","# Прямокутник 3 × 5\nfor row in range(3):\n    for col in range(5):\n        print(\"*\", end=\"\")\n    print()\n\n# Трикутник: у рядку i — i зірочок\nfor i in range(1, 5):\n    print(\"*\" * i)"],["h","Перебір усіх пар"],["code","# Знайти всі пари чисел від 1 до 10, сума яких дорівнює 10\nfor a in range(1, 10):\n    for b in range(a, 10):\n        if a + b == 10:\n            print(a, \"+\", b)"],["note","`break` у внутрішньому циклі завершує лише **внутрішній** цикл, а зовнішній продовжує роботу."]]},{"n":21,"title":"Можливості середовища програмування для роботи з циклічними програмами","blocks":[["p","Знайти помилку в циклі, просто дивлячись на код, буває складно. Тому середовища розробки мають **налагоджувач (debugger)**, який дозволяє виконувати програму по кроках і спостерігати за змінними."],["h","Інструменти налагодження"],["ul",["**Точка зупину (breakpoint)** — рядок, на якому програма зупиниться. Ставиться клацанням ліворуч від номера рядка.","**Крок з обходом (Step over)** — виконати поточний рядок повністю й перейти до наступного.","**Крок із заходом (Step into)** — зайти всередину функції, яка викликається в рядку.","**Продовжити (Resume)** — виконувати до наступної точки зупину.","**Панель змінних** — показує поточні значення всіх змінних."]],["h","Клавіші в популярних середовищах"],["table",["Дія","Thonny","VS Code"],[["Запустити налагодження","Ctrl+F5","F5"],["Точка зупину","Клацнути біля номера рядка","F9"],["Крок з обходом","F6","F10"],["Крок із заходом","F7","F11"],["Продовжити","F8","F5"]]],["p","У **Thonny** варто увімкнути меню View → Variables: тоді значення змінних видно під час виконання навіть без налагоджувача."],["h","Налагоджувальний вивід"],["p","Найпростіший спосіб простежити цикл — тимчасово додати `print()` зі значеннями змінних:"],["code","s = 0\nfor i in range(1, 5):\n    s += i\n    print(\"i =\", i, \" s =\", s)   # тимчасовий рядок для перевірки"]]},{"n":22,"title":"Покрокове виконання програм із циклами та розгалуженнями","blocks":[["p","**Трасувальна таблиця** — таблиця, у якій записують значення змінних після кожного кроку виконання програми. Її складають вручну, щоб зрозуміти роботу алгоритму або знайти помилку."],["h","Приклад: сума парних чисел від 1 до 6"],["code","s = 0\nfor i in range(1, 7):\n    if i % 2 == 0:\n        s += i\nprint(s)"],["table",["Ітерація","i","i % 2 == 0","s"],[["—","—","—","0"],["1","1","False","0"],["2","2","True","2"],["3","3","False","2"],["4","4","True","6"],["5","5","False","6"],["6","6","True","12"]]],["p","Результат: `12`. Порівнявши таблицю з виконанням у налагоджувачі, легко перевірити, чи правильно ви розумієте програму."],["h","Як шукати помилку в циклі"],["ol",["Запустіть програму на простому тесті, для якого знаєте відповідь.","Поставте точку зупину на початку тіла циклу.","Виконуйте програму по кроках і стежте за змінними на панелі.","Знайдіть ітерацію, на якій значення стає неправильним.","Виправте код і повторіть тест."]],["note","Цим уроком завершується підрозділ 1.3. Наприкінці проводиться тематична атестація."]]}],"practice":[{"task":"Користувач вводить рік. Визначте, чи він високосний. Рік високосний, якщо ділиться на 4, але не на 100, або ділиться на 400.","answer":"year = int(input(\"Рік: \"))\nif (year % 4 == 0 and year % 100 != 0) or year % 400 == 0:\n    print(\"Високосний\")\nelse:\n    print(\"Не високосний\")","code":true},{"task":"Користувач вводить температуру. Виведіть «Холодно», якщо нижче 10°, «Комфортно» від 10° до 25° включно, і «Спекотно», якщо вище 25°. Складіть таблицю тестів із граничними значеннями.","answer":"t = float(input(\"Температура: \"))\nif t \u003c 10:\n    print(\"Холодно\")\nelif t \u003c= 25:\n    print(\"Комфортно\")\nelse:\n    print(\"Спекотно\")\n\n# Тести: 9.9 → Холодно, 10 → Комфортно, 25 → Комфортно, 25.1 → Спекотно","code":true},{"task":"Виведіть усі числа від 1 до 50, які діляться на 3 або на 5, і знайдіть їх кількість.","answer":"count = 0\nfor i in range(1, 51):\n    if i % 3 == 0 or i % 5 == 0:\n        print(i, end=\" \")\n        count += 1\nprint()\nprint(\"Кількість:\", count)   # 23","code":true},{"task":"Знайдіть суму цифр довільного натурального числа за допомогою циклу `while`.","answer":"n = int(input(\"n = \"))\ns = 0\nwhile n > 0:\n    s += n % 10\n    n //= 10\nprint(\"Сума цифр:\", s)","code":true},{"task":"Виведіть таблицю множення для чисел від 1 до 5 за допомогою вкладених циклів.","answer":"for i in range(1, 6):\n    for j in range(1, 6):\n        print(f\"{i * j:4}\", end=\"\")\n    print()","code":true},{"task":"Складіть трасувальну таблицю для програми: `x = 1` / `while x \u003c 20:` / `x = x * 3`. Яке значення матиме `x` після циклу?","answer":"x: 1 → 3 → 9 → 27. Після третьої ітерації x = 27, умова 27 \u003c 20 хибна, цикл завершується. Відповідь: `27`."}],"quiz":[{"q":"Який символ обов'язково ставиться після умови в операторі `if`?","o":["Крапка з комою","Двокрапка","Дужка","Знак ="],"a":1},{"q":"Яка гілка виконується, якщо умова в `if` хибна, а `else` немає?","o":["Тіло if","Жодна","Програма завершується з помилкою","Тіло if виконується двічі"],"a":1},{"q":"Що виведе код: `x = 7` / `if x > 10: print(\"A\")` / `elif x > 5: print(\"B\")` / `else: print(\"C\")`?","o":["A","B","C","B і C"],"a":1},{"q":"Які значення дає `range(2, 8, 2)`?","o":["2, 4, 6, 8","2, 4, 6","2, 3, 4, 5, 6, 7","4, 6, 8"],"a":1,"why":"Кінцеве значення 8 не входить у послідовність."},{"q":"Який цикл доречніший, коли кількість повторень заздалегідь невідома?","o":["for","while","Обидва однаково","Жоден"],"a":1},{"q":"Що робить оператор `continue`?","o":["Завершує цикл","Переходить до наступної ітерації","Зупиняє програму","Повторює поточну ітерацію"],"a":1},{"q":"Скільки разів виконається `print` у коді: `for i in range(3):` / `for j in range(4):` / `print(i, j)`?","o":["3","4","7","12"],"a":3,"why":"Зовнішній цикл має 3 ітерації, внутрішній — 4 на кожну: 3 · 4 = 12."},{"q":"Що обов'язково має містити рекурсивна функція, щоб не викликати себе нескінченно?","o":["Цикл for","Базовий випадок","Оператор break","Глобальну змінну"],"a":1},{"q":"Яке значення є граничним для умови `if mark >= 10`?","o":["1","5","10","12"],"a":2},{"q":"Як називається таблиця зі значеннями змінних після кожного кроку програми?","o":["Таблиця істинності","Трасувальна таблиця","Таблиця тестів","Зведена таблиця"],"a":1}]},{"id":"s14","topic":1,"code":"1.4","title":"Вбудовані типи даних та їх опрацювання","lessons":[{"n":23,"title":"Прості та структуровані типи","blocks":[["p","Усі типи даних поділяють на дві групи залежно від того, скільки значень зберігає одна змінна."],["ul",["**Прості (скалярні) типи** — змінна зберігає одне неподільне значення: `int`, `float`, `bool`.","**Структуровані (складені) типи** — змінна зберігає набір значень, до яких можна звертатися окремо: `str`, `list`, `tuple`, `dict`, `set`."]],["table",["Тип","Назва","Приклад","Особливість"],[["`str`","Рядок","`\"Python\"`","Послідовність символів"],["`list`","Список","`[3, 7, 1]`","Упорядкований, можна змінювати"],["`tuple`","Кортеж","`(3, 7, 1)`","Упорядкований, змінювати не можна"],["`dict`","Словник","`{\"Оля\": 11}`","Пари «ключ: значення»"],["`set`","Множина","`{1, 2, 3}`","Без повторів і без порядку"]]],["p","Функція `len()` повертає кількість елементів структурованого значення: `len(\"Python\")` дорівнює `6`, `len([3, 7, 1])` дорівнює `3`."]]},{"n":24,"title":"Поняття структур даних. Класифікація структур даних","blocks":[["p","**Структура даних** — спосіб організації даних у пам'яті, разом з операціями, які можна над ними виконувати: додавання, видалення, пошук, перебір."],["h","Класифікація"],["table",["Ознака","Види"],[["За зв'язками між елементами","**Лінійні** (кожен елемент має одного попередника й одного наступника: масив, стек, черга) і **нелінійні** (дерево, граф)."],["За зміною розміру","**Статичні** (розмір фіксований) і **динамічні** (розмір змінюється під час роботи програми)."],["За типом елементів","**Однорідні** (усі елементи одного типу) і **неоднорідні** (різних типів)."],["За можливістю змінювати","**Змінювані** (`list`, `dict`) і **незмінювані** (`str`, `tuple`)."]]],["p","Вибір структури даних впливає на швидкість програми. Наприклад, перевірити, чи є значення в множині `set`, значно швидше, ніж шукати його у великому списку."]]},{"n":25,"title":"Лінійні структури даних","blocks":[["p","У **лінійній** структурі елементи розташовані один за одним, як у шерензі. Розглянемо основні види."],["ul",["**Масив** — елементи однакового типу, доступ до будь-якого за номером (індексом).","**Стек** — «останнім прийшов, першим вийшов» (LIFO). Як стос тарілок: беремо верхню.","**Черга** — «першим прийшов, першим вийшов» (FIFO). Як черга в магазині.","**Зв'язний список** — кожен елемент зберігає посилання на наступний."]],["h","Стек на основі списку"],["code","stack = []\nstack.append(\"A\")   # покласти\nstack.append(\"B\")\nstack.append(\"C\")\nprint(stack.pop())   # C — взяли останній\nprint(stack)         # ['A', 'B']"],["h","Черга"],["code","from collections import deque\nqueue = deque()\nqueue.append(\"Оля\")\nqueue.append(\"Петро\")\nprint(queue.popleft())   # Оля — хто перший прийшов"]]},{"n":26,"title":"Способи реалізації структур даних","blocks":[["p","Одну й ту саму структуру можна реалізувати по-різному. Існують два основні способи розміщення в пам'яті:"],["ul",["**Послідовне (суцільне)** — елементи займають сусідні комірки пам'яті. Так влаштовано масив: до будь-якого елемента можна швидко звернутися за номером, але вставка в середину вимагає зсуву решти.","**Зв'язне** — елементи розкидані в пам'яті, і кожен зберігає посилання на наступний. Вставка швидка, але щоб дістатися до n-го елемента, треба пройти всі попередні."]],["p","У Python список `list` реалізовано як **динамічний масив**: він зберігає посилання на об'єкти в суцільній ділянці пам'яті й сам збільшується, коли додаємо елементи."],["table",["Операція","Список Python","Зв'язний список"],[["Доступ за індексом","Швидко","Повільно"],["Додавання в кінець","Швидко","Швидко"],["Вставка на початок","Повільно (зсув)","Швидко"]]],["p","Готові реалізації інших структур є в стандартних модулях: черга `deque` у модулі `collections`, черга з пріоритетом у модулі `heapq`."]]},{"n":27,"title":"Масиви (списки)","blocks":[["p","**Список** (`list`) — упорядкований набір елементів, записаних у квадратних дужках через кому. Кожен елемент має **індекс** — номер, що починається з **0**."],["code","marks = [10, 8, 12, 7, 9]\nprint(marks[0])    # 10 — перший\nprint(marks[-1])   # 9 — останній (від'ємні індекси рахують з кінця)\nprint(len(marks))  # 5\nmarks[1] = 11      # змінити елемент\nprint(marks)       # [10, 11, 12, 7, 9]"],["h","Способи створення списку"],["code","a = []                       # порожній\nb = [0] * 5                  # [0, 0, 0, 0, 0]\nc = list(range(1, 6))        # [1, 2, 3, 4, 5]\nd = [i ** 2 for i in range(5)]   # генератор списку: [0, 1, 4, 9, 16]\ne = input().split()          # список слів з рядка\nf = list(map(int, input().split()))   # список чисел з рядка"],["h","Зрізи"],["p","**Зріз** `a[start:stop:step]` повертає частину списку від `start` до `stop - 1`:"],["code","a = [0, 1, 2, 3, 4, 5]\nprint(a[1:4])    # [1, 2, 3]\nprint(a[:3])     # [0, 1, 2]\nprint(a[::2])    # [0, 2, 4]\nprint(a[::-1])   # [5, 4, 3, 2, 1, 0] — у зворотному порядку"],["h","Перебір елементів"],["code","for m in marks:\n    print(m)\n\nfor i in range(len(marks)):\n    print(i, marks[i])"]]},{"n":28,"title":"Класичні алгоритми для роботи з масивами (списками)","blocks":[["h","Сума і середнє"],["code","a = [4, 9, 2, 7, 5]\ns = 0\nfor x in a:\n    s += x\nprint(\"Сума:\", s, \"Середнє:\", s / len(a))\n# те саме вбудованими функціями:\nprint(sum(a), sum(a) / len(a))"],["h","Пошук найбільшого та його індексу"],["code","a = [4, 9, 2, 7, 5]\nimax = 0\nfor i in range(1, len(a)):\n    if a[i] > a[imax]:\n        imax = i\nprint(\"Максимум:\", a[imax], \"на позиції\", imax)\n# вбудовано: max(a), a.index(max(a))"],["h","Підрахунок за умовою"],["code","count = 0\nfor x in a:\n    if x % 2 == 0:\n        count += 1\nprint(\"Парних:\", count)"],["h","Обмін значень і розворот"],["code","a[0], a[-1] = a[-1], a[0]   # обмін першого й останнього\n\nn = len(a)\nfor i in range(n // 2):       # розворот списку вручну\n    a[i], a[n - 1 - i] = a[n - 1 - i], a[i]\nprint(a)"],["h","Корисні методи і функції списків"],["table",["Запис","Дія"],[["`a.append(x)`","Додати x у кінець"],["`a.count(x)`","Скільки разів зустрічається x"],["`a.index(x)`","Індекс першого входження x"],["`a.reverse()`","Розвернути список"],["`sum(a)`, `min(a)`, `max(a)`","Сума, мінімум, максимум"]]]]},{"n":29,"title":"Лінійний пошук та бінарний пошук","blocks":[["h","Лінійний пошук"],["p","Елементи переглядають **по черзі** від першого, доки не знайдуть потрібний або не дійдуть до кінця. Працює для будь-якого списку. У найгіршому випадку треба переглянути всі n елементів."],["code","def linear_search(a, x):\n    for i in range(len(a)):\n        if a[i] == x:\n            return i\n    return -1          # не знайдено\n\nprint(linear_search([5, 3, 8, 1], 8))   # 2"],["h","Бінарний (двійковий) пошук"],["p","Працює **лише для відсортованого** списку. Порівнюємо шукане значення із середнім елементом і відкидаємо ту половину, де його точно немає. Щокроку область пошуку зменшується вдвічі."],["code","def binary_search(a, x):\n    left, right = 0, len(a) - 1\n    while left \u003c= right:\n        mid = (left + right) // 2\n        if a[mid] == x:\n            return mid\n        elif a[mid] \u003c x:\n            left = mid + 1\n        else:\n            right = mid - 1\n    return -1\n\nprint(binary_search([1, 3, 5, 7, 9, 11], 9))   # 4"],["table",["Кількість елементів","Лінійний пошук (найгірше)","Бінарний пошук (найгірше)"],[["10","10 порівнянь","4 порівняння"],["1 000","1 000","10"],["1 000 000","1 000 000","20"]]],["note","Перевірити наявність елемента можна й оператором `in`: `8 in [5, 3, 8, 1]` дорівнює `True`. Він виконує лінійний пошук."]]},{"n":30,"title":"Пошук елементів за умовою","blocks":[["p","Часто потрібно знайти не конкретне значення, а елементи, які задовольняють умову: усі від'ємні, перший парний, оцінки вище 10 тощо."],["h","Перший елемент, що задовольняє умову"],["code","a = [7, 3, 10, 5, 12]\nfound = -1\nfor i in range(len(a)):\n    if a[i] % 2 == 0:\n        found = i\n        break\nprint(\"Перший парний на позиції\", found)   # 2"],["h","Усі елементи, що задовольняють умову"],["code","marks = [9, 11, 6, 12, 10, 4]\nhigh = []\nfor m in marks:\n    if m >= 10:\n        high.append(m)\nprint(high)                               # [11, 12, 10]\n\n# коротко — генератор списку з умовою:\nhigh = [m for m in marks if m >= 10]"],["h","Чи є хоча б один / чи всі"],["code","print(any(m \u003c 4 for m in marks))   # False — немає жодної оцінки нижче 4\nprint(all(m >= 4 for m in marks))  # True — усі оцінки від 4"]]},{"n":31,"title":"Видалення елементів з масиву (списку)","blocks":[["table",["Запис","Що видаляє"],[["`del a[i]`","Елемент з індексом i"],["`a.pop(i)`","Елемент з індексом i і повертає його; без аргументу — останній"],["`a.remove(x)`","Перше входження значення x (помилка, якщо x немає)"],["`a.clear()`","Усі елементи"],["`del a[1:3]`","Зріз елементів"]]],["code","a = [10, 20, 30, 40, 50]\ndel a[0]          # [20, 30, 40, 50]\nx = a.pop()       # x = 50, a = [20, 30, 40]\na.remove(30)      # [20, 40]\nprint(a)"],["h","Видалення за умовою"],["note","Не видаляйте елементи зі списку під час перебору `for x in a`: індекси зсуваються, і частина елементів буде пропущена."],["code","a = [3, -1, -4, 5, -2, 8]\n\n# Спосіб 1: створити новий список без зайвих елементів\na = [x for x in a if x >= 0]\nprint(a)          # [3, 5, 8]\n\n# Спосіб 2: перебирати з кінця і видаляти\nb = [3, -1, -4, 5, -2, 8]\nfor i in range(len(b) - 1, -1, -1):\n    if b[i] \u003c 0:\n        del b[i]\nprint(b)          # [3, 5, 8]"]]},{"n":32,"title":"Вставка елементів у масив (список)","blocks":[["table",["Запис","Дія"],[["`a.append(x)`","Додати x у кінець"],["`a.insert(i, x)`","Вставити x на позицію i, решта зсувається праворуч"],["`a.extend(b)`","Додати в кінець усі елементи списку b"],["`a + b`","Новий список з елементів a і b"]]],["code","a = [1, 2, 4, 5]\na.insert(2, 3)      # [1, 2, 3, 4, 5]\na.insert(0, 0)      # [0, 1, 2, 3, 4, 5]\na.extend([6, 7])    # [0, 1, 2, 3, 4, 5, 6, 7]\nprint(a)"],["h","Вставка у відсортований список зі збереженням порядку"],["code","a = [2, 5, 9, 14]\nx = 7\ni = 0\nwhile i \u003c len(a) and a[i] \u003c x:\n    i += 1\na.insert(i, x)\nprint(a)   # [2, 5, 7, 9, 14]"],["note","Цим уроком завершується перша частина підрозділу. Проводиться тематична атестація з тем «Списки, пошук, видалення і вставка»."]]},{"n":33,"title":"Прямі методи сортування вставленням, обміном, вибором","blocks":[["p","**Сортування** — упорядкування елементів за зростанням або спаданням. Прямі методи прості, але повільні для великих списків: кількість дій зростає як n²."],["h","Сортування обміном (бульбашкою)"],["p","Порівнюємо сусідні елементи й міняємо їх місцями, якщо вони стоять неправильно. Після кожного проходу найбільший елемент «спливає» в кінець."],["code","def bubble_sort(a):\n    n = len(a)\n    for i in range(n - 1):\n        for j in range(n - 1 - i):\n            if a[j] > a[j + 1]:\n                a[j], a[j + 1] = a[j + 1], a[j]\n\nnums = [5, 2, 9, 1, 6]\nbubble_sort(nums)\nprint(nums)   # [1, 2, 5, 6, 9]"],["h","Сортування вибором"],["p","Знаходимо найменший елемент невідсортованої частини й ставимо його на початок цієї частини."],["code","def selection_sort(a):\n    n = len(a)\n    for i in range(n - 1):\n        imin = i\n        for j in range(i + 1, n):\n            if a[j] \u003c a[imin]:\n                imin = j\n        a[i], a[imin] = a[imin], a[i]"],["h","Сортування вставленням"],["p","Беремо елементи по одному і вставляємо кожен на своє місце серед уже відсортованих, як карти в руці."],["code","def insertion_sort(a):\n    for i in range(1, len(a)):\n        key = a[i]\n        j = i - 1\n        while j >= 0 and a[j] > key:\n            a[j + 1] = a[j]\n            j -= 1\n        a[j + 1] = key"]]},{"n":34,"title":"Удосконалені методи сортування, швидке сортування","blocks":[["p","**Удосконалені методи** сортують значно швидше: кількість дій зростає приблизно як n · log n. Для мільйона елементів це десятки мільйонів дій замість трильйона."],["h","Швидке сортування (Quicksort)"],["ol",["Вибираємо **опорний елемент** (наприклад, середній).","Розділяємо список на три частини: менші за опорний, рівні йому, більші.","Рекурсивно сортуємо частини з меншими й більшими елементами.","Об'єднуємо: менші + рівні + більші."]],["code","def quick_sort(a):\n    if len(a) \u003c= 1:\n        return a\n    pivot = a[len(a) // 2]\n    less = [x for x in a if x \u003c pivot]\n    equal = [x for x in a if x == pivot]\n    greater = [x for x in a if x > pivot]\n    return quick_sort(less) + equal + quick_sort(greater)\n\nprint(quick_sort([7, 2, 9, 4, 3, 8, 1]))   # [1, 2, 3, 4, 7, 8, 9]"],["p","Інші удосконалені методи: **сортування злиттям** (merge sort), **пірамідальне сортування** (heap sort), **сортування Шелла**."],["h","Вбудоване сортування Python"],["code","a = [5, 2, 9, 1]\na.sort()                      # змінює сам список: [1, 2, 5, 9]\nb = sorted([5, 2, 9, 1], reverse=True)   # новий список: [9, 5, 2, 1]\nwords = [\"кіт\", \"слон\", \"як\"]\nprint(sorted(words, key=len))  # за довжиною: ['як', 'кіт', 'слон']"],["note","На практиці використовують вбудовані `sort()` і `sorted()`: вони працюють за алгоритмом Timsort і дуже швидкі. Власні алгоритми вивчають, щоб розуміти, як це влаштовано."]]},{"n":35,"title":"Оголошення, введення та виведення двовимірних масивів (списків)","blocks":[["p","**Двовимірний масив** (матриця) — таблиця з рядків і стовпців. У Python його реалізують як **список списків**: кожен рядок — окремий список."],["code","m = [\n    [1, 2, 3],\n    [4, 5, 6],\n]\nprint(m[1][2])     # 6 — рядок 1, стовпець 2\nprint(len(m), len(m[0]))   # 2 рядки, 3 стовпці"],["h","Створення матриці заданого розміру"],["code","rows, cols = 3, 4\nm = [[0] * cols for i in range(rows)]"],["note","Запис `[[0] * cols] * rows` створює список з **однаковими посиланнями** на той самий рядок: зміна одного рядка змінить усі. Використовуйте генератор, як у прикладі вище."],["h","Введення та виведення"],["code","n = int(input(\"Кількість рядків: \"))\nm = []\nfor i in range(n):\n    row = list(map(int, input().split()))\n    m.append(row)\n\nfor row in m:\n    print(*row)   # елементи рядка через пробіл"],["h","Обробка матриці"],["code","m = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]\ntotal = 0\nfor i in range(len(m)):\n    for j in range(len(m[i])):\n        total += m[i][j]\nprint(\"Сума:\", total)                            # 45\nprint(\"Головна діагональ:\", [m[i][i] for i in range(3)])   # [1, 5, 9]"]]},{"n":36,"title":"Символьні та рядкові величини","blocks":[["p","**Рядок** (`str`) — послідовність символів у лапках. Рядки **незмінні**: окремий символ замінити не можна, можна лише створити новий рядок."],["code","s = \"Python\"\nprint(s[0], s[-1])   # P n\nprint(s[1:4])        # yth\nprint(len(s))        # 6\nprint(s + \"!\" * 3)   # Python!!!"],["h","Коди символів"],["p","Кожен символ має числовий код у таблиці **Unicode**. Функція `ord()` повертає код символу, `chr()` — символ за кодом:"],["code","print(ord(\"A\"))    # 65\nprint(chr(97))     # a\nprint(ord(\"Я\"))    # 1071"],["h","Методи рядків"],["table",["Метод","Дія","Приклад → результат"],[["`upper()`, `lower()`","Великі / малі літери","`\"Київ\".upper()` → `\"КИЇВ\"`"],["`strip()`","Прибрати пробіли з країв","`\"  so \".strip()` → `\"so\"`"],["`replace(a, b)`","Замінити a на b","`\"кіт\".replace(\"і\", \"о\")` → `\"кот\"`"],["`split()`","Розбити на список слів","`\"a b c\".split()` → `['a', 'b', 'c']`"],["`join(list)`","З'єднати список у рядок","`\"-\".join(['a', 'b'])` → `\"a-b\"`"],["`find(x)`","Позиція підрядка (−1, якщо немає)","`\"hello\".find(\"l\")` → `2`"],["`count(x)`","Кількість входжень","`\"banana\".count(\"a\")` → `3`"],["`isdigit()`","Чи складається лише з цифр","`\"123\".isdigit()` → `True`"]]]]},{"n":37,"title":"Класичні алгоритми для роботи з рядками","blocks":[["h","Підрахунок символів"],["code","s = input(\"Рядок: \")\nvowels = 0\nfor ch in s.lower():\n    if ch in \"аеєиіїоуюя\":\n        vowels += 1\nprint(\"Голосних:\", vowels)"],["h","Розворот і паліндром"],["code","word = \"Пилип\".lower()\nprint(word[::-1])                 # пилип\nprint(word == word[::-1])         # True — паліндром"],["h","Робота зі словами"],["code","text = \"навчання це світло а ненавчання темрява\"\nwords = text.split()\nprint(\"Слів:\", len(words))\nprint(\"Найдовше:\", max(words, key=len))\nprint(\" \".join(w.capitalize() for w in words))"],["h","Шифр Цезаря"],["p","Кожну літеру зсуваємо на k позицій в алфавіті:"],["code","def caesar(text, k):\n    result = \"\"\n    for ch in text:\n        if \"a\" \u003c= ch \u003c= \"z\":\n            result += chr((ord(ch) - ord(\"a\") + k) % 26 + ord(\"a\"))\n        else:\n            result += ch\n    return result\n\nprint(caesar(\"hello\", 3))    # khoor\nprint(caesar(\"khoor\", -3))   # hello"]]},{"n":38,"title":"Файли. Зчитування даних з файлу","blocks":[["p","**Файл** — іменована ділянка на диску, де дані зберігаються після завершення програми. Текстові файли читають так:"],["code","with open(\"marks.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()      # увесь файл одним рядком\nprint(text)"],["ul",["`open(ім'я, режим, encoding)` відкриває файл. Режим `\"r\"` — читання.","`encoding=\"utf-8\"` потрібне, щоб правильно читалися українські літери.","Конструкція `with` автоматично закриває файл після блоку."]],["h","Способи читання"],["table",["Запис","Результат"],[["`f.read()`","Увесь вміст одним рядком"],["`f.readline()`","Один наступний рядок"],["`f.readlines()`","Список усіх рядків"],["`for line in f:`","Перебір рядків по одному (зручно для великих файлів)"]]],["h","Приклад: середнє з чисел у файлі"],["p","Нехай файл `marks.txt` містить по одному числу в рядку:"],["code","total, count = 0, 0\nwith open(\"marks.txt\", encoding=\"utf-8\") as f:\n    for line in f:\n        line = line.strip()       # прибираємо символ переходу рядка\n        if line:\n            total += int(line)\n            count += 1\nprint(\"Середнє:\", total / count)"],["note","Якщо файла немає, виникне помилка `FileNotFoundError`. Файл має лежати в тій самій папці, що й програма, або треба вказати повний шлях."]]},{"n":39,"title":"Запис у файл","blocks":[["table",["Режим","Дія"],[["`\"w\"`","Запис. Створює файл або **стирає** наявний вміст"],["`\"a\"`","Дописування в кінець файлу"],["`\"x\"`","Створення нового файлу (помилка, якщо він уже існує)"]]],["code","with open(\"result.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"Результати тесту\\n\")   # \\n — перехід на новий рядок\n    f.write(\"Оля: 11\\n\")\n\nwith open(\"result.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"Петро: 9\\n\")   # дописали, не стираючи"],["h","Запис списку"],["code","squares = [i ** 2 for i in range(1, 6)]\nwith open(\"squares.txt\", \"w\", encoding=\"utf-8\") as f:\n    for x in squares:\n        f.write(str(x) + \"\\n\")   # write приймає лише рядки\n\n# або print з параметром file:\nwith open(\"squares.txt\", \"w\", encoding=\"utf-8\") as f:\n    for x in squares:\n        print(x, file=f)"],["h","Читання, обробка, запис"],["code","with open(\"names.txt\", encoding=\"utf-8\") as f:\n    names = [line.strip() for line in f if line.strip()]\nnames.sort()\nwith open(\"names_sorted.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"\\n\".join(names))"]]},{"n":40,"title":"Словники","blocks":[["p","**Словник** (`dict`) — набір пар **«ключ: значення»**. Доступ до значення відбувається не за номером, а за ключем, як у тлумачному словнику за словом."],["code","phone = {\"Оля\": \"067-111\", \"Петро\": \"050-222\"}\nprint(phone[\"Оля\"])          # 067-111\nphone[\"Ірина\"] = \"093-333\"   # додати пару\nphone[\"Петро\"] = \"050-999\"   # змінити значення\ndel phone[\"Оля\"]             # видалити пару\nprint(phone)"],["ul",["Ключі **унікальні** й мають бути незмінного типу: рядок, число, кортеж.","Значення можуть бути будь-якими, навіть списками чи іншими словниками.","Пошук за ключем дуже швидкий, навіть у великому словнику."]],["h","Основні операції"],["table",["Запис","Дія"],[["`key in d`","Чи є такий ключ"],["`d.get(key, default)`","Значення або default, якщо ключа немає (без помилки)"],["`d.keys()`, `d.values()`","Усі ключі / усі значення"],["`d.items()`","Усі пари (ключ, значення)"],["`len(d)`","Кількість пар"]]],["code","for name, number in phone.items():\n    print(name, \"—\", number)"],["h","Приклад: частота слів"],["code","text = \"мама мила раму мама\"\nfreq = {}\nfor w in text.split():\n    freq[w] = freq.get(w, 0) + 1\nprint(freq)   # {'мама': 2, 'мила': 1, 'раму': 1}"]]},{"n":41,"title":"Впорядкування словників","blocks":[["p","Словник зберігає пари в **порядку додавання**. Щоб вивести їх в іншому порядку, використовують функцію `sorted()`, яка повертає новий **список**."],["h","За ключами"],["code","marks = {\"Петро\": 9, \"Оля\": 11, \"Андрій\": 7}\nfor name in sorted(marks):\n    print(name, marks[name])\n# Андрій 7 / Оля 11 / Петро 9"],["h","За значеннями"],["p","Параметр `key` вказує, за чим сортувати. `lambda` — коротка безіменна функція:"],["code","by_mark = sorted(marks.items(), key=lambda pair: pair[1], reverse=True)\nfor name, m in by_mark:\n    print(name, m)\n# Оля 11 / Петро 9 / Андрій 7"],["h","Новий упорядкований словник"],["code","ordered = dict(sorted(marks.items(), key=lambda p: p[1]))\nprint(ordered)   # {'Андрій': 7, 'Петро': 9, 'Оля': 11}"],["h","Найкращий результат"],["code","best = max(marks, key=marks.get)\nprint(\"Найвища оцінка в\", best)   # Оля"]]},{"n":42,"title":"Поняття вказівника. Змінні та незмінні типи (Python)","blocks":[["p","У Python змінна не «містить» значення, а **посилається** на об'єкт у пам'яті. Таке посилання схоже на **вказівник** в інших мовах: воно вказує, де лежать дані. Адресу об'єкта показує функція `id()`."],["code","a = [1, 2, 3]\nb = a              # b посилається на ТОЙ САМИЙ список\nb.append(4)\nprint(a)           # [1, 2, 3, 4] — змінився й a!\nprint(a is b)      # True — один об'єкт"],["h","Змінювані та незмінні типи"],["table",["Незмінні (immutable)","Змінювані (mutable)"],[["`int`, `float`, `bool`, `str`, `tuple`","`list`, `dict`, `set`"],["Будь-яка «зміна» створює новий об'єкт","Об'єкт змінюється на місці"]]],["code","s = \"кіт\"\nt = s\nt += \"ик\"          # створено НОВИЙ рядок\nprint(s, t)        # кіт кітик — s не змінився"],["h","Як зробити копію списку"],["code","a = [1, 2, 3]\nb = a.copy()       # або a[:] або list(a)\nb.append(4)\nprint(a, b)        # [1, 2, 3] [1, 2, 3, 4]"],["note","`==` перевіряє, чи **однакові значення**, а `is` — чи це **той самий об'єкт**. Для двох різних списків `[1, 2] == [1, 2]` дає `True`, а `[1, 2] is [1, 2]` дає `False`."]]},{"n":43,"title":"Розв'язування практичних завдань з використанням різних структур даних","blocks":[["p","Добре підібрана структура даних робить розв'язання коротким і зрозумілим. Порівняйте:"],["table",["Задача","Зручна структура"],[["Зберегти оцінки й порахувати середнє","Список"],["Знайти номер телефону за іменем","Словник"],["Прибрати повтори","Множина `set`"],["Таблиця, розклад, шахівниця","Двовимірний список"],["Незмінні координати точки","Кортеж"]]],["h","Приклад: журнал оцінок"],["code","journal = {\n    \"Оля\": [11, 10, 12],\n    \"Петро\": [8, 9, 7],\n    \"Ірина\": [10, 12, 10],\n}\naverages = {name: sum(m) / len(m) for name, m in journal.items()}\nfor name, avg in sorted(averages.items(), key=lambda p: p[1], reverse=True):\n    print(f\"{name:6} {avg:.1f}\")"],["h","Приклад: унікальні слова"],["code","text = \"хто рано встає тому бог дає хто рано\"\nunique = set(text.split())\nprint(len(unique), sorted(unique))"],["note","Цим уроком завершується підрозділ 1.4. Проводиться тематична атестація."]]}],"practice":[{"task":"Користувач вводить у рядок оцінки через пробіл. Виведіть середню, найвищу й найнижчу оцінки та кількість оцінок, вищих за середню.","answer":"marks = list(map(int, input(\"Оцінки: \").split()))\navg = sum(marks) / len(marks)\nprint(f\"Середня: {avg:.2f}\")\nprint(\"Найвища:\", max(marks), \"Найнижча:\", min(marks))\nprint(\"Вище середньої:\", len([m for m in marks if m > avg]))","code":true},{"task":"Видаліть зі списку всі повтори, зберігши порядок першої появи елементів.","answer":"a = [3, 1, 3, 2, 1, 5]\nresult = []\nfor x in a:\n    if x not in result:\n        result.append(x)\nprint(result)   # [3, 1, 2, 5]","code":true},{"task":"Відсортуйте список чисел методом вибором за спаданням (не використовуючи `sort`).","answer":"a = [4, 9, 1, 7, 3]\nn = len(a)\nfor i in range(n - 1):\n    imax = i\n    for j in range(i + 1, n):\n        if a[j] > a[imax]:\n            imax = j\n    a[i], a[imax] = a[imax], a[i]\nprint(a)   # [9, 7, 4, 3, 1]","code":true},{"task":"Створіть матрицю 4 × 4, де елемент дорівнює добутку номерів рядка і стовпця (нумерація з 1), і виведіть суму елементів кожного рядка.","answer":"m = [[(i + 1) * (j + 1) for j in range(4)] for i in range(4)]\nfor row in m:\n    print(*row, \"| сума:\", sum(row))","code":true},{"task":"Перевірте, чи є введена фраза паліндромом, ігноруючи пробіли та регістр. Приклад: «А роза упала на лапу Азора».","answer":"s = input(\"Фраза: \").lower().replace(\" \", \"\")\nprint(\"Паліндром\" if s == s[::-1] else \"Не паліндром\")","code":true},{"task":"Порахуйте, скільки разів кожна літера зустрічається в слові, за допомогою словника. Виведіть літери в алфавітному порядку.","answer":"word = input(\"Слово: \").lower()\nfreq = {}\nfor ch in word:\n    freq[ch] = freq.get(ch, 0) + 1\nfor ch in sorted(freq):\n    print(ch, freq[ch])","code":true},{"task":"Прочитайте з файлу `numbers.txt` числа (по одному в рядку) і запишіть у файл `even.txt` лише парні.","answer":"with open(\"numbers.txt\", encoding=\"utf-8\") as f:\n    nums = [int(line) for line in f if line.strip()]\nwith open(\"even.txt\", \"w\", encoding=\"utf-8\") as f:\n    for x in nums:\n        if x % 2 == 0:\n            print(x, file=f)","code":true}],"quiz":[{"q":"З якого числа починається нумерація індексів у списку Python?","o":["1","0","−1","Залежить від списку"],"a":1},{"q":"Що виведе `print([10, 20, 30, 40][-1])`?","o":["10","−1","40","Помилку"],"a":2},{"q":"Що дає зріз `[0, 1, 2, 3, 4, 5][1:4]`?","o":["[1, 2, 3, 4]","[1, 2, 3]","[0, 1, 2, 3]","[2, 3, 4]"],"a":1},{"q":"Яка умова обов'язкова для бінарного пошуку?","o":["Список має бути коротким","Список має бути відсортованим","Елементи мають бути додатними","Немає жодних умов"],"a":1},{"q":"Яка структура працює за принципом «останнім прийшов — першим вийшов»?","o":["Черга","Стек","Словник","Множина"],"a":1},{"q":"Який метод вставляє елемент x на позицію i?","o":["a.append(i, x)","a.insert(i, x)","a.add(i, x
