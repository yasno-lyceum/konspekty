ючи клітинки змінних: `$B$1:$B$2`.","Обмеження: `$B$5 \u003c= 40`, `$B$6 >= 0`, `$B$1:$B$2 = ціле`.","Метод: «Симплекс-метод» (для лінійних задач). Позначити «Зробити змінні без обмежень невід'ємними».","Натиснути «Знайти розв'язок»."]],["p","**Результат**: x = 5 столів, y = 20 стільців, прибуток P = 5 · 600 + 20 · 200 = 7000 грн. Використано 4 · 5 + 20 = 40 год."],["h","Перевірка перебором (Python)"],["code","best = (0, 0, 0)\nfor x in range(11):\n    for y in range(41):\n        if 4 * x + y \u003c= 40 and y \u003c= 4 * x:\n            p = 600 * x + 200 * y\n            if p > best[0]:\n                best = (p, x, y)\nprint(best)   # (7000, 5, 20)"],["h","Типові оптимізаційні задачі"],["ul",["Задача про раціон: найдешевше меню з потрібною кількістю поживних речовин.","Транспортна задача: найдешевше перевезення від складів до магазинів.","Задача про розклад: розподіл змін працівників.","Задача про розкрій: мінімум відходів матеріалу."]]]},{"n":108,"title":"Візуалізація рядів і трендів даних","blocks":[["h","Вибір типу діаграми"],["table",["Мета","Тип діаграми"],[["Зміна в часі","Лінійна (графік)"],["Порівняння категорій","Стовпчаста або лінійчата"],["Частки цілого (до 5–6 частин)","Кругова або кільцева"],["Зв'язок двох величин","Точкова"],["Розподіл значень","Гістограма"]]],["h","Лінія тренду"],["p","**Тренд** — загальна тенденція зміни даних. Щоб додати лінію тренду: виділіть ряд на діаграмі → «Додати лінію тренду» (Excel) або Налаштування → Серії → Лінія тренду (Google). Типи: лінійна, експоненційна, поліноміальна."],["p","Можна показати **рівняння** лінії та **R²** — наскільки добре лінія описує дані (ближче до 1 — краще). Продовжуючи лінію вперед, отримують **прогноз**."],["p","Функції прогнозу: `=FORECAST(x; відомі_y; відомі_x)` (в нових версіях `FORECAST.LINEAR`), `=TREND()`."],["note","Правила хорошої діаграми: зрозумілий заголовок, підписані осі з одиницями, вісь значень зі стовпців починається з нуля, мінімум зайвих прикрас."]]},{"n":109,"title":"Інфографіка","blocks":[["p","**Інфографіка** — графічне подання інформації, даних і знань, призначене швидко й наочно донести суть складної теми."],["h","Види інфографіки"],["ul",["**Статистична** — числа й діаграми.","**Хронологічна** — події на часовій шкалі.","**Процесна** — етапи, інструкції, схеми.","**Порівняльна** — «до і після», «А проти Б».","**Географічна** — дані на карті."]],["h","Принципи створення"],["ol",["Одна головна ідея та чіткий заголовок.","Достовірні дані з указаними джерелами.","Візуальна ієрархія: найважливіше — найбільше.","Обмежена палітра (2–4 кольори) та 1–2 шрифти.","Піктограми замість зайвого тексту.","Читання зверху вниз або зліва направо."]],["h","Сервіси"],["p","Canva, Piktochart, Infogram, Venngage, Flourish. Для простої інфографіки підійдуть і Google Презентації."]]},{"n":110,"title":"Інтерактивні візуалізації даних","blocks":[["p","**Інтерактивна візуалізація** дозволяє користувачу взаємодіяти з даними: наводити курсор для підказок, фільтрувати, змінювати масштаб, обирати період."],["h","Інструменти"],["table",["Інструмент","Можливості"],[["Google Таблиці / Excel","Зрізи (slicers) і фільтри для зведених таблиць і діаграм"],["Looker Studio (Google)","Безкоштовні дашборди з даних Google Таблиць"],["Power BI","Професійні інтерактивні звіти"],["Flourish, Datawrapper","Анімовані та інтерактивні діаграми для сайтів"],["Python: plotly","Інтерактивні графіки з коду"]]],["h","Дашборд"],["p","**Дашборд** — сторінка з ключовими показниками та діаграмами, які оновлюються разом з даними. Наприклад, дашборд успішності класу: середній бал, розподіл оцінок, динаміка по місяцях, фільтр за предметом."],["code","import plotly.express as px\nfig = px.line(x=[\"Вер\", \"Жов\", \"Лис\"], y=[9.1, 9.4, 8.8], title=\"Середній бал\", markers=True)\nfig.show()   # відкриється в браузері з підказками при наведенні"]]},{"n":111,"title":"Розв'язання задач з різних предметних галузей","blocks":[["p","Табличний процесор і програмування допомагають розв'язувати задачі з різних предметів."],["table",["Предмет","Задача","Інструменти"],[["Фізика","Рівноприскорений рух: таблиця s(t) і графік","Формули, лінійна діаграма"],["Хімія","Масова частка речовини в розчині","Формули з відсотками"],["Біологія","Зростання популяції бактерій","Експоненційна модель, тренд"],["Географія","Густота населення областей","Ділення, сортування, карта"],["Економіка","Порівняння кредитів і депозитів","PMT, FV, діаграми"],["Математика","Дослідження функції, корені","Таблиця значень, графік, підбір параметра"]]],["h","Приклад: популяція бактерій"],["code","n = 100                 # початкова кількість\nfor hour in range(0, 7):\n    print(hour, \"год:\", n)\n    n *= 2              # подвоюється щогодини"],["p","У таблиці: A2 = 0, B2 = 100, B3 = `=B2*2`, копіювати вниз; потім діаграма з експоненційною лінією тренду."]]},{"n":112,"title":"Компроміси між різними формами представлення цифрової інформації","blocks":[["p","Ті самі дані можна подати таблицею, діаграмою, текстом, інфографікою, інтерактивною панеллю. Кожна форма має переваги й недоліки."],["table",["Форма","Переваги","Недоліки"],[["Таблиця","Точні значення, легко шукати","Важко побачити тенденцію"],["Діаграма","Наочні тенденції й порівняння","Втрачаються точні числа"],["Текст","Пояснює причини й висновки","Довго читати"],["Інфографіка","Швидко сприймається, привертає увагу","Спрощує, можливі маніпуляції"],["Інтерактивна панель","Користувач сам досліджує дані","Потребує пристрою й часу на освоєння"]]],["h","Інші компроміси"],["ul",["**Якість ↔ розмір файлу**: стиснення JPEG зменшує розмір, але погіршує якість.","**Точність ↔ простота**: округлені числа легше читати.","**Формат ↔ сумісність**: PDF виглядає однаково всюди, але незручний для редагування.","**Відкритість ↔ приватність** даних."]],["p","Вибір форми залежить від **аудиторії** та **мети**: для звіту директору — коротка інфографіка, для аналітика — повна таблиця."]]},{"n":113,"title":"Виконання індивідуальних та колективних проектів","blocks":[["p","Проєкт «Дослідження даних»: зібрати дані, проаналізувати їх і представити висновки."],["h","Теми"],["ul",["Як учні нашого ліцею проводять вільний час (опитування).","Динаміка цін на продукти за рік.","Погода в Рівному: порівняння місяців і років.","Зв'язок між часом сну та самопочуттям.","Населення областей України: аналіз відкритих даних."]],["h","Урок 1: планування й збір даних"],["ol",["Сформулювати питання дослідження і гіпотезу.","Обрати джерело або скласти анкету (Google Форма).","Зібрати не менше 30 записів.","Очистити дані: прибрати порожні та помилкові відповіді."]]]},{"n":114,"title":"Виконання індивідуальних та колективних проектів","blocks":[["h","Урок 2: аналіз"],["ol",["Обчислити статистичні характеристики (середнє, медіана, мода, розмах).","Побудувати зведену таблицю за категоріями.","Перевірити зв'язок між двома величинами (кореляція).","Побудувати 2–3 діаграми відповідного типу.","Підтвердити або спростувати гіпотезу."]]]},{"n":115,"title":"Виконання індивідуальних та колективних проектів","blocks":[["h","Урок 3: представлення результатів"],["ol",["Створити інфографіку або дашборд з основними висновками.","Підготувати виступ на 5 хвилин.","Вказати джерела даних і обмеження дослідження."]],["h","Критерії оцінювання"],["table",["Критерій","Бали"],[["Чітке питання дослідження та якісні дані","2"],["Правильні обчислення і зведені таблиці","3"],["Доречні та оформлені діаграми","3"],["Обґрунтовані висновки","2"],["Презентація","2"]]],["note","Цим уроком завершується тема 3. Проводиться тематична атестація."]]}],"practice":[{"task":"Розв'яжіть систему 3x + 2y = 16, x − y = 2 матричним методом в електронній таблиці.","answer":"x = 4, y = 2. Формула: =MMULT(MINVERSE(A1:B2);D1:D2)."},{"task":"Пекарня пече булки (прибуток 5 грн, 0,1 кг борошна) і пиріжки (8 грн, 0,2 кг). Борошна 50 кг, пиріжків не більше 150. Знайдіть оптимальний план.","answer":"Обмеження: 0,1x + 0,2y ≤ 50; y ≤ 150. Оптимум: x = 500, y = 0 → 2500 грн (булки вигідніші на кілограм борошна: 50 грн/кг проти 40 грн/кг)."},{"task":"Побудуйте лінійну діаграму середньої температури за 12 місяців з лінією тренду і поясніть, чи підходить тут лінійний тренд.","answer":"Ні: температура змінюється циклічно (сезонно), лінійна лінія погано описує дані — R² буде низьким. Краще поліноміальний тренд 2-го степеня."},{"task":"Оберіть одні й ті самі дані (наприклад, оцінки класу) і представте їх двома способами: таблицею і діаграмою. Опишіть, що краще видно в кожному.","answer":"Таблиця: точні оцінки кожного учня. Діаграма: розподіл і загальний рівень класу."}],"quiz":[{"q":"Як називається величина, яку потрібно максимізувати чи мінімізувати?","o":["Обмеження","Цільова функція","Змінна","Параметр"],"a":1},{"q":"Яка надбудова розв'язує оптимізаційні задачі в Excel?","o":["Підбір параметра","Пошук розв'язку (Solver)","Зведена таблиця","Фільтр"],"a":1},{"q":"Яка функція знаходить обернену матрицю?","o":["MMULT","MINVERSE","MDETERM","TRANSPOSE"],"a":1},{"q":"Який тип діаграми найкраще показує зміну величини в часі?","o":["Кругова","Лінійна","Точкова","Пелюсткова"],"a":1},{"q":"Що показує R² для лінії тренду?","o":["Кількість точок","Наскільки добре лінія описує дані","Середнє значення","Кут нахилу"],"a":1},{"q":"Що таке дашборд?","o":["Таблиця без формул","Сторінка з ключовими показниками і діаграмами","Тип шрифту","Формат файлу"],"a":1},{"q":"Головна перевага таблиці порівняно з діаграмою…","o":["Наочні тенденції","Точні значення","Привертає увагу","Анімація"],"a":1},{"q":"Що з переліченого є обмеженням в оптимізаційній задачі?","o":["Прибуток → max","Робочих годин не більше 40","Кількість столів x","Ціна стола"],"a":1}]},{"id":"t4","topic":4,"code":"4","title":"Електронні публікації","lessons":[{"n":116,"title":"Комп'ютерна верстка. Програми для комп'ютерної верстки","blocks":[["p","**Комп'ютерна верстка** — розміщення тексту, зображень та інших елементів на сторінках видання за допомогою комп'ютера. **Видавнича система** — програма для верстки."],["table",["Програма","Особливості"],[["Adobe InDesign","Професійний стандарт для журналів і книг (платна)"],["Scribus","Безкоштовна відкрита видавнича система"],["Affinity Publisher","Професійна, одноразова покупка"],["Microsoft Publisher","Проста верстка буклетів і листівок"],["Canva","Онлайн-сервіс з шаблонами, зручний для початківців"],["Google Документи / Word","Прості публікації, звіти"]]],["h","Основні поняття"],["ul",["**Макет** — схема розташування елементів на сторінці.","**Модульна сітка** — система напрямних, що впорядковує елементи.","**Поля** — відступи від країв сторінки.","**Блоки** (фрейми) — прямокутні області для тексту чи зображень.","**Шпальта** — сторінка видання; **колонка** — вертикальна смуга тексту."]],["note","Для друку використовують колірну модель **CMYK** і роздільність 300 dpi, для екрана — **RGB** і 72–150 dpi."]]},{"n":117,"title":"Композиційні прийоми створення листівки","blocks":[["p","**Композиція** — розташування елементів так, щоб утворилося гармонійне ціле і погляд глядача рухався в потрібному напрямку."],["h","Прийоми композиції"],["ul",["**Правило третин**: сторінку ділять двома горизонтальними і двома вертикальними лініями; важливі елементи ставлять на перетинах.","**Центр уваги (домінанта)**: один головний елемент, найбільший чи найяскравіший.","**Симетрія** — спокій, урочистість; **асиметрія** — динаміка.","**Контраст**: розміру, кольору, форми.","**Вільний простір**: порожнє місце дає елементам «дихати».","**Вирівнювання**: усі елементи вирівняні за спільними лініями."]],["h","Створення листівки (Canva / Scribus)"],["ol",["Обрати формат: A6 (105 × 148 мм) або 10 × 15 см.","Визначити головний образ (фото чи ілюстрацію).","Додати привітання — 1–2 шрифти, що добре читаються.","Вирівняти елементи за сіткою.","На звороті — текст привітання та місце для підпису.","Зберегти в PDF для друку або PNG для пересилання."]]]},{"n":118,"title":"Створення обкладинки журналу","blocks":[["h","Елементи обкладинки"],["ul",["**Логотип (назва журналу)** — угорі, завжди в одному стилі.","**Головне зображення** — найчастіше на всю площу.","**Анонси** — заголовки головних матеріалів номера.","**Вихідні дані**: номер, дата, ціна, штрих-код.","**Слоган** (за бажанням)."]],["h","Порядок роботи"],["ol",["Документ формату A4 (210 × 297 мм) з **випусками під обріз** 3 мм.","Розмістити фото на весь аркуш, включно з випусками.","Додати логотип; частина фото може перекривати логотип — популярний прийом.","Розмістити анонси з урахуванням вільних місць фото, щоб не закривати обличчя.","Перевірити читабельність: контраст тексту з фоном.","Експортувати в PDF для друку."]],["note","**Випуск під обріз** — зображення виходить за межі сторінки на 3–5 мм, щоб після обрізки не лишилося білих смуг."]]},{"n":119,"title":"Багатосторінкові видання та їх формат","blocks":[["h","Види багатосторінкових видань"],["ul",["**Книга** — понад 48 сторінок, тверда або м'яка обкладинка.","**Брошура** — від 5 до 48 сторінок.","**Журнал** — періодичне видання з багатьма ілюстраціями.","**Газета** — періодичне видання великого формату.","**Каталог, звіт, методичка**."]],["h","Формати"],["table",["Формат","Розмір, мм","Застосування"],[["A3","297 × 420","Плакати, газети"],["A4","210 × 297","Журнали, звіти"],["A5","148 × 210","Книги, брошури"],["A6","105 × 148","Листівки, кишенькові видання"]]],["h","Особливості верстки"],["ul",["**Розворот** — дві сусідні сторінки, які читач бачить одночасно; верстають розворотами.","**Сторінки-шаблони (мастер-сторінки)** — спільні елементи всіх сторінок: колонтитули, номери.","**Колонтитул** — рядок угорі чи внизу сторінки з назвою розділу.","**Зошит** — аркуш, складений кілька разів; кількість сторінок брошури кратна 4."]]]},{"n":120,"title":"Робота з текстом. Макетування","blocks":[["h","Типографські параметри тексту"],["ul",["**Кегль** — розмір шрифту в пунктах (pt). Основний текст: 9–12 pt.","**Інтерліньяж** — відстань між рядками: ≈ 120–145% кегля.","**Трекінг** — загальна відстань між літерами; **кернінг** — між окремими парами літер.","**Вирівнювання**: за лівим краєм — найлегше читати; за шириною — для книг, з переносами.","**Абзацний відступ** або відбивка між абзацами."]],["h","Текстові блоки"],["p","У видавничих системах текст розміщують у **зв'язаних блоках**: те, що не вмістилося в один блок, «перетікає» в наступний. Червоний значок «+» у кінці блоку означає надлишковий (прихований) текст."],["h","Стилі"],["p","**Стилі абзаців і символів** (заголовок, основний текст, підпис) задають оформлення один раз. Змінивши стиль, ви змінюєте всі абзаци з ним."],["h","Макетування"],["p","Перед версткою роблять **ескіз-макет** на папері або в програмі: де буде заголовок, текст, фото. Це економить час і допомагає узгодити дизайн."]]},{"n":121,"title":"Основи композиції і архітектоніки багатосторінкового видання","blocks":[["p","**Архітектоніка видання** — побудова видання як цілого: порядок частин, їх співвідношення та єдиний стиль."],["h","Структура книги"],["ol",["Обкладинка і форзац.","Титульний аркуш (автор, назва, видавництво).","Зворот титулу (вихідні дані, ISBN).","Зміст.","Передмова.","Основний текст (розділи).","Додатки, покажчики, список літератури."]],["h","Принципи єдності видання"],["ul",["Однакова **модульна сітка** на всіх сторінках.","Обмежений набір **шрифтів і стилів**.","Сталі місця для колонтитулів і номерів сторінок.","Повторювані графічні елементи (кольорові плашки розділів, іконки).","Ритм: чергування текстових сторінок і ілюстрацій."]],["p","**Пропорції полів**: класичний принцип — внутрішнє поле найменше, потім верхнє, зовнішнє, нижнє найбільше (приблизно 2 : 3 : 4 : 6)."]]},{"n":122,"title":"Буклет. Призначення. Принципи композиції. Види буклетів","blocks":[["p","**Буклет** — неброшуроване видання з одного аркуша, складеного в кілька разів (фальцованого). Використовують для реклами, інформування, запрошень."],["h","Види буклетів за фальцюванням"],["table",["Вид","Опис"],[["Одне згинання","Аркуш навпіл: 4 сторінки"],["Євробуклет (рулон)","A4 у три частини, згинання всередину: 6 сторінок"],["Гармошка","Згинання по черзі в різні боки"],["Віконний фальц","Дві крайні частини згинаються до центру"]]],["h","Композиція євробуклета"],["ul",["**Обкладинка** — права частина зовнішнього боку: назва, логотип, зображення.","**Задня сторінка** — середня частина зовнішнього боку: контакти, карта.","**Перший розворот** — ліва частина зовнішнього боку, яку бачать, відкривши обкладинку.","**Внутрішній бік** — три частини з основною інформацією."]],["note","Перед друком складіть паперовий макет і підпишіть кожну частину, щоб не переплутати порядок."]]},{"n":123,"title":"Розробка дизайну афіш, квитків, флаєрів, постерів тощо","blocks":[["table",["Продукт","Призначення","Особливості"],[["Афіша","Оголошення про подію","Що, де, коли — великим шрифтом; читається здалеку"],["Постер","Художній плакат","Сильний образ, мінімум тексту"],["Флаєр","Роздатковий рекламний листок","Малий формат (A6, євро 99 × 210), заклик до дії"],["Квиток","Документ на вхід","Назва події, дата, місце, ряд, номер; захист (QR-код)"],["Банер","Реклама в інтернеті чи на вулиці","Стандартні розміри, швидке сприйняття"]]],["h","Правило ієрархії інформації"],["ol",["Привернути увагу: зображення або гасло.","Головна інформація: назва події.","Деталі: дата, час, місце.","Заклик до дії: «Реєструйтеся за QR-кодом»."]],["p","**Тест 3 секунд**: якщо за 3 секунди погляду на афішу незрозуміло, що за подія, дизайн треба спростити."]]},{"n":124,"title":"Виконання індивідуальних та колективних проектів","blocks":[["p","Проєкт «Друкована продукція для події»: створіть комплект матеріалів для реальної чи вигаданої події ліцею (концерт, ярмарок, день відкритих дверей)."],["h","Склад комплекту"],["ul",["Афіша формату A3 або A4.","Флаєр.","Квиток або запрошення.","Буклет з програмою події."]],["h","Вимоги"],["ol",["Єдиний стиль: ті самі кольори, шрифти, логотип події.","Правильні формати та поля, випуски під обріз.","Без орфографічних помилок.","Експорт у PDF для друку."]]]},{"n":125,"title":"Засоби спільної роботи для спілкування з членами проектної групи","blocks":[["table",["Задача","Засоби"],[["Обмін повідомленнями","Telegram, Viber, Slack, Discord"],["Відеозустрічі","Google Meet, Zoom, Microsoft Teams"],["Спільне редагування","Google Документи, Canva (спільний доступ), Figma"],["Зберігання файлів","Google Диск, OneDrive, Dropbox"],["Планування задач","Trello, Notion, Google Таблиці"],["Мозковий штурм","Miro, Jamboard, FigJam"]]],["h","Правила ефективної комунікації в команді"],["ul",["Один основний канал для проєкту.","Чіткі повідомлення: що, хто, до коли.","Коментарі в документах замість довгих листувань.","Короткі регулярні зустрічі (10–15 хв).","Повага до часу й думки інших; конструктивна критика."]],["p","**Права доступу** у спільних документах: «Читач», «Коментатор», «Редактор». Надавайте лише потрібні права."]]},{"n":126,"title":"Нові форми досвіду, вираження, спілкування та співпраці в ІТ","blocks":[["ul",["**Соціальні мережі та блоги** — кожен може стати автором і мати аудиторію.","**Подкасти та стріми** — аудіо- й відеоконтент у реальному часі.","**Віртуальна й доповнена реальність** — спільні віртуальні простори, AR-фільтри, віртуальні екскурсії.","**Онлайн-спільноти** — форуми, Discord-сервери, відкриті проєкти на GitHub.","**Вікі-проєкти** — колективне створення знань (Вікіпедія).","**Краудфандинг і волонтерство онлайн**.","**Генеративний ШІ** — нові інструменти творчості."]],["p","Ці форми змінюють спосіб навчання, роботи й дозвілля: люди з різних країн разом створюють ігри, музику, програми, не зустрічаючись особисто."],["note","Публікуючи власний контент, пам'ятайте про авторське право: використовуйте зображення з ліцензією Creative Commons або власні, і вказуйте авторів."]]},{"n":127,"title":"Позитивний та негативний вплив ІТ на поведінку та культуру","blocks":[["table",["Позитивний вплив","Негативний вплив"],[["Доступ до знань і освіти","Інформаційне перевантаження"],["Спілкування на відстані","Залежність від гаджетів і соцмереж"],["Нові професії та можливості","Кібербулінг"],["Збереження й поширення культури","Поширення фейків і дезінформації"],["Інклюзія: допоміжні технології для людей з інвалідністю","Порушення приватності"],["Громадянська активність","Зменшення фізичної активності, проблеми із зором і сном"]]],["h","Цифрова гігієна"],["ul",["Обмежуйте екранний час, вимикайте зайві сповіщення.","Правило 20-20-20: кожні 20 хв дивіться 20 с на об'єкт за 20 футів (≈ 6 м).","Не беріть телефон у ліжко за годину до сну.","Перевіряйте інформацію перед поширенням.","Повідомляйте дорослих про кібербулінг."]]]},{"n":128,"title":"Мультимедійні засоби та периферійні пристрої для підтримки особистої продуктивності та навчання","blocks":[["table",["Пристрій / засіб","Як допомагає"],[["Графічний планшет","Малювання, рукописні нотатки, дизайн"],["Документ-камера, сканер","Оцифрування документів і конспектів"],["Навушники з мікрофоном","Онлайн-уроки, запис подкастів"],["Вебкамера","Відеоконференції"],["Другий монітор","Робота з кількома вікнами"],["Електронна книга","Читання без втоми очей"],["Інтерактивна дошка, проєктор","Презентації та спільна робота"],["3D-принтер","Виготовлення моделей і прототипів"]]],["h","Програми для продуктивності"],["ul",["Нотатки: Google Keep, OneNote, Notion.","Таймер «Помодоро»: 25 хв роботи + 5 хв перерви.","Розпізнавання мовлення (диктування тексту).","Читання тексту вголос (озвучування)."]]]},{"n":129,"title":"Виконання індивідуальних та колективних проектів","blocks":[["p","Підсумковий проєкт теми: **багатосторінкове видання** — шкільний журнал, газета, путівник Рівним, збірка творів класу."],["h","Урок 1: підготовка"],["ol",["Обрати тип видання і цільову аудиторію.","Розподілити ролі: редактор, автори, дизайнер, верстальник, коректор.","Скласти план-змісту і макет (8–12 сторінок).","Зібрати тексти та зображення у спільній папці."]]]},{"n":130,"title":"Виконання індивідуальних та колективних проектів","blocks":[["h","Урок 2: верстка і захист"],["ol",["Налаштувати мастер-сторінки, стилі абзаців і сітку.","Зверстати сторінки, вичитати текст.","Експортувати в PDF, за можливості — роздрукувати.","Представити видання та розповісти про процес роботи."]],["h","Критерії оцінювання"],["table",["Критерій","Бали"],[["Змістовність і грамотність текстів","3"],["Композиція та єдиний стиль","3"],["Технічна якість (формати, стилі, зображення)","3"],["Командна робота й презентація","3"]]],["note","Цим уроком завершується тема 4. Проводиться тематична атестація."]]}],"practice":[{"task":"Створіть святкову листівку формату A6 із застосуванням правила третин. Збережіть у PDF.","answer":"Головний образ на перетині ліній третин, 1–2 шрифти, достатній вільний простір, вирівнювання за сіткою."},{"task":"Зробіть паперовий макет євробуклета для вашого ліцею і підпишіть, що буде на кожній із 6 частин.","answer":"Зовнішній бік: ліва — перший розворот (про ліцей), середня — контакти й карта, права — обкладинка. Внутрішній: три частини з основною інформацією."},{"task":"Створіть афішу шкільного концерту й перевірте її «тестом 3 секунд» на однокласниках.","answer":"Назва події — найбільшим шрифтом, дата/час/місце — другим рівнем, заклик до дії і QR-код — унизу."},{"task":"Порахуйте свій екранний час за тиждень (налаштування телефона) і складіть 3 правила цифрової гігієни для себе.","answer":"Наприклад: без телефона за годину до сну; вимкнути сповіщення соцмереж; правило 20-20-20 під час навчання."}],"quiz":[{"q":"Яка програма є безкоштовною видавничою системою?","o":["Adobe InDesign","Scribus","Affinity Publisher","Photoshop"],"a":1},{"q":"Яку колірну модель використовують для друку?","o":["RGB","CMYK","HSV","HEX"],"a":1},{"q":"Що таке випуск під обріз?","o":["Видання без обкладинки","Вихід зображення за межі сторінки на 3–5 мм","Обрізаний текст","Порожня сторінка"],"a":1},{"q":"Як називається відстань між рядками тексту?","o":["Кегль","Кернінг","Інтерліньяж","Трекінг"],"a":2},{"q":"Скільки сторінок має євробуклет (аркуш A4 у три частини)?","o":["3","4","6","8"],"a":2},{"q":"Розмір формату A4…","o":["148 × 210 мм","210 × 297 мм","297 × 420 мм","105 × 148 мм"],"a":1},{"q":"Яке правило композиції ділить сторінку двома горизонтальними і двома вертикальними лініями?","o":["Правило третин","Золотий переріз","Модульна сітка","Симетрія"],"a":0},{"q":"Що з переліченого є негативним впливом ІТ?","o":["Доступ до освіти","Кібербулінг","Нові професії","Допоміжні технології"],"a":1}]},{"id":"t5a","topic":5,"code":"5.1","title":"Дизайн, типографіка і растрова графіка","lessons":[{"n":131,"title":"Дизайн і його тенденції. Цифрове мистецтво","blocks":[["p","**Дизайн** — проєктування зовнішнього вигляду і зручності предметів, зображень, інтерфейсів так, щоб вони були і красивими, і функціональними. **Графічний дизайн** працює з візуальною комунікацією: логотипи, плакати, сайти, упаковка."],["h","Сучасні тенденції"],["ul",["**Мінімалізм** і багато вільного простору.","**Сміливі шрифти** як головний елемент.","**Плоский дизайн** та **неоморфізм** в інтерфейсах.","**Градієнти** та яскраві кольори.","**3D-елементи** й ізометрія.","**Адаптивність** — дизайн для різних екранів.","**Інклюзивність** — доступність для людей з порушеннями зору."]],["h","Цифрове мистецтво"],["p","**Цифрове мистецтво** — твори, створені за допомогою цифрових технологій: цифровий живопис на планшеті, піксель-арт, 3D-скульптура, генеративне мистецтво, анімація, фотоманіпуляції, NFT-мистецтво."],["p","Інструменти: Procreate, Krita, Adobe Photoshop, GIMP, Blender, Aseprite (піксель-арт)."]]},{"n":132,"title":"Сучасна реклама та фірмовий стиль. Електронні та друковані портфоліо","blocks":[["h","Сучасна реклама"],["ul",["**Таргетована реклама** в соцмережах — показується людям за інтересами.","**Контекстна** — у пошукових системах за запитами.","**Інфлюенс-маркетинг** — через блогерів.","**Нативна реклама** — у формі корисного контенту.","**Зовнішня**: білборди, сітілайти, цифрові екрани."]],["p","Формула ефективної реклами **AIDA**: Attention (увага) → Interest (інтерес) → Desire (бажання) → Action (дія)."],["h","Фірмовий стиль"],["p","**Фірмовий стиль** — набір візуальних елементів, за якими впізнають компанію: логотип, кольори, шрифти, графічні елементи, стиль фото. Детально розглянемо його на уроці 146."],["h","Портфоліо"],["p","**Портфоліо** — добірка найкращих робіт для демонстрації навичок."],["ul",["**Електронне**: Behance, Dribbble, власний сайт, Google Сайти, PDF-презентація.","**Друковане**: альбом, папка з роботами для співбесід."]],["p","Добре портфоліо: 8–15 найкращих робіт, короткий опис задачі й вашої ролі до кожної, контакти."]]},{"n":133,"title":"Типографіка, шрифти і шрифтові пари. Коротка історія дизайну і типографіки","blocks":[["p","**Типографіка** — мистецтво оформлення тексту: вибір шрифтів, розмірів, інтервалів, розташування."],["h","Класифікація шрифтів"],["table",["Група","Ознаки","Приклади"],[["Антиква (із засічками, serif)","Засічки на кінцях штрихів, класичний вигляд","Times New Roman, Georgia, PT Serif"],["Гротеск (без засічок, sans-serif)","Прості, сучасні, добре читаються на екрані","Arial, Roboto, Montserrat"],["Моноширинні","Однакова ширина всіх символів","Consolas, Courier New"],["Рукописні","Імітують письмо","Marck Script, Caveat"],["Декоративні (акцидентні)","Для заголовків, не для тексту","Lobster, Rubik Mono One"]]],["h","Шрифтові пари"],["ul",["Поєднуйте **контрастні** шрифти: антикву із гротеском.","Не більше **2–3 шрифтів** в одному макеті.","Створюйте контраст **накресленням** (жирний/звичайний) і **розміром**.","Перевіряйте підтримку **кирилиці** (ґ, є, і, ї)."]],["p","Приклади пар: Playfair Display + Source Sans; Montserrat + Lora; Roboto Slab + Roboto."],["h","Коротка історія"],["ul",["XV ст. — Йоганн Гутенберг винайшов друкарський верстат з рухомими літерами.","1574 — Іван Федоров видав у Львові «Апостол», першу датовану друковану книгу в Україні.","1919–1933 — школа **Баугауз** заклала основи сучасного дизайну: функціональність, геометрія.","1917–1920 — Георгій Нарбут створив українську абетку, банкноти й марки УНР.","1980-ті — настільні видавничі системи, цифрові шрифти."]]]},{"n":134,"title":"Растровий графічний редактор як інструмент для дизайну","blocks":[["p","**Растрове зображення** складається з пікселів — дрібних кольорових квадратиків. Якість залежить від **роздільності** (кількість пікселів). Під час збільшення растр втрачає чіткість."],["table",["Редактор","Особливості"],[["Adobe Photoshop","Професійний стандарт (платний)"],["GIMP","Безкоштовний, відкритий"],["Photopea","Онлайн, інтерфейс як у Photoshop, відкриває PSD"],["Krita","Безкоштовний, для цифрового малювання"],["Pixlr","Простий онлайн-редактор"]]],["h","Основні інструменти"],["ul",["**Виділення**: прямокутне, еліптичне, ласо, чарівна паличка (за кольором).","**Пензель**, **олівець**, **гумка**, **заливка**, **градієнт**.","**Штамп** і **відновлювальний пензель** — для ретуші.","**Кадрування** — обрізка зображення.","**Текст**, **піпетка** (взяти колір)."]],["h","Формати растрових файлів"],["table",["Формат","Особливості"],[["JPEG","Стиснення з втратами, фото"],["PNG","Без втрат, прозорість"],["GIF","256 кольорів, анімація"],["WebP","Сучасний формат для вебу"],["PSD / XCF","Робочі формати Photoshop / GIMP із шарами"]]]]},{"n":135,"title":"Концепція побудови пошарового зображення. Робота з шарами","blocks":[["p","**Шар** — окреме зображення, наче прозора плівка. Шари накладаються один на одного; верхні перекривають нижні. Шари дозволяють редагувати частини зображення незалежно."],["h","Операції з шарами"],["ul",["Створити, видалити, дублювати шар.","Змінити порядок (перетягнути в панелі «Шари»).","Приховати/показати (значок ока).","Змінити **непрозорість** (0–100%).","Обрати **режим накладання**: Звичайний, Множення, Екран, Перекриття тощо.","Згрупувати шари, об'єднати шари."]],["h","Маска шару"],["p","**Маска шару** дозволяє приховати частину шару, не видаляючи пікселів: **чорне** на масці приховує, **біле** показує, **сіре** робить напівпрозорим. Помилку завжди можна виправити, перефарбувавши маску."],["note","Зберігайте робочий файл у форматі з шарами (PSD, XCF), а для публікації експортуйте копію в JPEG чи PNG."]]},{"n":136,"title":"Створення колажів. Прийоми колажування","blocks":[["p","**Колаж** — композиція з кількох зображень або їх фрагментів, об'єднаних спільною ідеєю."],["h","Прийоми"],["ul",["**Вирізання об'єктів** з фону (виділення + маска).","**Узгодження кольору й освітлення** фрагментів (корекція рівнів, кольоровий баланс).","**Тіні й відблиски** для реалістичності.","**Режими накладання** для поєднання текстур.","**Розмиття країв** (розтушування) для плавних переходів.","**Масштаб і перспектива**: дальні об'єкти менші й світліші."]],["h","Порядок створення"],["ol",["Задум і ескіз.","Підбір зображень із дозволом на використання (Unsplash, Pexels або власні фото).","Створення фону.","Вирізання і розміщення об'єктів на окремих шарах.","Узгодження кольору, тіней.","Фінальна корекція та експорт."]]]},{"n":137,"title":"Робота з текстом","blocks":[["p","У растровому редакторі текст створюється на окремому **текстовому шарі**, який можна редагувати, доки його не **растеризовано** (перетворено на пікселі)."],["h","Можливості"],["ul",["Шрифт, розмір, колір, міжлітерний і міжрядковий інтервали.","**Стилі шару**: тінь, обведення, світіння, тиснення, градієнт.","**Текст по контуру** — уздовж кривої.","**Деформація тексту**: дуга, хвиля, прапор.","**Текст-маска**: зображення «всередині» літер (обтравочна маска)."]],["h","Ефект «фото в тексті»"],["ol",["Створіть текстовий шар великим жирним шрифтом.","Над ним розмістіть шар із фото.","Застосуйте до фото **обтравочну маску** (Photoshop/Photopea: Alt + клік між шарами; GIMP: шар → маска з альфа-каналу тексту).","Фото буде видно лише в межах літер."]]]},{"n":138,"title":"Робота з векторними елементами","blocks":[["p","Растрові редактори мають і **векторні інструменти**: фігури (прямокутник, еліпс, багатокутник) та **перо** для побудови контурів. Векторні фігури не втрачають якості під час масштабування."],["h","Застосування"],["ul",["Кнопки, плашки, рамки для вебдизайну.","Точне виділення об'єктів пером (контур → виділення).","Логотипи та іконки в растровому макеті.","Векторні маски."]],["h","Інструмент «Перо»"],["p","Клік ставить **опорну точку** (прямий відрізок); клік з перетягуванням створює **криву** з напрямними. Контур можна перетворити на виділення або залити кольором."],["note","Для складної векторної графіки зручніше використовувати векторний редактор (тема уроків 148–152)."]]},{"n":139,"title":"Ретуш та художня обробка зображень","blocks":[["p","**Ретуш** — виправлення недоліків фото: подряпин, пилу, плям, небажаних об'єктів."],["table",["Інструмент","Дія"],[["Штамп (клонування)","Копіює ділянку зображення в інше місце"],["Відновлювальний пензель","Як штамп, але підлаштовує колір і текстуру"],["Точковий відновлювальний пензель","Видаляє дрібні дефекти одним кліком"],["Заплатка / заповнення з урахуванням вмісту","Заповнює виділену область на основі оточення"],["Освітлювач / затемнювач","Локально освітлює чи затемнює"],["Розмиття / різкість","Пом'якшує чи підсилює деталі"]]],["h","Художня обробка"],["p","**Фільтри** перетворюють фото на «картину»: олійний живопис, акварель, ескіз олівцем, мозаїка, шум, розмиття в русі. Комбінуючи фільтри, шари і режими накладання, створюють власний художній стиль."],["note","Ретушуючи портрети, зберігайте природність: надмірна обробка робить обличчя «пластиковим»."]]},{"n":140,"title":"Тонова корекція зображень. Робота з кольором","blocks":[["p","**Тонова корекція** змінює яскравість і контрастність зображення. Допомагає **гістограма** — графік розподілу пікселів від темних (ліворуч) до світлих (праворуч)."],["table",["Інструмент","Що робить"],[["Рівні (Levels)","Задає точки чорного, білого і середніх тонів"],["Криві (Curves)","Гнучко змінює тони; S-подібна крива підсилює контраст"],["Яскравість/контраст","Проста загальна корекція"],["Тон/насиченість (Hue/Saturation)","Змінює колір і його інтенсивність"],["Кольоровий баланс","Прибирає небажаний відтінок (жовтизну, синяву)"],["Чорно-біле, сепія","Перетворення на монохром"]]],["h","Колірні моделі"],["ul",["**RGB** (червоний, зелений, синій) — для екранів; адитивна модель (змішування світла).","**CMYK** (блакитний, пурпуровий, жовтий, чорний) — для друку; субтрактивна.","**HSB/HSV** — тон, насиченість, яскравість; зручна для вибору кольору."]],["note","Застосовуйте корекцію через **коригувальні шари**: їх можна змінити або вимкнути в будь-який момент, не псуючи оригінал."]]},{"n":141,"title":"Створення елементів для веб-сторінок","blocks":[["p","Растровий редактор використовують для створення графіки сайтів: банерів, кнопок, іконок, фонів, обкладинок для соцмереж."],["h","Типові розміри"],["table",["Елемент","Розмір, px"],[["Головний банер сайту (hero)","1920 × 600–1080"],["Обкладинка YouTube","2560 × 1440"],["Пост Instagram","1080 × 1080 або 1080 × 1350"],["Обкладинка Facebook","820 × 312"],["Фавікон (значок вкладки)","32 × 32, 180 × 180"]]],["h","Оптимізація для вебу"],["ul",["Зображення не більші, ніж потрібно для показу.","Фото — JPEG або WebP з якістю 70–85%; графіка з прозорістю — PNG; іконки — SVG.","Експорт: «Експортувати як» / «Зберегти для вебу».","Розмір файлу банера — бажано до 200–300 КБ."]],["note","Цим уроком завершується перша частина теми 5. Проводиться тематична атестація."]]}],"practice":[{"task":"Створіть колаж «Моє місто в майбутньому» з 3–5 зображень, використовуючи шари, маски та режими накладання.","answer":"Кожен об'єкт на окремому шарі, маски для плавних переходів, узгоджений колір через коригувальні шари, експорт у JPEG."},{"task":"Підберіть дві шрифтові пари з підтримкою кирилиці для афіші та для звіту. Поясніть вибір.","answer":"Афіша: Montserrat ExtraBold + Lora. Звіт: Roboto + Roboto Slab. Контраст засічок і накреслення, підтримка ґ, є, і, ї."},{"task":"Виконайте тонову корекцію тьмяного фото за допомогою рівнів або кривих. Порівняйте гістограми до і після.","answer":"До: гістограма зміщена до середини, немає чорного й білого. Після: розтягнута на весь діапазон."},{"task":"Створіть банер для сайту ліцею розміром 1920 × 600 px і експортуйте в JPEG розміром до 300 КБ.","answer":"Фон-фото, напис з тінню, кнопка-фігура, експорт з якістю ~80%."}],"quiz":[{"q":"З чого складається растрове зображення?","o":["З кривих","З пікселів","З формул","З шарів тексту"],"a":1},{"q":"Який безкоштовний онлайн-редактор має інтерфейс, схожий на Photoshop?","o":["Inkscape","Photopea","Blender","Scribus"],"a":1},{"q":"Що приховує чорний колір на масці шару?","o":["Нічого","Відповідну частину шару","Весь документ","Лише текст"],"a":1},{"q":"Який формат підтримує прозорість і стискає без втрат?","o":["JPEG","PNG","BMP","PDF"],"a":1},{"q":"Шрифти із засічками називають…","o":["Гротеск","Антиква","Моноширинні","Рукописні"],"a":1},{"q":"Який інструмент копіює ділянку зображення в інше місце?","o":["Штамп","Ласо","Піпетка","Градієнт"],"a":0},{"q":"Яка колірна модель використовується для екранів?","o":["CMYK","RGB","Pantone","Lab"],"a":1},{"q":"Що показує гістограма зображення?","o":["Розмір файлу","Розподіл пікселів за яскравістю","Кількість шарів","Роздільність"],"a":1},{"q":"Хто видав у Львові 1574 року першу датовану друковану книгу в Україні?","o":["Йоганн Гутенберг","Іван Федоров","Георгій Нарбут","Тарас Шевченко"],"a":1}]},{"id":"t5b","topic":5,"code":"5.2","title":"Теорія дизайну, брендинг і векторна графіка","lessons":[{"n":142,"title":"Розробка дизайну та створення графічних проектів","blocks":[["p","Будь-який дизайн-проєкт проходить однакові етапи — від задачі до готового результату."],["ol",["**Бриф** — опис задачі: що потрібно, для кого, навіщо, терміни, обмеження.","**Дослідження**: аудиторія, конкуренти, приклади (референси).","**Мудборд** — колаж з референсів, що задає настрій і стиль.","**Ескізи** — кілька варіантів ідеї олівцем чи в програмі.","**Розробка** обраного варіанта.","**Презентація** замовнику і **правки**.","**Підготовка файлів** до друку чи вебу."]],["h","Бриф (приклад)"],["table",["Питання","Відповідь"],[["Що створюємо?","Логотип шкільного клубу робототехніки"],["Для кого?","Учні 8–11 класів, батьки"],["Який настрій?","Сучасний, технологічний, дружній"],["Де використовуватиметься?","Футболки, сайт, соцмережі, грамоти"],["Термін","2 тижні"]]]]},{"n":143,"title":"Колір. Теорія кольору. Колористика","blocks":[["p","**Колористика** — наука про колір і його поєднання. Основний інструмент — **колірне коло** з 12 кольорів."],["h","Характеристики кольору"],["ul",["**Тон (відтінок)** — власне колір: червоний, синій.","**Насиченість** — інтенсивність, «чистота» кольору.","**Яскравість (світлота)** — наскільки колір світлий чи темний."]],["h","Гармонійні схеми"],["table",["Схема","Як утворити","Ефект"],[["Монохромна","Відтінки одного кольору","Спокій, єдність"],["Аналогова","2–3 сусідні кольори кола","Гармонія, м'якість"],["Комплементарна","Протилежні кольори кола","Сильний контраст"],["Тріада","3 кольори на однаковій відстані","Яскравість, баланс"],["Розщеплена комплементарна","Колір + два сусіди його протилежного","Контраст без різкості"]]],["h","Психологія кольору"],["p","Червоний — енергія, увага; синій — довіра, спокій; зелений — природа, здоров'я; жовтий — радість; чорний — розкіш, строгість. Сприйняття залежить і від культури."],["p","Підібрати палітру допомагають сервіси **Adobe Color**, **Coolors**. Правило **60-30-10**: 60% основний колір, 30% додатковий, 10% акцент."]]},{"n":144,"title":"Основи теорії дизайну. Стиль та композиція в дизайні","blocks":[["h","Принципи дизайну (CRAP)"],["table",["Принцип","Суть"],[["**Контраст** (Contrast)","Різні елементи мають бути помітно різними"],["**Повтор** (Repetition)","Повторювані кольори, шрифти, форми створюють єдність"],["**Вирівнювання** (Alignment)","Кожен елемент пов'язаний з іншими невидимою лінією"],["**Близькість** (Proximity)","Пов'язані елементи розміщують поруч"]]],["h","Інші поняття композиції"],["ul",["**Баланс** — симетричний чи асиметричний розподіл «ваги» елементів.","**Ієрархія** — порядок, у якому глядач сприймає елементи.","**Ритм** — повторення елементів із певною закономірністю.","**Пропорції**: правило третин, золотий переріз (≈ 1 : 1,618).","**Негативний простір** — порожнє місце довкола елементів."]],["h","Стилі в дизайні"],["p","Швейцарський (інтернаціональний), мінімалізм, ар-деко, поп-арт, гранж, ретро, плаский дизайн, брутализм. Стиль задає набір кольорів, шрифтів і форм."]]},{"n":145,"title":"Символи та образи. Художній образ","blocks":[["p","**Символ** — знак, що передає ідею чи поняття: серце — любов, голуб — мир, лампочка — ідея. **Художній образ** — узагальнене відображення дійсності, що викликає емоції та асоціації."],["h","Види знаків"],["ul",["**Піктограма** — спрощене зображення предмета (значок телефона, туалету).","**Ідеограма** — зображення поняття (знак «заборонено»).","**Символ** — умовний знак, значення якого треба знати (герб, тризуб).","**Метафора** в дизайні — поєднання двох образів для нового змісту (лампочка-мозок)."]],["h","Українська символіка"],["p","Тризуб, калина, соняшник, мотиви вишивки й петриківського розпису — популярні образи в сучасному українському дизайні. Використовуючи державну символіку, дотримуйтеся законодавства та поваги до неї."],["h","Як створити образ"],["ol",["Випишіть асоціації до теми (мозковий штурм).","Оберіть найпростіші та найвпізнаваніші.","Спробуйте поєднати два образи в один.","Спрощуйте, доки образ лишається впізнаваним."]]]},{"n":146,"title":"Поняття бренду, брендингу. Елементи фірмового стилю. Айдентика","blocks":[["ul",["**Бренд** — образ компанії чи продукту у свідомості людей: асоціації, емоції, довіра, репутація.","**Брендинг** — процес створення і розвитку бренду.","**Айдентика (фірмовий стиль)** — візуальна система бренду, за якою його впізнають."]],["h","Елементи фірмового стилю"],["table",["Елемент","Приклад"],[["Логотип","Знак і/або напис"],["Фірмові кольори","Основний і додаткові, з кодами HEX, RGB, CMYK"],["Фірмові шрифти","Для заголовків і тексту"],["Графічні елементи","Патерни, іконки, форми"],["Стиль фото й ілюстрацій","Світлі, з людьми, плоскі ілюстрації"],["Носії","Візитки, бланки, сайт, упаковка, уніформа"],["Тон комунікації","Як бренд «говорить»: офіційно чи дружньо"]]],["p","Сильний бренд впізнаваний навіть без назви: за кольором, формою, звуком."]]},{"n":147,"title":"Створення логотипів. Брендгайд. Брендбук","blocks":[["h","Види логотипів"],["ul",["**Шрифтовий** (логотайп) — лише назва особливим шрифтом.","**Знак** (символ) — зображення без тексту.","**Комбінований** — знак + напис.","**Монограма** — ініціали.","**Емблема** — напис усередині знака (як печатка)."]],["h","Вимоги до логотипа"],["ol",["Простота й запам'ятовуваність.","Читабельність у малому розмірі (на значку 16 px).","Працює в одному кольорі та на темному тлі.","Унікальність, без копіювання чужих знаків.","Створюється у **векторному** форматі."]],["h","Брендбук і брендгайд"],["p","**Брендбук** — повний документ про бренд: місія, цінності, аудиторія, тон і вся айдентика. **Брендгайд** — практичний посібник з правилами використання айдентики."],["ul",["Варіанти логотипа і **охоронне поле** (вільний простір навколо).","Мінімальний розмір.","Заборонене використання: розтягування, інші кольори.","Палітра, шрифти, сітки, приклади носіїв."]]]},{"n":148,"title":"Векторний графічний редактор як інструмент для дизайну","blocks":[["p","**Векторне зображення** складається з об'єктів (ліній, кривих, фігур), описаних математично. Його можна **масштабувати без втрати якості**, а файли зазвичай невеликі."],["table",["","Растрова графіка","Векторна графіка"],[["Основа","Пікселі","Математичні криві"],["Масштабування","Втрачає якість","Без втрат"],["Найкраще для","Фото, складні текстури","Логотипи, іконки, схеми, шрифти"],["Формати","JPEG, PNG, GIF","SVG, AI, CDR, EPS, PDF"]]],["h","Векторні редактори"],["ul",["**Inkscape** — безкоштовний, рідний формат SVG.","**Adobe Illustrator** — професійний стандарт.","**CorelDRAW** — популярний у поліграфії.","**Figma** — онлайн, для інтерфейсів і командної роботи.","**Vectr**, **Gravit Designer** — прості онлайн-редактори."]],["p","Інтерфейс Inkscape: панель інструментів ліворуч, палітра кольорів унизу, панелі властивостей праворуч (Заповнення та штрих, Шари, Вирівнювання)."]]},{"n":149,"title":"Робота з векторними контурами","blocks":[["p","**Контур** — лінія, що складається з **вузлів** (опорних точок) і **сегментів** між ними. Сегменти бувають прямими та кривими (кривими Безьє)."],["h","Інструменти"],["ul",["**Перо (крива Безьє)**: клік — кутовий вузол, клік із перетягуванням — гладкий вузол із напрямними.","**Олівець** — вільне малювання.","**Редагування вузлів**: переміщення, додавання, видалення вузлів, зміна типу (кутовий, гладкий, симетричний).","**Каліграфічне перо** — лінії змінної товщини."]],["h","Операції з контурами"],["ul",["Замкнути / розімкнути контур.","Перетворити об'єкт (фігуру, текст) на контур: Контур → Об'єкт у контур.","**Абрис (штрих)** у контур — щоб лінію можна було редагувати як фігуру.","Спрощення контуру (менше вузлів).","Векторизація растрового зображення: Контур → Векторизувати растр."]],["note","Менше вузлів — плавніші криві. Ставте вузли в «крайніх» точках кривої, а не густо вздовж неї."]]},{"n":150,"title":"Заливка об'єктів. Робота з градієнтами","blocks":[["p","У векторного об'єкта є дві складові оформлення: **заливка** (внутрішня область) і **штрих (абрис)** — обвідна лінія."],["h","Види заливки"],["ul",["**Суцільна** — один колір.","**Лінійний градієнт** — плавний перехід кольорів уздовж прямої.","**Радіальний градієнт** — перехід від центру до країв.","**Сітчастий градієнт (меш)** — складні переходи для реалістичних зображень.","**Візерунок (патерн)** — повторюване зображення.","**Без заливки**."]],["h","Робота з градієнтом в Inkscape"],["ol",["Виділіть об'єкт, відкрийте Заповнення та штрих (Ctrl+Shift+F).","Оберіть лінійний чи радіальний градієнт.","Інструментом «Градієнт» (G) перетягніть, щоб задати напрям.","Клацніть на опорній точці градієнта і змініть її колір; подвійний клік на лінії додає нову точку.","Налаштуйте прозорість (канал A) для ефекту зникання."]],["p","Параметри штриха: товщина, колір, пунктир, форма кінців і з'єднань, стрілки."]]},{"n":151,"title":"Впорядковування, вирівнювання й об'єднання об'єктів","blocks":[["h","Впорядкування (порядок накладання)"],["p","Кожен новий об'єкт розміщується над попередніми. Змінити порядок: Об'єкт → На передній план (Home), Піднести (Page Up), Опустити (Page Down), На задній план (End)."],["h","Вирівнювання і розподіл"],["p","Панель «Вирівняти та розподілити» (Ctrl+Shift+A) вирівнює об'єкти за лівим/правим краєм, центром, верхом/низом і рівномірно розподіляє відстані між ними. Опорою може бути сторінка, перший чи останній виділений об'єкт."],["h","Групування"],["p","**Група** (Ctrl+G) об'єднує об'єкти, щоб переміщувати їх разом, але кожен зберігає свої властивості. Розгрупувати — Ctrl+Shift+G."],["h","Логічні операції (Контур)"],["table",["Операція","Результат"],[["Сума (об'єднання)","Одна фігура з контуром навколо всіх"],["Різниця","Верхня фігура «вирізає» частину нижньої"],["Перетин","Лишається лише спільна частина"],["Виключне АБО","Усе, крім спільної частини"],["Розділити","Нижня фігура ділиться лініями верхньої"]]],["p","Логічні операції — основний спосіб будувати складні значки й логотипи з простих фігур."]]},{"n":152,"title":"Художнє оформлення тексту","blocks":[["p","У векторному редакторі текст можна перетворити на графічний об'єкт і оформити як завгодно."],["h","Прийоми"],["ul",["**Текст по контуру**: Текст → Розмістити по контуру — напис уздовж кола чи хвилі.","**Текст у фігурі**: Текст → Вписати у фрейм.","**Перетворення на контур** (Контур → Об'єкт у контур) — тепер кожну літеру можна редагувати вузлами.","**Градієнт, тінь, обведення** літер.","**Леттеринг** — малювання власних літер для логотипа чи заголовка."]],["h","Створення шрифтового логотипа"],["ol",["Наберіть назву підходящим шрифтом.","Налаштуйте кернінг вручну між парами літер.","Перетворіть текст на контури.","Змініть форму окремих літер, додайте графічний елемент.","Перевірте читабельність у малому розмірі."]],["note","Перетворений на контури текст більше не редагується як текст: збережіть копію з редагованим написом. Цим уроком завершується друга частина теми 5 — проводиться тематична атестація."]]}],"practice":[{"task":"Складіть бриф і мудборд для логотипа шкільного клубу (на вибір).","answer":"Бриф за таблицею уроку 142, мудборд з 8–12 референсів (кольори, шрифти, приклади логотипів), джерела зображень вказати."},{"task":"Підберіть три гармонійні палітри (аналогову, комплементарну, тріаду) в Adobe Color для майбутнього бренду. Запишіть коди HEX.","answer":"Наприклад, тріада: #E63946, #2A9D8F, #F4A261 (коди можуть бути будь-які, головне — схема)."},{"task":"Створіть у Inkscape значок з простих фігур за допомогою логічних операцій (суми, різниці, перетину).","answer":"Наприклад, хмарка = сума кількох кіл і прямокутника; місяць = різниця двох кіл."},{"task":"Розробіть шрифтовий або комбінований логотип і односторінковий брендгайд: варіанти логотипа, кольори, шрифти, приклад неправильного використання.","answer":"Логотип у SVG, кольорова й одноколірна версії, палітра з HEX, 2 шрифти, охоронне поле, 2–3 заборонені варіанти."}],"quiz":[{"q":"Що таке бриф?","o":["Готовий логотип","Опис задачі на дизайн","Тип шрифту","Формат файлу"],"a":1},{"q":"Як називається схема з протилежних кольорів колірного кола?","o":["Аналогова","Монохромна","Комплементарна","Тріада"],"a":2},{"q":"Який принцип дизайну говорить, що пов'язані елементи мають бути поруч?","o":["Контраст","Повтор","Вирівнювання","Близькість"],"a":3},{"q":"Головна перевага векторної графіки…","o":["Фотореалістичність","Масштабування без втрати якості","Більший розмір файлу","Робота з пікселями"],"a":1},{"q":"Який формат є рідним для Inkscape?","o":["PSD","SVG","JPEG","DOCX"],"a":1},{"q":"Документ із правилами використання логотипа, кольорів і шрифтів — це…","o":["Бриф","Брендгайд","Мудборд","Портфоліо"],"a":1},{"q":"Яка логічна операція лишає лише спільну частину двох фігур?","o":["Сума","Різниця","Перетин","Розділити"],"a":2},{"q":"Що означає правило 60-30-10?","o":["Розміри шрифтів","Пропорції основного, додаткового й акцентного кольорів","Роздільність зображення","Поля сторінки"],"a":1}]},{"id":"t5c","topic":5,"code":"5.3","title":"Художні ефекти, 3D-графіка та анімація","lessons":[{"n":153,"title":"Художні ефекти. Робота з символьними об'єктами","blocks":[["h","Художні ефекти у векторному редакторі"],["ul",["**Тінь** (Фільтри → Тіні та відблиски).","**Розмиття** і **прозорість** об'єкта.","**Перетікання (бленд)** — плавний перехід формою й кольором між двома об'єктами через проміжні копії (Розширення → Створення → Інтерполяція).","**Контур (абрис)** — концентричні копії навколо об'єкта (Контур → Втягнути/Розтягнути, Динамічний відступ).","**Фільтри**: текстури, шум, «акварель», тиснення."]],["h","Символьні об'єкти"],["p","**Символ** — об'єкт, збережений у бібліотеці документа, копії якого (**екземпляри**) пов'язані з оригіналом. Змінивши оригінал, ви змінюєте всі екземпляри одразу. Це економить час і зменшує розмір файлу."],["ul",["Inkscape: Об'єкт → Об'єкт у символ, панель «Символи» (Ctrl+Shift+Y); також **клони** (Alt+D).","CorelDRAW: Об'єкт → Символ → Новий символ.","Illustrator, Figma: панель «Символи» / компоненти."]],["p","Приклади використання: дерева в парку на мапі, іконки в інтерфейсі, візерунок із повторюваних елементів."]]},{"n":154,"title":"Спотворення і деформація","blocks":[["p","Деформація змінює форму об'єкта, не перемальовуючи його вручну."],["table",["Ефект","Що робить","Inkscape"],[["Обгортка (огинаюча)","Вписує об'єкт у довільну форму","Контурні ефекти → Деформація огинаючою"],["Перспектива","Створює ефект нахилу в глибину","Контурні ефекти → Перспектива / Конверт"],["Скручування, хвиля","Закручує, хвилює контур","Інструмент «Твік» (W)"],["Шорсткість, зигзаг","Робить край нерівним","Фільтри / Контурні ефекти → Зигзаг"],["Нахил і обертання","Змінює кут","Інструмент виділення: подвійний клік"]]],["p","**Контурні ефекти** (Path Effects) в Inkscape застосовуються **недеструктивно**: їх можна змінити чи вимкнути, оригінал зберігається."],["note","Деформація тексту робить його виразним, але не перестарайтеся: спотворений текст має лишатися читабельним."]]},{"n":155,"title":"Тривимірна графіка. Програми для роботи з тривимірною графікою","blocks":[["p","**Тривимірна (3D) графіка** — створення об'ємних моделей об'єктів у віртуальному просторі з трьома осями: X (ширина), Y (глибина), Z (висота)."],["h","Етапи створення 3D-зображення"],["ol",["**Моделювання** — створення форми об'єкта.","**Текстурування** — призначення матеріалів і текстур.","**Освітлення** — розміщення джерел світла.","**Анімація** (за потреби).","**Рендеринг** — обчислення фінального зображення."]],["table",["Програма","Особливості"],[["Tinkercad","Онлайн, дуже простий, для 3D-друку, ідеальний для початку"],["Blender","Безкоштовний професійний пакет: моделювання, анімація, рендер"],["SketchUp","Архітектура та інтер'єри"],["Fusion 360","Інженерне моделювання (безкоштовно для навчання)"],["3ds Max, Maya, Cinema 4D","Професійні пакети для кіно та ігор"]]],["p","Застосування 3D: ігри, кіно, архітектура, дизайн продуктів, медицина, 3D-друк, віртуальна реальність."]]},{"n":156,"title":"Додавання тривимірних примітивів. Вершини, ребра, грані","blocks":[["p","**Примітиви** — базові 3D-фігури, з яких починають моделювання: куб, сфера, циліндр, конус, тор, площина."],["h","Будова 3D-моделі (полігональна сітка)"],["ul",["**Вершина (vertex)** — точка в просторі.","**Ребро (edge)** — відрізок між двома вершинами.","**Грань (face, полігон)** — плоска поверхня, обмежена ребрами."]],["p","Куб має 8 вершин, 12 ребер, 6 граней. Для багатогранників виконується формула Ейлера: В − Р + Г = 2."],["h","Blender"],["ul",["Додати примітив: **Shift + A** → Mesh.","**Режим об'єкта** (Object Mode) і **режим редагування** (Edit Mode) перемикаються клавішею **Tab**.","У режимі редагування клавіші **1, 2, 3** перемикають вибір вершин, ребер, граней."]],["h","Tinkercad"],["p","Перетягніть фігуру з панелі праворуч на робочу площину. Фігура може бути **тілом** або **отвором** (Hole): отвір вирізає частину з інших об'єктів після групування."]]},{"n":157,"title":"Екструдування форми об'єкта","blocks":[["p","**Екструдування (видавлювання)** — витягування грані, ребра чи вершини з утворенням нової геометрії. Це один з головних інструментів полігонального моделювання."],["h","Екструдування в Blender"],["ol",["Виділіть об'єкт і перейдіть у режим редагування (**Tab**).","Оберіть режим граней (**3**) і клацніть на грані.","Натисніть **E** і перемістіть мишу — грань витягнеться.","Клацніть, щоб підтвердити. Для точного значення введіть число з клавіатури."]],["p","Так з куба можна видавити, наприклад, ніжки стола чи дах будиночка."],["h","Пов'язані інструменти"],["ul",["**Вставка грані (Inset, I)** — нова грань усередині наявної.","**Фаска (Bevel, Ctrl+B)** — скошує гострі ребра.","**Розріз петлею (Loop Cut, Ctrl+R)** — додає ребра навколо об'єкта."]],["p","У Tinkercad схожого результату досягають, розтягуючи фігури за маркери та поєднуючи їх у групи."]]},{"n":158,"title":"Переміщення, масштабування, групування об'єктів","blocks":[["h","Базові трансформації в Blender"],["table",["Дія","Клавіша","Обмеження осі"],[["Переміщення (Grab)","G","G, потім X / Y / Z"],["Обертання (Rotate)","R","R, Z, 90 — поворот на 90° навколо Z"],["Масштабування (Scale)","S","S, X, 2 — удвічі вздовж X"]]],["p","Точні значення задають на панелі **N** (Location, Rotation, Scale)."],["h","Групування та ієрархія"],["ul",["**Об'єднання** об'єктів в один: **Ctrl + J**.","**Батьківський зв'язок** (Parent): **Ctrl + P** — дочірні об'єкти рухаються разом з батьківським.","**Колекції** — папки для впорядкування об'єктів сцени."]],["h","Tinkercad"],["p","Переміщують мишею або стрілками, масштабують маркерами на кутах (Shift — пропорційно), групують кнопкою **«Групувати»** (Ctrl + G)."]]},{"n":159,"title":"Вирівнювання, обертання, копіювання та клонування об'єктів","blocks":[["h","Вирівнювання"],["p","Tinkercad: виділіть об'єкти → **Вирівняти** (L) → оберіть точку вирівнювання на осях. Blender: прилипання (Snapping, Shift+Tab) або Object → Snap."],["h","Обертання"],["p","У Tinkercad тягніть за вигнуті стрілки навколо об'єкта (крок 22,5°, із Shift — 45°). У Blender — клавіша **R** з віссю і кутом."],["h","Копіювання і клонування"],["table",["Дія","Blender","Tinkercad"],[["Дублювати (незалежна копія)","Shift + D","Ctrl + D"],["Пов'язаний дублікат (спільна сітка)","Alt + D","—"],["Масив копій","Модифікатор Array","Дублювати і повторити (Ctrl+D після переміщення)"]]],["p","**Пов'язаний дублікат (клон)** використовує ту саму сітку: змінивши форму одного, змінимо всі. Це зручно для однакових коліс, вікон, стільців."],["p","**Модифікатор Array** створює ряд копій із заданим зміщенням — наприклад, сходи чи паркан."]]},{"n":160,"title":"Поняття про 3D-друк","blocks":[["p","**3D-друк (адитивне виробництво)** — створення фізичного об'єкта пошаровим нанесенням матеріалу за цифровою моделлю."],["h","Технології"],["table",["Технологія","Як працює","Матеріал"],[["FDM","Розплавлена пластикова нитка шар за шаром","PLA, PETG, ABS"],["SLA / DLP","Затвердіння рідкої смоли світлом","Фотополімерна смола"],["SLS","Спікання порошку лазером","Нейлон, метал"]]],["h","Від моделі до виробу"],["ol",["Створити модель (Tinkercad, Blender, Fusion 360).","Експортувати у формат **STL** або **OBJ**.","Відкрити в **слайсері** (Cura, PrusaSlicer): він розрізає модель на шари і створює **G-код** для принтера.","Налаштувати висоту шару, заповнення, підтримки.","Друкувати і обробити виріб (зняти підтримки, зашліфувати)."]],["note","Модель для друку має бути **замкненою** (без дірок у сітці) і мати плоску основу. Нависаючі частини під кутом понад 45° потребують підтримок."]]},{"n":161,"title":"Комп'ютерна анімація. Ідея, сценарій та стиль анімації","blocks":[["p","**Анімація** — створення ілюзії руху швидкою зміною зображень (кадрів). Людське око сприймає послідовність від ≈ 12 кадрів за секунду як рух; у кіно — 24 кадри/с, у відео — 25–30, в іграх — 60."],["h","Етапи створення анімаційного ролика"],["ol",["**Ідея** — одне речення, про що ролик.","**Сценарій** — що відбувається, діалоги, тривалість.","**Розкадровка (сторіборд)** — ескізи ключових сцен з поясненнями.","**Дизайн персонажів і фонів**, вибір стилю.","**Анімація** ключових кадрів і проміжних.","**Звук**: музика, голос, ефекти.","**Монтаж і експорт**."]],["h","12 принципів анімації (Disney)"],["p","Серед них: стискання й розтягування, підготовка до дії, уповільнення на початку й наприкінці руху, рух дугами, перебільшення. Вони роблять рух живим і переконливим."],["p","**Стиль**: плоска векторна, піксельна, мальована (покадрова), перекладна (cut-out), 3D, стоп-моушн."]]},{"n":162,"title":"Види анімацій","blocks":[["table",["Вид","Суть","Інструменти"],[["Покадрова (класична)","Кожен кадр малюють окремо","Krita, FlipaClip, Pencil2D"],["Анімація з ключовими кадрами (твінінг)","Задають ключові положення, проміжні кадри обчислюються автоматично","Animate, Synfig, Blender, PowerPoint"],["Перекладна (cut-out)","Персонаж з окремих частин, які рухають","Moho, Toon Boom"],["Стоп-моушн","Фотографують фізичні об'єкти, трохи змінюючи їх положення","Stop Motion Studio"],["3D-анімація","Рух 3D-моделей і камер","Blender, Maya"],["Анімація за траєкторією","Об'єкт рухається вздовж кривої","Blender, Animate"],["GIF і веб-анімація","Короткі цикли для сайтів і соцмереж","Photopea, GIMP, CSS"],["Моушн-дизайн","Анімована графіка та текст","After Effects, Canva"]]],["p","**Ключовий кадр (keyframe)** задає важливе положення об'єкта в певний момент часу. **Твінінг** (від англ. in-between) — автоматичне створення проміжних кадрів між ключовими."]]},{"n":163,"title":"Анімація в растровому графічному редакторі","blocks":[["p","У растровому редакторі найпростіше створити **покадрову GIF-анімацію**, де кожен **шар — це кадр**."],["h","GIMP"],["ol",["Створіть зображення (наприклад, 400 × 400 px).","Кожен кадр малюйте на новому шарі; нижній шар — перший кадр.","Затримку кадру вкажіть у назві шару: «Кадр 1 (100ms)».","Перегляд: Фільтри → Анімація → Відтворення.","Оптимізація: Фільтри → Анімація → Оптимізувати (для GIF).","Експорт: Файл → Експортувати як → .gif → позначити «Як анімацію» і «Повторювати безкінечно»."]],["h","Photopea / Photoshop"],["p","Photoshop: Вікно → Шкала часу → «Створити анімацію кадру»; кожному кадру — видимі шари. Photopea: шари з назвами `_a_` або експорт GIF, де кожен шар — кадр."],["note","**Калька (onion skin)** — напівпрозорий показ попереднього кадру — допомагає малювати плавний рух. У Krita і Pencil2D вона є вбудованою."]]},{"n":164,"title":"Часова шкала, рівні, кадри та об'єкти кадрів","blocks":[["p","**Часова шкала (таймлайн)** — панель, де кадри розташовані в часі зліва направо, а **рівні (шари, доріжки)** — згори вниз."],["h","Основні поняття"],["ul",["**Кадр** — одне зображення в момент часу.","**Ключовий кадр** — кадр, де задано положення чи властивість об'єкта.","**Рівень (шар) анімації** — незалежна доріжка: фон, персонаж, текст рухаються окремо.","**Об'єкти кадру** — елементи, що змінюються: положення, розмір, обертання, прозорість, колір.","**Частота кадрів (FPS)** — кількість кадрів за секунду.","**Інтерполяція (easing)** — характер руху між ключами: рівномірний, з прискоренням, з уповільненням."]],["h","Анімація з ключовими кадрами в Blender"],["ol",["На кадрі 1 розташуйте об'єкт, натисніть **I** → Location (ключ).","Перейдіть на кадр 60, перемістіть об'єкт, знову **I**.","Натисніть пробіл — об'єкт рухається між положеннями.","Криві руху налаштовують у Graph Editor."]],["p","Тривалість: 60 кадрів при 24 FPS = 2,5 секунди."]]},{"n":165,"title":"Інтерактивна анімація","blocks":[["p","**Інтерактивна анімація** реагує на дії користувача: наведення курсора, клік, прокручування, натискання клавіш. Її використовують у вебсайтах, іграх, навчальних тренажерах, презентаціях."],["h","Де створювати"],["ul",["**Scratch** — блоки «коли натиснуто спрайт», «коли клавішу натиснуто».","**PowerPoint / Google Презентації** — тригери і гіперпосилання на слайди.","**Genially, H5P** — інтерактивні навчальні матеріали.","**Вебсторінки** — CSS-анімація та JavaScript.","**Ігрові рушії** — Unity, Godot."]],["h","Приклад: кнопка, що реагує на наведення (CSS)"],["code","\u003cstyle>\n.btn { background: #2b57b8; color: white; padding: 12px 24px; border-radius: 8px;\n       transition: transform 0.2s, background 0.2s; }\n.btn:hover { transform: scale(1.1); background: #f2a900; }\n\u003c/style>\n\u003cbutton class=\"btn\">Наведи на мене\u003c/button>"],["h","Приклад на Python (turtle)"],["code","import turtle\nt = turtle.Turtle(shape=\"turtle\")\nscreen = turtle.Screen()\n\ndef go_to(x, y):\n    t.goto(x, y)        # черепашка пливе до місця кліку\n\nscreen.onclick(go_to)\nturtle.done()"],["note","Цим уроком завершується третя частина теми 5. Проводиться тематична атестація."]]}],"practice":[{"task":"Створіть у Tinkercad модель брелока з вашими ініціалами (текст + основа + отвір для кільця) і експортуйте в STL.","answer":"Основа-циліндр або прямокутник 40 × 25 × 3 мм, текст висотою 2 мм над основою, отвір-циліндр (Hole) ⌀ 4 мм; згрупувати, експорт STL."},{"task":"У Blender з куба за допомогою екструдування створіть простий стіл або будиночок.","answer":"Tab → режим граней → E для витягування ніжок/даху, S для масштабування, Ctrl+R для додаткових ребер."},{"task":"Створіть GIF-анімацію з 6–8 кадрів (наприклад, м'ячик, що підстрибує) у GIMP або Photopea.","answer":"Кожен кадр на окремому шарі, затримка 80–120 мс, у нижній точці м'яч сплющений (принцип стискання), експорт як анімація з повтором."},{"task":"Напишіть сценарій і розкадровку з 6 кадрів для 15-секундного анімаційного ролика про безпеку в інтернеті.","answer":"Ідея в одному реченні, 6 ескізів з підписами дії та тривалості, звук, фінальний заклик."}],"quiz":[{"q":"Що відбувається з екземплярами символу, коли змінюють оригінал?","o":["Нічого","Змінюються всі екземпляри","Видаляються","Стають растровими"],"a":1},{"q":"Скільки граней має куб?","o":["4","6","8","12"],"a":1},{"q":"Яка клавіша в Blender перемикає режим об'єкта і режим редагування?","o":["E","G","Tab","Shift+A"],"a":2},{"q":"Що робить екструдування?","o":["Видаляє об'єкт","Витягує грань, створюючи нову геометрію","Змінює колір","Рендерить сцену"],"a":1},{"q":"У якому форматі зазвичай передають модель на 3D-друк?","o":["PNG","STL","DOCX","MP3"],"a":1},{"q":"Як називається програма, що розрізає модель на шари для 3D-принтера?","o":["Рендерер","Слайсер","Компілятор","Векторизатор"],"a":1},{"q":"Що таке ключовий кадр?","o":["Перший кадр фільму","Кадр, де задано важливе положення об'єкта","Найяскравіший кадр","Кадр зі звуком"],"a":1},{"q":"Скільки секунд триває анімація з 48 кадрів при 24 FPS?","o":["1","2","24","48"],"a":1},{"q":"Як називається ескізний план кадрів майбутнього ролика?","o":["Таймлайн","Розкадровка (сторіборд)","Рендер","Бриф"],"a":1}]},{"id":"t5d","topic":5,"code":"5.4","title":"Підсумковий мультимедійний проєкт і повторення","lessons":[{"n":166,"title":"Виконання індивідуальних та колективних проектів: вибір теми та формування команди","blocks":[["p","Підсумковий проєкт теми 5 об'єднує все вивчене: дизайн, растрову й векторну графіку, 3D та анімацію. Працювати можна індивідуально або в команді з 2–4 осіб."],["h","Варіанти проєктів"],["ul",["**Айдентика** для вигаданого бренду, клубу чи події: логотип, брендгайд, носії.","**Анімаційний ролик** (30–60 с) на соціальну тему.","**3D-модель** предмета з рендером і підготовкою до друку.","**Мультимедійна презентація** чи інтерактивний плакат.","**Комплексний проєкт**: бренд + анімований логотип + 3D-сувенір."]],["h","Завдання уроку"],["ol",["Обрати тип проєкту і тему.","Сформувати команду, розподілити ролі: арт-директор, дизайнер, 3D-художник, аніматор, менеджер.","Сформулювати мету й цільову аудиторію."]]]},{"n":167,"title":"Виконання індивідуальних та колективних проектів: бриф, дослідження, мудборд","blocks":[["ol",["Скласти **бриф** проєкту (див. урок 142).","Дослідити аналоги: що вже існує, що подобається, чого уникати.","Створити **мудборд** у Miro, Pinterest чи Canva.","Скласти **план роботи** з термінами на Kanban-дошці."]],["note","Збирайте посилання на всі використані джерела й зображення: вони знадобляться для захисту проєкту та дотримання авторського права."]]},{"n":168,"title":"Виконання індивідуальних та колективних проектів: ескізи та концепція","blocks":[["ol",["Намалювати 5–10 швидких ескізів на папері.","Обрати 2–3 найкращі й доопрацювати.","Для анімації — сценарій і розкадровка; для 3D — креслення з розмірами.","Затвердити концепцію в команді, отримати відгук учителя."]]]},{"n":169,"title":"Виконання індивідуальних та колективних проектів: створення графіки","blocks":[["ul",["Векторні елементи (логотип, іконки, персонажі) — в Inkscape чи Figma.","Растрова обробка фото, текстури, фони — у GIMP чи Photopea.","Узгодження палітри й шрифтів з брендгайдом."]],["p","Наприкінці уроку — проміжний перегляд: кожна команда показує, що зроблено, і отримує відгук."]]},{"n":170,"title":"Виконання індивідуальних та колективних проектів: 3D-моделювання","blocks":[["ul",["Моделювання об'єктів у Tinkercad чи Blender за кресленнями.","Матеріали, освітлення, камера.","Рендер 2–3 ракурсів.","За потреби — експорт STL і підготовка до друку."]]]},{"n":171,"title":"Виконання індивідуальних та колективних проектів: анімація","blocks":[["ul",["Анімація ключових сцен за розкадровкою.","Анімований логотип або заставка (3–5 с).","Перевірка плавності руху, принципи анімації."]]]},{"n":172,"title":"Виконання індивідуальних та колективних проектів: звук, монтаж, верстка носіїв","blocks":[["ul",["Додати музику і звукові ефекти з вільною ліцензією (наприклад, бібліотека аудіо YouTube, Pixabay Music).","Змонтувати ролик (Shotcut, DaVinci Resolve, CapCut, Clipchamp).","Зверстати нос /* ---------- helpers ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function inline(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
}
const KW = new Set("False None True and as break class continue def elif else except for from if import in is not or pass return try while with lambda print input int float str bool type round abs min max pow divmod help exit".split(" "));
function hl(src){
  // tokenise line by line: comments, strings, numbers, keywords, prompt
  return src.split("\n").map(line=>{
    let out = "", i = 0;
    if (line.startsWith(">>> ")) { out += '<span class="pr">&gt;&gt;&gt; </span>'; i = 4; }
    while (i < line.length){
      const c = line[i], rest = line.slice(i);
      if (c === "#"){ out += `<span class="com">${esc(rest)}</span>`; break; }
      if (c === '"' || c === "'"){
        let j = i + 1; while (j < line.length && line[j] !== c) j++;
        out += `<span class="str">${esc(line.slice(i, j + 1))}</span>`; i = j + 1; continue;
      }
      let m = rest.match(/^\d+(\.\d+)?/);
      if (m && !/[A-Za-z_]/.test(line[i-1]||"")){ out += `<span class="num">${m[0]}</span>`; i += m[0].length; continue; }
      m = rest.match(/^[A-Za-z_][A-Za-z_0-9]*/);
      if (m){ out += KW.has(m[0]) ? `<span class="kw">${m[0]}</span>` : esc(m[0]); i += m[0].length; continue; }
      out += esc(c); i++;
    }
    return out;
  }).join("\n");
}
const codeHTML = s => `<pre class="code"><button class="copy" type="button">Копіювати</button><code-x>${hl(s)}</code-x></pre>`;
function blocksHTML(list){
  return list.map(b=>{
    switch(b[0]){
      case "h": return `<h3>${inline(b[1])}</h3>`;
      case "p": return `<p>${inline(b[1])}</p>`;
      case "ul": return `<ul>${b[1].map(t=>`<li>${inline(t)}</li>`).join("")}</ul>`;
      case "ol": return `<ol>${b[1].map(t=>`<li>${inline(t)}</li>`).join("")}</ol>`;
      case "code": return codeHTML(b[1]);
      case "note": return `<div class="note">${inline(b[1])}</div>`;
      case "table": return `<div class="tbl"><table><thead><tr>${b[1].map(h=>`<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${b[2].map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    return "";
  }).join("");
}

const KEY = "inf10-progress-v1";
let S = {quiz:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function quizState(id){ return S.quiz[id] || (S.quiz[id] = {answers:{}}); }
function status(sec){
  const st = S.quiz[sec.id]; const total = sec.quiz.length;
  if (st && Object.keys(st.answers).length === total){
    const sc = Object.entries(st.answers).filter(([i,v])=>sec.quiz[i].a===v).length;
    return {text:`${sc}/${total}`, done:true};
  }
  return {text:"тест", done:false};
}

function renderQuiz(box){
  const id = box.dataset.quiz, sec = SECTIONS.find(s=>s.id===id), qs = sec.quiz, st = quizState(id);
  const answered = Object.keys(st.answers).length;
  const score = Object.entries(st.answers).filter(([i,v])=>qs[i].a===v).length;
  let h = `<div class="quiz-head"><h2>Тест для самоперевірки</h2><span class="score">${answered}/${qs.length} відповідей · ${score} правильних</span></div><div class="bar"><i style="width:${answered/qs.length*100}%"></i></div>`;
  qs.forEach((q,i)=>{
    const pick = st.answers[i], done = pick !== undefined;
    h += `<div class="q"><p><span class="qn">${i+1}.</span>${inline(q.q)}</p><div class="opts">`;
    q.o.forEach((o,j)=>{
      let cls = ""; if (done){ cls = j===q.a ? "right" : j===pick ? "wrong" : "dim"; }
      h += `<button type="button" class="opt ${cls}" data-q="${i}" data-o="${j}" ${done?"disabled":""}><span class="l">${LETTERS[j]})</span><span>${inline(o)}</span></button>`;
    });
    h += `</div>`;
    if (done) h += pick===q.a ? `<div class="fb ok">Правильно!${q.why?" "+inline(q.why):""}</div>` : `<div class="fb no">Неправильно. Правильна відповідь: ${LETTERS[q.a]}) ${inline(q.o[q.a])}.${q.why?" "+inline(q.why):""}</div>`;
    h += `</div>`;
  });
  if (answered === qs.length){
    const msg = score===qs.length ? "Чудово, усі відповіді правильні!" : score>=qs.length*0.7 ? "Добрий результат. Перегляньте питання з помилками ще раз." : "Варто ще раз перечитати конспект і пройти тест знову.";
    h += `<div class="result"><b>${score} з ${qs.length}</b><span>${msg}</span><button type="button" class="btn" data-retry>Пройти ще раз</button></div>`;
  }
  box.innerHTML = h;
}
function renderNav(cur){
  let h = `<a href="#home" ${cur==="home"?'aria-current="page"':""}><span class="t">Головна</span></a>`;
  TOPIC_IDS.forEach(t=>{
    h += `<h4>Тема ${t}. ${TOPICS[t]}</h4>`;
    SECTIONS.filter(s=>s.topic===t).forEach(s=>{ const st = status(s); h += `<a href="#${s.id}" ${cur===s.id?'aria-current="page"':""}><span class="n">${s.code}</span><span class="t">${s.title}</span><span class="st ${st.done?"done":""}">${st.text}</span></a>`; });
  });
  document.getElementById("tocList").innerHTML = h;
  const s = SECTIONS.find(x=>x.id===cur);
  document.getElementById("tocCurrent").textContent = s ? `${s.code}. ${s.title}` : "Зміст курсу";
}
/* Routing keeps its own state, so the page also works when embedded (iframe, srcdoc) where #links can't change the address */
const validId = h => SECTIONS.some(s=>s.id===h) ? h : "home";
let CUR = "home";
try { CUR = validId(location.hash.slice(1)); } catch(e) {}
function current(){ return CUR; }
function go(id){
  CUR = validId(id);
  try { if (location.protocol !== "about:") history.replaceState(null, "", "#" + CUR); } catch(e) {}
  show();
}
document.addEventListener("click", e=>{
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  go(a.getAttribute("href").slice(1));
}, true);
function show(){
  const id = current();
  if (id === "home") main.innerHTML = homeHTML();
  else { const i = SECTIONS.findIndex(s=>s.id===id); main.innerHTML = sectionHTML(SECTIONS[i], i); main.querySelectorAll("[data-quiz]").forEach(renderQuiz); }
  renderNav(id);
  const nav = document.getElementById("toc"); nav.classList.remove("open"); if (id === "home") nav.scrollTop = 0;
  document.getElementById("tocToggle").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", ()=>{ try { const h = validId(location.hash.slice(1)); if (h !== CUR){ CUR = h; show(); } } catch(e) {} });
show();

/* ---------- events ---------- */
document.getElementById("tocToggle").addEventListener("click", ()=>{
  const nav = document.getElementById("toc"); const open = nav.classList.toggle("open");
  document.getElementById("tocToggle").setAttribute("aria-expanded", open);
});
document.addEventListener("click", e=>{
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled){
    const box = opt.closest("[data-quiz]");
    quizState(box.dataset.quiz).answers[opt.dataset.q] = +opt.dataset.o;
    save(); renderQuiz(box); renderNav(current()); return;
  }
  const retry = e.target.closest("[data-retry]");
  if (retry){
    const box = retry.closest("[data-quiz]"); S.quiz[box.dataset.quiz] = {answers:{}}; save(); renderQuiz(box); renderNav(current());
    box.scrollIntoView({behavior:"smooth", block:"start"}); return;
  }
  const jump = e.target.closest("[data-jump]");
  if (jump){ const t = document.getElementById(jump.dataset.jump); if (t) t.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const copy = e.target.closest(".copy");
  if (copy){
    const txt = copy.parentElement.querySelector("code-x").textContent;
    const done = ()=>{ copy.textContent = "Скопійовано"; setTimeout(()=>copy.textContent="Копіювати", 1500); };
    try { navigator.clipboard.writeText(txt).then(done, ()=>selectText(copy)); } catch(err){ selectText(copy); }
    return;
  }
  if (e.target.id === "resetBtn") document.getElementById("resetConfirm").hidden = false;
  if (e.target.id === "resetNo") document.getElementById("resetConfirm").hidden = true;
  if (e.target.id === "resetYes"){ S = {quiz:{}}; save(); show(); }
});
function selectText(btn){
  const r = document.createRange(); r.selectNodeContents(btn.parentElement.querySelector("code-x"));
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  btn.textContent = "Натисніть Ctrl+C";
}
</script>
