)","a.put(i, x)"],"a":1},{"q":"Який із методів сортування є удосконаленим?","o":["Бульбашкою","Вибором","Вставленням","Швидке сортування"],"a":3},{"q":"Як звернутися до елемента в рядку 2, стовпці 0 матриці m?","o":["m[0][2]","m[2][0]","m[2, 0]","m(2)(0)"],"a":1},{"q":"Який режим відкриття файлу дописує дані в кінець, не стираючи вмісту?","o":["\"r\"","\"w\"","\"a\"","\"x\""],"a":2},{"q":"Що виведе код: `a = [1, 2]` / `b = a` / `b.append(3)` / `print(a)`?","o":["[1, 2]","[1, 2, 3]","[3]","Помилку"],"a":1,"why":"b посилається на той самий список, що й a."},{"q":"Який тип даних є незмінним?","o":["list","dict","str","set"],"a":2},{"q":"Що поверне `{\"a\": 1}.get(\"b\", 0)`?","o":["None","Помилку KeyError","0","1"],"a":2}]},{"id":"s15","topic":1,"code":"1.5","title":"Функції користувача і модулі мови Python","lessons":[{"n":44,"title":"Обчислювальне мислення: алгоритм, шаблон, абстракція, декомпозиція","blocks":[["p","**Обчислювальне мислення** — спосіб розв'язувати задачі так, щоб розв'язок міг виконати комп'ютер. Воно спирається на чотири складники:"],["table",["Складник","Суть","Приклад"],[["**Декомпозиція**","Поділ складної задачі на менші частини","Гра = меню + рух персонажа + підрахунок балів"],["**Розпізнавання шаблонів**","Пошук схожого в різних задачах","Середня оцінка, середня температура — одна дія «середнє»"],["**Абстракція**","Відкидання неважливих деталей","Для розкладу важливі час і предмет, а не колір класу"],["**Алгоритм**","Чітка послідовність кроків розв'язання","Інструкція, яку можна записати кодом"]]],["p","У програмуванні ці ідеї втілюються у **функціях**: функція — це абстракція (ми знаємо, що вона робить, не думаючи як), а програма з функцій — результат декомпозиції."]]},{"n":45,"title":"Метод функціональної декомпозиції задачі. Модульність","blocks":[["p","**Функціональна декомпозиція** — розбиття задачі на підзадачі, кожну з яких розв'язує окрема функція. Проєктування йде **зверху вниз**: спершу загальний план, потім деталі."],["h","Приклад: програма «Статистика класу»"],["ol",["Прочитати оцінки → функція `read_marks()`.","Обчислити середнє → функція `average(marks)`.","Знайти найкращих → функція `best(marks)`.","Вивести звіт → функція `report(...)`."]],["code","def read_marks():\n    return list(map(int, input(\"Оцінки: \").split()))\n\ndef average(marks):\n    return sum(marks) / len(marks)\n\ndef report(marks):\n    print(f\"Кількість: {len(marks)}, середнє: {average(marks):.1f}, максимум: {max(marks)}\")\n\nreport(read_marks())"],["p","**Модульність** — принцип, за яким програма складається з незалежних частин (функцій, модулів). Кожну частину можна написати, перевірити й замінити окремо."]]},{"n":46,"title":"Поняття підпрограми. Функції","blocks":[["p","**Підпрограма** — іменована частина програми, яку можна викликати багато разів. У Python підпрограми — це **функції**."],["code","def greet(name):            # заголовок: def, ім'я, параметри, двокрапка\n    print(\"Привіт,\", name)  # тіло функції з відступом\n\ngreet(\"Оля\")               # виклик функції\ngreet(\"Петро\")"],["h","Функції, що повертають значення"],["p","Оператор `return` завершує функцію і повертає результат у місце виклику:"],["code","def square(x):\n    return x * x\n\ny = square(5) + square(2)   # 25 + 4\nprint(y)                    # 29"],["p","Функція без `return` повертає спеціальне значення `None`."],["h","Переваги функцій"],["ul",["Код не дублюється: написали раз — викликаємо скільки завгодно.","Програму легше читати: ім'я функції пояснює, що відбувається.","Помилку виправляють в одному місці."]]]},{"n":47,"title":"Локальні та глобальні змінні","blocks":[["p","**Область видимості** — частина програми, де змінна доступна."],["ul",["**Локальна** змінна створюється всередині функції й існує лише під час її виконання.","**Глобальна** змінна створюється поза функціями й доступна для читання всюди."]],["code","rate = 40            # глобальна\n\ndef price(hours):\n    total = hours * rate   # total — локальна\n    return total\n\nprint(price(3))      # 120\n# print(total)       # NameError: total не існує поза функцією"],["h","Зміна глобальної змінної"],["code","counter = 0\n\ndef add():\n    global counter     # без цього рядка буде помилка UnboundLocalError\n    counter += 1\n\nadd(); add()\nprint(counter)       # 2"],["note","Глобальні змінні ускладнюють пошук помилок. Краще передавати дані у функцію через параметри й отримувати результат через `return`."]]},{"n":48,"title":"Формальні та фактичні параметри","blocks":[["ul",["**Формальні параметри** — імена в заголовку функції: `def area(a, b):` — тут `a` і `b`.","**Фактичні параметри (аргументи)** — значення, які передають під час виклику: `area(3, 5)`."]],["h","Способи передачі аргументів"],["code","def info(name, age, city=\"Рівне\"):   # city має значення за замовчуванням\n    print(name, age, city)\n\ninfo(\"Оля\", 16)                      # позиційні: Оля 16 Рівне\ninfo(\"Петро\", 15, \"Київ\")            # Петро 15 Київ\ninfo(age=17, name=\"Ірина\")           # іменовані, порядок не важливий"],["h","Довільна кількість аргументів"],["code","def total(*nums):\n    return sum(nums)\n\nprint(total(1, 2, 3))      # 6\nprint(total(5, 10))        # 15"],["note","Параметри зі значенням за замовчуванням записують **після** звичайних: `def f(a, b=1)` — правильно, `def f(a=1, b)` — помилка."]]},{"n":49,"title":"Передавання значень у функцію та з неї","blocks":[["p","У Python аргументи передаються **за посиланням на об'єкт**. Наслідки залежать від типу:"],["ul",["Незмінні об'єкти (`int`, `str`, `tuple`) функція змінити не може: присвоєння всередині створює новий об'єкт.","Змінювані об'єкти (`list`, `dict`) функція може змінити, і це буде видно поза нею."]],["code","def change(x, lst):\n    x = 100\n    lst.append(100)\n\na = 1\nb = [1]\nchange(a, b)\nprint(a, b)    # 1 [1, 100]"],["h","Повернення кількох значень"],["p","Функція може повернути кілька значень через кому — фактично це кортеж:"],["code","def min_max(nums):\n    return min(nums), max(nums)\n\nlo, hi = min_max([4, 9, 2, 7])\nprint(lo, hi)   # 2 9"]]},{"n":50,"title":"Робота зі списками у функціях","blocks":[["code","def average(nums):\n    \"\"\"Середнє значення списку.\"\"\"\n    return sum(nums) / len(nums) if nums else 0\n\ndef filter_positive(nums):\n    \"\"\"Новий список лише з додатних чисел.\"\"\"\n    return [x for x in nums if x > 0]\n\ndef normalize(nums):\n    \"\"\"Змінює список на місці: ділить кожен елемент на максимум.\"\"\"\n    m = max(nums)\n    for i in range(len(nums)):\n        nums[i] = nums[i] / m\n\ndata = [4, -2, 8, 0, 6]\nprint(average(data))          # 3.2\nprint(filter_positive(data))  # [4, 8, 6]\nnormalize(data)\nprint(data)                   # [0.5, -0.25, 1.0, 0.0, 0.75]"],["p","Зверніть увагу на два стилі: `filter_positive` **повертає новий** список і не чіпає вхідний, а `normalize` **змінює** переданий список. У документації функції варто вказувати, який стиль використано."],["note","Не використовуйте змінюваний об'єкт як значення за замовчуванням: `def f(lst=[])`. Список створюється один раз і накопичує значення між викликами. Правильно: `def f(lst=None)` і всередині `if lst is None: lst = []`."]]},{"n":51,"title":"Рекурсивні функції","blocks":[["p","Нагадаємо: **рекурсивна функція** викликає сама себе і має **базовий випадок**. Розглянемо типові приклади."],["code","def power(a, n):\n    if n == 0:\n        return 1\n    return a * power(a, n - 1)\n\ndef sum_digits(n):\n    if n \u003c 10:\n        return n\n    return n % 10 + sum_digits(n // 10)\n\ndef gcd(a, b):            # алгоритм Евкліда\n    if b == 0:\n        return a\n    return gcd(b, a % b)\n\nprint(power(2, 10), sum_digits(1234), gcd(48, 18))   # 1024 10 6"],["h","Рекурсія чи цикл?"],["p","Будь-яку рекурсію можна замінити циклом. Рекурсія коротша й природна для задач, які самі мають рекурсивну структуру (дерева папок, фрактали). Цикл зазвичай швидший і не має обмеження глибини."],["code","def fib(n):          # повільна рекурсія: повторно обчислює ті самі значення\n    if n \u003c= 2:\n        return 1\n    return fib(n - 1) + fib(n - 2)\n\nprint(fib(20))       # 6765"]]},{"n":52,"title":"Бібліотеки та модулі мови програмування","blocks":[["p","**Модуль** — файл `.py` з функціями, класами, змінними. **Бібліотека (пакет)** — набір модулів. Python має велику **стандартну бібліотеку**, що встановлюється разом з ним."],["h","Способи підключення"],["code","import math                    # усе, звертаємось math.sqrt\nfrom random import randint     # лише randint\nimport datetime as dt          # з коротким псевдонімом\n\nprint(math.sqrt(2))\nprint(randint(1, 10))\nprint(dt.date.today())"],["h","Корисні модулі стандартної бібліотеки"],["table",["Модуль","Призначення"],[["`math`","Математичні функції"],["`random`","Випадкові числа, вибір, перемішування"],["`datetime`","Дати й час"],["`os`","Робота з файлами й папками"],["`statistics`","Середнє, медіана, мода"],["`time`","Паузи, вимірювання часу"]]],["code","import statistics\nmarks = [10, 8, 12, 8, 9]\nprint(statistics.mean(marks), statistics.median(marks), statistics.mode(marks))   # 9.4 9 8"]]},{"n":53,"title":"Робота з додатковими бібліотеками мови програмування","blocks":[["p","**Додаткові (сторонні) бібліотеки** не входять у стандартну поставку. Їх встановлюють менеджером пакетів **pip** із каталогу PyPI:"],["code","pip install requests matplotlib"],["p","У Thonny це можна зробити через меню Tools → Manage packages."],["h","Популярні бібліотеки"],["table",["Бібліотека","Для чого"],[["`matplotlib`","Графіки та діаграми"],["`numpy`","Швидкі обчислення з масивами"],["`pandas`","Таблиці даних, аналіз"],["`requests`","Запити до сайтів"],["`pygame`","Ігри"],["`pillow`","Обробка зображень"]]],["h","Приклад: графік з matplotlib"],["code","import matplotlib.pyplot as plt\n\nmonths = [\"Вер\", \"Жов\", \"Лис\", \"Гру\"]\navg = [9.1, 9.4, 8.8, 9.7]\nplt.plot(months, avg, marker=\"o\")\nplt.title(\"Середній бал класу\")\nplt.ylabel(\"Бал\")\nplt.show()"]]},{"n":54,"title":"Відповідність результатів виконання програми поставленій задачі","blocks":[["p","Програма правильна, якщо для **будь-яких допустимих вхідних даних** вона дає результат, що відповідає умові задачі. Перевіряють це **тестуванням** окремих функцій (модульне тестування) і всієї програми."],["code","def is_leap(year):\n    return (year % 4 == 0 and year % 100 != 0) or year % 400 == 0\n\n# тести: вхідні дані → очікуваний результат\nassert is_leap(2024) is True\nassert is_leap(1900) is False\nassert is_leap(2000) is True\nassert is_leap(2023) is False\nprint(\"Функція працює правильно\")"],["h","Контрольний список перевірки"],["ul",["Чи всі вимоги умови виконано?","Чи правильно оброблено граничні та особливі значення (0, порожній список)?","Чи зрозуміло виведено результат?","Чи має кожна функція одну чітку задачу і зрозуміле ім'я?"]],["note","Цим уроком завершується підрозділ 1.5. Проводиться тематична атестація."]]}],"practice":[{"task":"Напишіть функцію `is_prime(n)`, яка повертає `True`, якщо число просте. Виведіть усі прості числа до 50.","answer":"def is_prime(n):\n    if n \u003c 2:\n        return False\n    for d in range(2, int(n ** 0.5) + 1):\n        if n % d == 0:\n            return False\n    return True\n\nprint([n for n in range(50) if is_prime(n)])","code":true},{"task":"Напишіть функцію `stats(nums)`, яка повертає мінімум, максимум і середнє списку.","answer":"def stats(nums):\n    return min(nums), max(nums), sum(nums) / len(nums)\n\nlo, hi, avg = stats([4, 8, 6, 2])\nprint(lo, hi, avg)   # 2 8 5.0","code":true},{"task":"Напишіть рекурсивну функцію, яка розвертає рядок.","answer":"def reverse(s):\n    if len(s) \u003c= 1:\n        return s\n    return reverse(s[1:]) + s[0]\n\nprint(reverse(\"Python\"))   # nohtyP","code":true},{"task":"За допомогою модуля `random` змоделюйте 1000 кидків кубика і виведіть, скільки разів випала кожна грань.","answer":"import random\ncounts = {i: 0 for i in range(1, 7)}\nfor _ in range(1000):\n    counts[random.randint(1, 6)] += 1\nprint(counts)","code":true},{"task":"Напишіть функцію `grade_level(mark)` та 4 перевірки `assert` для неї (по одній на кожен рівень: 1–3, 4–6, 7–9, 10–12).","answer":"def grade_level(mark):\n    if mark >= 10: return \"високий\"\n    if mark >= 7: return \"достатній\"\n    if mark >= 4: return \"середній\"\n    return \"початковий\"\n\nassert grade_level(12) == \"високий\"\nassert grade_level(7) == \"достатній\"\nassert grade_level(4) == \"середній\"\nassert grade_level(3) == \"початковий\"","code":true}],"quiz":[{"q":"Яке ключове слово починає опис функції в Python?","o":["function","def","func","sub"],"a":1},{"q":"Що повертає функція, у якій немає `return`?","o":["0","Порожній рядок","None","Помилку"],"a":2},{"q":"Як називаються змінні, створені всередині функції?","o":["Глобальні","Локальні","Формальні","Статичні"],"a":1},{"q":"У виклику `area(3, 5)` числа 3 і 5 — це…","o":["Формальні параметри","Фактичні параметри (аргументи)","Локальні змінні","Модулі"],"a":1},{"q":"Що виведе код: `def f(lst): lst.append(1)` / `a = []` / `f(a)` / `print(a)`?","o":["[]","[1]","None","Помилку"],"a":1,"why":"Список змінюваний, тому функція змінює той самий об'єкт."},{"q":"Який складник обчислювального мислення означає поділ задачі на частини?","o":["Абстракція","Декомпозиція","Розпізнавання шаблонів","Алгоритм"],"a":1},{"q":"Яка команда встановлює сторонню бібліотеку?","o":["import install numpy","pip install numpy","python get numpy","add numpy"],"a":1},{"q":"Як підключити з модуля math лише функцію sqrt?","o":["import sqrt from math","from math import sqrt","include math.sqrt","math import sqrt"],"a":1},{"q":"Що поверне `gcd(48, 18)` за алгоритмом Евкліда?","o":["2","3","6","18"],"a":2}]},{"id":"s16","topic":1,"code":"1.6","title":"Класи, об'єкти, наслідування","lessons":[{"n":55,"title":"Основні концепції об'єктно-орієнтованого програмування","blocks":[["p","**Об'єктно-орієнтоване програмування (ООП)** — підхід, у якому програма складається з **об'єктів**, що поєднують дані (властивості) і дії (методи). Об'єкти моделюють сутності реального світу: учня, банківський рахунок, персонажа гри."],["h","Чотири принципи ООП"],["table",["Принцип","Суть"],[["**Інкапсуляція**","Дані й методи, що з ними працюють, об'єднані в одному об'єкті; внутрішні деталі приховано"],["**Наслідування**","Новий клас створюється на основі наявного й отримує його властивості та методи"],["**Поліморфізм**","Однакові за назвою методи по-різному працюють у різних класах"],["**Абстракція**","Об'єкт описує лише суттєві для задачі характеристики"]]],["p","У Python **усе є об'єктами**: числа, рядки, списки. Наприклад, `\"hi\".upper()` — виклик методу `upper` об'єкта-рядка."]]},{"n":56,"title":"Поняття об'єкта, класу як об'єктного типу даних","blocks":[["p","**Клас** — це шаблон (креслення), що описує, які властивості та методи матимуть об'єкти. **Об'єкт (екземпляр)** — конкретна річ, створена за цим шаблоном."],["p","Аналогія: клас «Учень» описує, що в кожного учня є ім'я та клас навчання; об'єкти — конкретні учні Оля і Петро."],["code","class Student:\n    pass             # поки порожній клас\n\nolya = Student()     # створення об'єкта\npetro = Student()\nprint(type(olya))    # \u003cclass '__main__.Student'>\nprint(olya is petro) # False — це різні об'єкти"],["p","Клас є **типом даних**, визначеним користувачем, так само як вбудовані типи `int` чи `list`."],["note","Назви класів за PEP 8 пишуть з великої літери без підкреслень: `Student`, `BankAccount`."]]},{"n":57,"title":"Об'єкти, їх властивості","blocks":[["p","**Властивості (атрибути)** — дані, які зберігає об'єкт. Звертаються до них через крапку: `об'єкт.атрибут`."],["code","class Student:\n    school = \"ЯСНО\"         # атрибут класу — спільний для всіх\n\nolya = Student()\nolya.name = \"Оля\"          # атрибути об'єкта\nolya.grade = 10\nprint(olya.name, olya.grade, olya.school)   # Оля 10 ЯСНО"],["ul",["**Атрибути класу** однакові для всіх об'єктів класу.","**Атрибути об'єкта** в кожного екземпляра свої."]],["p","Перевірити наявність атрибута можна функцією `hasattr(obj, \"name\")`, а побачити всі атрибути об'єкта — через `vars(obj)`."]]},{"n":58,"title":"Конструктори, методи","blocks":[["p","**Конструктор** `__init__` — спеціальний метод, що автоматично викликається під час створення об'єкта й задає його початкові властивості. **Метод** — функція всередині класу. Перший параметр методів — `self`, посилання на сам об'єкт."],["code","class Student:\n    def __init__(self, name, grade):\n        self.name = name\n        self.grade = grade\n        self.marks = []\n\n    def add_mark(self, mark):\n        self.marks.append(mark)\n\n    def average(self):\n        return sum(self.marks) / len(self.marks) if self.marks else 0\n\n    def __str__(self):                 # як виводити об'єкт через print\n        return f\"{self.name}, {self.grade} клас, середній бал {self.average():.1f}\"\n\nolya = Student(\"Оля\", 10)\nolya.add_mark(11)\nolya.add_mark(12)\nprint(olya)    # Оля, 10 клас, середній бал 11.5"],["h","Наслідування"],["p","Клас-нащадок отримує все від батьківського класу і може додавати своє. `super()` викликає метод батьківського класу:"],["code","class Extern(Student):\n    def __init__(self, name, grade, tutor):\n        super().__init__(name, grade)\n        self.tutor = tutor\n\nivan = Extern(\"Іван\", 10, \"Мельник Л. М.\")\nivan.add_mark(9)\nprint(ivan, \"| тьютор:\", ivan.tutor)"]]},{"n":59,"title":"Події та обробники подій. Взаємодія об'єктів","blocks":[["p","**Подія** — зміна стану, на яку програма має відреагувати: натискання кнопки, введення тексту, закінчення таймера, досягнення рахунку. **Обробник події** — функція чи метод, що виконується, коли подія відбувається."],["code","class Button:\n    def __init__(self, text):\n        self.text = text\n        self.handlers = []          # список обробників\n\n    def on_click(self, handler):   # підписка на подію\n        self.handlers.append(handler)\n\n    def click(self):               # подія відбулася\n        for h in self.handlers:\n            h(self)\n\ndef say_hi(btn):\n    print(\"Натиснуто кнопку\", btn.text)\n\nok = Button(\"OK\")\nok.on_click(say_hi)\nok.click()     # Натиснуто кнопку OK"],["h","Взаємодія об'єктів"],["p","Об'єкти взаємодіють, викликаючи методи один одного:"],["code","class Account:\n    def __init__(self, owner, balance=0):\n        self.owner, self.balance = owner, balance\n\n    def transfer(self, other, amount):\n        if amount \u003c= self.balance:\n            self.balance -= amount\n            other.balance += amount\n            return True\n        return False\n\na, b = Account(\"Оля\", 500), Account(\"Петро\")\na.transfer(b, 200)\nprint(a.balance, b.balance)   # 300 200"]]},{"n":60,"title":"Проектування взаємодії програмних об'єктів","blocks":[["p","Перед написанням коду об'єктну програму проєктують: визначають класи, їх властивості, методи і зв'язки. Для цього використовують **діаграми класів UML**."],["h","Кроки проєктування"],["ol",["Виписати іменники з умови задачі — кандидати в класи та властивості.","Виписати дієслова — кандидати в методи.","Визначити зв'язки: «є різновидом» (наслідування) чи «містить» (композиція).","Намалювати діаграму класів."]],["h","Приклад: бібліотека"],["p","Умова: «Бібліотека має книги. Читач бере книгу і повертає її». Іменники: бібліотека, книга, читач. Дієслова: брати, повертати."],["table",["Клас","Властивості","Методи"],[["Book","title, author, is_available","—"],["Reader","name, books","take(book), give_back(book)"],["Library","books","add(book), find(title)"]]],["p","Зв'язки: бібліотека **містить** книги, читач **містить** список узятих книг."]]},{"n":61,"title":"Створення простих об'єктно-орієнтованих програм","blocks":[["p","Реалізуємо спроєктовану бібліотеку:"],["code","class Book:\n    def __init__(self, title, author):\n        self.title, self.author = title, author\n        self.is_available = True\n\nclass Reader:\n    def __init__(self, name):\n        self.name, self.books = name, []\n\n    def take(self, book):\n        if book.is_available:\n            book.is_available = False\n            self.books.append(book)\n            print(f\"{self.name} взяв(ла) «{book.title}»\")\n        else:\n            print(f\"«{book.title}» зараз недоступна\")\n\n    def give_back(self, book):\n        book.is_available = True\n        self.books.remove(book)\n\nclass Library:\n    def __init__(self):\n        self.books = []\n\n    def add(self, book):\n        self.books.append(book)\n\n    def find(self, title):\n        for b in self.books:\n            if b.title == title:\n                return b\n        return None\n\nlib = Library()\nlib.add(Book(\"Кайдашева сім'я\", \"І. Нечуй-Левицький\"))\nolya, petro = Reader(\"Оля\"), Reader(\"Петро\")\nbook = lib.find(\"Кайдашева сім'я\")\nolya.take(book)\npetro.take(book)\nolya.give_back(book)\npetro.take(book)"]]},{"n":62,"title":"Виконання індивідуальних та колективних проектів","blocks":[["p","Проєкт для практичного використання, творчого самовираження або розв'язання соціальної проблеми із застосуванням класів і об'єктів."],["h","Приклади тем"],["ul",["**Трекер звичок**: класи `Habit`, `Day`, підрахунок серій виконання.","**Облік волонтерських зборів**: класи `Fund`, `Donation`, звіт про зібрану суму.","**Електронний щоденник**: класи `Student`, `Subject`, середні бали.","**Текстова гра**: класи `Hero`, `Enemy`, `Item`."]],["h","Етапи"],["ol",["Обрати тему й сформулювати, яку проблему розв'язує програма.","Спроєктувати класи (таблиця або діаграма).","Реалізувати класи й перевірити кожен окремо.","Написати головну програму з меню.","Протестувати й підготувати презентацію."]]]},{"n":63,"title":"Документація проектних рішень","blocks":[["p","**Документація** пояснює, що робить програма, як нею користуватися і як вона влаштована. Без неї іншим людям (і вам за кілька місяців) важко зрозуміти код."],["h","Види документації"],["ul",["**Рядки документації (docstring)** у класах і функціях.","**Файл README** — опис проєкту, вимоги, інструкція із запуску.","**Діаграма класів** і опис архітектури.","**Інструкція користувача** зі знімками екрана."]],["code","class Habit:\n    \"\"\"Звичка, виконання якої відстежується щодня.\n\n    Атрибути:\n        name (str): назва звички\n        done (list[bool]): позначки виконання по днях\n    \"\"\"\n\n    def streak(self):\n        \"\"\"Повертає кількість днів поспіль, коли звичку виконано.\"\"\"\n        ..."],["p","Переглянути документацію можна функцією `help(Habit)`."]]},{"n":64,"title":"Доцільність створення класів та об'єктів для розв'язання задач","blocks":[["p","Класи корисні не завжди. Для маленької задачі на кілька рядків клас лише ускладнить код."],["table",["Класи доречні, коли…","Достатньо функцій, коли…"],[["Є кілька однотипних сутностей зі своїм станом (учні, рахунки, персонажі)","Задача — одне обчислення: середнє, площа, перевірка"],["Дані й дії над ними тісно пов'язані","Дані просто проходять через кілька перетворень"],["Потрібні різновиди однієї сутності (наслідування)","Немає стану, який треба зберігати між викликами"],["Програма велика й розвиватиметься","Програма коротка й одноразова"]]],["p","Добре правило: починайте з функцій, а клас створюйте, коли помітили, що кілька функцій постійно передають одні й ті самі дані."]]},{"n":65,"title":"Роль програмування та моделювання для розв'язання навчальних та життєвих задач","blocks":[["p","**Модель** — спрощене представлення реального об'єкта чи процесу. Програма з класами — це модель: класи описують сутності, методи — їхню поведінку."],["h","Де застосовують програмне моделювання"],["ul",["Прогноз погоди та клімату.","Моделювання поширення епідемій.","Симулятори для навчання пілотів і водіїв.","Фінансове планування, кредитні калькулятори.","Ігри та віртуальні світи."]],["h","Приклад: модель накопичень"],["code","class Savings:\n    def __init__(self, start, monthly, rate):\n        self.balance, self.monthly, self.rate = start, monthly, rate\n\n    def month(self):\n        self.balance = self.balance * (1 + self.rate / 12) + self.monthly\n\ns = Savings(start=1000, monthly=500, rate=0.12)\nfor m in range(12):\n    s.month()\nprint(f\"Через рік: {s.balance:.0f} грн\")"],["note","Цим уроком завершується підрозділ 1.6. Проводиться тематична атестація."]]}],"practice":[{"task":"Створіть клас `Rectangle` з властивостями `width`, `height` і методами `area()` та `perimeter()`.","answer":"class Rectangle:\n    def __init__(self, width, height):\n        self.width, self.height = width, height\n    def area(self):\n        return self.width * self.height\n    def perimeter(self):\n        return 2 * (self.width + self.height)\n\nr = Rectangle(3, 5)\nprint(r.area(), r.perimeter())   # 15 16","code":true},{"task":"Створіть клас `BankAccount` з методами `deposit(amount)` і `withdraw(amount)`. Зняття не має виконуватися, якщо коштів недостатньо.","answer":"class BankAccount:\n    def __init__(self, owner):\n        self.owner, self.balance = owner, 0\n    def deposit(self, amount):\n        self.balance += amount\n    def withdraw(self, amount):\n        if amount > self.balance:\n            print(\"Недостатньо коштів\")\n            return False\n        self.balance -= amount\n        return True\n\nacc = BankAccount(\"Оля\")\nacc.deposit(300)\nacc.withdraw(500)\nprint(acc.balance)   # 300","code":true},{"task":"Створіть клас `Animal` з методом `speak()` і два класи-нащадки `Cat` і `Dog`, які перевизначають цей метод.","answer":"class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        return \"...\"\n\nclass Cat(Animal):\n    def speak(self):\n        return \"Няв\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \"Гав\"\n\nfor a in [Cat(\"Мурка\"), Dog(\"Рекс\")]:\n    print(a.name, a.speak())","code":true},{"task":"Спроєктуйте (таблицею: клас, властивості, методи) програму «Шкільний розклад».","answer":"Lesson: subject, teacher, room, time. Day: name, lessons — add(lesson), show(). Timetable: days — find_by_teacher(name), total_lessons(). Зв'язки: Timetable містить Day, Day містить Lesson."}],"quiz":[{"q":"Що таке клас?","o":["Конкретний об'єкт","Шаблон для створення об'єктів","Вбудована функція","Тип циклу"],"a":1},{"q":"Як називається метод, що викликається під час створення об'єкта?","o":["__str__","__init__","__new_object__","create"],"a":1},{"q":"Що означає параметр `self` у методі?","o":["Клас","Сам об'єкт, для якого викликано метод","Батьківський клас","Глобальну змінну"],"a":1},{"q":"Який принцип ООП дозволяє створити клас на основі наявного?","o":["Інкапсуляція","Поліморфізм","Наслідування","Абстракція"],"a":2},{"q":"Як викликати конструктор батьківського класу?","o":["parent().__init__()","super().__init__()","base.__init__()","self.parent()"],"a":1},{"q":"Що таке обробник події?","o":["Помилка в програмі","Функція, що виконується у відповідь на подію","Клас для подій","Цикл while"],"a":1},{"q":"Як звернутися до атрибута name об'єкта s?","o":["s[name]","s->name","s.name","name(s)"],"a":2},{"q":"Коли створювати клас найменш доцільно?","o":["Є багато однотипних сутностей зі станом","Потрібні різновиди однієї сутності","Треба один раз обчислити площу кола","Програма велика й розвиватиметься"],"a":2}]},{"id":"s17","topic":1,"code":"1.7","title":"Поліморфізм, перевизначення методів, модулі користувача","lessons":[{"n":66,"title":"Поліморфізм","blocks":[["p","**Поліморфізм** («багато форм») — можливість працювати з об'єктами різних класів однаково, викликаючи методи з однаковою назвою. Кожен клас виконує метод по-своєму."],["code","class Circle:\n    def __init__(self, r): self.r = r\n    def area(self): return 3.14159 * self.r ** 2\n\nclass Square:\n    def __init__(self, a): self.a = a\n    def area(self): return self.a ** 2\n\nshapes = [Circle(1), Square(3), Circle(2)]\nfor s in shapes:\n    print(type(s).__name__, round(s.area(), 2))   # той самий виклик — різна поведінка"],["p","Поліморфізм ми використовували й раніше: оператор `+` додає числа, але склеює рядки та списки; функція `len()` працює з рядками, списками й словниками."],["note","У Python діє принцип **«качиної типізації»**: якщо об'єкт має потрібний метод, його можна використовувати, незалежно від класу. «Якщо щось ходить як качка і крякає як качка — це качка»."]]},{"n":67,"title":"Перевизначення і розширення можливостей методів","blocks":[["p","**Перевизначення** — клас-нащадок створює метод з тією самою назвою, що й у батьківського класу, і **замінює** його поведінку. **Розширення** — нащадок викликає батьківський метод через `super()` і **додає** свою дію."],["code","class Employee:\n    def __init__(self, name, salary):\n        self.name, self.salary = name, salary\n    def info(self):\n        return f\"{self.name}: {self.salary} грн\"\n\nclass Teacher(Employee):\n    def __init__(self, name, salary, subject):\n        super().__init__(name, salary)        # розширюємо конструктор\n        self.subject = subject\n    def info(self):                           # розширюємо метод\n        return super().info() + f\", предмет: {self.subject}\"\n\nclass Intern(Employee):\n    def info(self):                           # повністю перевизначаємо\n        return f\"{self.name} — стажист\"\n\nfor p in [Teacher(\"Олена\", 20000, \"інформатика\"), Intern(\"Петро\", 8000)]:\n    print(p.info())"],["h","Спеціальні методи"],["p","Перевизначаючи спеціальні методи, можна навчити свої об'єкти працювати з вбудованими операціями:"],["code","class Vector:\n    def __init__(self, x, y): self.x, self.y = x, y\n    def __add__(self, other): return Vector(self.x + other.x, self.y + other.y)\n    def __str__(self): return f\"({self.x}, {self.y})\"\n\nprint(Vector(1, 2) + Vector(3, 4))   # (4, 6)"]]},{"n":68,"title":"Композиційний підхід в ООП мовою Python","blocks":[["p","**Композиція** — об'єкт містить інші об'єкти як свої частини. Це зв'язок «**містить**» (has-a), на відміну від наслідування — «**є різновидом**» (is-a)."],["table",["Наслідування","Композиція"],[["Кіт **є** твариною","Автомобіль **має** двигун"],["`class Cat(Animal)`","`self.engine = Engine()`"]]],["code","class Engine:\n    def __init__(self, power): self.power = power\n    def start(self): return f\"двигун {self.power} к.с. запущено\"\n\nclass Wheel:\n    pass\n\nclass Car:\n    def __init__(self, model, power):\n        self.model = model\n        self.engine = Engine(power)          # композиція\n        self.wheels = [Wheel() for _ in range(4)]\n    def drive(self):\n        return f\"{self.model}: {self.engine.start()}, коліс: {len(self.wheels)}\"\n\nprint(Car(\"Таврія\", 52).drive())"],["note","Поширена порада: «надавайте перевагу композиції над наслідуванням». Композиція гнучкіша: частину можна замінити, не змінюючи всієї ієрархії класів."]]},{"n":69,"title":"Створення і використання модулів користувача","blocks":[["p","Будь-який ваш файл `.py` можна підключити як **модуль** до іншої програми. Так великий проєкт ділять на логічні частини."],["code","# файл geometry.py\nPI = 3.14159\n\ndef circle_area(r):\n    return PI * r ** 2\n\ndef rect_area(a, b):\n    return a * b\n\nif __name__ == \"__main__\":       # виконується лише при прямому запуску\n    print(\"Тест:\", circle_area(1))"],["code","# файл main.py (у тій самій папці)\nimport geometry\nfrom geometry import rect_area\n\nprint(geometry.circle_area(2))\nprint(rect_area(3, 4))"],["h","Пакети"],["p","Кілька модулів можна об'єднати в **пакет** — папку, у якій є файл `__init__.py`:"],["code","school/\n    __init__.py\n    students.py\n    marks.py\n\n# використання:\nfrom school.students import Student"]]},{"n":70,"title":"Опрацювання виняткових ситуацій","blocks":[["p","**Виняток (exception)** — помилка, що виникає під час виконання програми: ділення на нуль, неправильне введення, відсутній файл. Якщо виняток не обробити, програма аварійно завершиться."],["code","try:\n    n = int(input(\"Число: \"))\n    print(100 / n)\nexcept ValueError:\n    print(\"Потрібно ввести ціле число\")\nexcept ZeroDivisionError:\n    print(\"На нуль ділити не можна\")\nelse:\n    print(\"Обчислено без помилок\")      # якщо винятку не було\nfinally:\n    print(\"Роботу завершено\")            # виконується завжди"],["h","Поширені винятки"],["table",["Виняток","Коли виникає"],[["`ValueError`","Неправильне значення: `int(\"abc\")`"],["`ZeroDivisionError`","Ділення на нуль"],["`IndexError`","Індекс поза межами списку"],["`KeyError`","Немає такого ключа в словнику"],["`FileNotFoundError`","Файл не знайдено"],["`TypeError`","Операція з невідповідним типом"]]],["h","Повторне введення до правильного значення"],["code","while True:\n    try:\n        age = int(input(\"Вік: \"))\n        break\n    except ValueError:\n        print(\"Спробуйте ще раз\")"],["h","Власні винятки"],["code","def withdraw(balance, amount):\n    if amount > balance:\n        raise ValueError(\"Недостатньо коштів\")\n    return balance - amount"]]},{"n":71,"title":"Виконання індивідуальних та колективних проектів","blocks":[["p","Проєкт, у якому поєднуються наслідування, поліморфізм, композиція, власні модулі та обробка винятків."],["h","Приклад теми: «Зоопарк»"],["ul",["Модуль `animals.py`: базовий клас `Animal` і нащадки з перевизначеним методом `speak()`.","Модуль `zoo.py`: клас `Zoo`, що **містить** список тварин (композиція).","Модуль `main.py`: меню, введення команд, обробка неправильного введення через `try/except`."]],["h","Вимоги до проєкту"],["ol",["Щонайменше 3 класи, пов'язані наслідуванням.","Поліморфний виклик методу для списку об'єктів.","Програма розбита щонайменше на 2 модулі.","Неправильне введення не призводить до аварійного завершення.","Є README з описом і інструкцією."]],["note","Цим уроком завершується підрозділ 1.7. Проводиться тематична атестація."]]}],"practice":[{"task":"Створіть базовий клас `Shape` з методом `area()` і нащадки `Rect`, `Triangle`, `Circle`. Знайдіть фігуру з найбільшою площею у списку.","answer":"import math\nclass Shape:\n    def area(self): return 0\nclass Rect(Shape):\n    def __init__(self, a, b): self.a, self.b = a, b\n    def area(self): return self.a * self.b\nclass Triangle(Shape):\n    def __init__(self, a, h): self.a, self.h = a, h\n    def area(self): return self.a * self.h / 2\nclass Circle(Shape):\n    def __init__(self, r): self.r = r\n    def area(self): return math.pi * self.r ** 2\n\nshapes = [Rect(2, 5), Triangle(6, 4), Circle(2)]\nbig = max(shapes, key=lambda s: s.area())\nprint(type(big).__name__, round(big.area(), 2))","code":true},{"task":"Напишіть функцію `safe_divide(a, b)`, яка повертає частку або повідомлення «Ділення на нуль», не допускаючи аварійного завершення.","answer":"def safe_divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return \"Ділення на нуль\"\n\nprint(safe_divide(10, 4), safe_divide(1, 0))","code":true},{"task":"Створіть клас `Playlist`, який містить об'єкти `Song` (назва, тривалість у секундах), і метод для загальної тривалості у форматі хв:с.","answer":"class Song:\n    def __init__(self, title, sec): self.title, self.sec = title, sec\nclass Playlist:\n    def __init__(self): self.songs = []\n    def add(self, song): self.songs.append(song)\n    def duration(self):\n        total = sum(s.sec for s in self.songs)\n        return f\"{total // 60}:{total % 60:02}\"\n\np = Playlist()\np.add(Song(\"Пісня 1\", 185)); p.add(Song(\"Пісня 2\", 230))\nprint(p.duration())   # 6:55","code":true}],"quiz":[{"q":"Що таке поліморфізм?","o":["Приховування даних","Однакові за назвою методи працюють по-різному в різних класах","Створення копії об'єкта","Поділ програми на модулі"],"a":1},{"q":"Що робить `super().info()` у методі нащадка?","o":["Видаляє метод","Викликає метод info батьківського класу","Створює новий клас","Викликає виняток"],"a":1},{"q":"Який зв'язок описує композиція?","o":["«є різновидом»","«містить»","«дорівнює»","«копіює»"],"a":1},{"q":"Який блок виконується завжди, незалежно від винятку?","o":["try","except","else","finally"],"a":3},{"q":"Який виняток виникне під час `int(\"abc\")`?","o":["TypeError","ValueError","NameError","KeyError"],"a":1},{"q":"Як підключити власний модуль із файлу `tools.py`?","o":["import tools.py","import tools","include tools","from tools.py import *"],"a":1},{"q":"Яке ключове слово штучно створює виняток?","o":["throw","raise","error","except"],"a":1},{"q":"Який спеціальний метод треба перевизначити, щоб об'єкти можна було додавати знаком +?","o":["__plus__","__add__","__sum__","__init__"],"a":1}]},{"id":"s18","topic":1,"code":"1.8","title":"Основи графічного інтерфейсу користувача","lessons":[{"n":72,"title":"Консольний режим виконання програми та графічний інтерфейс","blocks":[["table",["","Консольний режим","Графічний інтерфейс (GUI)"],[["Взаємодія","Текстові команди та відповіді","Вікна, кнопки, поля, меню"],["Порядок дій","Визначає програма","Визначає користувач"],["Для кого","Розробники, адміністратори, автоматизація","Звичайні користувачі"],["Складність створення","Простіше","Складніше"]]],["p","GUI-програма працює за **подієвою моделлю**: після запуску вона чекає на дії користувача (події) у **головному циклі** і викликає відповідні обробники."],["p","Для Python є кілька бібліотек GUI: **tkinter** (входить у стандартну бібліотеку), PyQt, Kivy. Ми використовуємо tkinter."],["code","import tkinter as tk\n\nroot = tk.Tk()                 # головне вікно\nroot.title(\"Моя перша програма\")\nroot.geometry(\"300x150\")       # ширина x висота\ntk.Label(root, text=\"Привіт, 10 клас!\", font=(\"Arial\", 16)).pack(pady=40)\nroot.mainloop()                # головний цикл обробки подій"]]},{"n":73,"title":"Розробка форм та розміщення на них елементів керування","blocks":[["p","**Форма** — вікно програми. **Елементи керування (віджети)** — кнопки, написи, поля, які розміщують на формі."],["table",["Віджет","Призначення"],[["`Label`","Напис, зображення"],["`Button`","Кнопка"],["`Entry`","Поле введення одного рядка"],["`Text`","Багаторядкове поле"],["`Checkbutton`","Прапорець (так/ні)"],["`Radiobutton`","Перемикач (один з кількох)"],["`Listbox`","Список для вибору"],["`Scale`","Повзунок"]]],["h","Менеджери розміщення"],["ul",["`pack()` — розміщує віджети один за одним (зверху вниз або в рядок).","`grid(row, column)` — розміщує в клітинках таблиці; найзручніший для форм.","`place(x, y)` — точні координати."]],["code","import tkinter as tk\nroot = tk.Tk()\nroot.title(\"Реєстрація\")\ntk.Label(root, text=\"Ім'я:\").grid(row=0, column=0, padx=5, pady=5, sticky=\"e\")\ntk.Entry(root).grid(row=0, column=1, padx=5)\ntk.Label(root, text=\"Клас:\").grid(row=1, column=0, padx=5, pady=5, sticky=\"e\")\ntk.Entry(root).grid(row=1, column=1, padx=5)\ntk.Button(root, text=\"Зареєструватися\").grid(row=2, column=0, columnspan=2, pady=10)\nroot.mainloop()"]]},{"n":74,"title":"Уведення й виведення даних за допомогою елементів керування","blocks":[["p","Дані вводять у поле `Entry`, а виводять у напис `Label`. Дію запускає кнопка з параметром `command` — це **обробник події** натискання."],["code","import tkinter as tk\n\ndef calculate():\n    try:\n        a = float(entry_a.get())        # зчитати текст із поля\n        b = float(entry_b.get())\n        result.config(text=f\"Сума: {a + b}\")   # змінити напис\n    except ValueError:\n        result.config(text=\"Введіть числа!\")\n\nroot = tk.Tk()\nroot.title(\"Калькулятор\")\nentry_a = tk.Entry(root, width=10); entry_a.pack(pady=3)\nentry_b = tk.Entry(root, width=10); entry_b.pack(pady=3)\ntk.Button(root, text=\"Додати\", command=calculate).pack(pady=5)\nresult = tk.Label(root, text=\"Сума: ?\")\nresult.pack(pady=5)\nroot.mainloop()"],["note","У `command` передають **ім'я** функції без дужок: `command=calculate`. Запис `command=calculate()` викличе функцію одразу під час створення кнопки."],["p","Для повідомлень зручно використовувати модуль `messagebox`: `from tkinter import messagebox`, потім `messagebox.showinfo(\"Заголовок\", \"Текст\")`."]]},{"n":75,"title":"Зчитування і встановлення значень елементів керування у програмі","blocks":[["p","Для прапорців, перемикачів і повзунків використовують **змінні tkinter**: `StringVar`, `IntVar`, `BooleanVar`. Вони пов'язують віджет зі значенням у програмі."],["table",["Дія","Запис"],[["Прочитати текст поля","`entry.get()`"],["Очистити / записати в поле","`entry.delete(0, tk.END)`, `entry.insert(0, \"текст\")`"],["Змінити напис","`label.config(text=\"...\")`"],["Прочитати змінну","`var.get()`"],["Встановити змінну","`var.set(значення)`"]]],["code","import tkinter as tk\n\ndef show():\n    lang = choice.get()\n    extra = \" + розсилка\" if subscribe.get() else \"\"\n    out.config(text=f\"Мова: {lang}, рівень: {level.get()}{extra}\")\n\nroot = tk.Tk()\nchoice = tk.StringVar(value=\"Python\")\nfor name in [\"Python\", \"JavaScript\", \"C++\"]:\n    tk.Radiobutton(root, text=name, variable=choice, value=name).pack(anchor=\"w\")\nsubscribe = tk.BooleanVar()\ntk.Checkbutton(root, text=\"Отримувати новини\", variable=subscribe).pack(anchor=\"w\")\nlevel = tk.IntVar(value=5)\ntk.Scale(root, from_=1, to=10, orient=\"horizontal\", variable=level).pack()\ntk.Button(root, text=\"Показати\", command=show).pack()\nout = tk.Label(root, text=\"\")\nout.pack()\nroot.mainloop()"]]},{"n":76,"title":"Виконання індивідуальних та колективних проектів","blocks":[["p","Створіть програму з графічним інтерфейсом, яка розв'язує корисну задачу."],["h","Ідеї проєктів"],["ul",["Конвертер величин (гривні/долари, км/милі, °C/°F).","Калькулятор ІМТ з порадами.","Тренажер таблиці множення з підрахунком балів.","Список справ із збереженням у файл.","Генератор паролів із налаштуваннями довжини та символів."]],["h","Вимоги"],["ol",["Щонайменше 4 різні віджети.","Розміщення через `grid` або `pack` з відступами.","Перевірка введення: програма не «падає» на неправильних даних.","Логіка винесена у функції або клас.","Зрозумілі написи українською."]],["code","# Каркас програми з класом\nimport tkinter as tk\n\nclass App:\n    def __init__(self, root):\n        self.root = root\n        root.title(\"Мій проєкт\")\n        self.build()\n\n    def build(self):\n        tk.Label(self.root, text=\"...\").pack()\n\nroot = tk.Tk()\nApp(root)\nroot.mainloop()"]]},{"n":77,"title":"Зворотний зв'язок від користувачів програми","blocks":[["p","**Зворотний зв'язок** — думки й зауваження користувачів про програму. Він показує, чи зручна програма, і допомагає її покращити."],["h","Способи отримати відгуки"],["ul",["**Спостереження**: дати програму однокласнику і мовчки дивитися, де він зупиняється чи помиляється.","**Опитування**: Google Форма з питаннями й оцінками.","**Інтерв'ю**: коротка розмова після використання.","**Аналіз помилок**: запис у файл випадків, коли виникли винятки."]],["h","Питання для опитування"],["ol",["Чи зрозуміло, для чого програма? (1–5)","Що було найскладніше зробити?","Яких функцій бракує?","Чи порекомендували б ви програму?"]],["p","Після збору відгуків складають список покращень, упорядковують за важливістю й випускають нову версію. Цей цикл «створити → отримати відгук → покращити» називають **ітеративною розробкою**."]]},{"n":78,"title":"Кар'єрні траєкторії в галузі ІТ","blocks":[["table",["Напрям","Чим займається","Що варто вивчати"],[["Розробник програм (Software Developer)","Пише код застосунків і сервісів","Python, Java, C#, алгоритми"],["Веброзробник (Frontend / Backend)","Створює сайти та вебзастосунки","HTML, CSS, JavaScript, бази даних"],["Тестувальник (QA Engineer)","Шукає помилки, автоматизує тести","Тест-дизайн, Python, SQL"],["Аналітик даних (Data Analyst)","Аналізує дані, будує звіти","Excel, SQL, Python, статистика"],["Фахівець з кібербезпеки","Захищає системи від атак","Мережі, Linux, криптографія"],["UI/UX-дизайнер","Проєктує зручні інтерфейси","Figma, психологія користувача"],["Інженер машинного навчання","Створює моделі ШІ","Математика, Python, нейромережі"],["DevOps-інженер","Налаштовує сервери, розгортання","Linux, хмари, автоматизація"]]],["p","**Кар'єрна траєкторія** зазвичай виглядає так: стажист (Intern/Trainee) → молодший спеціаліст (Junior) → спеціаліст (Middle) → старший спеціаліст (Senior) → керівник команди (Team Lead) або архітектор."],["p","Шляхи навчання: університет, онлайн-курси, ІТ-школи, самостійне навчання з власними проєктами в портфоліо (наприклад, на GitHub)."]]},{"n":79,"title":"Універсальні вміння та навички в ІТ","blocks":[["p","Крім технічних знань (**hard skills**), в ІТ дуже цінуються **soft skills** — універсальні навички, корисні в будь-якій професії."],["ul",["**Критичне мислення** — аналізувати, перевіряти інформацію, шукати причини проблем.","**Навчання впродовж життя** — технології змінюються щороку.","**Командна робота** — більшість проєктів створюють команди.","**Комунікація** — пояснити ідею колегам і замовнику, написати зрозумілу документацію.","**Тайм-менеджмент** — планувати задачі й дотримуватися термінів.","**Англійська мова** — документація, спільноти та команди міжнародні.","**Емоційний інтелект і стресостійкість** — працювати з критикою та дедлайнами."]],["p","Розвивати ці навички допомагають командні проєкти, олімпіади, хакатони, волонтерство, ведення власного блогу про навчання."]]},{"n":80,"title":"Програмування як середовище для творчості","blocks":[["p","Програмування — не лише обчислення, а й інструмент творчості: генеративне мистецтво, музика, ігри, інтерактивні історії."],["h","Генеративна графіка з turtle"],["code","import turtle\nimport colorsys\n\nt = turtle.Turtle()\nturtle.bgcolor(\"black\")\nt.speed(0)\nfor i in range(180):\n    t.pencolor(colorsys.hsv_to_rgb(i / 180, 1, 1))\n    t.forward(i * 2)\n    t.left(59)\nturtle.done()"],["h","Напрями творчого програмування"],["ul",["**Генеративне мистецтво**: Processing, p5.js, Python turtle.","**Музика**: Sonic Pi, бібліотеки для синтезу звуку.","**Ігри**: pygame, Godot, Scratch.","**Інтерактивні історії**: Twine, Ren'Py.","**Творчий ШІ**: генерація текстів і зображень."]],["note","Цим уроком завершуються підрозділ 1.8 і вся тема 1. Проводиться тематична атестація."]]}],"practice":[{"task":"Створіть програму з графічним інтерфейсом для переведення температури з °C у °F (F = C · 9/5 + 32).","answer":"import tkinter as tk\n\ndef convert():\n    try:\n        c = float(entry.get())\n        out.config(text=f\"{c * 9 / 5 + 32:.1f} °F\")\n    except ValueError:\n        out.config(text=\"Введіть число\")\n\nroot = tk.Tk()\nroot.title(\"°C → °F\")\nentry = tk.Entry(root); entry.pack(padx=10, pady=5)\ntk.Button(root, text=\"Перевести\", command=convert).pack()\nout = tk.Label(root, text=\"\"); out.pack(pady=5)\nroot.mainloop()","code":true},{"task":"Створіть лічильник натискань: кнопка «+1», кнопка «Скинути» і напис з поточним значенням.","answer":"import tkinter as tk\n\nroot = tk.Tk()\ncount = tk.IntVar(value=0)\ntk.Label(root, textvariable=count, font=(\"Arial\", 24)).pack()\ntk.Button(root, text=\"+1\", command=lambda: count.set(count.get() + 1)).pack(side=\"left\", padx=10, pady=10)\ntk.Button(root, text=\"Скинути\", command=lambda: count.set(0)).pack(side=\"right\", padx=10)\nroot.mainloop()","code":true},{"task":"Складіть 5 питань для опитування користувачів вашої програми: 2 з оцінкою від 1 до 5 і 3 відкритих.","answer":"1) Наскільки зрозуміло, як користуватися програмою? (1–5) 2) Наскільки програма корисна для вас? (1–5) 3) Що було найважче? 4) Яку функцію ви б додали? 5) Що б ви змінили в оформленні?"}],"quiz":[{"q":"Яка бібліотека GUI входить у стандартну поставку Python?","o":["PyQt","tkinter","Kivy","pygame"],"a":1},{"q":"Який метод запускає головний цикл обробки подій?","o":["root.start()","root.run()","root.mainloop()","root.loop()"],"a":2},{"q":"Який віджет призначений для введення одного рядка тексту?","o":["Label","Entry","Button","Scale"],"a":1},{"q":"Як отримати текст із поля entry?","o":["entry.text","entry.get()","entry.read()","entry.value()"],"a":1},{"q":"Як правильно прив'язати функцію calc до кнопки?","o":["command=calc()","command=calc","onclick=calc","action=\"calc\""],"a":1},{"q":"Який менеджер розміщує віджети в клітинках таблиці?","o":["pack","grid","place","table"],"a":1},{"q":"Що належить до soft skills?","o":["Знання Python","Командна робота","Знання SQL","Налаштування серверів"],"a":1},{"q":"Як називається підхід «створити → отримати відгук → покращити»?","o":["Каскадна розробка","Ітеративна розробка","Декомпозиція","Рекурсія"],"a":1}]},{"id":"t2","topic":2,"code":"2","title":"Сучасні інформаційні технології","lessons":[{"n":81,"title":"Сучасні інформаційні технології та системи. Людина в інформаційному суспільстві","blocks":[["p","**Інформаційна технологія (ІТ)** — сукупність методів і засобів збирання, зберігання, опрацювання та передавання інформації. **Інформаційна система** — комплекс обладнання, програм, даних і людей, що забезпечує інформаційні потреби організації: наприклад, система «Дія», шкільний електронний журнал, система продажу квитків."],["h","Сучасні технології"],["ul",["**Хмарні обчислення** — дані й програми зберігаються на віддалених серверах (Google Диск, Microsoft 365).","**Інтернет речей (IoT)** — пристрої, що обмінюються даними: розумні лічильники, фітнес-браслети.","**Великі дані (Big Data)** — аналіз величезних масивів інформації.","**Штучний інтелект** — системи, що навчаються на даних.","**Блокчейн** — розподілені захищені реєстри.","**Доповнена та віртуальна реальність (AR/VR)**."]],["h","Інформаційне суспільство"],["p","**Інформаційне суспільство** — суспільство, у якому більшість людей зайняті створенням, зберіганням, обробкою та поширенням інформації і знань. Для життя в ньому потрібна **інформаційна грамотність**: уміння знаходити, оцінювати й критично перевіряти інформацію, захищати свої дані та дотримуватися цифрового етикету."]]},{"n":82,"title":"Здібності, креативність і знання в галузі інформатики","blocks":[["p","Успіх в інформатиці залежить не від «вродженого таланту», а від поєднання знань, навичок і способу мислення, які можна розвивати."],["table",["Складова","Що це","Як розвивати"],[["**Алгоритмічне мислення**","Уміння розкладати задачу на кроки","Задачі з програмування, олімпіади, головоломки"],["**Логіка й математика**","Точність міркувань","Математика, логічні ігри"],["**Креативність**","Пошук нестандартних розв'язків","Власні проєкти, хакатони, творче програмування"],["**Наполегливість**","Уміння шукати помилки й не здаватися","Регулярна практика, налагодження"],["**Знання**","Мови, технології, інструменти","Курси, документація, підручники"]]],["p","Креативність у ІТ — це створення нових продуктів, ігор, сервісів і несподіваних способів використати відомі технології."]]},{"n":83,"title":"Навчання в Інтернеті","blocks":[["p","**Дистанційне та онлайн-навчання** дає змогу вчитися будь-де й у зручному темпі."],["h","Платформи"],["table",["Тип","Приклади"],[["Масові відкриті онлайн-курси (MOOC)","Prometheus, Coursera, edX, EdEra"],["Шкільні освітні платформи","Всеукраїнська школа онлайн, Google Classroom"],["Навчання програмуванню","Codecademy, Stepik, freeCodeCamp, «Алгоритміка»"],["Відеоуроки","YouTube-канали освітніх проєктів"],["Мови","Duolingo"]]],["h","Як навчатися онлайн ефективно"],["ol",["Поставте конкретну мету і термін.","Складіть розклад і дотримуйтеся його.","Робіть нотатки й практичні завдання, а не лише дивіться відео.","Обговорюйте матеріал на форумах і з однокласниками.","Перевіряйте себе тестами."]],["note","Перевіряйте якість курсу: хто автор, чи є відгуки, чи видається сертифікат, чи актуальні матеріали."]]},{"n":84,"title":"Програмні засоби для планування, структурування роботи, співпраці","blocks":[["table",["Призначення","Засоби"],[["Календарі та нагадування","Google Календар, Outlook"],["Списки справ","Google Tasks, Microsoft To Do, Todoist"],["Керування проєктами (дошки Kanban)","Trello, Notion, Jira"],["Спільні документи","Google Документи, Таблиці, Презентації; Microsoft 365"],["Ментальні карти","Miro, MindMeister, Coggle"],["Спілкування в команді","Slack, Microsoft Teams, Discord, Telegram"],["Відеозустрічі","Google Meet, Zoom"]]],["h","Метод Kanban"],["p","Завдання записують на картки й переміщують між стовпцями **«Зробити» → «В роботі» → «Готово»**. Так усім видно стан проєкту."],["h","Принципи спільної роботи"],["ul",["Розподіліть ролі та відповідальність.","Встановіть терміни для кожного завдання.","Використовуйте коментарі та історію версій у спільних документах.","Домовтеся про канал спілкування й час відповіді."]]]},{"n":85,"title":"Роль інформаційних технологій в роботі сучасного працівника","blocks":[["p","ІТ використовують майже всі професії, а не лише програмісти."],["table",["Професія","Як використовує ІТ"],[["Лікар","Електронні медичні картки, телемедицина, аналіз знімків за допомогою ШІ"],["Вчитель","Онлайн-платформи, електронний журнал, інтерактивні вправи"],["Бухгалтер","Облікові програми, електронна звітність"],["Агроном","Дрони, супутникові карти полів, датчики вологості"],["Дизайнер","Графічні редактори, 3D-моделювання"],["Журналіст","Перевірка фактів, монтаж, соцмережі"]]],["h","Цифрові компетентності працівника"],["ul",["Робота з офісними програмами та хмарними сервісами.","Пошук і критична оцінка інформації.","Безпека даних і паролів.","Онлайн-комунікація і співпраця.","Готовність опановувати нові програми."]],["p","**Дистанційна робота** стала поширеною саме завдяки ІТ: відеозв'язок, спільні документи, хмарні сервіси."]]},{"n":86,"title":"Професії майбутнього – аналіз тенденцій на ринку праці","blocks":[["h","Тенденції"],["ul",["**Автоматизація** рутинної роботи: повторювані операції виконують програми та роботи.","**Поширення ШІ** в усіх галузях.","**Зростання попиту** на аналітиків даних, фахівців з кібербезпеки, розробників ШІ.","**Зелені технології**: відновлювана енергетика, екологічний моніторинг.","**Навчання впродовж життя**: професія може змінитися кілька разів."]],["h","Приклади професій майбутнього"],["ul",["Інженер з етики ШІ та промпт-інженер.","Архітектор віртуальних світів.","Фахівець з кібербезпеки IoT.","Аналітик великих даних у медицині.","Оператор дронів і робототехнічних систем.","Цифровий куратор (наставник з цифрових навичок)."]],["h","Як аналізувати ринок праці"],["p","Переглядайте вакансії на сайтах пошуку роботи (Work.ua, Robota.ua, DOU для ІТ), звіти про зарплати, дослідження Світового економічного форуму. Звертайте увагу, які навички найчастіше вимагають роботодавці."]]},{"n":87,"title":"Поняття про штучний інтелект","blocks":[["p","**Штучний інтелект (ШІ)** — галузь інформатики, що створює системи, здатні виконувати завдання, які зазвичай потребують людського інтелекту: розпізнавати мову та зображення, перекладати, ухвалювати рішення."],["h","Основні поняття"],["ul",["**Машинне навчання** — система вчиться на прикладах (даних), а не за явно прописаними правилами.","**Нейронна мережа** — модель, натхненна будовою мозку, з багатьох пов'язаних «нейронів».","**Генеративний ШІ** — створює тексти, зображення, музику (чат-боти, генератори зображень).","**Навчальні дані** — приклади, на яких навчається модель."]],["h","Застосування"],["p","Голосові помічники, машинний переклад, рекомендації фільмів і музики, розпізнавання облич, медична діагностика, безпілотні авто."],["h","Обмеження та ризики"],["ul",["ШІ може помилятися й «вигадувати» факти — результати треба перевіряти.","Упередженість: якщо навчальні дані упереджені, такими будуть і відповіді.","Діпфейки та дезінформація.","Питання приватності й авторського права.","Академічна доброчесність: використання ШІ в навчанні має бути чесним і зазначеним."]]]},{"n":88,"title":"Системи електронного врядування","blocks":[["p","**Електронне врядування** — спосіб організації державного управління за допомогою ІТ: громадяни отримують послуги онлайн, а влада стає прозорішою."],["h","Приклади в Україні"],["table",["Сервіс","Можливості"],[["**Дія** (застосунок і портал)","Цифрові документи, сотні державних послуг онлайн"],["**ProZorro**","Прозорі державні закупівлі"],["**Електронні петиції**","Звернення громадян до влади"],["**Електронна черга до садочків і шкіл**","Запис без відвідування установ"],["**Електронна медицина (Helsi та ін.)**","Запис до лікаря, електронні рецепти"],["**Відкриті дані** (data.gov.ua)","Публічні набори державних даних"]]],["p","Переваги: економія часу, менше бюрократії та корупційних ризиків, доступність 24/7. Виклики: захист персональних даних, цифрова нерівність, кібератаки."],["note","Для доступу до державних сервісів використовують **електронний підпис** або вхід через банківську ідентифікацію (BankID)."]]},{"n":89,"title":"Інформаційна безпека. Рівні та протоколи інформаційної безпеки","blocks":[["p","**Інформаційна безпека** — захищеність інформації від випадкових чи навмисних загроз. Її основа — **тріада CIA**:"],["table",["Властивість","Суть","Приклад порушення"],[["**Конфіденційність**","Доступ мають лише ті, кому дозволено","Витік паролів"],["**Цілісність**","Дані не змінено без дозволу","Підміна оцінок у журналі"],["**Доступність**","Дані доступні, коли потрібно","DDoS-атака на сайт"]]],["h","Рівні захисту"],["ul",["**Законодавчий** — закони про захист даних і кіберзлочини.","**Адміністративний** — правила організації, політика безпеки.","**Процедурний** — інструкції для людей: зміна паролів, резервні копії.","**Програмно-технічний** — антивіруси, брандмауери, шифрування."]],["h","Протоколи безпеки"],["ul",["**HTTPS (TLS)** — шифрування з'єднання з сайтом (замочок в адресному рядку).","**WPA2/WPA3** — захист Wi-Fi.","**SSH** — захищений віддалений доступ.","**Двофакторна автентифікація (2FA)** — пароль + код із телефона."]],["h","Правила особистої безпеки"],["ul",["Довгі унікальні паролі та менеджер паролів.","Двофакторна автентифікація.","Не відкривати підозрілих посилань (фішинг).","Оновлювати програми.","Робити резервні копії."]]]},{"n":90,"title":"Керування ризиками в інформаційних системах","blocks":[["p","**Ризик** — можливість того, що загроза використає вразливість і завдасть шкоди. **Керування ризиками** — процес їх виявлення, оцінки та зменшення."],["h","Етапи керування ризиками"],["ol",["**Ідентифікація** активів (що захищаємо), загроз і вразливостей.","**Оцінка** ризику: ймовірність × наслідки.","**Вибір реакції**: уникнути, зменшити, передати (страхування) чи прийняти.","**Впровадження** заходів.","**Моніторинг** і перегляд."]],["h","Матриця ризиків (приклад для шкільного сайту)"],["table",["Загроза","Ймовірність","Наслідки","Захід"],[["Злам слабкого пароля адміністратора","Висока","Високі","Складний пароль, 2FA"],["Збій сервера","Середня","Середні","Резервні копії, хостинг з гарантією"],["Випадкове видалення сторінки","Середня","Низькі","Історія версій"],["Пожежа в серверній","Низька","Високі","Копії в хмарі в іншому місці"]]],["note","Правило резервного копіювання **3-2-1**: 3 копії даних, на 2 різних носіях, 1 з них — в іншому місці."]]},{"n":91,"title":"Виконання індивідуальних та колективних проектів","blocks":[["p","Проєкт з теми «Сучасні інформаційні технології». Результат — дослідження з презентацією, інфографікою або вебсторінкою."],["h","Теми проєктів"],["ul",["Як ШІ змінює професію (на вибір): лікар, перекладач, дизайнер.","Порівняння онлайн-платформ для навчання програмуванню.","Кібербезпека для школярів: пам'ятка та опитування класу.","Електронні послуги в моїй громаді.","Моя цифрова кар'єра: аналіз вакансій ІТ."]],["h","Етапи (урок 1)"],["ol",["Обрати тему і сформулювати мету та питання дослідження.","Розподілити ролі в команді.","Скласти план у Trello чи Google Таблиці.","Зібрати джерела (не менше 5), перевірити їх надійність."]]]},{"n":92,"title":"Виконання індивідуальних та колективних проектів","blocks":[["h","Етапи (урок 2)"],["ol",["Опрацювати й узагальнити зібрану інформацію.","Підготувати продукт: презентацію (8–12 слайдів), інфографіку або сайт.","Вказати список джерел.","Захистити проєкт: виступ 5–7 хвилин і відповіді на запитання."]],["h","Критерії оцінювання"],["table",["Критерій","Бали"],[["Відповідність темі, глибина дослідження","3"],["Достовірність і посилання на джерела","2"],["Якість оформлення продукту","3"],["Виступ і відповіді на запитання","2"],["Командна робота (для групових)","2"]]],["note","Цим уроком завершується тема 2. Проводиться тематична атестація."]]}],"practice":[{"task":"Перевірте надійність трьох своїх паролів за критеріями: довжина ≥ 12, різні типи символів, унікальність. Складіть план покращення (самі паролі нікому не показуйте!).","answer":"Приклад плану: увімкнути менеджер паролів, замінити короткі паролі на парольні фрази з 4–5 слів, увімкнути 2FA для пошти та соцмереж."},{"task":"Створіть дошку Kanban у Trello або таблиці зі стовпцями «Зробити», «В роботі», «Готово» для свого навчального тижня.","answer":"Дошка з 6–10 картками: завдання з предметів, терміни, позначки пріоритету."},{"task":"Знайдіть 5 вакансій у сфері ІТ і випишіть найчастіші вимоги до навичок. Які з них можна почати розвивати вже зараз?","answer":"Наприклад: англійська, Python, SQL, командна робота, Git. Почати: онлайн-курс Python, практика англійської, власний проєкт на GitHub."},{"task":"Назвіть 3 державні послуги, які можна отримати в «Дії», і поясніть, які переваги це дає порівняно з паперовим оформленням.","answer":"Наприклад: цифровий паспорт, допомога «єМалятко», реєстрація ФОП. Переваги: без черг, 24/7, швидше, менше паперів."}],"quiz":[{"q":"Що з переліченого є прикладом інформаційної системи?","o":["Калькулятор на папері","Електронний шкільний журнал","Підручник","Дошка й крейда"],"a":1},{"q":"Як називається технологія зберігання даних і програм на віддалених серверах?","o":["Інтернет речей","Хмарні обчислення","Блокчейн","VR"],"a":1},{"q":"Яка властивість інформаційної безпеки порушується під час DDoS-атаки?","o":["Конфіденційність","Цілісність","Доступність","Достовірність"],"a":2},{"q":"Що означає замочок і HTTPS в адресному рядку?","o":["Сайт безкоштовний","З'єднання зашифроване","Сайт державний","Сайт без реклами"],"a":1},{"q":"Що таке машинне навчання?","o":["Навчання людей роботі з комп'ютером","Система вчиться на прикладах даних","Ремонт техніки","Програмування роботів вручну"],"a":1},{"q":"Яка платформа забезпечує прозорі державні закупівлі?","o":["Дія","ProZorro","Helsi","Prometheus"],"a":1},{"q":"Що означає правило резервного копіювання 3-2-1?","o":["3 паролі, 2 пристрої, 1 акаунт","3 копії, 2 носії, 1 копія в іншому місці","Копіювати щотри дні","3 файли в 2 папках"],"a":1},{"q":"Ризик оцінюють як…","o":["Ймовірність × наслідки","Кількість комп'ютерів","Вартість антивірусу","Швидкість інтернету"],"a":0},{"q":"Який метод передбачає переміщення карток між стовпцями «Зробити – В роботі – Готово»?","o":["Kanban","Mind map","SWOT","Блок-схема"],"a":0}]},{"id":"t3a","topic":3,"code":"3.1","title":"Моделювання, табличні обчислення та статистичний аналіз","lessons":[{"n":93,"title":"Комп'ютерне моделювання об'єктів і процесів. Комп'ютерний експеримент","blocks":[["p","**Модель** — спрощене представлення об'єкта чи процесу, що зберігає його суттєві для задачі властивості. **Комп'ютерна модель** — модель, реалізована програмою чи електронною таблицею."],["h","Етапи моделювання"],["ol",["Постановка задачі: що досліджуємо і навіщо.","Побудова **інформаційної моделі**: які величини важливі, які зв'язки між ними.","Побудова **математичної моделі**: формули.","Реалізація комп'ютерної моделі (таблиця, програма).","**Комп'ютерний експеримент**: змінюємо вхідні дані й спостерігаємо результат.","Аналіз результатів і перевірка адекватності моделі."]],["h","Приклад: падіння тіла"],["p","Висота тіла, кинутого з висоти h₀ без початкової швидкості: h(t) = h₀ − g·t²/2, де g ≈ 9,8 м/с². Модель не враховує опору повітря — це **припущення**."],["code","h0, g = 100, 9.8\nt = 0\nwhile True:\n    h = h0 - g * t ** 2 / 2\n    if h \u003c= 0:\n        break\n    print(f\"t = {t:.1f} с, h = {h:.1f} м\")\n    t += 1\nprint(f\"Падіння триває ≈ {(2 * h0 / g) ** 0.5:.2f} с\")"],["p","**Комп'ютерний експеримент** дешевший і безпечніший за реальний: можна «скинути» тіло на Місяці (g = 1,62), просто змінивши одне число."]]},{"n":94,"title":"Програмні засоби для складних обчислень, аналізу даних та фінансових розрахунків","blocks":[["table",["Тип засобу","Приклади","Для чого"],[["Табличні процесори","Microsoft Excel, Google Таблиці, LibreOffice Calc","Розрахунки, діаграми, фінанси, невеликі бази даних"],["Математичні пакети","GeoGebra, Wolfram Alpha, MATLAB","Рівняння, графіки функцій, символьні обчислення"],["Статистичні пакети","SPSS, R, Jamovi","Статистичний аналіз досліджень"],["Мови програмування","Python (pandas, numpy, matplotlib)","Великі дані, автоматизація аналізу"],["BI-системи","Power BI, Looker Studio","Інтерактивні звіти й дашборди"],["Фінансові програми","M.E.Doc, BAS, банківські застосунки","Облік, звітність, особисті фінанси"]]],["p","Для навчальних задач найуніверсальніший інструмент — **табличний процесор**: він поєднує обчислення, аналіз і візуалізацію. Далі використовуємо Excel або Google Таблиці; назви функцій в обох однакові."],["note","У Google Таблицях і Excel з українськими налаштуваннями десяткові дроби записують **через кому** (2,5), а аргументи функцій розділяють **крапкою з комою**: `=ROUND(A1;2)`."]]},{"n":95,"title":"Табличний процесор як засіб для фінансових розрахунків","blocks":[["h","Відсотки"],["code","=B2*15%              частка 15% від суми\n=B2*(1+C2)           сума після зростання на C2 відсотків\n=(C2-B2)/B2          відсоток зміни (формат «Відсотки»)"],["h","Складні відсотки (депозит)"],["p","Сума через n років при ставці r: S = P · (1 + r)ⁿ. В Excel: `=B1*(1+B2)^B3` або функцією майбутньої вартості `=FV(ставка; періоди; платіж; -початкова_сума)`."],["table",["Рік","Формула в B","Сума (P = 10 000, r = 10%)"],[["0","=10000","10 000,00"],["1","=B2*(1+$E$1)","11 000,00"],["2","=B3*(1+$E$1)","12 100,00"],["3","=B4*(1+$E$1)","13 310,00"]]],["note","Знак `$` робить посилання **абсолютним**: `$E$1` не зміниться під час копіювання формули вниз. Це основа більшості фінансових таблиць."],["h","Кредит"],["p","Щомісячний платіж за кредитом: `=PMT(річна_ставка/12; кількість_місяців; -сума_кредиту)`. Наприклад, `=PMT(18%/12; 12; -20000)` ≈ 1833,60 грн."],["h","Особистий бюджет"],["p","Таблиця: стовпці «Категорія», «План», «Факт», «Різниця» (`=C2-B2`). Функція `=SUM()` для підсумків, умовне форматування — червоний колір для перевитрат."]]},{"n":96,"title":"Електронна таблиця як засіб подання відомостей про однотипні об'єкти","blocks":[["p","Електронну таблицю можна використовувати як **однотабличну базу даних**: кожен **рядок — запис** про один об'єкт, кожен **стовпець — поле** (властивість). Перший рядок містить назви полів."],["table",["Прізвище","Клас","Інформатика","Математика","Українська"],[["Коваль","10-А","11","9","10"],["Мельник","10-Б","8","10","12"],["Шевченко","10-А","12","11","9"]]],["h","Правила організації таблиці-бази"],["ul",["Один рядок заголовків, без об'єднаних клітинок.","Без порожніх рядків і стовпців усередині таблиці.","В одному стовпці — дані одного типу (лише числа, лише дати).","Кожен запис — в окремому рядку."]],["p","Зручно перетворити діапазон на **«розумну» таблицю**: Excel — Вставлення → Таблиця (Ctrl+T); Google Таблиці — Формат → Перетворити на таблицю. Тоді формули й форматування поширюються на нові рядки автоматично."]]},{"n":97,"title":"Операції з однотабличною базою даних","blocks":[["h","Сортування"],["p","Дані → Сортування. Можна сортувати за кількома полями: спершу за класом, потім за прізвищем."],["h","Фільтрування"],["p","**Фільтр** приховує записи, що не відповідають умові (Дані → Фільтр). Можна задати умови «більше ніж», «містить», вибрати значення зі списку."],["h","Функції для бази даних"],["table",["Функція","Дія","Приклад"],[["`COUNTIF`","Кількість записів за умовою","`=COUNTIF(B:B;\"10-А\")`"],["`SUMIF`","Сума за умовою","`=SUMIF(B:B;\"10-А\";C:C)`"],["`AVERAGEIF`","Середнє за умовою","`=AVERAGEIF(B:B;\"10-А\";C:C)`"],["`COUNTIFS`","Кількість за кількома умовами","`=COUNTIFS(B:B;\"10-А\";C:C;\">=10\")`"],["`VLOOKUP` / `XLOOKUP`","Знайти значення в таблиці","`=VLOOKUP(\"Коваль\";A:E;3;FALSE)`"],["`FILTER`","Вибрати записи за умовою (Google, Excel 365)","`=FILTER(A2:E100;C2:C100>=10)`"]]],["h","Умовне форматування"],["p","Автоматично виділяє клітинки кольором за умовою: оцінки нижче 7 — червоним, 10 і вище — зеленим. Головна → Умовне форматування (Excel) або Формат → Умовне форматування (Google)."]]},{"n":98,"title":"Основи статистичного аналізу даних. Ряди даних","blocks":[["p","**Статистика** — наука про збирання, опрацювання та аналіз масових даних. **Генеральна сукупність** — усі об'єкти дослідження (усі десятикласники України), **вибірка** — та частина, яку реально досліджуємо (учні нашого ліцею)."],["h","Ряди даних"],["ul",["**Варіаційний ряд** — значення, впорядковані за зростанням: 7, 8, 8, 9, 10, 10, 10, 12.","**Частота** — скільки разів зустрічається значення.","**Відносна частота** — частота, поділена на кількість усіх значень.","**Часовий ряд** — значення в послідовні моменти часу: температура щодня, курс валют щомісяця."]],["h","Таблиця частот"],["table",["Оцінка","Частота","Відносна частота"],[["8","2","0,25"],["9","1","0,125"],["10","3","0,375"],["12","2","0,25"]]],["p","В Excel частоти зручно рахувати функцією `=COUNTIF(дані; значення)`, а відносні — діленням на `=COUNT(дані)`. Наочно розподіл показує **гістограма**."]]},{"n":99,"title":"Пошук та збір наборів даних. Соціальні аспекти масштабного аналізу даних","blocks":[["h","Де шукати набори даних"],["table",["Джерело","Що містить"],[["data.gov.ua","Відкриті дані державних органів України"],["Державна служба статистики (ukrstat.gov.ua)","Населення, економіка, освіта"],["Kaggle","Тисячі навчальних наборів даних"],["Our World in Data","Світові показники: здоров'я, клімат, освіта"],["Google Dataset Search","Пошуковик наборів даних"]]],["h","Власний збір даних"],["p","Опитування (Google Форми), вимірювання, спостереження. Відповіді з Google Форми автоматично потрапляють у Google Таблицю."],["h","Соціальні аспекти"],["ul",["**Приватність**: дані про людей треба знеособлювати; не збирайте зайвого.","**Згода**: учасники мають знати, як використовуватимуть їхні дані.","**Упередженість**: вибірка може не відображати всіх (опитування лише в інтернеті пропускає людей без нього).","**Маніпуляції**: ті самі дані можна подати так, що висновок зміниться.","**Користь**: аналіз даних допомагає медицині, транспорту, плануванню міст."]]]},{"n":100,"title":"Обчислення основних статистичних характеристик вибірки","blocks":[["table",["Характеристика","Зміст","Функція"],[["Середнє арифметичне","Сума значень / кількість","`=AVERAGE()`"],["Медіана","Середнє значення впорядкованого ряду","`=MEDIAN()`"],["Мода","Найчастіше значення","`=MODE()`"],["Розмах","Максимум − мінімум","`=MAX()-MIN()`"],["Дисперсія","Середній квадрат відхилення від середнього","`=VAR.S()`"],["Стандартне відхилення","Корінь із дисперсії: наскільки значення «розкидані»","`=STDEV.S()`"]]],["h","Приклад"],["p","Оцінки: 7, 8, 8, 9, 10, 10, 10, 12. Середнє = 74 / 8 = 9,25; медіана = (9 + 10) / 2 = 9,5; мода = 10; розмах = 5."],["code","import statistics as st\nmarks = [7, 8, 8, 9, 10, 10, 10, 12]\nprint(st.mean(marks), st.median(marks), st.mode(marks), max(marks) - min(marks))\nprint(round(st.stdev(marks), 2))   # стандартне відхилення вибірки"],["note","Середнє чутливе до викидів: якщо до зарплат 10 працівників по 15 тис. додати зарплату директора 300 тис., середнє зросте майже вдвічі, а медіана не зміниться. Тому для доходів частіше наводять медіану."]]},{"n":101,"title":"Створення та редагування зведених таблиць","blocks":[["p","**Зведена таблиця** автоматично групує дані й обчислює підсумки: суми, середні, кількості за категоріями. Вона не змінює вихідних даних."],["h","Як створити"],["ol",["Виділіть таблицю з заголовками.","Excel: Вставлення → Зведена таблиця. Google: Вставка → Зведена таблиця.","Перетягніть поля в області: **Рядки**, **Стовпці**, **Значення**, **Фільтри**.","Оберіть спосіб підсумку значень: сума, середнє, кількість."]],["h","Приклад"],["p","З таблиці продажів (Дата, Магазин, Товар, Сума) зведена таблиця відповість: скільки продав кожен магазин (Рядки — Магазин, Значення — Сума), які товари найпопулярніші, як змінювалися продажі по місяцях."],["table",["Магазин","Зошити","Ручки","Разом"],[["Центр","4 200","1 800","6 000"],["Північ","3 100","2 300","5 400"],["Разом","7 300","4 100","11 400"]]],["p","Після зміни вихідних даних зведену таблицю треба **оновити** (Excel: правою кнопкою → Оновити; у Google оновлюється автоматично). На основі зведеної таблиці можна побудувати **зведену діаграму**."]]},{"n":102,"title":"Кореляційний аналіз даних","blocks":[["p","**Кореляція** — статистичний зв'язок між двома величинами: коли змінюється одна, в середньому змінюється й інша. Силу лінійного зв'язку показує **коефіцієнт кореляції** r від −1 до 1."],["table",["Значення r","Зв'язок"],[["близько 1","Сильний прямий (зростає одна — зростає інша)"],["близько −1","Сильний обернений (зростає одна — спадає інша)"],["близько 0","Лінійного зв'язку немає"],["|r| від 0,3 до 0,7","Помірний зв'язок"]]],["p","В Excel: `=CORREL(діапазон1; діапазон2)`. Наочно зв'язок показує **точкова діаграма** з **лінією тренду**."],["code","import statistics as st\nhours = [1, 2, 3, 4, 5, 6]           # години підготовки\nscore = [5, 6, 8, 8, 10, 11]         # бал за тест\nprint(round(st.correlation(hours, score), 3))   # ≈ 0.98 — сильний прямий зв'язок"],["note","**Кореляція не означає причинності.** Продаж морозива і кількість сонячних опіків корелюють, але причина обох — спека."]]},{"n":103,"title":"Розв'язування рівнянь","blocks":[["h","Графічний спосіб"],["p","Будуємо таблицю значень функції f(x) і графік. Корені рівняння f(x) = 0 — точки, де графік перетинає вісь Ox (значення змінює знак)."],["h","Підбір параметра"],["p","**Підбір параметра** (Goal Seek) знаходить таке значення клітинки, при якому формула дає потрібний результат. Excel: Дані → Аналіз «що як» → Підбір параметра. У Google Таблицях — доповнення Goal Seek."],["ol",["У A1 введіть початкове наближення, наприклад 1.","У B1 — формулу лівої частини: `=A1^3-2*A1-5`.","Підбір параметра: встановити в клітинці B1 значення 0, змінюючи клітинку A1.","Результат: x ≈ 2,0946."]],["h","Метод поділу навпіл (у Python)"],["code","def f(x):\n    return x ** 3 - 2 * x - 5\n\na, b = 2, 3                     # f(2) \u003c 0, f(3) > 0 — корінь між ними\nwhile b - a > 0.0001:\n    m = (a + b) / 2\n    if f(a) * f(m) \u003c= 0:\n        b = m\n    else:\n        a = m\nprint(round((a + b) / 2, 4))   # 2.0946"],["note","Цим уроком завершується перша частина теми 3. Проводиться тематична атестація."]]}],"practice":[{"task":"Складіть таблицю депозиту: початкова сума 5000 грн, ставка 12% річних, 5 років. Ставку винесіть в окрему клітинку з абсолютним посиланням.","answer":"Рік 1: 5600; 2: 6272; 3: 7024,64; 4: 7867,60; 5: 8811,71 грн. Формула: =B2*(1+$E$1)."},{"task":"Для оцінок 6, 9, 9, 10, 11, 12, 12, 12 обчисліть середнє, медіану, моду і розмах.","answer":"Середнє 10,125; медіана 10,5; мода 12; розмах 6."},{"task":"Проведіть опитування в класі через Google Форму (час на домашні завдання і середній бал). Обчисліть коефіцієнт кореляції і побудуйте точкову діаграму.","answer":"Використати =CORREL(B2:B30;C2:C30), Вставка → Діаграма → Точкова, додати лінію тренду. Зробити висновок про силу зв'язку."},{"task":"Розв'яжіть рівняння x² − 5 = 0 на відрізку [2; 3] підбором параметра або методом поділу навпіл.","answer":"x ≈ 2,2361 (√5)."}],"quiz":[{"q":"Що таке комп'ютерний експеримент?","o":["Ремонт комп'ютера","Дослідження моделі зміною вхідних даних","Встановлення нової програми","Тестування швидкості інтернету"],"a":1},{"q":"Що робить знак $ у посиланні $E$1?","o":["Позначає валюту","Робить посилання абсолютним","Округлює число","Приховує клітинку"],"a":1},{"q":"У таблиці-базі даних рядок — це…","o":["Поле","Запис","Формула","Діаграма"],"a":1},{"q":"Яка функція рахує кількість клітинок, що відповідають умові?","o":["SUMIF","COUNTIF","AVERAGE","VLOOKUP"],"a":1},{"q":"Медіана ряду 3, 5, 7, 20, 25 дорівнює…","o":["7","12","5","20"],"a":0},{"q":"Мода — це…","o":["Середнє арифметичне","Найчастіше значення","Різниця max і min","Середнє впорядкованого ряду"],"a":1},{"q":"Коефіцієнт кореляції −0,9 означає…","o":["Зв'язку немає","Сильний прямий зв'язок","Сильний обернений зв'язок","Помилку обчислення"],"a":2},{"q":"Для чого використовують зведені таблиці?","o":["Для малювання","Для групування даних і обчислення підсумків","Для захисту листа паролем","Для перевірки орфографії"],"a":1},{"q":"Який інструмент знаходить значення клітинки, при якому формула дає потрібний результат?","o":["Фільтр","Підбір параметра","Сортування","Умовне форматування"],"a":1},{"q":"Чи означає сильна кореляція причинно-наслідковий зв'язок?","o":["Так, завжди","Ні, не обов'язково","Лише якщо r = 1","Лише для додатного r"],"a":1}]},{"id":"t3b","topic":3,"code":"3.2","title":"Оптимізація та візуалізація даних","lessons":[{"n":104,"title":"Поняття про оптимізаційні задачі, цільову функцію","blocks":[["p","**Оптимізаційна задача** — задача пошуку найкращого (оптимального) розв'язку серед можливих: найбільшого прибутку, найменших витрат, найкоротшого маршруту."],["h","Складові оптимізаційної задачі"],["ul",["**Змінні** — величини, які ми можемо обирати (кількість виробів, обсяг закупівлі).","**Цільова функція** — величина, яку треба максимізувати чи мінімізувати (прибуток, вартість).","**Обмеження** — умови, яким мають задовольняти змінні (бюджет, запаси матеріалів, час)."]],["h","Приклад"],["p","Майстерня виготовляє столи (прибуток 600 грн) і стільці (200 грн). На стіл іде 4 год роботи, на стілець — 1 год; є 40 год на тиждень. Стільці продають комплектами до столів, тому стільців може бути не більше 4 на кожен стіл."],["ul",["Змінні: x — кількість столів, y — кількість стільців.","Цільова функція: P = 600x + 200y → max.","Обмеження: 4x + y ≤ 40; y ≤ 4x; x, y ≥ 0, цілі."]]]},{"n":105,"title":"Основні етапи розв'язування оптимізаційних задач за допомогою комп'ютера","blocks":[["ol",["**Побудова математичної моделі**: визначити змінні, цільову функцію, обмеження.","**Підготовка таблиці**: клітинки для змінних (з початковими значеннями, наприклад 0), формула цільової функції, формули лівих частин обмежень.","**Налаштування надбудови «Пошук розв'язку»** (Solver): ціль, напрям (max/min), змінювані клітинки, обмеження.","**Розв'язування** і перевірка, чи виконано всі обмеження.","**Аналіз** результату: чи має він зміст у реальному житті."]],["h","Де знайти «Пошук розв'язку»"],["ul",["**Excel**: Файл → Параметри → Надбудови → Надбудови Excel → «Пошук розв'язку». Потім: Дані → Пошук розв'язку.","**Google Таблиці**: Розширення → Доповнення → встановити Solver.","**LibreOffice Calc**: Сервіс → Розв'язувач."]],["table",["Клітинка","Вміст"],[["B1, B2","Змінні x і y (спершу 0)"],["B4","`=600*B1+200*B2` — цільова функція"],["B5","`=4*B1+B2` — використані години (≤ 40)"],["B6","`=4*B1-B2` — умова на стільці (≥ 0)"]]]]},{"n":106,"title":"Розв'язування систем рівнянь","blocks":[["p","Систему лінійних рівнянь можна розв'язати в табличному процесорі **матричним методом**: X = A⁻¹ · B, де A — матриця коефіцієнтів, B — стовпець вільних членів."],["p","Приклад: 2x + y = 7, x − y = −1."],["ol",["Введіть матрицю A у діапазон A1:B2: 2, 1 / 1, −1.","Введіть B у D1:D2: 7 / −1.","Виділіть F1:F2 і введіть `=MMULT(MINVERSE(A1:B2); D1:D2)` (у старих версіях Excel завершити Ctrl+Shift+Enter).","Результат: x = 2, y = 3."]],["p","Інший спосіб — **«Пошук розв'язку»**: змінні x і y в клітинках, обмеження «ліва частина = права частина», цільова функція будь-яка (наприклад, x)."],["code","import numpy as np\nA = np.array([[2, 1], [1, -1]])\nB = np.array([7, -1])\nprint(np.linalg.solve(A, B))   # [2. 3.]"],["note","Якщо визначник матриці A дорівнює нулю (`=MDETERM(A1:B2)` = 0), система не має єдиного розв'язку."]]},{"n":107,"title":"Розв'язування оптимізаційних задач","blocks":[["p","Розв'яжемо задачу майстерні з уроку 104 за допомогою «Пошуку розв'язку»:"],["ol",["Оптимізувати цільову функцію: `$B$4`, До: **Максимум**.","Зміню
